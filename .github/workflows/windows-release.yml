name: Windows installer
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.23.3"
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache-dependency-path: desktop/go.sum
      - uses: actions/cache@v4
        with:
          path: build/desktop/windows-compiler
          key: windows-tectonic-0.15.0-${{ hashFiles('core/latex/setup.ts', 'core/latex/starter.tex') }}
      - run: npm ci
      - name: Check versioned source
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "if ('v'+require('./package.json').version !== process.env.RELEASE_TAG) throw Error('Tag and package version differ')"
      - name: Tests
        run: node --import tsx --test tests/assistant-onboarding.test.ts tests/assistant.test.ts tests/profile-chat.test.ts tests/attachments.test.ts tests/pi-runtime.test.ts tests/pi-windows-environment.test.ts
      - name: Native tests
        working-directory: desktop
        run: go test ./...
      - name: Build application
        run: npm run desktop:build:windows
      - name: Prepare setup compiler
        run: ./scripts/setup-windows-builder.ps1
      - name: Build setup
        run: npm run desktop:setup:windows
      - name: Exercise setup and installed application
        run: node --import tsx scripts/verify-windows-setup.ts
      - name: Verify PDF export and isolation
        run: node --import tsx scripts/verify-windows-pdf.ts
      - name: Installer integrity regressions
        run: node --import tsx --test tests/windows-installer.test.ts
      - name: Retain verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-verification
          path: |
            .local-data/verification/setup/results.json
            .local-data/verification/setup/partial-results.json
            .local-data/verification/setup/native/results.json
            .local-data/verification/windows-pdf/results.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: ununemploy-windows-setup
          path: build/releases/*
          if-no-files-found: error
      - name: Publish prerelease
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create $env:RELEASE_TAG build/releases/* --verify-tag --prerelease --title "ununemploy $env:RELEASE_TAG" --notes-file deploy/windows/release-notes.md
