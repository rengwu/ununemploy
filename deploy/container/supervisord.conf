[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/config/supervisord.pid
childlogdir=/config

[program:api]
command=/usr/local/bin/ununemploy-run /app/node_modules/.bin/tsx server/index.ts
directory=/app
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker]
command=/usr/local/bin/ununemploy-run /app/node_modules/.bin/tsx worker/index.ts
directory=/app
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
