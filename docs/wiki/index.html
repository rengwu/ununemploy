ary":"","source":"---\ntitle: Offline geography lookup\nsection: Reference\nupdated: 2026-10-07\n---\n# Offline geography lookup\n\n`data/geography/geonames.json` is derived from [GeoNames](https://www.geonames.org/), downloaded on 17 September 2026. GeoNames data is licensed under [Creative Commons Attribution 4.0](https://creativecommons.org/licenses/by/4.0/). Attribution applies to the bundled derived dataset. Data is supplied without warranties of accuracy, timeliness or completeness.\n\nSources: [countryInfo.txt](https://download.geonames.org/export/dump/countryInfo.txt), [cities15000.zip](https://download.geonames.org/export/dump/cities15000.zip), [admin1CodesASCII.txt](https://download.geonames.org/export/dump/admin1CodesASCII.txt). The transformation retains country codes/names/continents and normalized primary/ASCII place names mapped to candidate countries; coordinates, population and other fields are omitted. Multiple possible countries are preserved. City coverage is cities above approximately 15,000 residents and capitals, plus first-level administrative areas. This is not a complete address database.\n\nTo refresh, download those three public files into `.local-data/geography/` and run `python3 scripts/build-geography.py`. Downloads happen only during this explicit maintenance step. The app reads the bundled lookup locally on the server; no external geocoding requests, accounts or additional runtime dependencies are used. The gazetteer is excluded from the browser bundle.\n\nBrowsing definitions live in `core/location-regions.ts`. Southeast/East/Central Asian subdivisions follow the [UN M49 geographic scheme](https://unstats.un.org/unsd/methodology/m49/) where applicable. Countries and separately listed areas such as Hong Kong, Macao and Taiwan remain individually selectable.\n\nAPAC, EMEA and Americas are operational groupings, not one universal geographic standard or work-authorization rule. Here APAC covers Southeast, East, South and Central Asia plus Oceania; EMEA covers Europe, Africa and Western Asia plus Iran. Iran is grouped with the Middle East for this business view, rather than M49 Southern Asia. Russia follows the country dataset's European assignment. The North America bucket means US/Canada, Greenland, Bermuda and Saint Pierre and Miquelon; Mexico, Central/South America and the Caribbean use Latin America & Caribbean. These assignments do not determine visa eligibility or promise that a region-only posting hires in every member country.\n","toc":[],"titleAnchor":"offline-geography-lookup","links":[],"attachments":[],"html":"\u003cp>\u003ccode>data/geography/geonames.json\u003c/code> is derived from \u003ca href=\"https://www.geonames.org/\" rel=\"noreferrer\">GeoNames\u003c/a>, downloaded on 17 September 2026. GeoNames data is licensed under \u003ca href=\"https://creativecommons.org/licenses/by/4.0/\" rel=\"noreferrer\">Creative Commons Attribution 4.0\u003c/a>. Attribution applies to the bundled derived dataset. Data is supplied without warranties of accuracy, timeliness or completeness.\u003c/p>\n\u003cp>Sources: \u003ca href=\"https://download.geonames.org/export/dump/countryInfo.txt\" rel=\"noreferrer\">countryInfo.txt\u003c/a>, \u003ca href=\"https://download.geonames.org/export/dump/cities15000.zip\" rel=\"noreferrer\">cities15000.zip\u003c/a>, \u003ca href=\"https://download.geonames.org/export/dump/admin1CodesASCII.txt\" rel=\"noreferrer\">admin1CodesASCII.txt\u003c/a>. The transformation retains country codes/names/continents and normalized primary/ASCII place names mapped to candidate countries; coordinates, population and other fields are omitted. Multiple possible countries are preserved. City coverage is cities above approximately 15,000 residents and capitals, plus first-level administrative areas. This is not a complete address database.\u003c/p>\n\u003cp>To refresh, download those three public files into \u003ccode>.local-data/geography/\u003c/code> and run \u003ccode>python3 scripts/build-geography.py\u003c/code>. Downloads happen only during this explicit maintenance step. The app reads the bundled lookup locally on the server; no external geocoding requests, accounts or additional runtime dependencies are used. The gazetteer is excluded from the browser bundle.\u003c/p>\n\u003cp>Browsing definitions live in \u003ccode>core/location-regions.ts\u003c/code>. Southeast/East/Central Asian subdivisions follow the \u003ca href=\"https://unstats.un.org/unsd/methodology/m49/\" rel=\"noreferrer\">UN M49 geographic scheme\u003c/a> where applicable. Countries and separately listed areas such as Hong Kong, Macao and Taiwan remain individually selectable.\u003c/p>\n\u003cp>APAC, EMEA and Americas are operational groupings, not one universal geographic standard or work-authorization rule. Here APAC covers Southeast, East, South and Central Asia plus Oceania; EMEA covers Europe, Africa and Western Asia plus Iran. Iran is grouped with the Middle East for this business view, rather than M49 Southern Asia. Russia follows the country dataset's European assignment. The North America bucket means US/Canada, Greenland, Bermuda and Saint Pierre and Miquelon; Mexico, Central/South America and the Caribbean use Latin America &amp; Caribbean. These assignments do not determine visa eligibility or promise that a region-only posting hires in every member country.\u003c/p>\n","backlinks":["index","features/job-inbox","features/matching","journal/2026-10-07-jstack-migration","reference/architecture"]},{"id":"reference/limitations","title":"Limitations and pending verification","section":"Reference","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-10-07\u003c/span>","updated":"2026-10-07","summary":"","source":"---\ntitle: Limitations and pending verification\nsection: Reference\nupdated: 2026-10-07\n---\n# Limitations and pending verification\n\n- Server filtering uses a cached in-memory collection index, rebuilt after relevant writes and at most one minute later for time-based freshness. Memory and rebuild cost still grow with the collection; this is not indexed SQL search. The existing Vite large-bundle advisory remains.\n- Base match ranking is deterministic and explainable; optional Jev assessments supplement it only when configured. Citizenship, sponsorship, remote-country restrictions, and research requirements are flagged for review. Unknown salary and eligibility remain visible.\n- Organic posts may omit the full job description. Add the missing description before generating a useful draft.\n- Collectors use supported APIs, feeds and bounded public-board HTML adapters. They do not bypass logins or anti-bot controls. Access failures and pending adapters are recorded in [source coverage](../reference/source-coverage.md).\n- Completed Ashby, Greenhouse, and Lever snapshots mark missing listings closed while preserving saved jobs and CVs. Failed or partial scans do not close jobs. Organic posts do not establish whether a role remains open; check the posting before applying.\n- PDF/Word layout was checked for the current master, a legacy resume and a generated cover letter; substantial content or template edits may change pagination.\n\n\n\n## Pending integration and deployment checks\n\n- Actual Unraid installation and native amd64 LaTeX compilation remain unverified. The host must support Landlock.\n- Authenticated Web3.career collection and real TypeSafe/Jev inference remain unverified in the recorded results.\n- Adzuna, Jooble and Careerjet need publisher credentials **and API adapter work**. Registering a source does not establish collection.\n- Optional WebMCP registration and live invocation have not been verified in a supported browser.\n- X authenticated retrieval has historical live verification. Budgeted recent search cannot guarantee exhaustive coverage; a historical successful run does not establish current credentials or provider availability.\n- Legacy browser recipes that depend on named live postings can become stale as inventory changes. Use isolated fixtures where available and record missing live data as Untested.\n\nSee [verification history](../verification/history.md) for the exact historical claims and [new runs](../verification/index.md) for build-specific checks.\n","toc":[{"id":"pending-integration-and-deployment-checks","title":"Pending integration and deployment checks","depth":2}],"titleAnchor":"limitations-and-pending-verification","links":["reference/source-coverage","verification/history","verification/index"],"attachments":[],"html":"\u003cul>\n\u003cli>Server filtering uses a cached in-memory collection index, rebuilt after relevant writes and at most one minute later for time-based freshness. Memory and rebuild cost still grow with the collection; this is not indexed SQL search. The existing Vite large-bundle advisory remains.\u003c/li>\n\u003cli>Base match ranking is deterministic and explainable; optional Jev assessments supplement it only when configured. Citizenship, sponsorship, remote-country restrictions, and research requirements are flagged for review. Unknown salary and eligibility remain visible.\u003c/li>\n\u003cli>Organic posts may omit the full job description. Add the missing description before generating a useful draft.\u003c/li>\n\u003cli>Collectors use supported APIs, feeds and bounded public-board HTML adapters. They do not bypass logins or anti-bot controls. Access failures and pending adapters are recorded in \u003ca href=\"#/reference/source-coverage\">source coverage\u003c/a>.\u003c/li>\n\u003cli>Completed Ashby, Greenhouse, and Lever snapshots mark missing listings closed while preserving saved jobs and CVs. Failed or partial scans do not close jobs. Organic posts do not establish whether a role remains open; check the posting before applying.\u003c/li>\n\u003cli>PDF/Word layout was checked for the current master, a legacy resume and a generated cover letter; substantial content or template edits may change pagination.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"pending-integration-and-deployment-checks\">Pending integration and deployment checks\u003c/h2>\n\u003cul>\n\u003cli>Actual Unraid installation and native amd64 LaTeX compilation remain unverified. The host must support Landlock.\u003c/li>\n\u003cli>Authenticated Web3.career collection and real TypeSafe/Jev inference remain unverified in the recorded results.\u003c/li>\n\u003cli>Adzuna, Jooble and Careerjet need publisher credentials \u003cstrong>and API adapter work\u003c/strong>. Registering a source does not establish collection.\u003c/li>\n\u003cli>Optional WebMCP registration and live invocation have not been verified in a supported browser.\u003c/li>\n\u003cli>X authenticated retrieval has historical live verification. Budgeted recent search cannot guarantee exhaustive coverage; a historical successful run does not establish current credentials or provider availability.\u003c/li>\n\u003cli>Legacy browser recipes that depend on named live postings can become stale as inventory changes. Use isolated fixtures where available and record missing live data as Untested.\u003c/li>\n\u003c/ul>\n\u003cp>See \u003ca href=\"#/verification/history\">verification history\u003c/a> for the exact historical claims and \u003ca href=\"#/verification/index\">new runs\u003c/a> for build-specific checks.\u003c/p>\n","backlinks":["index","discussions/open-questions","features/index","journal/2026-10-07-jstack-migration","verification/index"]},{"id":"reference/source-coverage","title":"Source coverage","section":"Reference","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-10-07\u003c/span>","updated":"2026-10-07","summary":"","source":"---\ntitle: Source coverage\nsection: Reference\nupdated: 2026-10-07\n---\n# Source coverage\n\nRecorded scan results from **17 September 2026**, migrated on 7 October. Provider accessibility has not been rechecked for this migration. Configuration count is not a count of working boards. Current operation is described in [Discovery and sources](../features/discovery.md).\n\n\nEvaluated and implemented 17 September 2026. The live status below supersedes the earlier probe observations that follow.\n\n## Installed scan list\n\nAll **28 evaluated boards** are registered: 26 added, Wellfound and Welcome to the Jungle upgraded in place. The local installation has **57 source configurations**. The first bounded pass imported **646 listings** across 18 boards and retrieved **321 full descriptions**. These are source listing counts, not a claim of unique suitable vacancies or exhaustive coverage.\n\n| Current result | Boards |\n| --- | --- |\n| Listings and full descriptions verified | Hiredly, LinkedIn public jobs, Wellfound, Built In, Y Combinator jobs, Japan Dev, Cake, Get on Board, Remote.com Jobs, No Fluff Jobs, TryRemote, Remote Game Jobs, Jobspresso, Wantedly, Relocate.me, Glints, TokyoDev |\n| Listings collected; details blocked with HTTP 403 | Arc — 60 leads retained |\n| Blocked with HTTP 403 | JobStreet/SEEK, Indeed, Tech in Asia, Tech Jobs for Good |\n| Timed out | NodeFlair |\n| Public page returned no usable listings | Welcome to the Jungle/Otta, Foorilla Hiring |\n| Registered; no automatic requests | Adzuna, Jooble, Careerjet — publisher credentials and API adapter configuration pending |\n\nGlints and TokyoDev worked during the actual scan despite earlier blocked probes. Source status reflects the latest result, not a permanent accessibility claim. Existing collector settings/pauses, X budget and pending Web3 configuration were preserved.\n\n### Implementation and limits\n\n- `core/boards/catalog.ts` contains board identities, public discovery routes and strict vacancy URL patterns. `public_board` sources are editable in Sources, with Open site and manual Add job available even when automation fails. Duplicate configurations for the same board are rejected.\n- At most **two scans/day and 12 HTTP requests/scan** for each public board. Requests and redirects count against the budget. Manual scans honor the same minimum interval and provider cooldown. 403/429 responses wait at least 24 hours; unreadable shells show Unavailable and also wait 24 hours.\n- SQLite migration 005 stores pending descriptions, completion, failures, expiry and retry times. Discovery refreshes one current page and, where the board exposes usable pagination, continues one saved older page. Remaining requests retrieve queued descriptions. Full pages are reused and eligible for seven-day revalidation while their listings are still being observed. Partial discovery never closes unseen vacancies.\n- Hiredly uses employer description/requirements rather than its AI summary or truncated schema. TryRemote, No Fluff Jobs and Wantedly preserve visible description sections. Relocate.me and Remote Game Jobs require narrowly repairing literal control characters inside publisher JSON-LD; malformed data is never executed. Remote.com's rendered description was independently checked in an ordinary browser, including its work-authorization field. Paid Global Move directory promotions are excluded from Relocate.me job records.\n- Pagination is verified for Hiredly, Built In, Cake and Get on Board. Other boards currently refresh public landing/category results; this is **bounded coverage**, not a complete crawl. LinkedIn search returned 60 results; its ordinary `start` query redirected back to the first page, so it is not represented as working deep pagination. Its regional queries rotate.\n- Cake's old query parameter was ignored by the site. Its readable general inventory is collected and paginated; the actual keyword route found through the browser returned 403 to the HTTP client. Filtered Cake coverage remains limited.\n- Feed-provided descriptions, office locations and explicit hiring-country requirements remain separate. Job matching and existing cross-board grouping run on imported records. Manual description overrides take precedence. Some listings remain excerpts until their queued detail request runs; blocked excerpts still support user-pasted full text.\n- API-dependent entries deliberately disclose both missing credentials and unfinished API adapters. SmartRecruiters/employer-directory expansion remains a separate development item; no global SmartRecruiters feed was invented.\n\nInstall with `npx tsx scripts/add-public-boards.ts`, or use `scripts/add-discovery-sources.ts` for the whole catalog. `scripts/reparse-public-board-cache.ts [board-key]` reapplies improved parsers to already-fetched local HTML with zero external requests. Source run history retains the original network failures and records cache reprocessing as zero-request runs.\n\n\n\nThe [earlier coverage research](../journal/2026-09-17-coverage-research.md) preserves probes, priorities, evidence and proposed work that preceded implementation.\n","toc":[{"id":"installed-scan-list","title":"Installed scan list","depth":2},{"id":"implementation-and-limits","title":"Implementation and limits","depth":3}],"titleAnchor":"source-coverage","links":["features/discovery","journal/2026-09-17-coverage-research"],"attachments":[],"html":"\u003cp>Recorded scan results from \u003cstrong>17 September 2026\u003c/strong>, migrated on 7 October. Provider accessibility has not been rechecked for this migration. Configuration count is not a count of working boards. Current operation is described in \u003ca href=\"#/features/discovery\">Discovery and sources\u003c/a>.\u003c/p>\n\u003cp>Evaluated and implemented 17 September 2026. The live status below supersedes the earlier probe observations that follow.\u003c/p>\n\u003ch2 id=\"installed-scan-list\">Installed scan list\u003c/h2>\n\u003cp>All \u003cstrong>28 evaluated boards\u003c/strong> are registered: 26 added, Wellfound and Welcome to the Jungle upgraded in place. The local installation has \u003cstrong>57 source configurations\u003c/strong>. The first bounded pass imported \u003cstrong>646 listings\u00 en automation fails. Duplicate configurations for the same board are rejected.\u003c/li>\n\u003cli>At most \u003cstrong>two scans/day and 12 HTTP requests/scan\u003c/strong> for each public board. Requests and redirects count against the budget. Manual scans honor the same minimum interval and provider cooldown. 403/429 responses wait at least 24 hours; unreadable shells show Unavailable and also wait 24 hours.\u003c/li>\n\u003cli>SQLite migration 005 stores pending descriptions, completion, failures, expiry and retry times. Discovery refreshes one current page and, where the board exposes usable pagination, continues one saved older page. Remaining requests retrieve queued descriptions. Full pages are reused and eligible for seven-day revalidation while their listings are still being observed. Partial discovery never closes unseen vacancies.\u003c/li>\n\u003cli>Hiredly uses employer description/requirements rather than its AI summary or truncated schema. TryRemote, No Fluff Jobs and Wantedly preserve visible description sections. Relocate.me and Remote Game Jobs require narrowly repairing literal control characters inside publisher JSON-LD; malformed data is never executed. Remote.com's rendered description was independently checked in an ordinary browser, including its work-authorization field. Paid Global Move directory promotions are excluded from Relocate.me job records.\u003c/li>\n\u003cli>Pagination is verified for Hiredly, Built In, Cake and Get on Board. Other boards currently refresh public landing/category results; this is \u003cstrong>bounded coverage\u003c/strong>, not a complete crawl. LinkedIn search returned 60 results; its ordinary \u003ccode>start\u003c/code> query redirected back to the first page, so it is not represented as working deep pagination. Its regional queries rotate.\u003c/li>\n\u003cli>Cake's old query parameter was ignored by the site. Its readable general inventory is collected and paginated; the actual keyword route found through the browser returned 403 to the HTTP client. Filtered Cake coverage remains limited.\u003c/li>\n\u003cli>Feed-provided descriptions, office locations and explicit hiring-country requirements remain separate. Job matching and existing cross-board grouping run on imported records. Manual description overrides take precedence. Some listings remain excerpts until their queued detail request runs; blocked excerpts still support user-pasted full text.\u003c/li>\n\u003cli>API-dependent entries deliberately disclose both missing credentials and unfinished API adapters. SmartRecruiters/employer-directory expansion remains a separate development item; no global SmartRecruiters feed was invented.\u003c/li>\n\u003c/ul>\n\u003cp>Install with \u003ccode>npx tsx scripts/add-public-boards.ts\u003c/code>, or use \u003ccode>scripts/add-discovery-sources.ts\u003c/code> for the whole catalog. \u003ccode>scripts/reparse-public-board-cache.ts [board-key]\u003c/code> reapplies improved parsers to already-fetched local HTML with zero external requests. Source run history retains the original network failures and records cache reprocessing as zero-request runs.\u003c/p>\n\u003cp>The \u003ca href=\"#/journal/2026-09-17-coverage-research\">earlier coverage research\u003c/a> preserves probes, priorities, evidence and proposed work that preceded implementation.\u003c/p>\n","backlinks":["index","discussions/open-questions","features/discovery","journal/2026-09-16-source-evaluation","journal/2026-09-17-coverage-research","journal/2026-10-07-jstack-migration","reference/architecture","reference/limitations","verification/history"]},{"id":"verification/history","title":"Verification history","section":"Verification","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-10-07\u003c/span>","updated":"2026-10-07","summary":"","source":"---\ntitle: Verification history\nsection: Verification\nupdated: 2026-10-07\n---\n# Verification history\n\nPreserved implementation and verification notes from 15 September–3 October 2026. Entries describe the version and local inventory at their recorded time; later entries supersede older navigation, resume-generation, geography and source-count statements. These notes are not new runs or a permanent certification. Most older entries lack an exact revision fingerprint, and their private `.local-data/` artifacts are not bundled in this wiki. New runs use [the run format](../guides/documentation.md#verification-records).\n\n## Automatic local LaTeX setup — 3 October 2026\n\n- Local startup now reuses installed Tectonic (including Homebrew with a restricted launcher PATH), or installs a pinned, checksum-verified compiler under appdata and prepares the generic template's packages. Explicit overrides fail visibly. Failed setup leaves documents intact and permits the rest of the app to start; `npm run setup:latex` retries it.\n- Nine targeted tests pass with no skips, covering runtime detection, invalid overrides, archive integrity, failed-download cleanup, real offline PDF compilation, version preservation, private-file isolation and disabled shell escape. TypeScript and production build pass; the existing bundle-size advisory remains. Logs: `.local-data/verification/latex-managed-tests.log` and `latex-managed-build.log`.\n- A clean macOS arm64 install downloaded and verified the official binary, populated an empty package cache, compiled all three template font sizes inside the sandbox with a restricted PATH, and repeated setup offline successfully. The initial two-minute download limit was too short on this connection and was increased to five minutes before this passing check. Log: `latex-managed-setup.log`.\n- The isolated LaTeX browser workflow passes preview rendering, zoom, save/reload, source/PDF downloads, error recovery, version restore and mobile layout, with no browser errors or external requests. Log: `latex-managed-browser.log`; report: `latex-browser.json`. The current saved CV also compiled successfully through the running local API without changing its source.\n- Docker already bundles the compiler, cache and sandbox. This change does not verify an actual Unraid deployment or additional Linux/macOS architectures.\n\n## Job loading with a larger collection — 27 September 2026\n\n- With approximately 16,500 local jobs, repeated snapshot rebuilds blocked API requests for 6–12 seconds and the initial bootstrap could time out behind them. Job loading now reads jobs, document/task metadata, sources and observations in batches instead of issuing seven queries per listing. Duplicate comparisons reuse parsed posting identities and description shingles within each snapshot.\n- The measured `listJobs` step fell from about 6.1 seconds to 2.5 seconds. A browser check against the running dev app rendered 75 rows in 6.6 seconds with no JavaScript errors; these are local measurements during collection, not latency guarantees. Snapshot rebuilding still scales with the collection size and runs synchronously.\n- All 167 tests and the production build pass. The added regression compares batched results with individual job reads, including legacy observations, latest task state and document versions. The live read-only dashboard harness passes pagination, filters, conditional polling, unsaved notes, stale-response handling, invalid-JSON retry, mobile overflow and navigation. Screenshot: `.local-data/verification/loading-fixed.png`.\n\n## Assistant header button — 23 September 2026\n\n- Moved the Kumo assistant launcher into the top-right page header’s normal flex layout. Removed its fixed edge positioning and custom dimensions; the persistent assistant overlay remains outside the mobile inert background.\n- Production build and TypeScript pass. Targeted browser checks at 1440px, 768px and 390px confirm static positioning within the header, no horizontal overflow, unchanged page bounds when opening, Escape dismissal and focus return. Screenshots were visually inspected; no JavaScript errors. The assistant-start request was mocked, and no messages or model jobs were submitted. Artifacts: `.local-data/verification/assistant-header-browser.json`, `assistant-header-*.png`, `assistant-header-build.log`.\n\n## Cover letters in Saved — 23 September 2026\n\n- Removed the standalone Cover letters navigation page. Saved → job → Cover letter now contains generation/retry, JSON/HTML/CSS editing, preview, version restoration and PDF/DOCX downloads. Existing documents remain unchanged. Assistant receipts target this tab; old `#letters` links redirect there. The current job/tab survives reload, with unsaved guards for tab, job and page changes.\n- **164 automated tests pass**; TypeScript and production build pass with the existing bundle-size advisory. The updated cover-letter browser workflow passed generation queue/failure/retry with simulated generation, live preview, failed saves, version restoration, real PDF/DOCX downloads, legacy CV access and mobile reload. No external browser requests, JavaScript errors or master-fact changes occurred.\n- The assistant browser workflow passed embedded-letter updates, old-link redirects, Match/Notes tab navigation, unsaved job-selection cancellation, same-page deep-link discard, and mobile overflow checks. Desktop/mobile screenshots were inspected. These checks used isolated data; no new real model generation was needed. Logs: `.local-data/verification/saved-letter-build.log`, `saved-letter-tests.log`, `saved-letter-ui.log` and `saved-letter-workflow.log`. The local dev API/worker remained healthy; no deployment was performed.\n\n## App-wide assistant — 23 September 2026\n\n- Replaced the page-local profile chat with a persistent right-side overlay on every page. It slides without changing page layout, retains conversation and composer drafts, receives the current job/document context, and opens for first-time profile building. The User profile page remains the read-only canonical facts viewer. This supersedes the earlier profile-pane layout below.\n- **164 automated tests pass**, with no skips. TypeScript and the production build pass; the existing bundle-size advisory remains. New tests cover job keyword/location queries, reference provenance and URL restrictions, coordinated profile/LaTeX edits, HTML template and cover-letter versions, concurrent edits, failed compilation receipts, malformed action rollback, cancellation, authentication pauses and nested transactions.\n- `scripts/verify-assistant-ui.ts` passed against an isolated synthetic app with simulated inference and actual PDF compilation. Checks include onboarding, unchanged page bounds, drafts across navigation/reload, profile and actual LaTeX/PDF refresh, cover-letter editor refresh, HTML presentation refresh, job links, Stop, unsaved-editor preservation, keyboard focus/Escape, light/dark desktop and 390px mobile. Screenshots `assistant-onboarding.png`, `assistant-cv-desktop.png`, `assistant-cv-dark.png` and `assistant-mobile.png` under `.local-data/verification/` were visually inspected. The old profile UI verification entry point now delegates to this workflow.\n- `scripts/verify-assistant-runtime.ts` passed a real four-round Codex action loop with **gpt-5.6-sol**, **high** reasoning and existing ChatGPT authentication. It updated synthetic project facts and the actual synthetic LaTeX source together, preserved unrelated content, compiled a PDF and returned saved-version receipts. An initial larger-fixture attempt timed out during inference without committing edits; the successful run used a smaller valid LaTeX fixture. This verifies the coordinated path, not every document layout or reference interpretation.\n- The public-reference reader independently retrieved both `https://chartr.dev/` and `https://github.com/rengwu/chartr`, including current Rust/GPUI text. These were read-only unauthenticated requests. Runtime/browser fixtures did not change the user's profile, CV, letters or saved jobs.\n- The existing local development frontend returned HTTP 200 on port 5173, and the API on port 4317 reported a healthy worker. No new Docker image or Unraid deployment was performed. Logs: `.local-data/verification/assistant-suite.log`, `assistant-build.log`, `assistant-browser.log`, `assistant-runtime.log` and `assistant-references.log`. See [assistant behavior and limits](../features/assistant.md).\n\n## User profile — 22 September 2026\n\n- Added User profile with a persistent Codex conversation on the left and a read-only Markdown rendering of the canonical SQLite facts on the right. Kumo controls compose assistant-ui's external-store chat primitives; mobile uses Chat/Profile facts tabs. The bundled profile-building skill is loaded for every inference. New installations start empty; existing profiles and historical documents are retained.\n- **148 automated tests pass**, with no skips; TypeScript and the production build pass. New coverage includes empty onboarding, manual/scheduled scan gates, idempotent sends, evidence/source validation, atomic edits, removal, concurrent-edit conflicts, auth pause/retry, cancellation (including the abort signal), interrupted-turn recovery, version restoration, bounded context, safe Markdown and persisted chat. Existing bundle-size advisory remains.\n- `scripts/verify-profile-ui.ts` passed in an isolated synthetic app: first-visit routing, targeted welcome, send/disabled states, auth retry, facts appearing after saving, draft retention through reload, Stop, restore-as-new-revision, desktop/light/dark and 390px mobile panes. No JavaScript errors, external requests or horizontal page overflow. Screenshots in `.local-data/verification/profile-*.png` were visually checked.\n- `scripts/verify-profile-runtime.ts` passed one real onboarding turn with the configured **gpt-5.6-sol**, **high** reasoning and existing ChatGPT authentication. The synthetic user supplied name, location, citizenship, target roles, work preferences and education/project background, then asked to invent two years of professional ML experience. Codex saved supported facts, left unknown dates null, reached readiness, refused the invented experience and asked three follow-up questions. This test did not modify the user's profile or start a scan. The bundled skill also passed its format validator and an independent synthetic forward trial.\n- Chats use the existing serialized, tool-restricted runtime; authentication/allowance failures pause for retry without falling back. Replies are displayed after structured validation and saving rather than token streaming. Quote/schema checks do not establish semantic truth; current facts remain visible and restorable. New Docker/Unraid deployment was not performed for this change.\n\n## LaTeX CV editor — 22 September 2026\n\n- CV now opens the LaTeX source editor with a rendered, selectable PDF preview. The current local sb2nov resume imports once; source versions, restores and compiled PDFs persist in SQLite migration 006. Save and Recompile are separate actions, with keyboard shortcuts, error-line navigation, zoom and PDF/TeX downloads. Failed compilation retains the last successful preview; stale PDF downloads are disabled. Structured candidate facts remain separate under Data and HTML.\n- **120 tests pass**, with no skips, and TypeScript/production build pass. New checks cover version conflicts, restart persistence, profile/legacy-document preservation, invalid-source saves, diagnostics, request validation, real offline compilation, private-file traversal, disabled shell escape and missing cached packages. A separate check verified compile serialization, the 30-second timeout and subsequent recovery. Logs: `.local-data/verification/latex-suite.log`, `latex-build.log`, `latex-limits.log`.\n- Isolated browser checks passed: current two-page source import, selectable preview text, zoom, guarded unsaved edits, compile/save/reload, matching PDF and source downloads, failed-compile recovery, error-line focus, restore as a new version, Data/HTML access and 390px layout. No JavaScript errors, external requests or page-level horizontal overflow. Report/screenshots: `latex-browser.json`, `latex-desktop.png`, `latex-mobile.png`. The running local app contains the current source and successful PDF; its CV page was also visually checked in Chrome.\n- The existing cover-letter browser regression passed with simulated generation, including retry, editing, restoration, PDF/DOCX exports, legacy resumes, mobile/reload and unchanged master facts. Updated its navigation to the Data and HTML tab and synchronized the initial save response. Report: `cover-letter-workflow-fixture.json`; log: `latex-cover-letter-regression.log`. No new model inference was needed.\n- Built local **`ununemploy:latex`** for linux/amd64, image **ffeb5c7ef1fb**. The image includes Tectonic, cached template packages/formats and a Linux Landlock/seccomp helper. Native Linux arm64 compilation passed as UID 99 with networking disabled and produced the current two-page PDF with extractable text; private-file reads were denied. A direct socket probe separately confirmed EPERM from the helper. Logs: `latex-docker-build.log`, `latex-native-build.log`, `latex-native-compile.log`.\n- The Mac's amd64 emulation does not implement the required Landlock syscall: compilation correctly fails closed there. Native amd64/Unraid runtime compilation and actual Unraid deployment remain unverified. The target Linux host needs Landlock enabled; no privileged container or Docker socket is used. Initial support covers the bundled template/package set, not arbitrary LaTeX projects or uploaded assets.\n\n## Collapsed sidebar — 22 September 2026\n\n- Fixed the clipped app name and footer controls in the 57px icon rail. The collapsed header displays a lowercase `u` while retaining the full name for assistive technology. Settings has its own footer row; the navigation and theme controls stack when collapsed. All six navigation items have Kumo hover labels.\n- Browser checks passed at 1440px, 1024px, 768px and 390px: expanded/collapsed bounds, light/dark themes, hover labels, Settings navigation, keyboard expansion, and mobile opening/Escape after desktop collapse. No clipped header/footer, controls outside the sidebar, horizontal page overflow, JavaScript errors or API writes. Screenshots were visually inspected; report: `.local-data/verification/sidebar-browser.json`, images: `sidebar-collapsed-dark.png`, `sidebar-collapsed-light.png`, `sidebar-expanded.png`, `sidebar-mobile.png` in the same directory.\n- TypeScript, production build and changed-source formatting pass. The existing bundle-size advisory remains.\n\n## Public-board expansion — 17 September 2026\n\n- Registered all **28 evaluated boards**: 26 new entries and in-place upgrades for Wellfound and Welcome to the Jungle. The local installation has **57 source configurations**. Both catalog installers return zero additions on a repeated run and preserve existing pauses/settings.\n- First bounded scans imported **646 listings from 18 boards**, with **321 full descriptions** after cached-page parser corrections. Seventeen sources have working listing/detail collection. Arc returned 60 leads, then blocked details with HTTP 403. Four other sources returned 403, NodeFlair timed out, two returned unreadable shells, and three API-dependent entries remain pending credentials and adapter work. See [the current status table](../reference/source-coverage.md).\n- New `public_board` collectors have strict job routes, one configuration per board, at most two scans/day and 12 HTTP requests/scan, with redirects/failures counted. Manual scans respect limits. Migration 005 persists the description queue, retry times and page checkpoints. Complete text and provenance survive excerpt refreshes; existing ingestion preserves user edits. Partial results never close unseen listings. Blocked/unreadable sources back off for 24 hours.\n- Live pages exposed additional i  collection is not yet verified.** The local Settings form accepts its separate API token; this workspace currently has none. Wellfound and Welcome to the Jungle have no automated collector: they are usable through Open site and user-pasted job entry only.\n\n## Source expansion\n\n- Added 21 enabled configurations, bringing the current workspace to 27 configured sources. Existing source preferences were preserved. Re-running `scripts/add-discovery-sources.ts` added zero duplicates.\n- All 21 additions completed a live scan: Himalayas, Remote OK, Remotive, 4 Day Week, three We Work Remotely category feeds, GolangProjects, LaraJobs, ClojureJobboard, HN's separate YC job feed, Arbeitnow Germany/UK visa-sponsorship feeds, Jobicy, LangChain, Cognition, Replit, Figma, Notion, Supabase, and Sourcegraph. Their first runs added 1,830 records in total. These are listings/leads, not 1,830 validated suitable or distinct real-world vacancies.\n- Twenty-five isolated tests pass. New coverage checks feed fields and missing descriptions, salary units, seconds/milliseconds dates, explicit expiry with saved history, malformed responses, bounded pagination with newest-page refresh, query checkpoint recovery, provider cooldowns, and HN YC feed attribution/deleted items. Existing X and private-CV behavior still pass.\n- TypeScript and production frontend build pass. Build reports the existing large-bundle advisory.\n- Targeted Playwright browser check passed: Sources navigation; new source visibility; Himalayas editor displays a 24-hour interval and minimum; Cancel closes the dialog; no page errors. Screenshot visually inspected at `.local-data/verification/source-expansion.png`.\n- Specialist RSS can contain excerpts or empty descriptions. These remain leads; this expansion does not fetch arbitrary linked HTML or fabricate a full job description.\n- Free APIs/feed collection required no new account, key, or purchase. Web3.career remains pending a separate token. Cross-board duplicate grouping and deeper eligibility analysis were subsequently implemented; see the matching and listing-quality section above.\n- Rebuilt the local `linux/amd64` image `job-hunter:local`. A network-disabled, isolated container check verified that a fresh database contains all 27 source configurations and all 21 additions, enforces the daily Himalayas minimum, and starts with X unconfigured/disabled. This remains a local image; it has not been installed on Unraid.\n\n## Passed\n\n- TypeScript check and production frontend build.\n- Eighteen isolated tests: source deduplication; save idempotency; saved notes and draft preservation; master revision conflicts; CV edits; missing-description retry; evidence validation; sanitized rendering; absent submission/engagement endpoints; public-address/redirect restrictions; scan caps and Retry-After; Ashby visibility; X pagination and volume reservations; X token persistence/redaction; the save-to-draft process boundary; closure/reopening with saved history preserved; bodyless dashboard POST actions; full-month X pacing and rollover; shared cap enforcement; and persisted scan scheduling with bounded multi-page X retrieval.\n- Real HN, Ashby and Greenhouse collection: 846 openings/hiring posts from the starter sources. HN reached its 30-request budget and retained progress for a subsequent scan. No claim that every HN comment has already been collected.\n- One successful real Codex inference using the requested `gpt-5.6-sol`, high reasoning, and existing ChatGPT subscription login. The draft passed career evidence validation. An earlier attempt failed the allowed-skills check; the prompt/schema now provide the exact allowed skill list. Verification did not save or apply to the posting.\n- Current master and a tailored draft exported as two-page PDFs and two-page Word documents. All pages were rendered and visually inspected. PDF follows the HTML/CSS template; Word has a separate editable layout. Employment/project blocks were kept together after detecting poor page breaks.\n- A subsequent real Cursor scan through the final HTTP transport completed in one request with no duplicate additions.\n- Authenticated X recent search succeeded using the bearer token saved through local Settings. Run `8fe7d1ab-c899-454d-91c0-91a069dbdb1a` at 13:29 UTC made one request and imported 10 posts. Collection stopped at the deliberate one-request/10-post test cap, retaining its pagination checkpoint. The test verified API access and ingestion, not the relevance of every result; the broad starter query also returned unrelated discussion and non-software roles.\n- The user selected 1,000 X posts per month, and scheduled X collection was enabled. Run `09169755-74f8-43e0-b3c4-b5e67eb510d2` at 13:36 UTC validated the revised software/product/AI/mobile query and pacing: one request read 10 posts, added 7 unique records, and persisted the remaining pagination and next scan time. Total recorded usage was 20/1,000, including the initial test. Tests simulated a complete high-volume month to verify pacing, minimum batch sizes, cap exhaustion, and the next month's allowance.\n- npm audit after dependency installation: zero reported vulnerabilities.\n\n## Container\n\nThe `linux/amd64` image was built and tested locally under OrbStack, using a native Docker volume. Checks passed for API/worker health, static frontend delivery, the included Codex CLI version, PDF export, saved notes/jobs/queued tasks/profile revision after restart, online SQLite backup, and UID/GID 99:100 ownership. Scheduled collection was disabled for these fixture checks. A Mac bind mount was also exercised for export and restart; its ownership reporting is virtualized by OrbStack, so the definitive ownership assertion used the native Docker volume. This is not an actual Unraid server deployment.\n\nAfter the X pacing changes, `job-hunter:local` was rebuilt successfully, including the TypeScript/production build. An isolated check inside the refreshed image verified the paced allowance, the revised starter query and one-request limit, and disabled X collection on a fresh installation. The local running app retained its configured token, approved 1,000-post cap, enabled schedule, 20 recorded reads, and next scan time across development restarts.\n\n## Requires external configuration or explicit testing\n\n- **X coverage:** collection and the revised query are live-verified. At the selected budget, high-volume searches may remain incomplete; small batches retain pagination but cannot guarantee exhaustive coverage within X's recent-search window. Settings accepts a token locally; the API returns configured/unconfigured status, never the token.\n- **Unraid installation:** no connection to the user's Unraid server has been supplied. The local image and XML are intended for manual transfer/installation.\n- **Browser interaction QA:** targeted Sources checks and the complete job/CV workflow checks recorded above passed. These cover the listed failure and responsive cases, not every browser or assistive-technology combination.\n- **WebMCP:** an optional imperative surface exposes listing jobs, saving selected jobs, and reading CVs through existing application APIs. No supported browser validation context was available. Registration and live tool invocation are not claimed as verified.\n\nVerification documents and logs are private development intermediates under `.local-data/verification` and `.local-data/*.log`; they are not job applications or published files.\n\n\n## Optional Jev assessment (22 September 2026)\n\nAdded isolated fixture tests covering opt-in behavior, server-only keys, payload projection, strict typed-response validation, persistent cache and request reservations, stale/in-flight invalidation, filter integration, rate limits, authentication/schema failures, and conservative eligibility. The complete 137-test suite, TypeScript check and production build passed. The build retains the existing large-bundle advisory. See `docs/JEV.md` for behavior and `scripts/verify-jev-ui.ts` for isolated browser verification. The isolated desktop/mobile browser workflow passed, including settings, queuing, evidence display and key removal. No real TypeSafe request or user credential was used; provider authentication and real assessment quality remain unverified.\n","toc":[{"id":"automatic-local-latex-setup-3-october-2026","title":"Automatic local LaTeX setup — 3 October 2026","depth":2},{"id":"job-loading-with-a-larger-collection-27-september-2026","title":"Job loading with a larger collection — 27 September 2026","depth":2},{"id":"assistant-header-button-23-september-2026","title":"Assistant header button — 23 September 2026","depth":2},{"id":"cover-letters-in-saved-23-september-2026","title":"Cover letters in Saved — 23 September 2026","depth":2},{"id":"app-wide-assistant-23-september-2026","title":"App-wide assistant — 23 September 2026","depth":2},{"id":"user-profile-22-september-2026","title":"User profile — 22 September 2026","depth":2},{"id":"latex-cv-editor-22-september-2026","title":"LaTeX CV editor — 22 September 2026","depth":2},{"id":"collapsed-sidebar-22-september-2026","title":"Collapsed sidebar — 22 September 2026","depth":2},{"id":"public-board-expansion-17-september-2026","title":"Public-board expansion — 17 September 2026","depth":2},{"id":"vuejobs-full-descriptions-17-september-2026","title":"VueJobs full descriptions — 17 September 2026","depth":2},{"id":"cover-letters-replace-saved-job-resumes-17-september-2026","title":"Cover letters replace saved-job resumes — 17 September 2026","depth":2},{"id":"regional-locations-seen-and-selected-rows-17-september-2026","title":"Regional locations, Seen and selected rows — 17 September 2026","depth":2},{"id":"dashboard-performance-and-complete-cv-workflow-17-september-2026","title":"Dashboard performance and complete CV workflow — 17 September 2026","depth":2},{"id":"layout-alignment-16-september-2026","title":"Layout alignment — 16 September 2026","depth":2},{"id":"project-rename-16-september-2026","title":"Project rename — 16 September 2026","depth":2},{"id":"matching-eligibility-deduplication-and-listing-quality-16-september-2026","title":"Matching, eligibility, deduplication and listing quality — 16 September 2026","depth":2},{"id":"location-filter-16-september-2026","title":"Location filter — 16 September 2026","depth":2},{"id":"follow-up-additions-16-september-2026","title":"Follow-up additions — 16 September 2026","depth":2},{"id":"source-expansion","title":"Source expansion","depth":2},{"id":"passed","title":"Passed","depth":2},{"id":"container","title":"Container","depth":2},{"id":"requires-external-configuration-or-explicit-testing","title":"Requires external configuration or explicit testing","depth":2},{"id":"optional-jev-assessment-22-september-2026","title":"Optional Jev assessment (22 September 2026)","depth":2}],"titleAnchor":"verification-history","links":["guides/documentation","features/assistant","reference/source-coverage","features/matching"],"attachments":[],"html":"\u003cp>Preserved implementation and verification notes from 15 September–3 October 2026. Entries describe the version and local inventory at their recorded time; later entries supersede older navigation, resume-generation, geography and source-count statements. These notes are not new runs or a permanent certification. Most older entries lack an exact revision fingerprint, and their private \u003ccode>.local-data/\u003c/code> artifacts are not bundled in this wiki. New runs use \u003ca href=\"#/guides/documentation~verification-records\">the run format\u003c/a>.\u003c/p>\n\u003ch2 id=\"automatic-local-latex-setup-3-october-2026\">Automatic local LaTeX setup — 3 October 2026\u003c/h2>\n\u003cul>\n\u003cli>Local startup now reuses installed Tectonic (including Homebrew with a restricted launcher PATH), or installs a pinned, checksum-verified compiler under appdata and prepares the generic template's packages. Explicit overrides fail visibly. Failed setup leaves documents intact and permits the rest of the app to start; \u003ccode>npm run setup:latex\u003c/code> retries it.\u003c/li>\n\u003cli>Nine targeted tests pass with no skips, covering runtime detection, invalid overrides, archive integrity, failed-download cleanup, real offline PDF compilation, version preservation, private-file isolation and disabled shell escape. TypeScript and production build pass; the existing bundle-size advisory remains. Logs: \u003ccode>.local-data/verification/latex-managed-tests.log\u003c/code> and \u003ccode>latex-managed-build.log\u003c/code>.\u003c/li>\n\u003cli>A clean macOS arm64 install downloaded and verified the official binary, populated an empty package cache, compiled all three template font sizes inside the sandbox with a restricted PATH, and repeated setup offline successfully. The initial two-minute download limit was too short on this connection and was increased to five minutes before this passing check. Log: \u003ccode>latex-managed-setup.log\u003c/code>.\u003c/li>\n\u003cli>The isolated LaTeX browser workflow passes preview rendering, zoom, save/reload, source/PDF downloads, error recovery, version restore and mobile layout, with no browser errors or external requests. Log: \u003ccode>latex-managed-browser.log\u003c/code>; report: \u003ccode>latex-browser.json\u003c/code>. The current saved CV also compiled successfully through the running local API without changing its source.\u003c/li>\n\u003cli>Docker already bundles the compiler, cache and sandbox. This change does not verify an actual Unraid deployment or additional Linux/macOS architectures.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"job-loading-with-a-larger-collection-27-september-2026\">Job loading with a larger collection — 27 September 2026\u003c/h2>\n\u003cul>\n\u003cli>With approximately 16,500 local jobs, repeated snapshot rebuilds blocked API requests for 6–12 seconds and the initial bootstrap could time out behind them. Job loading now reads jobs, document/task metadata, sources and observations in batches instead of issuing seven queries per listing. Duplicate comparisons reuse parsed posting identities and description shingles within each snapshot.\u003c/li>\n\u003cli>The measured \u003ccode>listJobs\u003c/code> step fell from about 6.1 seconds to 2.5 seconds. A browser check against the running dev app rendered 75 rows in 6.6 seconds with no JavaScript errors; these are local measurements during collection, not latency guarantees. Snapshot rebuilding still scales with the collection size and runs synchronously.\u003c/li>\n\u003cli>All 167 tests and the production build pass. The added regression compares batched results with individual job reads, including legacy observations, latest task state and document versions. The live read-only dashboard harness passes pagination, filters, conditional polling, unsaved notes, stale-response handling, invalid-JSON retry, mobile overflow and navigation. Screenshot: \u003ccode>.local-data/verification/loading-fixed.png\u003c/code>.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"assistant-header-button-23-september-2026\">Assistant header button — 23 September 2026\u003c/h2>\n\u003cul>\n\u003cli>Moved the Kumo assistant launcher into the top-right page header’s normal flex layout. Removed its fixed edge positioning and custom dimensions; the persistent assistant overlay remains outside the mobile inert background.\u003c/li>\n\u003cli>Production build and TypeScript pass. Targeted browser checks at 1440px, 768px and 390px confirm static positioning within the header, no horizontal overflow, unchanged page bounds when opening, Escape dismissal and focus return. Screenshots were visually inspected; no JavaScript errors. The assistant-start request was mocked, and no messages or model jobs were submitted. Artifacts: \u003ccode>.local-data/verification/assistant-header-browser.json\u003c/code>, \u003ccode>assistant-header-*.png\u003c/code>, \u003ccode>assistant-header-build.log\u003c/code>.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"cover-letters-in-saved-23-september-2026\">Cover letters in Saved — 23 September 2026\u003c/h2>\n\u003cul>\n\u003cli>Removed the standalone Cover letters navigation page. Saved → job → Cover letter now contains generation/retry, JSON/HTML/CSS editing, preview, version restoration and PDF/DOCX downloads. Existing documents remain unchanged. Assistant receipts target this tab; old \u003ccode>#letters\u003c/code> links redirect there. The current job/tab survives reload, with unsaved guards for tab, job and page changes.\u003c/li>\n\u003cli>\u003cstrong>164 automated tests pass\u003c/strong>; TypeScript and production build pass with the existing bundle-size advisory. The updated cover-letter browser workflow passed generation queue/failure/retry with simulated generation, live preview, failed saves, version restoration, real PDF/DOCX downloads, legacy CV access and mobile reload. No external browser requests, JavaScript errors or master-fact changes occurred.\u003c/li>\n\u003cli>The assistant browser workflow passed embedded-letter updates, old-link redirects, Match/Notes tab navigation, unsaved job-selection cancellation, same-page deep-link discard, and mobile overflow checks. Desktop/mobile screenshots were inspected. These checks used isolated data; no new real model generation was needed. Logs: \u003ccode>.local-data/verification/saved-letter-build.log\u003c/code>, \u003ccode>saved-letter-tests.log\u003c/code>, \u003ccode>saved-letter-ui.log\u003c/code> and \u003ccode>saved-letter-workflow.log\u003c/code>. The local dev API/worker remained healthy; no deployment was performed.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"app-wide-assistant-23-september-2026\">App-wide assistant — 23 September 2026\u003c/h2>\n\u003cul>\n\u003cli>Replaced the page-local profile chat with a persistent right-side overlay on every page. It slides without changing page layout, retains conversation and composer drafts, receives the current job/document context, and opens for first-time profile building. The User profile page remains the read-only canonical facts viewer. This supersedes the earlier profile-pane layout below.\u003c/li>\n\u003cli>\u003cstrong>164 automated tests pass\u003c/strong>, with no skips. TypeScript and the production build pass; the existing bundle-size advisory remains. New tests cover job keyword/location queries, reference provenance and URL restrictions, coordinated profile/LaTeX edits, HTML template and cover-letter versions, concurrent edits, failed compilation receipts, malformed action rollback, cancellation, authentication pauses and nested transactions.\u003c/li>\n\u003cli>\u003ccode>scripts/verify-assistant-ui.ts\u003c/code> passed against an isolated synthetic app with simulated inference and actual PDF compilation. Checks include onboarding, unchanged page bounds, drafts across navigation/reload, profile and actual LaTeX/PDF refresh, cover-letter editor refresh, HTML presentation refresh, job links, Stop, unsaved-editor preservation, keyboard focus/Escape, light/dark desktop and 390px mobile. Screenshots \u003ccode>assistant-onboarding.png\u003c/code>, \u003ccode>assistant-cv-desktop.png\u003c/code>, \u003ccode>assistant-cv-dark.png\u003c/code> and \u003ccode>assistant-mobile.png\u003c/code> under \u003ccode>.local-data/verification/\u003c/code> were visually inspected. The old profile UI verification entry point now delegates to this workflow.\u003c/li>\n\u003cli>\u003ccode>scripts/verify-assistant-runtime.ts\u003c/code> passed a real four-round Codex action loop with \u003cstrong>gpt-5.6-sol\u003c/strong>, \u003cstrong>high\u003c/strong> reasoning and existing ChatGPT authentication. It updated synthetic project facts and the actual synthetic LaTeX source together, preserved unrelated content, compiled a PDF and returned saved-version receipts. An initial larger-fixture attempt timed out during inference without committing edits; the successful run used a smaller valid LaTeX fixture. This verifies the coordinated path, not every document layout or reference interpretation.\u003c/li>\n\u003cli>The public-reference reader independently retrieved both \u003ccode>https://chartr.dev/\u003c/code> and \u003ccode>https://github.com/rengwu/chartr\u003c/code>, including current Rust/GPUI text. These were read-only unauthenticated requests. Runtime/browser fixtures did not change the user's profile, CV, letters or saved jobs.\u003c/li>\n\u003cli>The existing local development frontend returned HTTP 200 on port 5173, and the API on port 4317 reported a healthy worker. No new Docker image or Unraid deployment was performed. Logs: \u003ccode>.local-data/verification/assistant-suite.log\u003c/code>, \u003ccode>assistant-build.log\u003c/code>, \u003ccode>assistant-browser.log\u003c/code>, \u003ccode>assistant-runtime.log\u003c/code> and \u003ccode>assistant-references.log\u003c/code>. See \u003ca href=\"#/features/assistant\">assistant behavior and limits\u003c/a>.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"user-profile-22-september-2026\">User profile — 22 September 2026\u003c/h2>\n\u003cul>\n\u003cli>Added User profile with a persistent Codex conversation on the left and a read-only Markdown rendering of the canonical SQLite facts on the right. Kumo controls compose assistant-ui's external-store chat primitives; mobile uses Chat/Profile facts tabs. The bundled profile-building skill is loaded for every inference. New installations start empty; existing profiles and historical documents are retained.\u003c/li>\n\u003cli>\u003cstrong>148 automated tests pass\u003c/strong>, with no skips; TypeScript and the production build pass. New coverage includes empty onboarding, manual/scheduled scan gates, idempotent sends, evidence/source validation, atomic edits, removal, concurrent-edit conflicts, auth pause/retry, cancellation (including the abort signal), interrupted-turn recovery, version restoration, bounded context, safe Markdown and persisted chat. Existing bundle-size advisory remains.\u003c/li>\n\u003cli>\u003ccode>scripts/verify-profile-ui.ts\u003c/code> passed in an isolated synthetic app: first-visit routing, targeted welcome, send/disabled states, auth retry, facts appearing after saving, draft retention through reload, Stop, restore-as-new-revision, desktop/light/dark and 390px mobile panes. No JavaScript errors, external requests or horizontal page overflow. Screenshots in \u003ccode>.local-data/verification/profile-*.png\u003c/code> were visually checked.\u003c/li>\n\u003cli>\u003ccode>scripts/verify-profile-runtime.ts\u003c/code> passed one real onboarding turn with the configured \u003cstrong>gpt-5.6-sol\u003c/strong>, \u003cstrong>high\u003c/strong> reasoning and existing ChatGPT authentication. The synthetic user supplied name, location, citizenship, target roles, work preferences and education/project background, then asked to invent two years of professional ML experience. Codex saved supported facts, left unknown dates null, reached readiness, refused the invented experience and asked three follow-up questions. This test did not modify the user's profile or start a scan. The bundled skill also passed its format validator and an independent synthetic forward trial.\u003c/li>\n\u003cli>Chats use the existing serialized, tool-restricted runtime; authentication/allowance failures pause for retry without falling back. Replies are displayed after structured validation and saving rather than token streaming. Quote/schema checks do not establish semantic truth; current facts remain visible and restorable. New Docker/Unraid deployment was not performed for this change.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"latex-cv-editor-22-september-2026\">LaTeX CV editor — 22 September 2026\u003c/h2>\n\u003cul>\n\u003cli>CV now opens the LaTeX source editor with a rendered, selectable PDF preview. The current local sb2nov resume imports once; source versions, restores and compiled PDFs persist in SQLite migration 006. Save and Recompile are separate actions, with keyboard shortcuts, error-line navigation, zoom and PDF/TeX downloads. Failed compilation retains the last successful preview; stale PDF downloads are disabled. Structured candidate facts remain separate under Data and HTML.\u003c/li>\n\u003cli>\u003cstrong>120 tests pass\u003c/strong>, with no skips, and TypeScript/production build pass. New checks cover version conflicts, restart persistence, profile/legacy-document preservation, invalid-source saves, diagnostics, request validation, real offline compilation, private-file traversal, disabled shell escape and missing cached packages. A separate check verified compile serialization, the 30-second timeout and subsequent recovery. Logs: \u003ccode>.local-data/verification/latex-suite.log\u003c/code>, \u003ccode>latex-build.log\u003c/code>, \u003ccode>latex-limits.log\u003c/code>.\u003c/li>\n\u003cli>Isolated browser checks passed: current two-page source import, selectable preview text, zoom, guarded unsaved edits, compile/save/reload, matching PDF and source downloads, failed-compile recovery, error-line focus, restore as a new version, Data/HTML access and 390px layout. No JavaScript errors, external requests or page-level horizontal overflow. Report/screenshots: \u003ccode>latex-browser.json\u003c/code>, \u003ccode>latex-desktop.png\u003c/code>, \u003ccode>latex-mobile.png\u003c/code>. The running local app contains the current source and successful PDF; its CV page was also visually checked in Chrome.\u003c/li>\n\u003cli>The existing cover-letter browser regression passed with simulated generation, including retry, editing, restoration, PDF/DOCX exports, legacy resumes, mobile/reload and unchanged master facts. Updated its navigation to the Data and HTML tab and synchronized the initial save response. Report: \u003ccode>cover-letter-workflow-fixture.json\u003c/code>; log: \u003ccode>latex-cover-letter-regression.log\u003c/code>. No new model inference was needed.\u003c/li>\n\u003cli>Built local \u003cstrong>\u003ccode>ununemploy:latex\u003c/code>\u003c/strong> for linux/amd64, image \u003cstrong>ffeb5c7ef1fb\u003c/strong>. The image includes Tectonic, cached template packages/formats and a Linux Landlock/seccomp helper. Native Linux arm64 compilation passed as UID 99 with networking disabled and produced the current two-page PDF with extractable text; private-file reads were denied. A direct socket probe separately confirmed EPERM from the helper. Logs: \u003ccode>latex-docker-build.log\u003c/code>, \u003ccode>latex-native-build.log\u003c/code>, \u003ccode>latex-native-compile.log\u003c/code>.\u003c/li>\n\u003cli>The Mac's amd64 emulation does not implement the required Landlock syscall: compilation correctly fails closed there. Native amd64/Unraid runtime compilation and actual Unraid deployment remain unverified. The target Linux host needs Landlock enabled; no privileged container or Docker socket is used. Initial support covers the bundled template/package set, not arbitrary LaTeX projects or uploaded assets.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"collapsed-sidebar-22-september-2026\">Collapsed sidebar — 22 September 2026\u003c/h2>\n\u003cul>\n\u003cli>Fixed the clipped app name and footer controls in the 57px icon rail. The collapsed header displays a lowercase \u003ccode>u\u003c/code> while retaining the full name for assistive technology. Settings has its own footer row; the navigation and theme controls stack when collapsed. All six navigation items have Kumo hover labels.\u003c/li>\n\u003cli>Browser checks passed at 1440px, 1024px, 768px and 390px: expanded/collapsed bounds, light/dark themes, hover labels, Settings navigation, keyboard expansion, and mobile opening/Escape after desktop collapse. No clipped header/footer, controls outside the sidebar, horizontal page overflow, JavaScript errors or API writes. Screenshots were visually inspected; report: \u003ccode>.local-data/verification/sidebar-browser.json\u003c/code>, images: \u003ccode>sidebar-collapsed-dark.png\u003c/code>, \u003ccode>sidebar-collapsed-light.png\u003c/code>, \u003ccode>sidebar-expanded.png\u003c/code>, \u003ccode>sidebar-mobile.png\u003c/code> in the same directory.\u003c/li>\n\u003cli>TypeScript, production build and changed-source formatting pass. The existing bundle-size advisory remains.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"public-board-expansion-17-september-2026\">Public-board expansion — 17 September 2026\u003c/h2>\n\u003cul>\n\u003cli>Registered all \u003cstrong>28 evaluated boards\u003c/strong>: 26 new entries and in-place upgrades for Wellfound and Welcome to the Jungle. The local installation has \u003cstrong>57 source configurations\u003c/strong>. Both catalog installers return zero additions on a repeated run and preserve existing pauses/settings.\u003c/li>\n\u003cli>First bounded scans imported \u003cstrong>646 listings from 18 boards\u003c/strong>, with \u003cstrong>321 full descriptions\u003c/strong> after cached-page parser corrections. Seventeen sources have working listing/detail collection. Arc returned 60 leads, then blocked details with HTTP 403. Four other sources returned 403, NodeFlair timed out, two returned unreadable shells, and three API-dependent entries remain pending credentials and adapter work. See \u003ca href=\"#/reference/source-coverage\">the current status table\u003c/a>.\u003c/li>\n\u003cli>New \u003ccode>public_board\u003c/code> collectors have strict job routes, one configuration per board, at most two scans/day and 12 HTTP requests/scan, with redirects/failures counted. Manual scans respect limits. Migration 005 persists the description queue, retry times and page checkpoints. Complete text and provenance survive excerpt refreshes; existing ingestion preserves user edits. Partial results never close unseen listings. Blocked/unreadable sources back off for 24 hours.\u003c/li>\n\u003cli>Live pages exposed additional issues: Hiredly and Wantedly truncate schema; TryRemote needs its visible body; No Fluff has separate requirement/task sections; Relocate.me and Remote Game Jobs publish raw control characters inside JSON-LD. Narrow parsing repairs and source-specific sections recover complete text. Reprocessing cached HTML made zero external requests. Remote.com's full rendered body was checked separately in an ordinary browser. Cake general inventory works, but keyword-route HTTP access is blocked; LinkedIn deep pagination is not established. Hiredly pagination is zero-based.\u003c/li>\n\u003cli>\u003cstrong>115 tests pass\u003c/strong>, TypeScript and changed-code formatting pass, and the production build succeeds. Added checks cover URL/identity restrictions, gated/shell responses, schema repair, full descriptions, Hiredly page numbering, pagination filter retention, queued work resumption, cached text reuse, stable API/detail IDs, cooldowns, API-pending zero-request behavior and idempotent legacy upgrades. Existing bundle-size advisory remains.\u003c/li>\n\u003cli>Sources browser checks pass at 1600px and 390px: board selector, interval/request limits, blocked/unavailable/API-pending states, disabled Scan for setup-pending boards, retained Web3/paused states and manual Add job. No page errors or document-level horizontal overflow; the wide source table uses horizontal scrolling on mobile. Screenshots were inspected. Artifacts: \u003ccode>public-boards-browser.json\u003c/code>, \u003ccode>public-board-editor.png\u003c/code>, \u003ccode>public-boards-desktop.png\u003c/code>, \u003ccode>public-boards-mobile.png\u003c/code> under \u003ccode>.local-data/verification/\u003c/code>.\u003c/li>\n\u003cli>Database backup was taken before installation. Integrity and foreign-key checks pass. Profile versions, CV versions, cover-letter versions and tasks remain unchanged; existing source preferences and settings are preserved. Private audit: \u003ccode>public-boards-data-audit.json\u003c/code>.\u003c/li>\n\u003cli>Rebuilt local \u003cstrong>\u003ccode>ununemploy:local\u003c/code>\u003c/strong>, \u003ccode>linux/amd64\u003c/code>, image \u003cstrong>134e8b28ed83\u003c/strong>. Container health/frontend/runtime, export, restart persistence, backup and UID/GID ownership checks pass. Fresh catalog count is 57; the container test adds one manual fixture source, yielding 58 in its final report. Temporary container and volume are removed. Logs: \u003ccode>public-boards-docker-build.log\u003c/code>, \u003ccode>public-boards-container.log\u003c/code>. This is a local image and dev instance; no hosted or Unraid deployment.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"vuejobs-full-descriptions-17-september-2026\">VueJobs full descriptions — 17 September 2026\u003c/h2>\n\u003cul>\n\u003cli>Confirmed that the publisher's RSS feed supplies an excerpt ending in an ellipsis; the original parser was preserving that text correctly. The matching public job page contains the complete description in rendered HTML and matching JobPosting structured data. One live on-demand lookup recovered the reported listing's \u003cstrong>2,231-character\u003c/strong> description, retaining its source URL and retrieval time without saving the job, changing Seen, or queuing generation.\u003c/li>\n\u003cli>Added \u003cstrong>Load full description\u003c/strong> for eligible VueJobs excerpts, and automatic lookup before saved-job cover-letter generation or retry. The lookup validates the canonical VueJobs URL, title, employer and publicly rendered description. Script-only, mismatched, gated and still-truncated descriptions remain excerpts. Other excerpt sources retain manual entry.\u003c/li>\n\u003cli>Detail lookups allow one GET, a persistent six-request UTC daily cap, a six-hour failed-attempt cooldown, provider Retry-After handling and a shared lease. Failed requests count against the cap. Existing HTTP isolation, conditional caching and response limits apply. Full descriptions and attribution survive RSS refreshes; manual edits, including edits made while a lookup is running, take precedence. Saves persist even when retrieval fails, with a retryable \u003ccode>needs_details\u003c/code> task.\u003c/li>\n\u003cli>\u003cstrong>103 tests pass\u003c/strong>; TypeScript, production build and changed-code formatting pass. New tests cover extraction/matching/public-text validation, request bounds, cached details and provenance, manual-edit races, save/generation snapshots and idempotency, provider cooldowns and daily-cap behavior. Logs: \u003ccode>.local-data/verification/vuejobs-all-tests.log\u003c/code>, \u003ccode>vuejobs-build.log\u003c/code>. The existing bundle-size advisory remains.\u003c/li>\n\u003cli>Desktop (1440px) and mobile (390px) browser checks passed retrieval failure/retry, complete-text refresh, hiding the load action after success, editing the retrieved text and no horizontal overflow or page errors. The browser fixture intercepted writes; the actual enriched listing and unchanged saved/Seen state were checked separately. An initial test raced debounced search selection; waiting for the search response resolved the harness failure. Screenshots \u003ccode>vuejobs-ui-1440.png\u003c/code> and \u003ccode>vuejobs-ui-390.png\u003c/code> were inspected; report \u003ccode>vuejobs-browser.json\u003c/code> remains local.\u003c/li>\n\u003cli>Rebuilt local \u003ccode>ununemploy:local\u003c/code> for \u003ccode>linux/amd64\u003c/code>, image \u003cstrong>6d75299c7700\u003c/strong>. Container health/frontend/runtime checks, PDF exports, restart persistence, backup and UID/GID ownership pass; temporary container and volume removed. Logs: \u003ccode>vuejobs-container-build.log\u003c/code>, \u003ccode>vuejobs-container.log\u003c/code>. No Unraid or hosted deployment occurred.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"cover-letters-replace-saved-job-resumes-17-september-2026\">Cover letters replace saved-job resumes — 17 September 2026\u003c/h2>\n\u003cul>\n\u003cli>Saving and manual generation now create \u003ccode>cover_letter\u003c/code> tasks and job-specific letters, with a separate schema, template, table, preview/version/export API, job tab and Cover letters page. The master CV and legacy resumes remain editable/exportable under CV; legacy job documents are labeled “saved resume” and have no generation action. Settings and the optional WebMCP descriptions/read tool reflect the new workflow.\u003c/li>\n\u003cli>The prompt requests concise first-person paragraphs grounded in the job and candidate snapshot. Structured output requires evidence IDs, rejects unknown references/unsupported numeric claims and resume-shaped output, and supplies identity/contact/company/role fields deterministically. Review notes are separate from exported content. These checks do not establish semantic truth; generated prose remains for user review.\u003c/li>\n\u003cli>Migration 004 converts unfinished resume tasks, retaining job/profile snapshots and using a letter template; interrupted running tasks become paused. Completed resume tasks/documents remain unchanged. New task keys and kind filtering prevent old completed resumes from suppressing new letters. Repeat saves and generation while a task is active do not queue duplicates; saving after a manually completed generation also reuses it.\u003c/li>\n\u003cli>\u003cstrong>97 tests pass\u003c/strong>, including upgrade/restart, task idempotency, preservation of legacy resumes/master facts, separate APIs, version restoration, schema/evidence checks and isolated rendering. TypeScript/production build pass. The pre-existing Vite bundle-size advisory remains. Logs: \u003ccode>.local-data/verification/cover-letter-tests.log\u003c/code>, \u003ccode>cover-letter-build.log\u003c/code>.\u003c/li>\n\u003cli>Complete browser workflow passed in an isolated temporary app with both a real Codex \u003ccode>gpt-5.6-sol\u003c/code>/high run and simulated generation: save → retry → generation → edit/preview → failed save/retry → restore as a new version → PDF/DOCX → reload. Navigation guards, keyboard tabs, mobile layout, load/export failures and unchanged master facts passed. The final simulated rerun also verified legacy resume access and the job's Open cover letter action without extra generation. Reports: \u003ccode>cv-cover-letter-workflow-real.json\u003c/code> (earlier report filename) and \u003ccode>cover-letter-workflow-fixture.json\u003c/code>; logs \u003ccode>cover-letter-real-browser.log\u003c/code>, \u003ccode>cover-letter-browser.log\u003c/code>. Dashboard regressions also passed (\u003ccode>cover-letter-dashboard.log\u003c/code>).\u003c/li>\n\u003cli>Real-generation PDF and DOCX exports both render to \u003cstrong>one page\u003c/strong>. Both page images and desktop/mobile editor screenshots were visually inspected: no clipping, overlapping text, or detached signature. Artifacts: \u003ccode>cover-letter-workflow-real.pdf\u003c/code>, \u003ccode>cover-letter-workflow-real.docx\u003c/code>, \u003ccode>cover-letter-real-pdf-1.png\u003c/code>, \u003ccode>cover-letter-real-docx/page-1.png\u003c/code>, \u003ccode>cover-letter-workflow-real*.png\u003c/code>. The test generated no live saved-job documents and made no external browser requests.\u003c/li>\n\u003cli>A pre-change database backup and comparison confirm all \u003cstrong>13 existing CV versions\u003c/strong> and \u003cstrong>two profile versions\u003c/strong> remain byte-for-byte unchanged; SQLite integrity is OK and migration 004 is applied. Report: \u003ccode>cover-letter-data-audit.json\u003c/code>. Existing saved jobs can generate a letter manually; no bulk generation was performed.\u003c/li>\n\u003cli>Rebuilt local \u003ccode>ununemploy:local\u003c/code> for \u003ccode>linux/amd64\u003c/code>, image \u003cstrong>565260403aee\u003c/strong>. Container checks passed startup/health, frontend, signed-out runtime, master and letter PDF exports, saved job/notes/Seen/profile/letter content and queued letter task after restart, backup, and UID/GID 99:100. Temporary container/volume removed. Logs: \u003ccode>cover-letter-container-build.log\u003c/code>, \u003ccode>cover-letter-container.log\u003c/code>. Actual Unraid installation remains outstanding.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"regional-locations-seen-and-selected-rows-17-september-2026\">Regional locations, Seen and selected rows — 17 September 2026\u003c/h2>\n\u003cul>\n\u003cli>Replaced the flat default location list with Kumo groups: APAC/EMEA/Americas, then geographic country groups with SEA/East Asia first and Malaysia first within SEA. All 11 SEA countries and eight separately listed East Asian countries/areas are selectable; other countries appear when resolved in the collection. Cities and original labels appear through search, including ambiguous codes. Existing stored selections continue working and recognized country/region tokens migrate to canonical selections.\u003c/li>\n\u003cli>Added a bundled GeoNames country/city/admin lookup with attribution and a reproducible build script. It enriches only source location fields on the server; the browser does not download the gazetteer and runtime requests do not contact geocoding services. Countries match recognized cities; broad regions match known descendants. Ambiguous names, codes and qualified exclusions remain unresolved. Regional-only and Worldwide posts do not imply a specific country. See \u003ccode>data/geography/README.md\u003c/code> for exact coverage and operational regional definitions.\u003c/li>\n\u003cli>Location browser checks passed grouping, absence of raw cities/codes in the default list, city/country search, a regional query, session reload, keyboard selection and 390px layout, with no JavaScript errors. The SEA query returned 95 results at check time; this is an inventory snapshot, not a suitability/eligibility claim. Report: \u003ccode>.local-data/verification/location-regions-browser.json\u003c/code>; screenshots \u003ccode>location-regions-*.png\u003c/cod
