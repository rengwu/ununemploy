 instance first. The installer refuses active leases and does not overwrite an existing desktop database. Installation updates the local \u003ccode>.env\u003c/code>; it is not a disposable fixture command.\u003c/p>\n\u003cp>Native UI checks: open the app, edit/save a synthetic LaTeX CV, compile and inspect its selectable PDF preview, download using the native Save panel, verify unsaved-edit cancellation on Quit, close the window, confirm a fresh worker heartbeat, reopen, then Quit and confirm the entire service process group exits. Use \u003ca href=\"#/verification/setup\">shared setup\u003c/a> and keep personal data out of screenshots.\u003c/p>\n\u003ch2 id=\"coverage-and-limitations\">Coverage and limitations\u003c/h2>\n\u003cp>The bundle is approximately 1.1 GB because it includes the model/runtime and document-export dependencies. Its native UI uses the system webview. The build is locally ad-hoc signed, not Developer ID signed or notarized for distribution. No Windows/Linux desktop package, automatic update system, login item, or tray icon is provided. Unraid remains an independent supported hosting target; no server deployment is implied.\u003c/p>\n\u003cp>Window routing/filter state is tied to the saved local origin. If another application occupies its port, a new port is used and origin-specific browser preferences may start afresh; SQLite records remain intact. Service failure requires quitting/reopening the app after the displayed error. Existing startup recovery preserves queued work and pauses interrupted model jobs.\u003c/p>\n\u003ch2 id=\"verification-history\">Verification history\u003c/h2>\n\u003cp>\u003ca href=\"#/verification/runs/2026-10-07T114528Z-desktop-portable\">Desktop portability follow-up — 7 October 2026\u003c/a> passed the corrected bundle audit, 175-test suite, packaged lifecycle and final startup.\u003c/p>\n\u003cp>\u003ca href=\"#/verification/runs/2026-10-07T113853Z-desktop\">Native desktop verification — 7 October 2026\u003c/a> records the packaging, lifecycle, native workflow and installation checks. These expectations are not a claim that every provider, model invocation or document layout was reverified during packaging.\u003c/p>\n","backlinks":["index","decisions/index","features/index","guides/local-development","journal/2026-10-07-desktop","reference/architecture","verification/runs/2026-10-07T113853Z-desktop","verification/runs/2026-10-07T114528Z-desktop-portable"]},{"id":"features/discovery","title":"Discovery and sources","section":"Features","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-10-07\u003c/span>","updated":"2026-10-07","summary":"","source":"---\ntitle: Discovery and sources\nsection: Features\nupdated: 2026-10-07\n---\n# Discovery and sources\n\nFeature ID: `FEAT-discovery`\n\n## Intent and basis\n\nCollect bounded, attributable job leads while preserving source progress and user data. Based on the [accepted project boundaries](../decisions/index.md) and existing implementation documentation; this migration adds no product requirement.\n\n## Entry points and prerequisites\n\nSources configures identifiers and intervals; Scan and the worker require a ready profile. X/Web3 need separate credentials and configured budgets.\n\n## Expected outcomes\n\nFailed or partial scans preserve listings and checkpoints. Budgets apply to manual scans too. Saving an excerpt waits for details. Manual entry never submits anything externally.\n\n## Verification recipe\n\nUse [shared verification setup](../verification/setup.md) for isolation, build identity, evidence and cleanup. `npx tsx --test tests/discovery.test.ts tests/public-boards.test.ts tests/next-sources.test.ts tests/vuejobs.test.ts tests/system.test.ts` uses isolated data and simulated provider responses. Live Scan calls need intentional source selection and its configured request allowance.\n\nRecipes are migrated from existing scripts and historical checks; they were not re-executed during the wiki migration.\n\n## Coverage and limitations\n\nFixture checks do not establish current provider access. [Coverage](../reference/source-coverage.md) gives dated live observations; incomplete API adapters are explicit.\n\n## Verification history\n\n[X status check — 7 October 2026](../verification/runs/2026-10-07T073652Z-x-status.md): recent budget-limited scans imported posts; the local runtime was stopped at inspection.\n\n[Historical implementation checks](../verification/history.md) record previous selected scenarios and limitations. Those entries are historical evidence; new reports belong in [verification runs](../verification/index.md).\n\n\n| Source | Identifier | Access |\n| --- | --- | --- |\n| Ashby | Board name, e.g. `linear` | Public posting API |\n| Greenhouse | Board token, e.g. `anthropic` | Public job board API |\n| Lever | Site name | Public postings API |\n| Hacker News | `whoishiring` | Official Firebase API; current and preceding hiring threads |\n| RSS / Atom | Public feed URL | Public feeds |\n| X | Search query | Official recent-search API and app-only bearer token |\n| Himalayas | Search keywords separated by `\\|` | Public search API; two recent pages per keyword |\n| Remote OK / Remotive / Jobicy | Fixed feed | Public JSON APIs |\n| 4 Day Week | Category slugs separated by commas | Public v2 API; newest page plus resumable older pages |\n| Arbeitnow | `de` or `uk` | Public visa-sponsorship job APIs |\n| Hacker News · YC jobs | `jobstories` | Official Firebase API, separate from monthly hiring threads |\n| Web3.career | Fixed feed | Official JSON API; separate token, up to 100 recent listings per scan |\n| Public job board | Select a board | Public HTML, embedded page data or published feed/API; status reports access failures and setup requirements |\n| Manual entry | Website URL | Open the site yourself and paste a posting; no automatic requests |\n\nFresh installations include **57 source configurations**, including 28 boards from the latest expansion. Existing Wellfound and Welcome to the Jungle entries are upgraded in place. This is a configuration count, not 57 distinct working job boards. See [current results and access limitations](../reference/source-coverage.md). X still requires local credentials and a configured budget.\n\nFor an existing installation, add missing catalog entries without changing existing source preferences:\n\n```sh\nnpx tsx scripts/add-discovery-sources.ts\n```\n\nTo install only the 28 public-board entries, use `npx tsx scripts/add-public-boards.ts`. Both installers are idempotent and preserve existing collector preferences.\n\nCollection defaults to every four hours, with individual intervals editable in Sources. Effective scheduled intervals use the slower of the global and source settings. Himalayas runs daily, Remotive/VueJobs/Web3.career twice daily, specialist RSS daily, and most other additions two to four times daily. Each source has at most six scans per calendar day, including manual scans; collector cooldowns enforce daily Himalayas collection, at most four Remotive scans, and at most two Web3.career scans. Every scan also has a request budget. Fetches use conditional caching, a per-host delay, response-size limits, and Retry-After cooldowns. Partial HN/Lever/X/Himalayas scans retain checkpoints. Failed scans preserve existing jobs and drafts.\n\nPublic-board collectors run at most twice daily, with at most 12 HTTP requests per scan, including redirects and failures. The first page refreshes on each pass; supported pagination continues from saved checkpoints, and remaining requests process a SQLite description queue. Completed detail pages are reused and become eligible for revalidation after seven days. Blocked/challenged sources wait at least 24 hours; manual scans respect cooldowns. The Sources page distinguishes **Blocked**, **Unavailable**, **Failed** and **Needs API setup**. Adzuna, Jooble and Careerjet are registered but await publisher credentials and API adapter configuration; they make no requests. Web3 remains separate and pending its token. Public-page discovery never closes vacancies simply because they disappear from a partial result page.\n\nPublic feeds retain their source URLs and attribution. RSS extracts employer and location fields where supplied; excerpts and empty descriptions remain leads. Saving an RSS lead waits for a complete description. VueJobs can retrieve its public job page on save or through **Load full description**. For other excerpts, paste the full text in the Description editor and retry the cover-letter task. Truncated feeds do not close missing listings. Himalayas expiry timestamps are retained and already-expired incoming entries are marked closed. Pay periods/currencies remain unknown when a feed omits them; 4 Day Week salary cents are converted to currency units. These feeds are bounded discovery, not exhaustive mirrors. VueJobs discovery uses its publisher-advertised RSS feed. Public detail retrieval is on demand, not a crawl: one request per lookup, at most six per UTC day, with a six-hour failed-attempt cooldown and provider Retry-After handling. It accepts only matching JobPosting data also present in the public page text, keeps source attribution, and preserves full descriptions across shorter RSS refreshes. Manual edits take precedence. Unavailable/gated descriptions remain excerpts; no paywall bypass is used.\n\n### Web3.career setup\n\n1. Obtain your token from the [official API page](https://web3.career/web3-jobs-api).\n2. In **Settings → Web3.career**, enter it and choose **Save token**. It is stored in the data directory’s `secrets/web3.json` with mode 0600 and is never returned to the browser. Alternatively use `JH_WEB3_API_TOKEN`; a dashboard-saved token takes precedence.\n3. The enabled source becomes eligible for its scheduled scan. It reads up to 100 recent listings with full descriptions, without country or remote-only filters, twice daily. No pagination is offered by the API, so this is bounded coverage.\n\nMissing credentials make no requests; HTTP 401/403 pauses further attempts until the token is replaced in Settings. Query-string credentials are excluded from the HTTP cache and error history, and credentialed redirects are not followed. Original `apply_url` values and follow links are retained as required by the [API terms](https://docs.bondex.app/api-reference/web3-career-jobs-api/api-overview). Authenticated Web3 collection still requires live verification after the user supplies a token.\n\n### Manual job entry and public boards\n\n**Sources → Open site** opens the provider for you. **Add job** accepts the role, employer, posting URL, location and description while keeping that board’s attribution. Adding a job does not generate a draft; saving it in Jobs does. Sources of type `manual` cannot be scheduled or scanned.\n\nWellfound and Welcome to the Jungle entries were subsequently upgraded to `public_board`. Their automated results and access limits are in [source coverage](../reference/source-coverage.md); manual Add job remains available. The earlier manual-only behavior is preserved in the [source-evaluation journal](../journal/2026-09-16-source-evaluation.md).\n\n### X setup\n\n1. Sign in to the [X developer console](https://console.x.com/), create an app, and obtain its **app-only bearer token**. This is the credential for reading public data; user access tokens are unnecessary. [Official access guide](https://docs.x.com/x-api/getting-started/getting-access).\n2. In **Settings → X**, enter the bearer token and choose **Save token**. It is stored locally under the data directory with mode 0600 and is never returned by the API. Alternatively set `JH_X_BEARER_TOKEN` in `.env` or the Unraid template. A dashboard-saved token takes precedence.\n3. Set a monthly post limit of at least 10, enable X, and save settings. The default is zero and disabled, so no paid requests begin before configuration. X API usage is separate from the Codex subscription; manage API credits and spending controls in the X console.\n4. Open **Sources → X · Engineering** to edit the starter search, add more searches, or scan. Searches support the [official recent-search syntax](https://docs.x.com/x-api/posts/search-recent-posts), including `from:account` and `-is:retweet`.\n\nThe initial X scan looks back 24 hours. Later scans use fixed time windows and resume pagination without advancing the completed checkpoint early. The API only exposes recent history; after an extended outage, older posts may be unavailable. Post IDs remain strings. Results deduplicate across searches. Retrieval volume is reserved before requests; ambiguous failures retain reservations. The counter is conservative and is **not a currency spending guarantee**. The cap is shared by all X searches and resets by UTC calendar month. Sources have separate daily scan caps.\n\nX batches divide the remaining monthly allowance across the remaining time and enabled searches. Because the API requires at least 10 posts per request, small budgets extend the interval between scheduled X scans beyond four hours. The next scan time is persisted. Manual scans share the monthly cap but can run before the scheduled time. High-volume searches may outpace the chosen budget.\n\nX is a required integration, implemented with credential entry, saved queries, retrieval limits, and fixture coverage. Authenticated retrieval was verified locally on 15 September 2026 with a selected limit of 1,000 posts per UTC calendar month. The first two requests consumed 20 post reads and yielded 17 unique records. These are historical observations; Settings and scan history describe the current configuration and allowance. Fresh installations require their own locally configured credentials and settings.\n","toc":[{"id":"intent-and-basis","title":"Intent and basis","depth":2},{"id":"entry-points-and-prerequisites","title":"Entry points and prerequisites","depth":2},{"id":"expected-outcomes","title":"Expected outcomes","depth":2},{"id":"verification-recipe","title":"Verification recipe","depth":2},{"id":"coverage-and-limitations","title":"Coverage and limitations","depth":2},{"id":"verification-history","title":"Verification history","depth":2},{"id":"web3-career-setup","title":"Web3.career setup","depth":3},{"id":"manual-job-entry-and-public-boards","title":"Manual job entry and public boards","depth":3},{"id":"x-setup","title":"X setup","depth":3}],"titleAnchor":"discovery-and-sources","links":["decisions/index","verification/setup","reference/source-coverage","verification/runs/2026-10-07T073652Z-x-status","verification/history","verification/index","reference/source-coverage","reference/source-coverage","journal/2026-09-16-source-evaluation"],"attachments":[],"html":"\u003cp>Feature ID: \u003ccode>FEAT-discovery\u003c/code>\u003c/p>\n\u003ch2 id=\"intent-and-basis\">Intent and basis\u003c/h2>\n\u003cp>Collect bounded, attributable job leads while preserving source progress and user data. Based on the \u003ca href=\"#/decisions/index\">accepted project boundaries\u003c/a> and existing implementation documentation; this migration adds no product requirement.\u003c/p>\n\u003ch2 id=\"entry-points-and-prerequisites\">Entry points and prerequisites\u003c/h2>\n\u003cp>Sources configures identifiers and intervals; Scan and the worker require a ready profile. X/Web3 need separate credentials and configured budgets.\u003c/p>\n\u003ch2 id=\"expected-outcomes\">Expected outcomes\u003c/h2>\n\u003cp>Failed or partial scans preserve listings and checkpoints. Budgets apply to manual scans too. Saving an excerpt waits for details. Manual entry never submits anything externally.\u003c/p>\n\u003ch2 id=\"verification-recipe\">Verification recipe\u003c/h2>\n\u003cp>Use \u003ca href=\"#/verification/setup\">shared verification setup\u003c/a> for isolation, build identity, evidence and cleanup. \u003ccode>npx tsx --test tests/discovery.test.ts tests/public-boards.test.ts tests/next-sources.test.ts tests/vuejobs.test.ts tests/system.test.ts\u003c/code> uses isolated data and simulated provider responses. Live Scan calls need intentional source selection and its configured request allowance.\u003c/p>\n\u003cp>Recipes are migrated from existing scripts and historical checks; they were not re-executed during the wiki migration.\u003c/p>\n\u003ch2 id=\"coverage-and-limitations\">Coverage and limitations\u003c/h2>\n\u003cp>Fixture checks do not establish current provider access. \u003ca href=\"#/reference/source-coverage\">Coverage\u003c/a> gives dated live observations; incomplete API adapters are explicit.\u003c/p>\n\u003ch2 id=\"verification-history\">Verification history\u003c/h2>\n\u003cp>\u003ca href=\"#/verification/runs/2026-10-07T073652Z-x-status\">X status check — 7 October 2026\u003c/a>: recent budget-limited scans imported posts; the local runtime was stopped at inspection.\u003c/p>\n\u003cp>\u003ca href=\"#/verification/history\">Historical implementation checks\u003c/a> record previous selected scenarios and limitations. Those entries are historical evidence; new reports belong in \u003ca href=\"#/verification/index\">verification runs\u003c/a>.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Source\u003c/th>\n\u003cth>Identifier\u003c/th>\n\u003cth>Access\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Ashby\u003c/td>\n\u003ctd>Board name, e.g. \u003ccode>linear\u003c/code>\u003c/td>\n\u003ctd>Public posting API\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Greenhouse\u003c/td>\n\u003ctd>Board token, e.g. \u003ccode>anthropic\u003c/code>\u003c/td>\n\u003ctd>Public job board API\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Lever\u003c/td>\n\u003ctd>Site name\u003c/td>\n\u003ctd>Public postings API\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Hacker News\u003c/td>\n\u003ctd>\u003ccode>whoishiring\u003c/code>\u003c/td>\n\u003ctd>Official Firebase API; current and preceding hiring threads\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>RSS / Atom\u003c/td>\n\u003ctd>Public feed URL\u003c/td>\n\u003ctd>Public feeds\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>X\u003c/td>\n\u003ctd>Search query\u003c/td>\n\u003ctd>Official recent-search API and app-only bearer token\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Himalayas\u003c/td>\n\u003ctd>Search keywords separated by \u003ccode>|\u003c/code>\u003c/td>\n\u003ctd>Public search API; two recent pages per keyword\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Remote OK / Remotive / Jobicy\u003c/td>\n\u003ctd>Fixed feed\u003c/td>\n\u003ctd>Public JSON APIs\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4 Day Week\u003c/td>\n\u003ctd>Category slugs separated by commas\u003c/td>\n\u003ctd>Public v2 API; newest page plus resumable older pages\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Arbeitnow\u003c/td>\n\u003ctd>\u003ccode>de\u003c/code> or \u003ccode>uk\u003c/code>\u003c/td>\n\u003ctd>Public visa-sponsorship job APIs\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Hacker News · YC jobs\u003c/td>\n\u003ctd>\u003ccode>jobstories\u003c/code>\u003c/td>\n\u003ctd>Official Firebase API, separate from monthly hiring threads\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Web3.career\u003c/td>\n\u003ctd>Fixed feed\u003c/td>\n\u003ctd>Official JSON API; separate token, up to 100 recent listings per scan\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Public job board\u003c/td>\n\u003ctd>Select a board\u003c/td>\n\u003ctd>Public HTML, embedded page data or published feed/API; status reports access failures and setup requirements\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Manual entry\u003c/td>\n\u003ctd>Website URL\u003c/td>\n\u003ctd>Open the site yourself and paste a posting; no automatic requests\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Fresh installations include \u003cstrong>57 source configurations\u003c/strong>, including 28 boards from the latest expansion. Existing Wellfound and Welcome to the Jungle entries are upgraded in place. This is a configuration count, not 57 distinct working job boards. See \u003ca href=\"#/reference/source-coverage\">current results and access limitations\u003c/a>. X still requires local credentials and a configured budget.\u003c/p>\n\u003cp>For an existing installation, add missing catalog entries without changing existing source preferences:\u003c/p>\n\u003cpre>\u003ccode class=\"language-sh\">npx tsx scripts/add-discovery-sources.ts\n\u003c/code>\u003c/pre>\n\u003cp>To install only the 28 public-board entries, use \u003ccode>npx tsx scripts/add-public-boards.ts\u003c/code>. Both installers are idempotent and preserve existing collector preferences.\u003c/p>\n\u003cp>Collection defaults to every four hours, with individual intervals editable in Sources. Effective scheduled intervals use the slower of the global and source settings. Himalayas runs daily, Remotive/VueJobs/Web3.career twice daily, specialist RSS daily, and most other additions two to four times daily. Each source has at most six scans per calendar day, including manual scans; collector cooldowns enforce daily Himalayas collection, at most four Remotive scans, and at most two Web3.career scans. Every scan also has a request budget. Fetches use conditional caching, a per-host delay, response-size limits, and Retry-After cooldowns. Partial HN/Lever/X/Himalayas scans retain checkpoints. Failed scans preserve existing jobs and drafts.\u003c/p>\n\u003cp>Public-board collectors run at most twice daily, with at most 12 HTTP requests per scan, including redirects and failures. The first page refreshes on each pass; supported pagination continues from saved checkpoints, and remaining requests process a SQLite description queue. Completed detail pages are reused and become eligible for revalidation after seven days. Blocked/challenged sources wait at least 24 hours; manual scans respect cooldowns. The Sources page distinguishes \u003cstrong>Blocked\u003c/strong>, \u003cstrong>Unavailable\u003c/strong>, \u003cstrong>Failed\u003c/strong> and \u003cstrong>Needs API setup\u003c/strong>. Adzuna, Jooble and Careerjet are registered but await publisher credentials and API adapter configuration; they make no requests. Web3 remains separate and pending its token. Public-page discovery never closes vacancies simply because they disappear from a partial result page.\u003c/p>\n\u003cp>Public feeds retain their source URLs and attribution. RSS extracts employer and location fields where supplied; excerpts and empty descriptions remain leads. Saving an RSS lead waits for a complete description. VueJobs can retrieve its public job page on save or through \u003cstrong>Load full description\u003c/strong>. For other excerpts, paste the full text in the Description editor and retry the cover-letter task. Truncated feeds do not close missing listings. Himalayas expiry timestamps are retained and already-expired incoming entries are marked closed. Pay periods/currencies remain unknown when a feed omits them; 4 Day Week salary cents are converted to currency units. These feeds are bounded discovery, not exhaustive mirrors. VueJobs discovery uses its publisher-advertised RSS feed. Public detail retrieval is on demand, not a crawl: one request per lookup, at most six per UTC day, with a six-hour failed-attempt cooldown and provider Retry-After handling. It accepts only matching JobPosting data also present in the public page text, keeps source attribution, and preserves full descriptions across shorter RSS refreshes. Manual edits take precedence. Unavailable/gated descriptions remain excerpts; no paywall bypass is used.\u003c/p>\n\u003ch3 id=\"web3-career-setup\">Web3.career setup\u003c/h3>\n\u003col>\n\u003cli>Obtain your token from the \u003ca href=\"https://web3.career/web3-jobs-api\" rel=\"noreferrer\">official API page\u003c/a>.\u003c/li>\n\u003cli>In \u003cstrong>Settings → Web3.career\u003c/strong>, enter it and choose \u003cstrong>Save token\u003c/strong>. It is stored in the data directory’s \u003ccode>secrets/web3.json\u003c/code> with mode 0600 and is never returned to the browser. Alternatively use \u003ccode>JH_WEB3_API_TOKEN\u003c/code>; a dashboard-saved token takes precedence.\u003c/li>\n\u003cli>The enabled source becomes eligible for its scheduled scan. It reads up to 100 recent listings with full descriptions, without country or remote-only filters, twice daily. No pagination is offered by the API, so this is bounded coverage.\u003c/li>\n\u003c/ol>\n\u003cp>Missing credentials make no requests; HTTP 401/403 pauses further attempts until the token is replaced in Settings. Query-string credentials are excluded from the HTTP cache and error history, and credentialed redirects are not followed. Original \u003ccode>apply_url\u003c/code> values and follow links are retained as required by the \u003ca href=\"https://docs.bondex.app/api-reference/web3-career-jobs-api/api-overview\" rel=\"noreferrer\">API terms\u003c/a>. Authenticated Web3 collection still requires live verification after the user supplies a token.\u003c/p>\n\u003ch3 id=\"manual-job-entry-and-public-boards\">Manual job entry and public boards\u003c/h3>\n\u003cp>\u003cstrong>Sources → Open site\u003c/strong> opens the provider for you. \u003cstrong>Add job\u003c/strong> accepts the role, employer, posting URL, location and description while keeping that board’s attribution. Adding a job does not generate a draft; saving it in Jobs does. Sources of type \u003ccode>manual\u003c/code> cannot be scheduled or scanned.\u003c/p>\n\u003cp>Wellfound and Welcome to the Jungle entries were subsequently upgraded to \u003ccode>public_board\u003c/code>. Their automated results and access limits are in \u003ca href=\"#/reference/source-coverage\">source coverage\u003c/a>; manual Add job remains available. The earlier manual-only behavior is preserved in the \u003ca href=\"#/journal/2026-09-16-source-evaluation\">source-evaluation journal\u003c/a>.\u003c/p>\n\u003ch3 id=\"x-setup\">X setup\u003c/h3>\n\u003col>\n\u003cli>Sign in to the \u003ca href=\"https://console.x.com/\" rel=\"noreferrer\">X developer console\u003c/a>, create an app, and obtain its \u003cstrong>app-only bearer token\u003c/strong>. This is the credential for reading public data; user access tokens are unnecessary. \u003ca href=\"https://docs.x.com/x-api/getting-started/getting-access\" rel=\"noreferrer\">Official access guide\u003c/a>.\u003c/li>\n\u003cli>In \u003cstrong>Settings → X\u003c/strong>, enter the bearer token and choose \u003cstrong>Save token\u003c/strong>. It is stored locally under the data directory with mode 0600 and is never returned by the API. Alternatively set \u003ccode>JH_X_BEARER_TOKEN\u003c/code> in \u003ccode>.env\u003c/code> or the Unraid template. A dashboard-saved token takes precedence.\u003c/li>\n\u003cli>Set a monthly post limit of at least 10, enable X, and save settings. The default is zero and disabled, so no paid requests begin before configuration. X API usage is separate from the Codex subscription; manage API credits and spending controls in the X console.\u003c/li>\n\u003cli>Open \u003cstrong>Sources → X · Engineering\u003c/strong> to edit the starter search, add more searches, or scan. Searches support the \u003ca href=\"https://docs.x.com/x-api/posts/search-recent-posts\" rel=\"noreferrer\">official recent-search syntax\u003c/a>, including \u003ccode>from:account\u003c/code> and \u003ccode>-is:retweet\u003c/code>.\u003c/li>\n\u003c/ol>\n\u003cp>The initial X scan looks back 24 hours. Later scans use fixed time windows and resume pagination without advancing the completed checkpoint early. The API only exposes recent history; after an extended outage, older posts may be unavailable. Post IDs remain strings. Results deduplicate across searches. Retrieval volume is reserved before requests; ambiguous failures retain reservations. The counter is conservative and is \u003cstrong>not a currency spending guarantee\u003c/strong>. The cap is shared by all X searches and resets by UTC calendar month. Sources have separate daily scan caps.\u003c/p>\n\u003cp>X batches divide the remaining monthly allowance across the remaining time and enabled searches. Because the API requires at least 10 posts per request, small budgets extend the interval between scheduled X scans beyond four hours. The next scan time is persisted. Manual scans share the monthly cap but can run before the scheduled time. High-volume searches may outpace the chosen budget.\u003c/p>\n\u003cp>X is a required integration, implemented with credential entry, saved queries, retrieval limits, and fixture coverage. Authenticated retrieval was verified locally on 15 September 2026 with a selected limit of 1,000 posts per UTC calendar month. The first two requests consumed 20 post reads and yielded 17 unique records. These are historical observations; Settings and scan history describe the current configuration and allowance. Fresh installations require their own locally configured credentials and settings.\u003c/p>\n","backlinks":["decisions/index","features/index","journal/2026-09-16-source-evaluation","reference/source-coverage","verification/runs/2026-10-07T073652Z-x-status"]},{"id":"features/documentation","title":"Project wiki","section":"Features","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-10-07\u003c/span>","updated":"2026-10-07","summary":"","source":"---\ntitle: Project wiki\nsection: Features\nupdated: 2026-10-07\n---\n# Project wiki\n\nFeature ID: `FEAT-documentation`\n\n## Intent and basis\n\n[DEC-wiki](../decisions/index.md) adopts jstack and migrates the project guides into an offline Markdown wiki. This changes documentation organization, not the application runtime or UI.\n\n## Entry points and prerequisites\n\nOpen repository README → wiki home or `docs/wiki/index.html`. Node 22+ builds the reader. The sibling jstack checkout supplies process skills and the report checker; a checked-in builder makes the reader independently rebuildable.\n\n## Expected outcomes\n\nCurrent guides, accepted decisions, historical research and verification remain navigable and searchable. Links resolve, the generated reader matches Markdown, and the reader works without network requests. Candidate evidence and local raw logs are excluded. Existing runtime skills and agent instructions remain at their original entry points.\n\n## Verification recipe\n\nRun the [wiki commands](../verification/setup.md#wiki-checks). Open the reader locally, follow a feature link, search for a documented topic, inspect Markdown source and check a mobile-width viewport. Compare `_build.mjs` with the jstack asset and confirm original private paths remain ignored. Link the sanitized results from a dated run.\n\n## Coverage and limitations\n\nStructural validation cannot establish external link availability, live provider access or product behavior. Historical notes keep their original evidence limits. Root and directory READMEs are pointers into the wiki; `AGENTS.md` and the profile runtime skill retain their special purposes.\n\n## Verification history\n\nSee the [migration check](../verification/runs/2026-10-07T042714Z-wiki-migration.md) and [migration journal](../journal/2026-10-07-jstack-migration.md) for the move map.\n","toc":[{"id":"intent-and-basis","title":"Intent and basis","depth":2},{"id":"entry-points-and-prerequisites","title":"Entry points and prerequisites","depth":2},{"id":"expected-outcomes","title":"Expected outcomes","depth":2},{"id":"verification-recipe","title":"Verification recipe","depth":2},{"id":"coverage-and-limitations","title":"Coverage and limitations","depth":2},{"id":"verification-history","title":"Verification history","depth":2}],"titleAnchor":"project-wiki","links":["decisions/index","verification/setup","verification/runs/2026-10-07T042714Z-wiki-migration","journal/2026-10-07-jstack-migration"],"attachments":[],"html":"\u003cp>Feature ID: \u003ccode>FEAT-documentation\u003c/code>\u003c/p>\n\u003ch2 id=\"intent-and-basis\">Intent and basis\u003c/h2>\n\u003cp>\u003ca href=\"#/decisions/index\">DEC-wiki\u003c/a> adopts jstack and migrates the project guides into an offline Markdown wiki. This changes documentation organization, not the application runtime or UI.\u003c/p>\n\u003ch2 id=\"entry-points-and-prerequisites\">Entry points and prerequisites\u003c/h2>\n\u003cp>Open repository README → wiki home or \u003ccode>docs/wiki/index.html\u003c/code>. Node 22+ builds the reader. The sibling jstack checkout supplies process skills and the report checker; a checked-in builder makes the reader independently rebuildable.\u003c/p>\n\u003ch2 id=\"expected-outcomes\">Expected outcomes\u003c/h2>\n\u003cp>Current guides, accepted decisions, historical research and verification remain navigable and searchable. Links resolve, the generated reader matches Markdown, and the reader works without network requests. Candidate evidence and local raw logs are excluded. Existing runtime skills and agent instructions remain at their original entry points.\u003c/p>\n\u003ch2 id=\"verification-recipe\">Verification recipe\u003c/h2>\n\u003cp>Run the \u003ca href=\"#/verification/setup~wiki-checks\">wiki commands\u003c/a>. Open the reader locally, follow a feature link, search for a documented topic, inspect Markdown source and check a mobile-width viewport. Compare \u003ccode>_build.mjs\u003c/code> with the jstack asset and confirm original private paths remain ignored. Link the sanitized results from a dated run.\u003c/p>\n\u003ch2 id=\"coverage-and-limitations\">Coverage and limitations\u003c/h2>\n\u003cp>Structural validation cannot establish external link availability, live provider access or product behavior. Historical notes keep their original evidence limits. Root and directory READMEs are pointers into the wiki; \u003ccode>AGENTS.md\u003c/code> and the profile runtime skill retain their special purposes.\u003c/p>\n\u003ch2 id=\"verification-history\">Verification history\u003c/h2>\n\u003cp>See the \u003ca href=\"#/verification/runs/2026-10-07T042714Z-wiki-migration\">migration check\u003c/a> and \u003ca href=\"#/journal/2026-10-07-jstack-migration\">migration journal\u003c/a> for the move map.\u003c/p>\n","backlinks":["features/index","verification/runs/2026-10-07T042714Z-wiki-migration"]},{"id":"features/index","title":"Feature map","section":"Features","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-10-07\u003c/span>","updated":"2026-10-07","summary":"","source":"---\ntitle: Feature map\nsection: Features\nupdated: 2026-10-07\n---\n# Feature map\n\nThese records separate expected behavior from dated verification. Stable IDs identify the behavior; a historical pass applies only to the build and scenarios recorded.\n\n| Feature ID | Record | Main entry point |\n| --- | --- | --- |\n| FEAT-desktop | [Native desktop app](desktop.md) | Finder / Spotlight |\n| FEAT-job-inbox | [Job inbox and saved jobs](job-inbox.md) | Jobs / Saved |\n| FEAT-discovery | [Discovery and sources](discovery.md) | Sources / Settings |\n| FEAT-matching | [Matching and listing quality](matching.md) | Match / result filters |\n| FEAT-profile | [User profile and evidence](profile.md) | User profile / assistant |\n| FEAT-master-cv | [Master CV and legacy resumes](master-cv.md) | CV |\n| FEAT-cover-letters | [Saved-job cover letters](cover-letters.md) | Saved → job → Cover letter |\n| FEAT-assistant | [App-wide assistant](assistant.md) | Header assistant button |\n| FEAT-jev | [Optional Jev assessment](jev.md) | Settings → Jev / Match |\n| FEAT-documentation | [Project wiki](documentation.md) | README / offline reader |\n\nThe core journey is profile readiness → discovery → inspect/match → save → private cover-letter review/download. The master CV remains independently editable. See [shared setup](../verification/setup.md), [architecture](../reference/architecture.md) and [known limits](../reference/limitations.md).\n","toc":[],"titleAnchor":"feature-map","links":["features/desktop","features/job-inbox","features/discovery","features/matching","features/profile","features/master-cv","features/cover-letters","features/assistant","features/jev","features/documentation","verification/setup","reference/architecture","reference/limitations"],"attachments":[],"html":"\u003cp>These records separate expected behavior from dated verification. Stable IDs identify the behavior; a historical pass applies only to the build and scenarios recorded.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Feature ID\u003c/th>\n\u003cth>Record\u003c/th>\n\u003cth>Main entry point\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>FEAT-desktop\u003c/td>\n\u003ctd>\u003ca href=\"#/features/desktop\">Native desktop app\u003c/a>\u003c/td>\n\u003ctd>Finder / Spotlight\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>FEAT-job-inbox\u003c/td>\n\u003ctd>\u003ca href=\"#/features/job-inbox\">Job inbox and saved jobs\u003c/a>\u003c/td>\n\u003ctd>Jobs / Saved\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>FEAT-discovery\u003c/td>\n\u003ctd>\u003ca href=\"#/features/discovery\">Discovery and sources\u003c/a>\u003c/td>\n\u003ctd>Sources / Settings\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>FEAT-matching\u003c/td>\n\u003ctd>\u003ca href=\"#/features/matching\">Matching and listing quality\u003c/a>\u003c/td>\n\u003ctd>Match / result filters\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>FEAT-profile\u003c/td>\n\u003ctd>\u003ca href=\"#/features/profile\">User profile and evidence\u003c/a>\u003c/td>\n\u003ctd>User profile / assistant\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>FEAT-master-cv\u003c/td>\n\u003ctd>\u003ca href=\"#/features/master-cv\">Master CV and legacy resumes\u003c/a>\u003c/td>\n\u003ctd>CV\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>FEAT-cover-letters\u003c/td>\n\u003ctd>\u003ca href=\"#/features/cover-letters\">Saved-job cover letters\u003c/a>\u003c/td>\n\u003ctd>Saved → job → Cover letter\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>FEAT-assistant\u003c/td>\n\u003ctd>\u003ca href=\"#/features/assistant\">App-wide assistant\u003c/a>\u003c/td>\n\u003ctd>Header assistant button\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>FEAT-jev\u003c/td>\n\u003ctd>\u003ca href=\"#/features/jev\">Optional Jev assessment\u003c/a>\u003c/td>\n\u003ctd>Settings → Jev / Match\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>FEAT-documentation\u003c/td>\n\u003ctd>\u003ca href=\"#/features/documentation\">Project wiki\u003c/a>\u003c/td>\n\u003ctd>README / offline reader\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>The core journey is profile readiness → discovery → inspect/match → save → private cover-letter review/download. The master CV remains independently editable. See \u003ca href=\"#/verification/setup\">shared setup\u003c/a>, \u003ca href=\"#/reference/architecture\">architecture\u003c/a> and \u003ca href=\"#/reference/limitations\">known limits\u003c/a>.\u003c/p>\n","backlinks":["index","guides/workflow","verification/index"]},{"id":"features/jev","title":"Optional Jev assessment","section":"Features","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-10-07\u003c/span>","updated":"2026-10-07","summary":"","source":"---\ntitle: Optional Jev assessment\nsection: Features\nupdated: 2026-10-07\n---\n# Optional Jev assessment\n\nFeature ID: `FEAT-jev`\n\n## Intent and basis\n\nOptionally supplement fit, geography, arrangement and applicability assessment when the user configures TypeSafe. Based on the [accepted project boundaries](../decisions/index.md) and existing implementation documentation; this migration adds no product requirement.\n\n## Entry points and prerequisites\n\nSettings → Jev configures the key and limits; Match → Assess with Jev prioritizes a job. No key means no requests.\n\n## Expected outcomes\n\nDisabling the integration restores baseline behavior. Unknown eligibility remains distinct from supported conflicts. Keys stay server-side; stale responses and limits are enforced. Codex still generates cover letters.\n\n## Verification recipe\n\nUse [shared verification setup](../verification/setup.md) for isolation, build identity, evidence and cleanup. `npx tsx --test tests/jev.test.ts` uses simulated provider responses. After `npm run build`, `npx tsx scripts/verify-jev-ui.ts` drives isolated settings and job assessment UI with simulated inference.\n\nRecipes are migrated from existing scripts and historical checks; they were not re-executed during the wiki migration.\n\n## Coverage and limitations\n\nAuthenticated TypeSafe access and actual assessment quality remain unverified. Provider inference is separately billed.\n\n## Verification history\n\n[Historical implementation checks](../verification/history.md) record previous selected scenarios and limitations. Those entries are historical evidence; new reports belong in [verification runs](../verification/index.md).\n\n\nJev supplements local job matching through TypeSafe AI's official `POST https://api.typesafe.ai/v1/systemone` endpoint using `jev-latest`. It is a separately configured integration, not a fallback for Codex. Cover letters still use the configured official Codex runtime.\n\n## Configure\n\nOpen **Settings → Jev**, set the daily request limit if desired (default **100**, UTC day), and save a TypeSafe API key. Saving a key enables assessment. The worker assesses one posting per tick, prioritizing explicitly queued jobs, then saved jobs, then existing match strength and recency. Existing open, non-dismissed jobs are included; the collection is processed gradually within the limit. **Match → Assess with Jev** moves a posting to the front of the queue. Reads and browser polling never trigger inference.\n\nA key may alternatively be supplied through `JH_JEV_API_KEY`. Dashboard configuration takes precedence. **Remove API key** stores an empty local override, including when an environment key exists. **Pause Jev** and key removal disable both requests and the application of cached results, restoring the original matching and filtering. Cached assessments remain local and can be reused after re-enabling. A daily limit of zero prevents requests while retaining cached assessments.\n\nKeys are stored in `secrets/jev.json` under the appdata directory, with mode 0600. They are not returned to the browser or included in SQLite backups. Persistent appdata works identically in local development and the Unraid container; no deployment was performed for this change.\n\n## Data sent\n\nOne bounded request contains a posting's title, location, work arrangement and complete description, plus relevant structured career evidence, project attribution, education qualifications, citizenship, current location, work authorization and relocation preferences. The projection omits structured contact details, candidate name, employers, source URLs/files, private saved-job notes, application history and generated documents. Free-text career evidence and posting descriptions themselves are sent to TypeSafe. No arbitrary links in the posting are fetched. Keys go only to the fixed TypeSafe endpoint; redirects are rejected.\n\nReview master facts in **CV**. `basics.citizenship` and `basics.location` provide citizenship/current residence. `preferences.workAuthorizationCountries` can hold confirmed country names; omit it or use `null` when unknown. An empty array explicitly records no additional authorization beyond citizenship. The existing `preferences.existingWorkAuthorizationsOutsideMalaysia` remains supported for this installation. `preferences.relocation` retains the existing preference. Do not enter inferred authorization as a confirmed fact.\n\n## Behavior\n\n- **Match:** a confident role-fit decision adjusts the existing score by averaging it with the category score (85 strong, 55 adjacent, 30 stretch, 10 other). Existing evidence caps remain; incomplete descriptions retain their original score. The Match tab shows the adjustment alongside the original breakdown. Jev confidence is not the probability of being hired.\n- **Geography:** a local gazetteer finds up to 24 candidate place names. Jev classifies each as workplace, hiring area, incidental/excluded, or unknown. A separate decision selects an exact location evidence span. Accepted locations participate in the existing country/region filters. For remote jobs, only hiring areas replace the source location. Headquarters alone do not establish a job's location. Unrecognized/ambiguous places retain source behavior.\n- **Arrangement:** confident remote/hybrid/onsite decisions with a selected evidence span update the displayed arrangement and filters. Original source fields remain visible in the assessment.\n- **Applicability:** sponsorship and eligibility are assessed separately. Silence about sponsorship, foreign citizenship, missing authorization, or an unknown relocation preference do not establish impossibility. A Jev conflict normally means review. Additional exclusion requires confidence/probability of at least 0.95, a selected restriction quote, and corroboration by the existing deterministic eligibility checks using confirmed candidate facts. Other applied decisions require confidence and selected-option probability of at least 0.85. Existing explicit conflicts are not cleared by an optimistic model answer. Incompatible jobs remain accessible through the eligibility filter; Saved keeps all saved records.\n\nThese are assessments of posting evidence, not immigration-law verification, visa guarantees, or predictions of employer acceptance. Jev has no browsing, tools, application-submission or engagement capabilities here. Description text is untrusted input.\n\n## Persistence and failures\n\nMigration 007 stores per-job assessment state and results separately from source records and drafts. A fingerprint covers relevant posting and candidate input plus model/prompt version; content and relevant profile edits invalidate results. Notes and contact-only edits do not. In-flight responses are discarded if inputs or credentials changed. The worker serializes Jev work through a database lease and performs it sequentially with cover-letter generation. Interrupted work becomes eligible again after 90 seconds.\n\nEvery attempted request reserves one daily request before network activity. Reservations remain after timeout or failure. Reported token counts are recorded separately. This is a request cap, not a currency spending guarantee. The worker honors Retry-After and uses exponential backoff. Authentication, account allowance, schema errors and permanent API failures pause requests with a Settings message and Retry action. Overlong inputs fail locally without truncation or a provider request. No model/provider/billing fallback is used.\n\n## Verification\n\n`npx tsx --test tests/jev.test.ts` exercises no-key behavior, credential storage/removal, payload minimization, response validation, caching, filtering, persistence, stale responses, limits, authentication failures, retry timing and eligibility uncertainty with simulated provider responses. `npx tsx scripts/verify-jev-ui.ts` uses an isolated database and simulated inference to verify settings, queuing, evidence display, removal and desktop/mobile layout. Run `npm run build` before the browser check.\n\nAn authenticated TypeSafe request has **not** been verified: no user key was configured or consumed during implementation. Actual provider quality and account access require verification after configuration.\n\nReferences: [TypeSafe API](https://docs.typesafe.ai/api), [Choice](https://docs.typesafe.ai/primitives/choice), [confidence](https://docs.typesafe.ai/confidence), [known model limitations](https://docs.typesafe.ai/model-jaggedness/jev-1.13).\n","toc":[{"id":"intent-and-basis","title":"Intent and basis","depth":2},{"id":"entry-points-and-prerequisites","title":"Entry points and prerequisites","depth":2},{"id":"expected-outcomes","title":"Expected ou o not enter inferred authorization as a confirmed fact.\u003c/p>\n\u003ch2 id=\"behavior\">Behavior\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Match:\u003c/strong> a confident role-fit decision adjusts the existing score by averaging it with the category score (85 strong, 55 adjacent, 30 stretch, 10 other). Existing evidence caps remain; incomplete descriptions retain their original score. The Match tab shows the adjustment alongside the original breakdown. Jev confidence is not the probability of being hired.\u003c/li>\n\u003cli>\u003cstrong>Geography:\u003c/strong> a local gazetteer finds up to 24 candidate place names. Jev classifies each as workplace, hiring area, incidental/excluded, or unknown. A separate decision selects an exact location evidence span. Accepted locations participate in the existing country/region filters. For remote jobs, only hiring areas replace the source location. Headquarters alone do not establish a job's location. Unrecognized/ambiguous places retain source behavior.\u003c/li>\n\u003cli>\u003cstrong>Arrangement:\u003c/strong> confident remote/hybrid/onsite decisions with a selected evidence span update the displayed arrangement and filters. Original source fields remain visible in the assessment.\u003c/li>\n\u003cli>\u003cstrong>Applicability:\u003c/strong> sponsorship and eligibility are assessed separately. Silence about sponsorship, foreign citizenship, missing authorization, or an unknown relocation preference do not establish impossibility. A Jev conflict normally means review. Additional exclusion requires confidence/probability of at least 0.95, a selected restriction quote, and corroboration by the existing deterministic eligibility checks using confirmed candidate facts. Other applied decisions require confidence and selected-option probability of at least 0.85. Existing explicit conflicts are not cleared by an optimistic model answer. Incompatible jobs remain accessible through the eligibility filter; Saved keeps all saved records.\u003c/li>\n\u003c/ul>\n\u003cp>These are assessments of posting evidence, not immigration-law verification, visa guarantees, or predictions of employer acceptance. Jev has no browsing, tools, application-submission or engagement capabilities here. Description text is untrusted input.\u003c/p>\n\u003ch2 id=\"persistence-and-failures\">Persistence and failures\u003c/h2>\n\u003cp>Migration 007 stores per-job assessment state and results separately from source records and drafts. A fingerprint covers relevant posting and candidate input plus model/prompt version; content and relevant profile edits invalidate results. Notes and contact-only edits do not. In-flight responses are discarded if inputs or credentials changed. The worker serializes Jev work through a database lease and performs it sequentially with cover-letter generation. Interrupted work becomes eligible again after 90 seconds.\u003c/p>\n\u003cp>Every attempted request reserves one daily request before network activity. Reservations remain after timeout or failure. Reported token counts are recorded separately. This is a request cap, not a currency spending guarantee. The worker honors Retry-After and uses exponential backoff. Authentication, account allowance, schema errors and permanent API failures pause requests with a Settings message and Retry action. Overlong inputs fail locally without truncation or a provider request. No model/provider/billing fallback is used.\u003c/p>\n\u003ch2 id=\"verification\">Verification\u003c/h2>\n\u003cp>\u003ccode>npx tsx --test tests/jev.test.ts\u003c/code> exercises no-key behavior, credential storage/removal, payload minimization, response validation, caching, filtering, persistence, stale responses, limits, authentication failures, retry timing and eligibility uncertainty with simulated provider responses. \u003ccode>npx tsx scripts/verify-jev-ui.ts\u003c/code> uses an isolated database and simulated inference to verify settings, queuing, evidence display, removal and desktop/mobile layout. Run \u003ccode>npm run build\u003c/code> before the browser check.\u003c/p>\n\u003cp>An authenticated TypeSafe request has \u003cstrong>not\u003c/strong> been verified: no user key was configured or consumed during implementation. Actual provider quality and account access require verification after configuration.\u003c/p>\n\u003cp>References: \u003ca href=\"https://docs.typesafe.ai/api\" rel=\"noreferrer\">TypeSafe API\u003c/a>, \u003ca href=\"https://docs.typesafe.ai/primitives/choice\" rel=\"noreferrer\">Choice\u003c/a>, \u003ca href=\"https://docs.typesafe.ai/confidence\" rel=\"noreferrer\">confidence\u003c/a>, \u003ca href=\"https://docs.typesafe.ai/model-jaggedness/jev-1.13\" rel=\"noreferrer\">known model limitations\u003c/a>.\u003c/p>\n","backlinks":["decisions/index","discussions/open-questions","features/index","journal/2026-10-07-jstack-migration"]},{"id":"features/job-inbox","title":"Job inbox and saved jobs","section":"Features","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-10-07\u003c/span>","updated":"2026-10-07","summary":"","source":"---\ntitle: Job inbox and saved jobs\nsection: Features\nupdated: 2026-10-07\n---\n# Job inbox and saved jobs\n\nFeature ID: `FEAT-job-inbox`\n\n## Intent and basis\n\nJobs and Saved let the user inspect postings, filter results, record Seen state, save work and keep private notes. Based on the [accepted project boundaries](../decisions/index.md) and existing implementation documentation; this migration adds no product requirement.\n\n## Entry points and prerequisites\n\nOpen Jobs or Saved after [profile readiness](profile.md); use the existing local collection or isolated fixtures.\n\n## Expected outcomes\n\nOpening a posting records Seen once; the default preview does not. Filters and pagination retain deliberate selection and unsaved notes. Saved preserves individual records and starts only [cover-letter generation](cover-letters.md).\n\n## Verification recipe\n\nUse [shared verification setup](../verification/setup.md) for isolation, build identity, evidence and cleanup. `npx tsx --test tests/job-query.test.ts tests/seen.test.ts tests/locations.test.ts tests/location-regions.test.ts` checks isolated data behavior. `npx tsx scripts/verify-dashboard.ts` uses the existing dev app and intercepts Seen writes; it expects real inventory. `npx tsx scripts/verify-seen-ui.ts` checks Seen with isolated fixtures.\n\nRecipes are migrated from existing scripts and historical checks; they were not re-executed during the wiki migration.\n\n## Coverage and limitations\n\nLive-dashboard recipes depend on inventory and were not rerun for this documentation migration.\n\n## Verification history\n\n[Historical implementation checks](../verification/history.md) record previous selected scenarios and limitations. Those entries are historical evidence; new reports belong in [verification runs](../verification/index.md).\n\n\n## Dashboard loading\n\n\nJobs and Saved filter and paginate on the server, with 75 summaries per page. Full descriptions and match evidence load when the detail pane opens; document data loads when its editor opens. The eight-second status check uses ETags, so unchanged responses have no body. Collection changes refresh the visible results, and polling pauses while the browser tab is hidden. Failed or invalid responses show a Retry action without discarding existing data or edits.\n\nThe API now returns `{items, total, page, pageSize, totalPages, revision}` from `GET /api/jobs`, with zero-based pages and a maximum page size of 100. Use `GET /api/jobs/:id` for full details, `/api/job-locations` for filter options, and `/api/master` for the profile/template. `/api/bootstrap` contains status, counts and compact document choices, not the complete collection.\n\n\n## Location filter\n\n\nIn **Jobs** or **Saved**, open **Any location**. The menu groups countries under geographic areas, with **APAC**, **EMEA** and **Americas** available as broad filters. **Southeast Asia** and **East Asia** come first, with Malaysia first within SEA and individual countries/areas selectable. Search also finds cities and original source labels; these do not crowd the default country list. Multiple selections match any selected location and combine with the other job filters. **Clear locations** resets the filter. Selections persist across page switches and reloads in the same browser tab.\n\nCountry filters include recognized cities using a bundled, server-only [GeoNames](https://www.geonames.org/) lookup. Regions include their member countries and narrower regions: Kuala Lumpur → Malaysia → Southeast Asia → APAC. Source text is preserved. Ambiguous codes/names such as bare CA, AZ or London are not assigned a country without sufficient context. **Unresolved** includes locations that could not be assigned a country/region; their original labels remain searchable. See [dataset attribution, coverage and exact regional definitions](../reference/geography.md).\n\n**Worldwide** requires an explicit global statement. **Unspecified** includes missing and remote-only location fields. Select these alongside a country when desired. A country filter does not include a posting that only says APAC or Worldwide: those statements do not establish that every country is eligible. Region buckets organize browsing and do not determine work authorization.\n\nThe detail header labels explicit candidate restrictions as **Hiring locations** for Himalayas, Remotive, Jobicy, and We Work Remotely; other source fields are labeled **Location**. Filtering uses these listed fields, not incidental headquarters mentions in descriptions, and does not determine visa eligibility. Organic posts have free-form location headers: their dropdown values are limited to place names also found in structured boards (plus explicit Worldwide); unrecognized headers fall under Unspecified. Original posting text is preserved.\n\n\n## Seen posts\n\n\nOpening a job by clicking its title, using the keyboard, or choosing **View posting** records its first `seenAt` timestamp locally. A **Seen** label appears in the row. **Seen and unseen / Unseen / Seen** filters work in Jobs and Saved, independently of saved/applied status. The selected row has a blue background, edge marker and emphasized title in light and dark modes.\n\nThe default first-row preview does not count as a deliberate open. Under Unseen, opening a result removes it from the list while keeping its detail pane open. Seen state survives rescans and restarts and applies to that individual posting, not every inferred duplicate. Historical opens were not recorded, so tracking begins with this feature; older views cannot be reconstructed. This action never saves the job or queues a cover letter.\n","toc":[{"id":"intent-and-basis","title":"Intent and basis","depth":2},{"id":"entry-points-and-prerequisites","title":"Entry points and prerequisites","depth":2},{"id":"expected-outcomes","title":"Expected outcomes","depth":2},{"id":"verification-recipe","title":"Verification recipe","depth":2},{"id":"coverage-and-limitations","title":"Coverage and limitations","depth":2},{"id":"verification-history","title":"Verification history","depth":2},{"id":"dashboard-loading","title":"Dashboard loading","depth":2},{"id":"location-filter","title":"Location filter","depth":2},{"id":"seen-posts","title":"Seen posts","depth":2}],"titleAnchor":"job-inbox-and-saved-jobs","links":["decisions/index","features/profile","features/cover-letters","verification/setup","verification/history","verification/index","reference/geography"],"attachments":[],"html":"\u003cp>Feature ID: \u003ccode>FEAT-job-inbox\u003c/code>\u003c/p>\n\u003ch2 id=\"intent-and-basis\">Intent and basis\u003c/h2>\n\u003cp>Jobs and Saved let the user inspect postings, filter results, record Seen state, save work and keep private notes. Based on the \u003ca href=\"#/decisions/index\">accepted project boundaries\u003c/a> and
