oard-loading\">Dashboard loading\u003c/h2>\n\u003cp>Jobs and Saved filter and paginate on the server, with 75 summaries per page. Full descriptions and match evidence load when the detail pane opens; document data loads when its editor opens. The eight-second status check uses ETags, so unchanged responses have no body. Collection changes refresh the visible results, and polling pauses while the browser tab is hidden. Failed or invalid responses show a Retry action without discarding existing data or edits.\u003c/p>\n\u003cp>The API now returns \u003ccode>{items, total, page, pageSize, totalPages, revision}\u003c/code> from \u003ccode>GET /api/jobs\u003c/code>, with zero-based pages and a maximum page size of 100. Use \u003ccode>GET /api/jobs/:id\u003c/code> for full details, \u003ccode>/api/job-locations\u003c/code> for filter options, and \u003ccode>/api/master\u003c/code> for the profile/template. \u003ccode>/api/bootstrap\u003c/code> contains status, counts and compact document choices, not the complete collection.\u003c/p>\n\u003ch2 id=\"location-filter\">Location filter\u003c/h2>\n\u003cp>In \u003cstrong>Jobs\u003c/strong> or \u003cstrong>Saved\u003c/strong>, open \u003cstrong>Any location\u003c/strong>. The menu groups countries under geographic areas, with \u003cstrong>APAC\u003c/strong>, \u003cstrong>EMEA\u003c/strong> and \u003cstrong>Americas\u003c/strong> available as broad filters. \u003cstrong>Southeast Asia\u003c/strong> and \u003cstrong>East Asia\u003c/strong> come first, with Malaysia first within SEA and individual countries/areas selectable. Search also finds cities and original source labels; these do not crowd the default country list. Multiple selections match any selected location and combine with the other job filters. \u003cstrong>Clear locations\u003c/strong> resets the filter. Selections persist across page switches and reloads in the same browser tab.\u003c/p>\n\u003cp>Country filters include recognized cities using a bundled, server-only \u003ca href=\"https://www.geonames.org/\" rel=\"noreferrer\">GeoNames\u003c/a> lookup. Regions include their member countries and narrower regions: Kuala Lumpur → Malaysia → Southeast Asia → APAC. Source text is preserved. Ambiguous codes/names such as bare CA, AZ or London are not assigned a country without sufficient context. \u003cstrong>Unresolved\u003c/strong> includes locations that could not be assigned a country/region; their original labels remain searchable. See \u003ca href=\"#/reference/geography\">dataset attribution, coverage and exact regional definitions\u003c/a>.\u003c/p>\n\u003cp>\u003cstrong>Worldwide\u003c/strong> requires an explicit global statement. \u003cstrong>Unspecified\u003c/strong> includes missing and remote-only location fields. Select these alongside a country when desired. A country filter does not include a posting that only says APAC or Worldwide: those statements do not establish that every country is eligible. Region buckets organize browsing and do not determine work authorization.\u003c/p>\n\u003cp>The detail header labels explicit candidate restrictions as \u003cstrong>Hiring locations\u003c/strong> for Himalayas, Remotive, Jobicy, and We Work Remotely; other source fields are labeled \u003cstrong>Location\u003c/strong>. Filtering uses these listed fields, not incidental headquarters mentions in descriptions, and does not determine visa eligibility. Organic posts have free-form location headers: their dropdown values are limited to place names also found in structured boards (plus explicit Worldwide); unrecognized headers fall under Unspecified. Original posting text is preserved.\u003c/p>\n\u003ch2 id=\"seen-posts\">Seen posts\u003c/h2>\n\u003cp>Opening a job by clicking its title, using the keyboard, or choosing \u003cstrong>View posting\u003c/strong> records its first \u003ccode>seenAt\u003c/code> timestamp locally. A \u003cstrong>Seen\u003c/strong> label appears in the row. \u003cstrong>Seen and unseen / Unseen / Seen\u003c/strong> filters work in Jobs and Saved, independently of saved/applied status. The selected row has a blue background, edge marker and emphasized title in light and dark modes.\u003c/p>\n\u003cp>The default first-row preview does not count as a deliberate open. Under Unseen, opening a result removes it from the list while keeping its detail pane open. Seen state survives rescans and restarts and applies to that individual posting, not every inferred duplicate. Historical opens were not recorded, so tracking begins with this feature; older views cannot be reconstructed. This action never saves the job or queues a cover letter.\u003c/p>\n","backlinks":["features/index"]},{"id":"features/master-cv","title":"Master CV and legacy resumes","section":"Features","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-10-07\u003c/span>","updated":"2026-10-07","summary":"","source":"---\ntitle: Master CV and legacy resumes\nsection: Features\nupdated: 2026-10-07\n---\n# Master CV and legacy resumes\n\nFeature ID: `FEAT-master-cv`\n\n## Intent and basis\n\nEdit and export an independent master CV, retaining legacy resumes and manual changes. Based on the [accepted project boundaries](../decisions/index.md) and existing implementation documentation; this migration adds no product requirement.\n\n## Entry points and prerequisites\n\nCV → LaTeX or Data and HTML; prepare the compiler using [local setup](../guides/local-development.md).\n\n## Expected outcomes\n\nSave and Restore append versions; unsaved source remains downloadable. Invalid compilation preserves the last good PDF. Profile changes do not overwrite independent LaTeX text.\n\n## Verification recipe\n\nUse [shared verification setup](../verification/setup.md) for isolation, build identity, evidence and cleanup. After `npm run build`, run `npx tsx scripts/verify-latex.ts` for isolated browser preview, save/reload, downloads, errors, restore and mobile checks. `npx tsx --test tests/latex.test.ts tests/latex-runtime.test.ts` checks sandbox/runtime behavior.\n\nRecipes are migrated from existing scripts and historical checks; they were not re-executed during the wiki migration.\n\n## Coverage and limitations\n\nThe compiler/package cache must be ready. Native Linux sandbox support and actual Unraid execution remain unverified. Arbitrary uploaded LaTeX projects are outside initial support.\n\n## Verification history\n\n[Historical implementation checks](../verification/history.md) record previous selected scenarios and limitations. Those entries are historical evidence; new reports belong in [verification runs](../verification/index.md).\n\n\n## LaTeX editor\n\nOpen **CV → LaTeX** to edit `Resume.tex` beside its actual PDF. **Recompile** (`Cmd/Ctrl+Enter`) updates the preview; **Save** (`Cmd/Ctrl+S`) creates a persistent source version. The version selector and **Restore version** retain previous edits. **Download PDF** exports the displayed build and is disabled when the source has changed; **Download .tex** always preserves the current source, including an unfinished edit. Errors link to source lines and leave the last good preview visible. Compilation uses no AI.\n\nLaTeX has independent version history. Editing it never updates career facts or cover-letter evidence. **CV → Data and HTML** retains the structured profile, HTML/CSS editor, Word exports and legacy saved resumes. On first use, an existing `resume/output/pdf/john-goh-rengwu-resume.tex` under appdata is imported once. Otherwise a source document is initialized from the current master facts using the sb2nov-style template. Later edits are never overwritten by seed files or profile changes.\n\nThe Docker image includes Tectonic, the required fonts/packages, and a Linux Landlock sandbox. Compiles run offline, with shell escape disabled, a 30-second timeout, bounded output and a temporary work directory. They cannot read appdata or Codex authentication. The Linux host must support Landlock (kernel 5.13+ with Landlock enabled); compilation fails closed if it does not. No privileged container or Docker socket is required.\n\nLocal `npm run dev` and `npm start` automatically prepare LaTeX. Setup reuses an installed compiler (including Homebrew outside the launcher's PATH), or downloads a SHA-256-verified Tectonic 0.15.0 release into `\u003cappdata>/latex-runtime/bin`. macOS and Linux arm64/x64 are supported. No Homebrew installation or administrator access is needed on macOS. To retry a failed download or prepare updated template packages:\n\n```sh\nnpm run setup:latex\n```\n\nSetup checks offline compilation first and only downloads packages using a generic template without candidate data when needed. An existing package cache is reused; new installations use `\u003cappdata>/latex-runtime/cache`. Runtime compilation uses only the cache and the OS sandbox, which blocks private files and networking. Optional overrides are `JH_TECTONIC_BIN`, `JH_LATEX_CACHE` and, on Linux, `JH_LATEX_SANDBOX`; invalid explicit overrides are reported instead of silently replaced. Native Linux development needs `gcc` and Linux development headers to build the included sandbox helper automatically; Docker already contains it. If setup fails, the rest of the app still starts and saved documents remain available. Only the bundled package set is supported initially; add trusted package requirements to `core/latex/starter.tex` and rerun setup/rebuild the image to expand it.\n\nMigration 006 stores LaTeX source versions and successful PDF builds in SQLite. They are included in the existing database backup. Unsaved preview builds are bounded; saved versions keep their compiled PDFs. Appdata and all existing documents are preserved across updates.\n","toc":[{"id":"intent-and-basis","title":"Intent and basis","depth":2},{"id":"entry-points-and-prerequisites","title":"Entry points and prerequisites","depth":2},{"id":"expected-outcomes","title":"Expected outcomes","depth":2},{"id":"verification-recipe","title":"Verification recipe","depth":2},{"id":"coverage-and-limitations","title":"Coverage and limitations","depth":2},{"id":"verification-history","title":"Verification history","depth":2},{"id":"latex-editor","title":"LaTeX editor","depth":2}],"titleAnchor":"master-cv-and-legacy-resumes","links":["decisions/index","guides/local-development","verification/setup","verification/history","verification/index"],"attachments":[],"html":"\u003cp>Feature ID: \u003ccode>FEAT-master-cv\u003c/code>\u003c/p>\n\u003ch2 id=\"intent-and-basis\">Intent and basis\u003c/h2>\n\u003cp>Edit and export an independent master CV, retaining legacy resumes and manual changes. Based on the \u003ca href=\"#/decisions/index\">accepted project boundaries\u003c/a> and existing implementation documentation; this migration adds no product requirement.\u003c/p>\n\u003ch2 id=\"entry-points-and-prerequisites\">Entry points and prerequisites\u003c/h2>\n\u003cp>CV → LaTeX or Data and HTML; prepare the compiler using \u003ca href=\"#/guides/local-development\">local setup\u003c/a>.\u003c/p>\n\u003ch2 id=\"expected-outcomes\">Expected outcomes\u003c/h2>\n\u003cp>Save and Restore append versions; unsaved source remains downloadable. Invalid compilation preserves the last good PDF. Profile changes do not overwrite independent LaTeX text.\u003c/p>\n\u003ch2 id=\"verification-recipe\">Verification recipe\u003c/h2>\n\u003cp>Use \u003ca href=\"#/verification/setup\">shared verification setup\u003c/a> for isolation, build identity, evidence and cleanup. After \u003ccode>npm run build\u003c/code>, run \u003ccode>npx tsx scripts/verify-latex.ts\u003c/code> for isolated browser preview, save/reload, downloads, errors, restore and mobile checks. \u003ccode>npx tsx --test tests/latex.test.ts tests/latex-runtime.test.ts\u003c/code> checks sandbox/runtime behavior.\u003c/p>\n\u003cp>Recipes are migrated from existing scripts and historical checks; they were not re-executed during the wiki migration.\u003c/p>\n\u003ch2 id=\"coverage-and-limitations\">Coverage and limitations\u003c/h2>\n\u003cp>The compiler/package cache must be ready. Native Linux sandbox support and actual Unraid execution remain unverified. Arbitrary uploaded LaTeX projects are outside initial support.\u003c/p>\n\u003ch2 id=\"verification-history\">Verification history\u003c/h2>\n\u003cp>\u003ca href=\"#/verification/history\">Historical implementation checks\u003c/a> record previous selected scenarios and limitations. Those entries are historical evidence; new reports belong in \u003ca href=\"#/verification/index\">verification runs\u003c/a>.\u003c/p>\n\u003ch2 id=\"latex-editor\">LaTeX editor\u003c/h2>\n\u003cp>Open \u003cstrong>CV → LaTeX\u003c/strong> to edit \u003ccode>Resume.tex\u003c/code> beside its actual PDF. \u003cstrong>Recompile\u003c/strong> (\u003ccode>Cmd/Ctrl+Enter\u003c/code>) updates the preview; \u003cstrong>Save\u003c/strong> (\u003ccode>Cmd/Ctrl+S\u003c/code>) creates a persistent source version. The version selector and \u003cstrong>Restore version\u003c/strong> retain previous edits. \u003cstrong>Download PDF\u003c/strong> exports the displayed build and is disabled when the source has changed; \u003cstrong>Download .tex\u003c/strong> always preserves the current source, including an unfinished edit. Errors link to source lines and leave the last good preview visible. Compilation uses no AI.\u003c/p>\n\u003cp>LaTeX has independent version history. Editing it never updates career facts or cover-letter evidence. \u003cstrong>CV → Data and HTML\u003c/strong> retains the structured profile, HTML/CSS editor, Word exports and legacy saved resumes. On first use, an existing \u003ccode>resume/output/pdf/john-goh-rengwu-resume.tex\u003c/code> under appdata is imported once. Otherwise a source document is initialized from the current master facts using the sb2nov-style template. Later edits are never overwritten by seed files or profile changes.\u003c/p>\n\u003cp>The Docker image includes Tectonic, the required fonts/packages, and a Linux Landlock sandbox. Compiles run offline, with shell escape disabled, a 30-second timeout, bounded output and a temporary work directory. They cannot read appdata or Codex authentication. The Linux host must support Landlock (kernel 5.13+ with Landlock enabled); compilation fails closed if it does not. No privileged container or Docker socket is required.\u003c/p>\n\u003cp>Local \u003ccode>npm run dev\u003c/code> and \u003ccode>npm start\u003c/code> automatically prepare LaTeX. Setup reuses an installed compiler (including Homebrew outside the launcher's PATH), or downloads a SHA-256-verified Tectonic 0.15.0 release into \u003ccode>&lt;appdata&gt;/latex-runtime/bin\u003c/code>. macOS and Linux arm64/x64 are supported. No Homebrew installation or administrator access is needed on macOS. To retry a failed download or prepare updated template packages:\u003c/p>\n\u003cpre>\u003ccode class=\"language-sh\">npm run setup:latex\n\u003c/code>\u003c/pre>\n\u003cp>Setup checks offline compilation first and only downloads packages using a generic template without candidate data when needed. An existing package cache is reused; new installations use \u003ccode>&lt;appdata&gt;/latex-runtime/cache\u003c/code>. Runtime compilation uses only the cache and the OS sandbox, which blocks private files and networking. Optional overrides are \u003ccode>JH_TECTONIC_BIN\u003c/code>, \u003ccode>JH_LATEX_CACHE\u003c/code> and, on Linux, \u003ccode>JH_LATEX_SANDBOX\u003c/code>; invalid explicit overrides are reported instead of silently replaced. Native Linux development needs \u003ccode>gcc\u003c/code> and Linux development headers to build the included sandbox helper automatically; Docker already contains it. If setup fails, the rest of the app still starts and saved documents remain available. Only the bundled package set is supported initially; add trusted package requirements to \u003ccode>core/latex/starter.tex\u003c/code> and rerun setup/rebuild the image to expand it.\u003c/p>\n\u003cp>Migration 006 stores LaTeX source versions and successful PDF builds in SQLite. They are included in the existing database backup. Unsaved preview builds are bounded; saved versions keep their compiled PDFs. Appdata and all existing documents are preserved across updates.\u003c/p>\n","backlinks":["features/index","guides/local-development"]},{"id":"features/matching","title":"Matching and listing quality","section":"Features","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-10-07\u003c/span>","updated":"2026-10-07","summary":"","source":"---\ntitle: Matching and listing quality\nsection: Features\nupdated: 2026-10-07\n---\n# Matching and listing quality\n\nFeature ID: `FEAT-matching`\n\n## Intent and basis\n\nExplain role fit separately from eligibility, preserve listing evidence and group likely duplicate vacancies. Based on the [accepted project boundaries](../decisions/index.md) and existing implementation documentation; this migration adds no product requirement.\n\n## Entry points and prerequisites\n\nJobs/Saved filters and Match tab; configured canonical facts determine evidence and eligibility.\n\n## Expected outcomes\n\nUnknown authorization stays under review; explicit conflicts remain accessible. Grouping preserves originals, notes and documents. Complete/manual descriptions take precedence and bounded feed absence does not close a job.\n\n## Verification recipe\n\nUse [shared verification setup](../verification/setup.md) for isolation, build identity, evidence and cleanup. `npx tsx --test tests/matching.test.ts tests/listing-quality.test.ts` covers fixtures. `npx tsx scripts/verify-listing-upgrade.ts` checks isolated migration/restart behavior. `npx tsx scripts/verify-matching-ui.ts` depends on named postings in the live local collection and may need fixture maintenance.\n\nRecipes are migrated from existing scripts and historical checks; they were not re-executed during the wiki migration.\n\n## Coverage and limitations\n\nConservative heuristics and a small evaluation corpus do not establish broad matching accuracy or legal eligibility.\n\n## Verification history\n\n[Historical implementation checks](../verification/history.md) record previous selected scenarios and limitations. Those entries are historical evidence; new reports belong in [verification runs](../verification/index.md).\n\n\nImplemented locally on 16 September 2026.\n\n## Matching\n\nThe matcher uses an explicit, deterministic scoring rubric. It does not call an AI model for every discovered job or consume additional Codex allowance. The score expresses fit against the recorded profile, not a probability of getting hired.\n\n- Role family carries the most weight. Frontend, product, full-stack, native/web and developer-tool roles take priority; related engineering roles remain visible.\n- Technology evidence distinguishes employment entries from personal projects. The Match tab shows the score components and the relevant technologies. Project experience does not establish professional AI tenure.\n- Level and specialist requirements limit scores when the profile does not establish the requested depth. Staff, research, unsupported primary technologies, and incomplete descriptions require review.\n- General mentions of AI, coding, or native products cannot turn an account executive role into an engineering match. Employer tenure and EEO boilerplate are not candidate requirements.\n- Ingestion, description edits, profile edits, and the versioned upgrade recompute matches. Reassessment does not regenerate or alter existing CVs.\n\n### Eligibility\n\nUse only confirmed citizenship, current location, work-authorization and relocation facts from the canonical profile. `preferences.workAuthorizationCountries` records country names; `null` or omission means unknown and an empty array records no additional authorization beyond citizenship. The legacy `existingWorkAuthorizationsOutsideMalaysia` field remains supported. Candidate-specific answers stay in the local profile, not this documentation.\n\nRole fit is independent of eligibility. A technically strong vacancy can still be incompatible.\n\n- Explicit conflicting citizenship, existing authorization without an available route, or current-residency restrictions can produce **Incompatible**, with the supporting posting clause.\n- Foreign hiring-country restrictions normally produce **Needs review** because relocation remains possible. A listing's office location does not by itself establish a remote hiring restriction.\n- No sponsorship by itself stays under review when the confirmed profile permits pursuing an independent visa route. An explicit existing-authorization requirement can establish a conflict.\n- Unclear or conditional sponsorship, conflicting company boilerplate, citizenship/residency alternatives, and independently obtainable visas stay under review. Security clearance alone does not imply a citizenship rule.\n- The default Jobs view uses **No known conflict**. **Any eligibility**, **Needs review**, and **Incompatible** remain selectable. Saved retains every saved/applied record.\n- Explicit hiring scope can indicate whether remote work from the candidate's current location is possible, restricted, or unknown; it does not establish legal eligibility.\n\nThe parser recognizes a bounded English country/requirement vocabulary. It is conservative around unsupported countries, languages, ambiguous clauses, immigration routes, and clearance details. It is not a legal determination. Review the original posting when deciding whether to apply. Original source location text is preserved; the bundled [geography lookup](../reference/geography.md) now adds country/region browsing facets without establishing eligibility. Compensation remains a soft preference.\n\n## Duplicate listings\n\nIDs and canonical URLs still identify observations of the same stored job. Additionally, the results group likely duplicate vacancies across boards:\n\n1. An explicit job-specific Ashby, Greenhouse, or Lever posting identity can match across URL aliases and board copies.\n2. Otherwise, require the same normalized employer/title/location, compatible arrangement and employment type, publication dates within 45 days, and substantially similar **complete** descriptions (at least 82% four-word shingle overlap across boards, 96% within one source).\n3. Different employer requisitions, explicit requisition numbers, levels, locations, eligibility outcomes, old reposts, and truncated excerpts remain separate. Organic HN/X posts remain independent because they may advertise several roles.\n4. Every member must match all other members, preventing a chain of loose similarities from collapsing unrelated jobs.\n\nGrouping is reversible and does not delete jobs, move tasks, combine private notes, or renumber CV versions. Saved records take precedence as representatives. **Show duplicates** displays every original record; **Other listings** links to its related source copies. Grouping runs after the user's filters so an excluded representative cannot hide a matching copy. Saved always shows its individual records.\n\nThis favors missed duplicates over merging separate vacancies. Similar titles alone are insufficient, and unsupported ATS identities or differing geographic formats may leave copies ungrouped.\n\n## Description evidence and freshness\n\nMigration 002 adds per-source observations and immutable versions of changed source payloads. Empty responses and excerpts cannot overwrite an existing complete description. A newer complete description may legitimately be shorter. Manual description edits retain precedence. Employer ATS descriptions are preferred over board copies when complete; the source is shown in the detail pane.\n\nRSS/Atom normalization prefers complete content over summaries. API excerpt fallbacks remain marked as excerpts even when long. Incomplete descriptions wait for details before cover-letter generation. No arbitrary truncation is applied to stored descriptions; the cover-letter inference prompt still has its own context limit.\n\nAvailability uses all observations, with employer-board evidence taking priority:\n\n- A complete employer-board snapshot can close a missing job; a partial/failed scan cannot.\n- A feed copy cannot reopen a vacancy closed by the employer. Reappearance on the employer board can reopen it.\n- Explicit expiry closes a listing, including when the expiry date passes between scans. Omitting a previous expiry does not itself reopen it.\n- Disappearance from a bounded feed is not closure.\n- Old feed content becomes **Stale**, with availability **Unconfirmed**, rather than being treated as freshly hiring merely because it was returned again.\n\nFreshness policy: employer observations need checking after 14 days; other observations after 30 days. Published feed age is limited to 90 days, HN to 45 days, and X to 30 days. Missing publication dates use first-seen time. An actively checked employer posting remains current even if it was originally published long ago. These are application heuristics, not provider expiry guarantees.\n\nThe Jobs availability filter includes stale and closed records on demand; Saved keeps its history. Nothing is deleted by freshness handling.\n\n### Existing data\n\nThe migration can only retain descriptions that still exist in the database. The optional recovery command re-normalizes existing cached responses, preserves last-seen and closure state, and makes no network requests:\n\n```sh\nnpx tsx scripts/backup.ts\nnpx tsx scripts/recover-cached-descriptions.ts\n```\n\nThe September 2026 local collection was backed up and recovered this way, as recorded in [verification history](../verification/history.md). Old descriptions overwritten before this feature and absent from the cache cannot be reconstructed.\n\n## Evaluation\n\n`tests/fixtures/listing-evaluation.json` contains 16 actual locally collected listing snapshots and a manually written rubric evaluated against the fictional profile in `tests/fixtures/profile.json`. The cases cover direct frontend/native roles, sales false positives, adjacent support/DevRel, staff scope, unsupported specializations, truncated descriptions, citizenship restrictions, and independent visas.\n\n```sh\nnpm test\nnpx tsx scripts/evaluate-matching.ts --write\nnpx tsx scripts/verify-listing-upgrade.ts\nnpx tsx scripts/verify-matching-ui.ts\n```\n\nThis is a targeted regression set used during development, not a blinded or independent benchmark. It demonstrates specific expected behavior, not measured accuracy across every listing. Continue adding cases when real decisions reveal mistakes. Database tests cover duplicate non-matches, source precedence, expiry/staleness, description versions, profile changes, saved-state preservation, and migration/restart integrity. Browser checks cover the new controls and evidence on desktop and mobile.\n","toc":[{"id":"intent-and-basis","title":"Intent and basis","depth":2},{"id":"entry-points-and-prerequisites","title":"Entry points and prerequisites","depth":2},{"id":"expected-outcomes","title":"Expected outcomes","depth":2},{"id":"verification-recipe","title":"Verification recipe","depth":2},{"id":"coverage-and-limitations","title":"Coverage and limitations","depth":2},{"id":"verification-history","title":"Verification history","depth":2},{"id":"matching","title":"Matching","depth":2},{"id":"eligibility","title":"Eligibility","depth":3},{"id":"duplicate-listings","title":"Duplicate listings","depth":2},{"id":"description-evidence-and-freshness","title":"Description evidence and freshness","depth":2},{"id":"existing-data","title":"Existing data","depth":3},{"id":"evaluation","title":"Evaluation","depth":2}],"titleAnchor":"matching-and-listing-quality","links":["decisions/index","verification/setup","verification/history","verification/index","reference/geography","verification/hist  duplicate non-matches, source precedence, expiry/staleness, description versions, profile changes, saved-state preservation, and migration/restart integrity. Browser checks cover the new controls and evidence on desktop and mobile.\u003c/p>\n","backlinks":["features/index","journal/2026-10-07-jstack-migration","reference/architecture","verification/history"]},{"id":"features/profile","title":"User profile and evidence","section":"Features","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-10-07\u003c/span>","updated":"2026-10-07","summary":"","source":"---\ntitle: User profile and evidence\nsection: Features\nupdated: 2026-10-07\n---\n# User profile and evidence\n\nFeature ID: `FEAT-profile`\n\n## Intent and basis\n\nKeep attributable career facts canonical and distinct from document wording and inference. Based on the [accepted project boundaries](../decisions/index.md) and existing implementation documentation; this migration adds no product requirement.\n\n## Entry points and prerequisites\n\nUser profile → Edit with assistant; advanced CV data editing shares the same SQLite profile versions. New installations start empty.\n\n## Expected outcomes\n\nUnknown eligibility does not prevent discovery once essential profile fields are complete. Quoted change evidence, revisions and chat persist; invalid/conflicting edits cannot silently replace facts.\n\n## Verification recipe\n\nUse [shared verification setup](../verification/setup.md) for isolation, build identity, evidence and cleanup. `npx tsx --test tests/profile-chat.test.ts tests/assistant.test.ts` exercises isolated facts and chat handling. `npx tsx scripts/verify-assistant-ui.ts` exercises onboarding and saved facts with simulated inference.\n\nRecipes are migrated from existing scripts and historical checks; they were not re-executed during the wiki migration.\n\n## Coverage and limitations\n\nReal interpretation quality is not established by schema validation. Real runtime recipes consume subscription allowance; see [setup](../verification/setup.md).\n\n## Verification history\n\n[Historical implementation checks](../verification/history.md) record previous selected scenarios and limitations. Those entries are historical evidence; new reports belong in [verification runs](../verification/index.md).\n\n\nThe versioned SQLite profile is the canonical facts record. **User profile** renders it directly and uses the bundled onboarding skill to guide chat edits. Discovery requires a name, current location, target roles, useful career/education/project background, and work-arrangement preferences. Contact details, citizenship and visa answers are optional; unknown eligibility remains unknown. Both manual and scheduled scans enforce this gate, including after a restore removes essential information. Scheduling still respects Settings.\n\nChat history, queued turns, quoted change evidence and document versions persist locally. The app-wide assistant reads records through explicit application actions, stages changes, validates them and commits coordinated edits atomically with version checks. Replies link to the saved records and report their actual versions and preview results. Stop discards uncommitted work; authentication failures, interrupted requests and conflicts support retry. A failed PDF compilation is reported explicitly and retains the prior preview while preserving the newly versioned source. Editors refresh after successful assistant changes unless they contain unsaved text or are showing a historical version.\n\nProfile facts and document wording remain distinct. A request to update a project in the CV can update the facts and actual LaTeX document together. A profile-only correction updates master facts and the data/HTML representation; it does not silently overwrite independent LaTeX wording. A wording-only letter or CV edit leaves the underlying facts alone. Profile updates refresh deterministic matching and invalidate relevant Jev assessments. Review resulting facts and documents: schema and quote checks cannot prove every interpretation is correct. See [assistant capabilities and architecture](assistant.md).\n\nFresh databases start empty. `JH_PROFILE_SEED=/absolute/path/to/profile.json` explicitly imports a structured profile only on first initialization (optional local evidence). `data/candidate-profile.json` and `docs/MASTER_CV.md` retain the original local evidence; neither overwrites an existing profile. See the profile guide (`core/profile/skills/build-user-profile/SKILL.md`).\n","toc":[{"id":"intent-and-basis","title":"Intent and basis","depth":2},{"id":"entry-points-and-prerequisites","title":"Entry points and prerequisites","depth":2},{"id":"expected-outcomes","title":"Expected outcomes","depth":2},{"id":"verification-recipe","title":"Verification recipe","depth":2},{"id":"coverage-and-limitations","title":"Coverage and limitations","depth":2},{"id":"verification-history","title":"Verification history","depth":2}],"titleAnchor":"user-profile-and-evidence","links":["decisions/index","verification/setup","verification/setup","verification/history","verification/index","features/assistant"],"attachments":[],"html":"\u003cp>Feature ID: \u003ccode>FEAT-profile\u003c/code>\u003c/p>\n\u003ch2 id=\"intent-and-basis\">Intent and basis\u003c/h2>\n\u003cp>Keep attributable career facts canonical and distinct from document wording and inference. Based on the \u003ca href=\"#/decisions/index\">accepted project boundaries\u003c/a> and existing implementation documentation; this migration adds no product requirement.\u003c/p>\n\u003ch2 id=\"entry-points-and-prerequisites\">Entry points and prerequisites\u003c/h2>\n\u003cp>User profile → Edit with assistant; advanced CV data editing shares the same SQLite profile versions. New installations start empty.\u003c/p>\n\u003ch2 id=\"expected-outcomes\">Expected outcomes\u003c/h2>\n\u003cp>Unknown eligibility does not prevent discovery once essential profile fields are complete. Quoted change evidence, revisions and chat persist; invalid/conflicting edits cannot silently replace facts.\u003c/p>\n\u003ch2 id=\"verification-recipe\">Verification recipe\u003c/h2>\n\u003cp>Use \u003ca href=\"#/verification/setup\">shared verification setup\u003c/a> for isolation, build identity, evidence and cleanup. \u003ccode>npx tsx --test tests/profile-chat.test.ts tests/assistant.test.ts\u003c/code> exercises isolated facts and chat handling. \u003ccode>npx tsx scripts/verify-assistant-ui.ts\u003c/code> exercises onboarding and saved facts with simulated inference.\u003c/p>\n\u003cp>Recipes are migrated from existing scripts and historical checks; they were not re-executed during the wiki migration.\u003c/p>\n\u003ch2 id=\"coverage-and-limitations\">Coverage and limitations\u003c/h2>\n\u003cp>Real interpretation quality is not established by schema validation. Real runtime recipes consume subscription allowance; see \u003ca href=\"#/verification/setup\">setup\u003c/a>.\u003c/p>\n\u003ch2 id=\"verification-history\">Verification history\u003c/h2>\n\u003cp>\u003ca href=\"#/verification/history\">Historical implementation checks\u003c/a> record previous selected scenarios and limitations. Those entries are historical evidence; new reports belong in \u003ca href=\"#/verification/index\">verification runs\u003c/a>.\u003c/p>\n\u003cp>The versioned SQLite profile is the canonical facts record. \u003cstrong>User profile\u003c/strong> renders it directly and uses the bundled onboarding skill to guide chat edits. Discovery requires a name, current location, target roles, useful career/education/project background, and work-arrangement preferences. Contact details, citizenship and visa answers are optional; unknown eligibility remains unknown. Both manual and scheduled scans enforce this gate, including after a restore removes essential information. Scheduling still respects Settings.\u003c/p>\n\u003cp>Chat history, queued turns, quoted change evidence and document versions persist locally. The app-wide assistant reads records through explicit application actions, stages changes, validates them and commits coordinated edits atomically with version checks. Replies link to the saved records and report their actual versions and preview results. Stop discards uncommitted work; authentication failures, interrupted requests and conflicts support retry. A failed PDF compilation is reported explicitly and retains the prior preview while preserving the newly versioned source. Editors refresh after successful assistant changes unless they contain unsaved text or are showing a historical version.\u003c/p>\n\u003cp>Profile facts and document wording remain distinct. A request to update a project in the CV can update the facts and actual LaTeX document together. A profile-only correction updates master facts and the data/HTML representation; it does not silently overwrite independent LaTeX wording. A wording-only letter or CV edit leaves the underlying facts alone. Profile updates refresh deterministic matching and invalidate relevant Jev assessments. Review resulting facts and documents: schema and quote checks cannot prove every interpretation is correct. See \u003ca href=\"#/features/assistant\">assistant capabilities and architecture\u003c/a>.\u003c/p>\n\u003cp>Fresh databases start empty. \u003ccode>JH_PROFILE_SEED=/absolute/path/to/profile.json\u003c/code> explicitly imports a structured profile only on first initialization (optional local evidence). \u003ccode>data/candidate-profile.json\u003c/code> and \u003ccode>docs/MASTER_CV.md\u003c/code> retain the original local evidence; neither overwrites an existing profile. See the profile guide (\u003ccode>core/profile/skills/build-user-profile/SKILL.md\u003c/code>).\u003c/p>\n","backlinks":["decisions/index","features/index","features/job-inbox"]},{"id":"guides/backups","title":"Backups and restore","section":"Guides","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-10-07\u003c/span>","updated":"2026-10-07","summary":"","source":"---\ntitle: Backups and restore\nsection: Guides\nupdated: 2026-10-07\n---\n# Backups and restore\n\n```sh\nnpx tsx scripts/backup.ts\n```\n\nThis uses SQLite's online backup API and writes a consistent snapshot under the data directory's `backups/` folder. To restore, stop both API and worker, preserve the existing appdata folder, replace `job-hunter.db` with the chosen backup, and remove stale `job-hunter.db-wal` / `job-hunter.db-shm` files before restarting. Back up `secrets/` and `codex/` separately if you want credentials restored too; they are not in database backups.\n\n\n\nFor container-specific commands and storage ownership, see [Unraid installation](unraid.md).\n","toc":[],"titleAnchor":"backups-and-restore","links":["guides/unraid"],"attachments":[],"html":"\u003cpre>\u003ccode class=\"language-sh\">npx tsx scripts/backup.ts\n\u003c/code>\u003c/pre>\n\u003cp>This uses SQLite's online backup API and writes a consistent snapshot under the data directory's \u003ccode>backups/\u003c/code> folder. To restore, stop both API and worker, preserve the existing appdata folder, replace \u003ccode>job-hunter.db\u003c/code> with the chosen backup, and remove stale \u003ccode>job-hunter.db-wal\u003c/code> / \u003ccode>job-hunter.db-shm\u003c/code> files before restarting. Back up \u003ccode>secrets/\u003c/code> and \u003ccode>codex/\u003c/code> separately if you want credentials restored too; they are not in database backups.\u003c/p>\n\u003cp>For container-specific commands and storage ownership, see \u003ca href=\"#/guides/unraid\">Unraid installation\u003c/a>.\u003c/p>\n","backlinks":["index","journal/2026-10-07-jstack-migration"]},{"id":"guides/documentation","title":"Documentation maintenance","section":"Guides","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-10-07\u003c/span>","updated":"2026-10-07","summary":"","source":"---\ntitle: Documentation maintenance\nsection: Guides\nupdated: 2026-10-07\n---\n# Documentation maintenance\n\nThe project adopts the cooperating skills from the sibling `../jstack` checkout. Reusable skills remain there; project-specific Markdown, decisions, recipes and runs live here. No plugin package installation or application dependency change is required to use this checkout's skills.\n\n## Skill selection\n\n| Task | Skill source relative to the repository root |\n| --- | --- |\n| Clarify a requested design | `../jstack/skills/grill-me/SKILL.md` |\n| Present an offline interview form | `../jstack/skills/grill-form/SKILL.md` |\n| Discuss scope and decisions | `../jstack/skills/plan/SKILL.md` |\n| Edit pages, links and reader | `../jstack/skills/wiki/SKILL.md` |\n| Describe behavior and recipes | `../jstack/skills/feature-map/SKILL.md` |\n| Exercise a selected change | `../jstack/skills/verify-change/SKILL.md` |\n| Repair verification drift | `../jstack/skills/maintain-verification/SKILL.md` |\n\nRead the applicable skill and `../jstack/references/stack-contract.md`. These are task-specific tools, not a mandatory sequence for every change. Existing user authorization and project boundaries continue to govern actions. No delegation, deployment, external messaging or product changes are implied by adoption.\n\n## Edit and build\n\nMarkdown is authoritative. Keep one current feature record and link to it from decisions and guides. Historical research and old verification notes retain their dates and limits. Use relative `.md` links within the wiki; repository source paths outside the wiki are shown as code because the offline reader only embeds wiki pages. Root README, agent instructions and directory pointers remain outside as entry points; runtime skills remain at their executable paths.\n\n```sh\nnode docs/wiki/_build.mjs\nnode docs/wiki/_build.mjs --check\n```\n\nThe generated `index.html` is a snapshot. Rebuild after source or attachment changes; do not edit it directly. It opens offline and has no runtime network or package dependency. Share the reader with its `evidence/` or `attachments/` directories when linked files are needed.\n\n## Verification records\n\nUse a stable feature ID and a unique timestamped run ID. New reports go in `verification/runs/` with flat frontmatter and `result: Passed`, `Failed` or `Untested`. Include scope, exact revision plus dirty-tree fingerprint, environment/instance, expected and observed outcomes, evidence, and limits. Passed covers only the selected scenarios; any exercised failed expectation makes the run Failed, otherwise an incomplete selected scenario makes it Untested. Keep failures and later fixes as separate attempts.\n\nValidate metadata with `node ../jstack/skills/verify-change/scripts/check-reports.mjs docs/wiki`. The checker establishes report format, and wiki build/check establishes structure and snapshot freshness; neither proves a product claim. Older [verification history](../verification/history.md) is retained as provenance, not fabricated into reports with missing revisions.\n\n## Privacy and evidence\n\n`data/candidate-profile.json`, `docs/MASTER_CV.md`, databases, generated CVs, application records, secrets and raw development logs remain local and outside this wiki. Do not copy private artifacts into a shareable reader or publish them to Slopchan. New evidence must be reviewed before copying. The original local evidence paths remain intact because they are candidate records, not public project guides.\n\n## Reader provenance\n\n`_build.mjs` is copied unchanged from `../jstack/skills/wiki/assets/_build.mjs` at jstack revision `4a3109a2e4fd3be9836b7a14a2bf76ce14ce567d` on 7 October 2026. Its bundled dependency licenses are preserved. Compare with the upstream asset before future upgrades and preserve any intentional local customizations. No jstack examples or project facts were copied.\n","toc":[{"id":"skill-selection","title":"Skill selection","depth":2},{"id":"edit-and-build","title":"Edit and build","depth":2},{"id":"verification-records","title":"Verification records","depth":2},{"id":"privacy-and-evidence","title":"Privacy and evidence","depth":2},{"id":"reader-provenance","title":"Reader provenance","depth":2}],"titleAnchor":"documentation-maintenance","links":["verification/history"],"attachments":[],"html":"\u003cp>The project adopts the cooperating skills from the sibling \u003ccode>../jstack\u003c/code> checkout. Reusable skills remain there; project-specific Markdown, decisions, recipes and runs live here. No plugin package installation or application dependency change is required to use this checkout's skills.\u003c/p>\n\u003ch2 id=\"skill-selection\">Skill selection\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Task\u003c/th>\n\u003cth>Skill source relative to the repository root\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Clarify a requested design\u003c/td>\n\u003ctd>\u003ccode>../jstack/skills/grill-me/SKILL.md\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Present an offline interview form\u003c/td>\n\u003ctd>\u003ccode>../jstack/skills/grill-form/SKILL.md\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Discuss scope and decisions\u003c/td>\n\u003ctd>\u003ccode>../jstack/skills/plan/SKILL.md\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Edit pages, links and reader\u003c/td>\n\u003ctd>\u003ccode>../jstack/skills/wiki/SKILL.md\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Describe behavior and recipes\u003c/td>\n\u003ctd>\u003ccode>../jstack/skills/feature-map/SKILL.md\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Exercise a selected change\u003c/td>\n\u003ctd>\u003ccode>../jstack/skills/verify-change/SKILL.md\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Repair verification drift\u003c/td>\n\u003ctd>\u003ccode>../jstack/skills/maintain-verification/SKILL.md\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Read the applicable skill and \u003ccode>../jstack/references/stack-contract.md\u003c/code>. These are task-specific tools, not a mandatory sequence for every change. Existing user authorization and project boundaries continue to govern actions. No delegation, deployment, external messaging or product changes are implied by adoption.\u003c/p>\n\u003ch2 id=\"edit-and-build\">Edit and build\u003c/h2>\n\u003cp>Markdown is authoritative. Keep one current feature record and link to it from decisions and guides. Historical research and old verification notes retain their dates and limits. Use relative \u003ccode>.md\u003c/code> links within the wiki; repository source paths outside the wiki are shown as code because the offline reader only embeds wiki pages. Root README, agent instructions and directory pointers remain outside as entry points; runtime skills remain at their executable paths.\u003c/p>\n\u003cpre>\u003ccode class=\"language-sh\">node docs/wiki/_build.mjs\nnode docs/wiki/_build.mjs --check\n\u003c/code>\u003c/pre>\n\u003cp>The generated \u003ccode>index.html\u003c/code> is a snapshot. Rebuild after source or attachment changes; do not edit it directly. It opens offline and has no runtime network or package dependency. Share the reader with its \u003ccode>evidence/\u003c/code> or \u003ccode>attachments/\u003c/code> directories when linked files are needed.\u003c/p>\n\u003ch2 id=\"verification-records\">Verification records\u003c/h2>\n\u003cp>Use a stable feature ID and a unique timestamped run ID. New reports go in \u003ccode>verification/runs/\u003c/code> with flat frontmatter and \u003ccode>result: Passed\u003c/code>, \u003ccode>Failed\u003c/code> or \u003ccode>Untested\u003c/code>. Include scope, exact revision plus dirty-tree fingerprint, environment/instance, expected and observed outcomes, evidence, and limits. Passed covers only the selected scenarios; any exercised failed expectation makes the run Failed, otherwise an incomplete selected scenario makes it Untested. Keep failures and later fixes as separate attempts.\u003c/p>\n\u003cp>Validate metadata with \u003ccode>node ../jstack/skills/verify-change/scripts/check-reports.mjs docs/wiki\u003c/code>. The checker establishes report format, and wiki build/check establishes structure and snapshot freshness; neither proves a product claim. Older \u003ca href=\"#/verification/history\">verification history\u003c/a> is retained as provenance, not fabricated into reports with missing revisions.\u003c/p>\n\u003ch2 id=\"privacy-and-evidence\">Privacy and evidence\u003c/h2>\n\u003cp>\u003ccode>data/candidate-profile.json\u003c/code>, \u003ccode>docs/MASTER_CV.md\u003c/code>, databases, generated CVs, application records, secrets and raw development logs remain local and outside this wiki. Do not copy private artifacts into a shareable reader or publish them to Slopchan. New evidence must be reviewed before copying. The original local evidence paths remain intact because they are candidate records, not public project guides.\u003c/p>\n\u003ch2 id=\"reader-provenance\">Reader provenance\u003c/h2>\n\u003cp>\u003ccode>_build.mjs\u003c/code> is copied unchanged from \u003ccode>../jstack/skills/wiki/assets/_build.mjs\u003c/code> at jstack revision \u003ccode>4a3109a2e4fd3be9836b7a14a2bf76ce14ce567d\u003c/code> on 7 October 2026. Its bundled dependency licenses are preserved. Compare with the upstream asset before future upgrades and preserve any intentional local customizations. No jstack examples or project facts were copied.\u003c/p>\n","backlinks":["index","verification/history","verification/setup"]},{"id":"guides/local-development","title":"Local development","section":"Guides","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-10-07\u003c/span>","updated":"2026-10-07","summary":"","source":"---\ntitle: Local development\nsection: Guides\nupdated: 2026-10-07\n---\n# Local development\n\nFor everyday use, open the [native desktop app](../features/desktop.md). The commands below are for developing the web application. After desktop installation, this workspace's `.env` points to the same Application Support data directory; avoid running an extra development instance unless needed.\n\nRequires Node 22.19+ and the official Codex CLI signed in with ChatGPT.\n\n```sh\nnpm ci\ntest -f .env || cp .env.example .env\nnpx playwright install chromium\nnpm run dev\n```\n\nOpen **http://127.0.0.1:5173**. The current workspace uses API port **4317** in `.env` because port 3000 was already occupied. Fresh installations default to API port 3000; change `JH_PORT` if needed. Vite proxies API requests to that port. No application login, hosted domain, or publishing service.\n\nThe development command prepares the local LaTeX compiler, then starts the API, frontend, and worker. First-run compiler/package downloads require internet access; subsequent CV compilation is offline. All persistent application data lives in `.local-data/` by default. The server must remain awake for scans to run; Unraid runs the same worker continuously.\n\n\n## Existing installations\n\n\nThe app keeps its existing `job-hunter.db` database filename, `JH_*` environment settings, and browser storage keys so saved jobs, CVs, credentials, and preferences continue to work after the rename. Use `ununemploy:local` for new Docker builds and keep the existing appdata mount when updating an installation.\n\n\n## Public source and local data\n\n\nThe repository excludes local candidate evidence, app databases, generated documents and credentials. Automated tests use the fictional profile in `tests/fixtures/profile.json`; it is not a default profile or real candidate evidence. Run `npm test` and `npm run build` to check a source checkout.\n\n## Next steps\n\nOpen [the workflow guide](workflow.md), review [verification setup](../verification/setup.md), or prepare [Unraid installation](unraid.md). The [master CV guide](../features/master-cv.md) covers compiler setup and overrides. All commands in this wiki assume the repository root unless stated otherwise.\n","toc":[{"id":"existing-installations","title":"Existing installations","depth":2},{"id":"public-source-and-local-data","title":"Public source and local data","depth":2},{"id":"next-steps","title":"Next steps","depth":2}],"titleAnchor":"local-development","links":["features/desktop","guides/workflow","verification/setup","guides/unraid","features/master-cv"],"attachments":[],"html":"\u003cp>For everyday use, open the \u003ca href=\"#/features/desktop\">native desktop app\u003c/a>. The commands below are for developing the web application. After desktop installation, this workspace's \u003ccode>.env\u003c/code> points to the same Application Support data directory; avoid running an extra development instance unless needed.\u003c/p>\n\u003cp>Requires Node 22.19+ and the official Codex CLI signed in with ChatGPT.\u003c/p>\n\u003cpre>\u003ccode class=\"language-sh\">npm ci\ntest -f .env || cp .env.example .env\nnpx playwright install chromium\nnpm run dev\n\u003c/code>\u003c/pre>\n\u003cp>Open \u003cstrong>\u003ca href=\"http://127.0.0.1:5173\" rel=\"noreferrer\">http://127.0.0.1:5173\u003c/a>\u003c/strong>. The current workspace uses API port \u003cstrong>4317\u003c/strong> in \u003ccode>.env\u003c/code> because port 3000 was already occupied. Fresh installations default to API port 3000; change \u003ccode>JH_PORT\u003c/code> if needed. Vite proxies API requests to that port. No application login, hosted domain, or publishing service.\u003c/p>\n\u003cp>The development command prepares the local LaTeX compiler, then starts the API, frontend, and worker. First-run compiler/package downloads require internet access; subsequent CV compilation is offline. All persistent application data lives in \u003ccode>.local-data/\u003c/code> by default. The server must remain awake for scans to run; Unraid runs the same worker continuously.\u003c/p>\n\u003ch2 id=\"existing-installations\">Existing installations\u003c/h2>\n\u003cp>The app keeps its existing \u003ccode>job-hunter.db\u003c/code> database filename, \u003ccode>JH_*\u003c/code> environment settings, and browser storage keys so saved jobs, CVs, credentials, and preferences continue to work after the rename. Use \u003ccode>ununemploy:local\u003c/code> for new Docker builds and keep the existing appdata mount when updating an installation.\u003c/p>\n\u003ch2 id=\"public-source-and-local-data\">Public source and local data\u003c/h2>\n\u003cp>The repository excludes local candidate evidence, app databases, generated documents and credentials. Automated tests use the fictional profile in \u003ccode>tests/fixtures/profile.json\u003c/code>; it is not a default profile or real candidate evidence. Run \u003ccode>npm test\u003c/code> and \u003ccode>npm run build\u003c/code> to check a source checkout.\u003c/p>\n\u003ch2 id=\"next-steps\">Next steps\u003c/h2>\n\u003cp>Open \u003ca href=\"#/guides/workflow\">the workflow guide\u003c/a>, review \u003ca href=\"#/verification/setup\">verification setup\u003c/a>, or prepare \u003ca href=\"#/guides/unraid\">Unraid installation\u003c/a>. The \u003ca href=\"#/features/master-cv\">master CV guide\u003c/a> covers compiler setup and overrides. All commands in this wiki assume the repository root unless stated otherwise.\u003c/p>\n","backlinks":["index","features/master-cv","journal/2026-10-07-jstack-migration","reference/architecture","verification/setup"]},{"id":"guides/unraid","title":"Unraid installation","section":"Guides","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-10-07\u003c/span>","updated":"2026-10-07","summary":"","source":"---\ntitle: Unraid installation\nsection: Guides\nupdated: 2026-10-07\n---\n# Unraid installation\n\nThe image and container checks have been exercised locally. Actual Unraid deployment and native amd64 LaTeX sandbox execution remain unverified; see [verification history](../verification/history.md). Commands below run from the repository root unless stated otherwise.\n\nununemploy runs entirely on your server, on a local port without an application login. It uses one Docker container for the API, UI, and supervised worker. Persistent data is mounted at `/config`.\n\n## Build the local image\n\nFrom the project folder on a machine with Docker:\n\n```sh\ndocker buildx build --platform linux/amd64 --load -t ununemploy:local .\n```\n\nThe image stays local. Fresh databases start empty unless `JH_PROFILE_SEED` is explicitly set. Keep builds and hosting local; do not publish the image to a public registry. If you build directly on Unraid, the image is immediately available there. If you build on your Mac, transfer it manually:\n\n```sh\ndocker save -o ununemploy-image.tar ununemploy:local\n```\n\nCopy the archive to your server, then run `docker load -i /path/to/ununemploy-image.tar` on Unraid. No hosted domain or registry account is needed.\n\n## Install the XML template\n\n1. Copy `deploy/unraid/ununemploy.xml` to `/boot/config/plugins/dockerMan/templates-user/my-ununemploy.xml` on Unraid.\n2. Open **Docker → Add Container** and select the ununemploy template.\n3. Keep `/config` mapped to `/mnt/user/appdata/ununemploy` and choose a host port, default **3080**.\n4. Set **Application URL** to the address you will use, for example `http://192.168.1.10:3080`.\n5. Apply. Open the WebUI from the container menu.\n\nWhen updating an existing installation, keep its current `/config` host-directory mapping. The database remains named `job-hunter.db` for compatibility.\n\nThe template uses `ununemploy:local`, container port 3000, PUID 99, PGID 100, and a four-hour scan interval. The supervisor runs the API and worker as the configured UID/GID and restarts them if they exit. Health checks require a live API and recent worker heartbeat. `/config` persists across image replacements.\n\n## Sign in to Codex\n\nThe official CLI is included. Run this on Unraid after starting the container:\n\n```sh\ndocker exec -it -u 99:100 -e CODEX_HOME=/config/codex -e HOME=/config/home ununemploy codex login --device-auth\n```\n\nFollow the CLI's own sign-in instructions using your ChatGPT subscription. If you changed PUID/PGID, use those values. The official CLI owns its authentication and refresh state under `/config/codex`; the application does not implement OAuth. Device sign-in may need enabling in the account's security settings. See [Codex authentication](https://learn.chatgpt.com/docs/auth).\n\nOpen **Settings → Codex → Check connection** afterwards. Generation uses `gpt-5.6-sol` with high reasoning, one task at a time. Login, model-access, and subscription-allowance failures pause drafts. Retry after resolving the displayed issue. No API-key billing fallback is configured.\n\nYour current Mac login is used by the development instance. A new container needs its own official sign-in; credentials are not baked into the image.\n\n## Configure the additional sources\n\nFresh databases include the full source catalog. For existing appdata after replacing the image, run `docker exec -u 99:100 ununemploy npx tsx scripts/add-discovery-sources.ts` to install missing entries without changing existing preferences. VueJobs runs through public RSS. Set the separate Web3.career token in **Settings → Web3.career**; it persists under `/config/secrets`. The installer upgrades Wellfound and Welcome to the Jungle in place and adds the 28-board expansion. Public-board collectors use a persistent SQLite description queue, at most two scans/day and 12 requests/scan. Sources reports blocked/unavailable boards. Adzuna, Jooble and Careerjet remain pending API configuration; no credentials are bundled.\n\n## Enable X\n\nUse **Settings → X** to save the app-only bearer token, set a monthly post limit, and enable collection. The starter search is in **Sources → X · Engineering**. Add additional queries as separate X sources. All queries share one monthly retrieval cap. You can also supply the token through the optional Unraid variable.\n\nCreate the X app and obtain the bearer token at [console.x.com](https://console.x.com/). X API access/credits are separate from the Codex subscription. No X posting or user-engagement capabilities are present.\n\n## Update and back up\n\nThe image also includes the offline LaTeX compiler and package cache. **CV → LaTeX** edits and previews the master resume, with source and PDF versions persisted in `job-hunter.db`. The compiler uses Linux Landlock and requires a host kernel with Landlock enabled (Linux 5.13+); unsupported hosts show a compilation error and preserve saved source. Do not add privileged mode or mount the Docker socket. No additional Unraid volume or authentication is needed.\n\nRebuild/load the image, then recreate the container using the same `/config` mapping. Existing jobs, profile revisions, CV and cover-letter edits, queued drafts, source checkpoints, and counters stay in appdata. Interrupted generation appears as a paused task.\n\nCreate a consistent database backup while the app is running:\n\n```sh\ndocker exec -u 99:100 ununemploy /app/node_modules/.bin/tsx scripts/backup.ts\n```\n\nThe command prints the backup path under `/config/backups`. Keep `secrets/` and `codex/` with a separate private backup if you need to preserve sign-in. To restore a database, stop the container first, keep a copy of its current appdata, replace `job-hunter.db`, and remove stale WAL/SHM sidecars before restarting.\n\n## Local container check\n\n```sh\nnpx tsx scripts/verify-container.ts\n```\n\nThis uses a temporary native Docker volume and port 5308 with scheduled collection disabled. It verifies the amd64 image, persistent notes/CV profile versions/cover letters/queued tasks, PDF rendering, UID/GID, and online database backup. It does not deploy to your Unraid server.\n","toc":[{"id":"build-the-local-image","title":"Build the local image","depth":2},{"id":"install-the-xml-template","title":"Install the XML template","depth":2},{"id":"sign-in-to-codex","title":"Sign in to Codex","depth":2},{"id":"configure-the-additional-sources","title":"Configure the additional sources","depth":2},{"id":"enable-x","title":"Enable X","depth":2},{"id":"update-and-back-up","title":"Update and back up","depth":2},{"id":"local-container-check","title":"Local container check","depth":2}],"titleAnchor":"unraid-installation","links":["verification/history"],"attachments":[],"html":"\u003cp>The image and container checks have been exercised locally. Actual Unraid deployment and native amd64 LaTeX sandbox execution remain unverified; see \u003ca href=\"#/verification/history\">verification history\u003c/a>. Commands below run from the repository root unless stated otherwise.\u003c/p>\n\u003cp>ununemploy runs entirely on your server, on a local port without an application login. It uses one Docker container for the API, UI, and supervised worker. Persistent data is mounted at \u003ccode>/config\u003c/code>.\u003c/p>\n\u003ch2 id=\"build-the-local-image\">Build the local image\u003c/h2>\n\u003cp>From the project folder on a machine with Docker:\u003c/p>\n\u003cpre>\u003ccode class=\"language-sh\">docker buildx build --platform linux/amd64 --load -t ununemploy:local .\n\u003c/code>\u003c/pre>\n\u003cp>The image stays local. Fresh databases start empty unless \u003ccode>JH_PROFILE_SEED\u003c/code> is explicitly set. Keep builds and hosting local; do not publish the image to a public registry. If you build directly on Unraid, the image is immediately available there. If you build on your Mac, transfer it manually:\u003c/p>\n\u003cpre>\u003ccode class=\"language-sh\">docker save -o ununemploy-image.tar ununemploy:local\n\u003c/code>\u003c/pre>\n\u003cp>Copy the archive to your server, then run \u003ccode>docker load -i /path/to/ununemploy-image.tar\u003c/code> on Unraid. No hosted domain or registry account is needed.\u003c/p>\n\u003ch2 id=\"install-the-xml-template\">Install the XML template\u003c/h2>\n\u003col>\n\u003cli>Copy \u003ccode>deploy/unraid/ununemploy.xml\u003c/code> to \u003ccode>/boot/config/plugins/dockerMan/templates-user/my-ununemploy.xml\u003c/code> on Unraid.\u003c/li>\n\u003cli>Open \u003cstrong>Docker → Add Container\u003c/strong> and select the ununemploy template.\u003c/li>\n\u003cli>Keep \u003ccode>/config\u003c/code> mapped to \u003ccode>/mnt/user/appdata/ununemploy\u003c/code> and choose a host port, default \u003cstrong>3080\u003c/strong>.\u003c/li>\n\u003cli>Set \u003cstrong>Application URL\u003c/strong> to the address you will use, for example \u003ccode>http://192.168.1.10:3080\u003c/code>.\u003c/li>\n\u003cli>Apply. Open the WebUI from the container menu.\u003c/li>\n\u003c/ol>\n\u003cp>When updating an existing installation, keep its current \u003ccode>/config\u003c/code> host-directory mapping. The database remains named \u003ccode>job-hunter.db\u003c/code> for compatibility.\u003c/p>\n\u003cp>The template uses \u003ccode>ununemploy:local\u003c/code>, container port 3000, PUID 99, PGID 100, and a four-hour scan interval. The supervisor runs the API and worker as the configured UID/GID and restarts them if they exit. Health checks require a live API and recent worker heartbeat. \u003ccode>/config\u003c/code> persists across image replacements.\u003c/p>\n\u003ch2 id=\"sign-in-to-codex\">Sign in to Codex\u003c/h2>\n\u003cp>The official CLI is included. Run this on Unraid after starting the container:\u003c/p>\n\u003cpre>\u003ccode class=\"language-sh\">docker exec -it -u 99:100 -e CODEX_HOME=/config/codex -e HOME=/config/home ununemploy codex login --device-auth\n\u003c/code>\u003c/pre>\n\u003cp>Follow the CLI's own sign-in instructions using your ChatGPT subscription. If you changed PUID/PGID, use those values. The official CLI owns its authentication and refresh state under \u003ccode>/config/codex\u003c/code>; the application does not implement OAuth. Device sign-in may need enabling in the account's security settings. See \u003ca href=\"https://learn.chatgpt.com/docs/auth\" rel=\"noreferrer\">Codex authentication\u003c/a>.\u003c/p>\n\u003cp>Open \u003cstrong>Settings → Codex → Check connection\u003c/strong> afterwards. Generation uses \u003ccode>gpt-5.6-sol\u003c/code> with high reasoning, one task at a time. Login, model-access, and subscription-allowance failures pause drafts. Retry after resolving the displayed issue. No API-key billing fallback is configured.\u003c/p>\n\u003cp>Your current Mac login is used by the development instance. A new container needs its own official sign-in; credentials are not baked into the image.\u003c/p>\n\u003ch2 id=\"configure-the-additional-sources\">Configure the additional sources\u003c/h2>\n\u003cp>Fresh databases include the full source catalog. For existing appdata after replacing the image, run \u003ccode>docker exec -u 99:100 ununemploy npx tsx scripts/add-discovery-sources.ts\u003c/code> to install missing entries without changing existing preferences. VueJobs runs through public RSS. Set the separate Web3.career token in \u003cstrong>Settings → Web3.career\u003c/strong>; it persists under \u003ccode>/config/secrets\u003c/code>. The installer upgrades Wellfound and Welcome to the Jungle in place and adds the 28-board expansion. Public-board collectors use a persistent SQLite description queue, at most two scans/day and 12 requests/scan. Sources reports blocked/unavailable boards. Adzuna, Jooble and Careerjet remain pending API configuration; no credentials are bundled.\u003c/p>\n\u003ch2 id=\"enable-x\">Enable X\u003c/h2>\n\u003cp>Use \u003cstrong>Settings → X\u003c/strong> to save the app-only bearer token, set a monthly post limit, and enable collection. The starter search is in \u003cstrong>Sources → X · Engineering\u003c/strong>. Add additional queries as separate X sources. All queries share one monthly retrieval cap. You can also supply the token through the optional Unraid variable.\u003c/p>\n\u003cp>Create the X app and obtain the bearer token at \u003ca href=\"https://console.x.com/\" rel=\"noreferrer\">console.x.com\u003c/a>. X API access/credits are separate from the Codex subscription. No X posting or user-engagement capabilities are present.\u003c/p>\n\u003ch2 id=\"update-and-back-up\">Update and back up\u003c/h2>\n\u003cp>The image also includes the offline LaTeX compiler and package cache. \u003cstrong>CV → LaTeX\u003c/strong> edits and previews the master resume, with source and PDF versions persisted in \u003ccode>job-hunter.db\u003c/code>. The compiler uses Linux Landlock and requires a host kernel with Landlock enabled (Linux 5.13+); unsupported hosts show a compilation error and preserve saved source. Do not add privileged mode or mount the Docker socket. No additional Unraid volume or authentication is needed.\u003c/p>\n\u003cp>Rebuild/load the image, then recreate the container using the same \u003ccode>/config\u003c/code> mapping. Existing jobs, profile revisions, CV and cover-letter edits, queued drafts, source checkpoints, and counters stay in appdata. Interrupted generation appears as a paused task.\u003c/p>\n\u003cp>Create a consistent database backup while the app is running:\u003c/p>\n\u003cpre>\u003ccode class=\"language-sh\">docker exec -u 99:100 ununemploy /app/node_modules/.bin/tsx scripts/backup.ts\n\u003c/code>\u003c/pre>\n\u003cp>The command prints the backup path under \u003ccode>/config/backups\u003c/code>. Keep \u003ccode>secrets/\u003c/code> and \u003ccode>codex/\u003c/code> with a separate private backup if you need to preserve sign-in. To restore a database, stop the container first, keep a copy of its current appdata, replace \u003ccode>job-hunter.db\u003c/code>, and remove stale WAL/SHM sidecars before restarting.\u003c/p>\n\u003ch2 id=\"local-container-check\">Local container check\u003c/h2>\n\u003cpre>\u003ccode class=\"language-sh\">npx tsx scripts/verify-container.ts\n\u003c/code>\u003c/pre>\n\u003cp>This uses a temporary native Docker volume and port 5308 with scheduled collection disabled. It verifies the amd64 image, persistent notes/CV profile versions/cover letters/queued tasks, PDF rendering, UID/GID, and online database backup. It does not deploy to your Unraid server.\u003c/p>\n","backlinks":["index","decisions/index","discussions/open-questions","guides/backups","guides/local-development","journal/2026-10-07-jstack-migration","reference/architecture"]},{"id":"guides/workflow","title":"Application workflow","section":"Guides","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-10-07\u003c/span>","updated":"2026-10-07","summary":"","source":"---\ntitle: Application workflow\nsection: Guides\nupdated: 2026-10-07\n---\n# Application workflow\n\n- **Jobs:** search, filter, compare match reasons, review the description, save or dismiss. Saved jobs queue a tailored cover letter. Manually adding a posting or editing a short description also works.\n- **Saved:** keep notes, open the cover letter, or manually record that you applied elsewhere.\n- **Assistant:** the button in the top-right page header opens a sliding chat overlay on any page. Search collected jobs, research supplied public references, update profile facts, edit the actual LaTeX or HTML CV, and rewrite saved cover letters. Conversation and unsent text stay with you across pages; Escape hides the pane. **New chat** clears the conversation, remembered context and unsent draft while keeping saved facts and documents. Wait for a reply or stop it first.\n- **User profile:** review the canonical facts as read-only Markdown and use **Edit with assistant** to change them. New installations open here with guided onboarding; discovery waits for the essential details. Previous profile versions can be restored.\n- **CV:** edit the structured master facts and presentation, or open previously generated resumes marked “saved resume”.\n- **Saved → job → Cover letter:** generate and edit the letter in its job detail, as JSON, with editable HTML/CSS and a preview. Save creates a version; restore appends a new version. PDF uses your template; DOCX uses a separate editable Word layout.\n- **Sources:** add company boards, public job boards, HN, feeds, or X searches. Public boards also have direct site links and manual job entry. Review scan status, request counts, errors, and next scan times.\n- **Settings:** collection schedule, Codex state, generation pause, X credentials/budget, and the Web3.career API token.\n\nNo application submission, employer upload, form filling, messaging, posting, replying, following, or reacting is implemented. External posting links open normally for you to use yourself. Notifications stay in the application.\n\n\nSee the [feature map](../features/index.md) for the contracts and verification recipes behind these actions.\n","toc":[],"titleAnchor":"application-workflow","links":["features/index"],"attachments":[],"html":"\u003cul>\n\u003cli>\u003cstrong>Jobs:\u003c/strong> search, filter, compare match reasons, review the description, save or dismiss. Saved jobs queue a tailored cover letter. Manually adding a posting or editing a short description also works.\u003c/li>\n\u003cli>\u003cstrong>Saved:\u003c/strong> keep notes, open the cover letter, or manually record that you applied elsewhere.\u003c/li>\n\u003cli>\u003cstrong>Assistant:\u003c/strong> the button in the top-right page header opens a sliding chat overlay on any page. Search collected jobs, research supplied public references, update profile facts, edit the actual LaTeX or HTML CV, and rewrite saved cover letters. Conversation and unsent text stay with you across pages; Escape hides the pane. \u003cstrong>New chat\u003c/strong> clears the conversation, remembered context and unsent draft while keeping saved facts and documents. Wait for a reply or stop it first.\u003c/li>\n\u003cli>\u003cstrong>User profile:\u003c/strong> review the canonical facts as read-only Markdown and use \u003cstrong>Edit with assistant\u003c/strong> to change them. New installations open here with guided onboarding; discovery waits for the essential details. Previous profile versions can be restored.\u003c/li>\n\u003cli>\u003cstrong>CV:\u003c/strong> edit the structured master facts and presentation, or open previously generated resumes marked “saved resume”.\u003c/li>\n\u003cli>\u003cstrong>Saved → job → Cover letter:\u003c/strong> generate and edit the letter in its job detail, as JSON, with editable HTML/CSS and a preview. Save creates a version; restore appends a new version. PDF uses your template; DOCX uses a separate editable Word layout.\u003c/li>\n\u003cli>\u003cstrong>Sources:\u003c/strong> add company boards, public job boards, HN, feeds, or X searches. Public boards also have direct site links and manual job entry. Review scan status, request counts, errors, and next scan times.\u003c/li>\n\u003cli>\u003cstrong>Settings:\u003c/strong> collection schedule, Codex state, generation pause, X credentials/budget, and the Web3.career API token.\u003c/li>\n\u003c/ul>\n\u003cp>No application submission, employer upload, form filling, messaging, posting, replying, following, or reacting is implemented. External posting links open normally for you to use yourself. Notifications stay in the application.\u003c/p>\n\u003cp>See the \u003ca href=\"#/features/index\">feature map\u003c/a> for the contracts and verification recipes behind these actions.\u003c/p>\n","backlinks":["index","guides/local-development","journal/2026-10-07-jstack-migration"]},{"id":"journal/2026-09-16-source-evaluation","title":"Job source evaluation — September 2026","section":"Journal","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-10-07\u003c/span>","updated":"2026-10-07","summary":"","source":"---\ntitle: Job source evaluation — September 2026\nsection: Journal\nupdated: 2026-10-07\n---\n# Job source evaluation — September 2026\n\nHistorical research from 16–17 September 2026, migrated without rechecking external sites. Counts, access results, recommendations and older CV terminology describe that period. Later public-board collection supersedes the original API-first/manual-only conclusions. Use [source coverage](../reference/source-coverage.md) and [discovery](../features/discovery.md) for the implemented contract.\n\nReviewed: 16 September 2026. Scope: all visible sources in the user's screenshots, including the final nine-domain list.\n\n## Coverage expansion — 17 September 2026\n\nThe user has expanded the research scope to low-frequency public-page scraping, including sources without official APIs. See the [new coverage audit and prioritized adapter backlog](../reference/source-coverage.md), with local HTTP/browser/detail probes. Hiredly, LinkedIn public jobs, Wellfound, Built In, YC's broader directory, Japan Dev, Cake and Arc are the recommended first batch. Site restrictions and technical access are recorded separately. The earlier API-first/manual-only decisions below are historical. All 28 evaluated boards are now in the scan list; see the linked document’s current status table for verified imports, blocked sources and pending API configuration.\n\n## Implementation update\n\nAfter this evaluation, the user authorized adding as many supported sources as possible. **21 new configurations are installed and live-verified**, bringing the workspace to 27 configured sources at that stage. The follow-up below adds four more, for 31 total. They cover the five recommended boards; WWR programming/design/product feeds; GolangProjects, LaraJobs, ClojureJobboard; HN's separate YC jobs feed; two Arbeitnow markets; Jobicy; and seven employer feeds. See [verification](../verification/history.md) and the catalog (`core/source-catalog.ts`).\n\n### VueJobs detail follow-up — 17 September 2026\n\nThe LINE MAN Wongnai listing's RSS description ends with an ellipsis, while its [public job page](https://vuejobs.com/jobs/line-man-wongnai-senior-software-engineer-fullstack-vue-js-python) contains the full body and matching JobPosting structured data. The feed parser retained all supplied text; the missing step was fetching public details. Added on-demand retrieval on Save or Load full description, with a one-request lookup budget, six requests per UTC day, persistent cooldowns, identity/visible-text checks and description provenance. Full text survives feed refreshes and cannot overwrite manual edits. The first fetch recovered 2,231 plain-text characters for this listing. Gated or unavailable pages stay excerpts; this does not change the earlier restriction against bypassing PRO access.\n\n### Follow-up additions — 16 September 2026\n\n- **VueJobs:** added the [RSS feed](https://app.vuejobs.com/feed/posts) advertised by an RSS alternate link in [VueJobs’ homepage](https://vuejobs.com/). One live request imported 923 excerpts, all with employer and location fields. Runs twice daily. The app subdomain’s generic robots file disallows crawling; this integration consumes only the explicitly advertised syndication feed, with no crawling of app/detail pages. [Terms reviewed](https://vuejobs.com/terms-of-use). Public job pages advertise a seven-day PRO window for new listings; the integration does not bypass it. RSS entries remain leads and CV generation waits for the complete description.\n- **Web3.career:** implemented official JSON collection and local token configuration. The [API reference](https://docs.bondex.app/api-reference/web3-career-jobs-api/api-reference) and [response models](https://docs.bondex.app/api-reference/openapi-documentation/models) document the mixed metadata/jobs array, unmodified `apply_url`, and optional description/location fields. One request reads up to 100 listings, twice daily. No live authenticated scan yet; missing credentials cause zero requests.\n- **Wellfound:** added manual job entry and a direct board link. Its [terms](https://wellfound.com/terms) restrict harvesting/copying except where permitted; public search pages and employer ATS integrations did not
