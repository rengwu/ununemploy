e> were inspected.\u003c/li>\n\u003cli>Added persistent first-open \u003ccode>seenAt\u003c/code> per posting and a Seen/Unseen filter in Jobs/Saved. Explicit title/keyboard opens and the View posting link record it; automatic previews and GET requests do not. The atomic idempotent write preserves the rest of the job, creates no tasks, and survives later source content updates. Historical views cannot be backfilled. In Unseen, opening a job removes the result while its detail stays open.\u003c/li>\n\u003cli>Selected rows now use a brand-tinted background, inset blue edge and emphasized title. Isolated browser checks passed default-preview semantics, explicit click, Seen filter/reload, mutation failure/retry, keyboard open, keeping removed Unseen details open, mobile navigation, and light/dark selected styles. No real user postings were marked by these tests. Report: \u003ccode>seen-browser.json\u003c/code>; inspected screenshots: \u003ccode>seen-selected-light.png\u003c/code>, \u003ccode>seen-selected-dark.png\u003c/code>, \u003ccode>seen-mobile.png\u003c/code>.\u003c/li>\n\u003cli>\u003cstrong>92 tests pass\u003c/strong>, covering country/region expansion, ambiguous codes/city context, exclusions, SEA/East Asia specificity, legacy selections, Seen idempotency, independent review status, duplicate isolation, filter validation, refresh and database reopening. TypeScript/production build pass. The frontend entry increased by about 3 KB minified; the gazetteer stays on the server. The prior large-bundle advisory remains.\u003c/li>\n\u003cli>Dashboard regression checks and the complete CV browser workflow passed again against the final code. CV generation used the isolated fixture mode for this rerun; no additional real inference was required. Live dashboard checks intercept Seen writes so test navigation does not mark user postings. Logs: \u003ccode>regions-seen-dashboard.log\u003c/code> and \u003ccode>regions-seen-cv-workflow.log\u003c/code>.\u003c/li>\n\u003cli>Rebuilt local \u003ccode>ununemploy:local\u003c/code> for \u003ccode>linux/amd64\u003c/code>, image \u003cstrong>b53927983941\u003c/strong>. Container checks passed startup/health, frontend delivery, 32 fresh source configurations, signed-out Codex handling, PDF export, saved notes/jobs/queued tasks/profile revision and the exact Seen timestamp after restart, backup creation, and UID/GID 99:100 ownership. The temporary container and volume were removed. Logs: \u003ccode>regions-seen-container-build.log\u003c/code> and \u003ccode>regions-seen-container.log\u003c/code>. This is a local build; actual Unraid installation remains outstanding.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"dashboard-performance-and-complete-cv-workflow-17-september-2026\">Dashboard performance and complete CV workflow — 17 September 2026\u003c/h2>\n\u003cul>\n\u003cli>Moved Jobs/Saved filtering, duplicate grouping, sorting and pagination to the server. Pages contain at most 100 summaries (75 in the UI); descriptions/evidence load only for an opened detail pane. CV context and location options are separate reads. Bootstrap contains status/counts/task summaries, with no full jobs, profiles or task inputs.\u003c/li>\n\u003cli>Added migration 003 with cross-process revision triggers and a cached server collection index. SQLite snapshot reads, stable sort tie-breaks, validated query limits and page clamping preserve filter behavior during collection changes. Time-based freshness revalidates each minute. The index still rebuilds the full collection after invalidation; memory/rebuild costs are not constant and search is not SQL-indexed.\u003c/li>\n\u003cli>At \u003cstrong>4,263 jobs\u003c/strong>, bootstrap fell from \u003cstrong>28,661,733 bytes to 30,189 bytes\u003c/strong>. A 75-row page was \u003cstrong>37,469 bytes\u003c/strong>, and location options were \u003cstrong>36,762 bytes\u003c/strong>. Local warm reads measured approximately 28–50 ms, 6–10 ms and 1–3 ms respectively. Unchanged reads return bodyless 304s. These are local snapshots, not a large-scale benchmark. Reports: \u003ccode>.local-data/verification/performance-before.json\u003c/code> and \u003ccode>performance-after.json\u003c/code>.\u003c/li>\n\u003cli>The browser debounces search, aborts obsolete requests, rejects late results, retains last good data after failures, times out stalled reads, and pauses scheduled polling while hidden. Descriptions no longer accompany every eight-second status poll. The earlier intermittent bootstrap JSON error was \u003cstrong>not reproduced or root-caused\u003c/strong>; bounded payloads and explicit recovery are implemented, and malformed-JSON/retry behavior was exercised deliberately.\u003c/li>\n\u003cli>\u003cstrong>85 isolated tests pass\u003c/strong>, including query validation, server filtering/paging, grouping after filtering, cross-process invalidation, compact bootstrap/ETags, complete Unicode detail roundtrips and master-edit reassessment. TypeScript, production build and formatting checks pass. The existing Vite large-bundle advisory remains. Migration/restart verification preserves saved state, manual descriptions, CVs/tasks and database integrity. Logs: \u003ccode>performance-tests.log\u003c/code>, \u003ccode>performance-build.log\u003c/code>, \u003ccode>performance-upgrade.log\u003c/code>.\u003c/li>\n\u003cli>Dashboard browser verification passed pagination, filter page reset, conditional polling, unsaved notes, delayed stale-response cancellation, malformed JSON recovery, page navigation and 390px layout with no JavaScript errors. Report: \u003ccode>dashboard-browser.json\u003c/code>; desktop/mobile screenshots: \u003ccode>dashboard-performance*.png\u003c/code>. Live checks did not save jobs, notes or CVs.\u003c/li>\n\u003cli>The full CV flow passed in a \u003cstrong>separate temporary database/server\u003c/strong> using an already-collected posting and copied master context: save → queued generation → actual Codex \u003ccode>gpt-5.6-sol\u003c/code>/high generation → editor/preview → save v2 → restore v1 as v3 → PDF/DOCX download → reload. Real inference used the configured subscription. Controlled generation, save, load and export failures verified recovery; failed saves and cancelled navigation/version changes retained edits. Keyboard tab switching and 390px layout passed. No external browser requests occurred, and the master facts remained unchanged. Reports: \u003ccode>cv-workflow-real.json\u003c/code> and \u003ccode>cv-workflow-fixture.json\u003c/code>; the fixture mode simulates generation and was rerun after the final interaction guards.\u003c/li>\n\u003cli>Workflow fixes add a CV load Retry action, preserve save/export errors during preview updates, and disable editing/document switching while saving. Master saves now refresh listing assessments immediately, preserving saved CV versions. Job notes/description controls also prevent edits from racing an in-flight save.\u003c/li>\n\u003cli>The real workflow's PDF and DOCX both render to two pages. All four page images were visually inspected: no clipped text, overlapping elements or broken employment/project blocks. Artifacts: \u003ccode>workflow-real.pdf\u003c/code>, \u003ccode>workflow-real.docx\u003c/code>, \u003ccode>workflow-real-pdf-*.png\u003c/code>, and \u003ccode>workflow-real-docx/page-*.png\u003c/code>. Desktop/mobile editor screenshots were also inspected. This verifies the tested document/template, not every future content length.\u003c/li>\n\u003cli>Backup comparison retained all \u003cstrong>4,263 original job IDs\u003c/strong>, unchanged saved/status/notes/manual override fields, both existing CV versions and both profile versions. There were no live tasks before or after the check; task persistence is covered by isolated tests and the container test. SQLite integrity is OK and the X monthly cap remains \u003cstrong>1,000\u003c/strong>. Report: \u003ccode>performance-data-audit.json\u003c/code>.\u003c/li>\n\u003cli>Rebuilt local \u003ccode>ununemploy:local\u003c/code> for \u003ccode>linux/amd64\u003c/code>, image \u003cstrong>2c1c7ee9acd7\u003c/strong>. Container checks passed startup/health, frontend serving, signed-out Codex handling, PDF export, saved notes/jobs/queued tasks/profile revision after restart, backup creation and UID/GID ownership. Collection was disabled in the temporary test container; its volume/container were removed. Log: \u003ccode>performance-container.log\u003c/code>. Actual Unraid installation, Web3 authenticated collection and optional WebMCP invocation remain unverified.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"layout-alignment-16-september-2026\">Layout alignment — 16 September 2026\u003c/h2>\n\u003cul>\n\u003cli>Unified heading/filter/list/table gutters, sidebar/page header borders, and CV editor/preview header heights. Removed the duplicate tab separator and overlapping focus outline. Job notes now fill their pane.\u003c/li>\n\u003cli>TypeScript/production build and formatting checks pass. Browser checks at 1440px, 1024px and 390px cover Jobs, notes width, tab selection by keyboard, active underline placement, focus visibility, and CV file switching/header alignment. Saved and dark-mode CV were also inspected. Results: \u003ccode>.local-data/verification/layout-checks.json\u003c/code>; screenshots: \u003ccode>layout-*.png\u003c/code> in that directory.\u003c/li>\n\u003cli>At 320px, preview actions scroll horizontally and keyboard focus brings each action into view while preserving the 56px header height. No download was triggered by the check.\u003c/li>\n\u003cli>An initial CV screenshot exposed an intermittent bootstrap JSON parse error; a fresh load and subsequent refresh were clear. This was not fixed by the CSS changes. See the 17 September data-loading follow-up above for recovery changes and the unresolved original cause. The layout checks did not save notes/jobs or modify CV content.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"project-rename-16-september-2026\">Project rename — 16 September 2026\u003c/h2>\n\u003cul>\n\u003cli>The project name is now \u003cstrong>ununemploy\u003c/strong>, always lowercase. Updated the dashboard brand, browser title, npm package/lockfile, HTTP user-agent, backup prefix, container image/entrypoints, Unraid template and current setup documentation. The template is \u003ccode>deploy/unraid/ununemploy.xml\u003c/code>, using \u003ccode>ununemploy:local\u003c/code>.\u003c/li>\n\u003cli>Existing \u003ccode>job-hunter.db\u003c/code> storage, \u003ccode>JH_*\u003c/code> environment variables, and browser keys are retained for compatibility. New installations default to \u003ccode>/mnt/user/appdata/ununemploy\u003c/code>; existing deployments keep their current appdata mapping. Older verification entries retain the image names used when those checks were performed.\u003c/li>\n\u003cli>TypeScript/production build and \u003cstrong>76 existing tests pass\u003c/strong>. Browser title and brand both read exactly \u003ccode>ununemploy\u003c/code>; the local app remains healthy with all \u003cstrong>4,170 jobs\u003c/strong>. Screenshot: \u003ccode>.local-data/verification/ununemploy-dashboard.png\u003c/code>; browser result: \u003ccode>ununemploy-browser.json\u003c/code> in that directory.\u003c/li>\n\u003cli>Built \u003ccode>ununemploy:local\u003c/code> for \u003ccode>linux/amd64\u003c/code>, image \u003cstrong>15e8ebd9f43f\u003c/strong>. The renamed container passed startup/health, current catalog checks, local PDF export, restart persistence, backup creation and UID/GID ownership checks. Its temporary test container and volume were removed. Result: \u003ccode>.local-data/verification/ununemploy-container.log\u003c/code>.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"matching-eligibility-deduplication-and-listing-quality-16-september-2026\">Matching, eligibility, deduplication and listing quality — 16 September 2026\u003c/h2>\n\u003cul>\n\u003cli>Implemented an evidence-based deterministic matching rubric with role/technology/domain/level components, professional versus project evidence, and review limits for specialist depth, seniority, and incomplete descriptions. Saved CVs are not rewritten by reassessment.\u003c/li>\n\u003cli>Recorded the user's confirmation of Malaysia-only work authorization and openness to visas. Eligibility is independent of fit. Explicit conflicts carry posting evidence; foreign hiring areas, unclear sponsorship, independent visa routes, EEO and preferred/negated citizenship statements are handled conservatively. No sponsorship alone remains under review.\u003c/li>\n\u003cli>Added Kumo eligibility and duplicate filters, stale/closed availability choices, visible eligibility facts, a score breakdown, description source attribution and related posting links. Grouping follows user filters; Saved retains individual records.\u003c/li>\n\u003cli>Added migration 002 for per-source observations and changed-payload versions. Complete descriptions and manual edits survive incoming excerpts. Employer closure takes priority over feed copies; omitted expiry, partial scans, old publication dates and stale observations have explicit handling.\u003c/li>\n\u003cli>\u003cstrong>76 isolated tests pass.\u003c/strong> The targeted evaluation uses \u003cstrong>16 actual collected snapshots\u003c/strong>, with \u003cstrong>16/16 fit checks and 16/16 eligibility checks passing\u003c/strong>. These are developer-written regression expectations, not an independent accuracy benchmark. Results: \u003ccode>.local-data/verification/matching-evaluation.json\u003c/code>.\u003c/li>\n\u003cli>Existing-data migration and a second process restart passed with exact CV/task documents, saved status, notes, manual description, closed state and SQLite integrity preserved. Results: \u003ccode>.local-data/verification/matching-upgrade.log\u003c/code>.\u003c/li>\n\u003cli>The live database was backed up before migration. All \u003cstrong>4,170 original records\u003c/strong> remain; saved fields, task documents and CV versions match the backup. Cached responses recovered \u003cstrong>four longer descriptions\u003c/strong> and corrected source-quality metadata without new provider requests or altered last-seen timestamps. Repeating recovery is safe. X remains capped at \u003cstrong>1,000 posts/month\u003c/strong> and existing source pauses remain. Web3.career is still pending. Results: \u003ccode>.local-data/verification/matching-data-audit.json\u003c/code>.\u003c/li>\n\u003cli>Current grouping identifies \u003cstrong>20 groups / 21 extra copies\u003c/strong>. It retains separate employer requisitions, differing locations/levels, truncated excerpts and organic posts. These are conservative inferred groups, not verified employer identities. Current eligibility counts are 98 incompatible, 691 needing review, and 3,381 unknown. Nothing is deleted. Results: \u003ccode>.local-data/verification/matching-collection.json\u003c/code>.\u003c/li>\n\u003cli>Desktop and 390px mobile browser checks passed: filtering and evidence, reload persistence, duplicate grouping and original links, excerpt handling, and no horizontal overflow or page errors. Screenshots: \u003ccode>.local-data/verification/matching-eligibility.png\u003c/code>, \u003ccode>matching-duplicates.png\u003c/code>, \u003ccode>matching-mobile.png\u003c/code>, \u003ccode>matching-mobile-list.png\u003c/code>; results: \u003ccode>matching-browser.json\u003c/code> in the same directory.\u003c/li>\n\u003cli>TypeScript and production build pass. The existing Vite large-bundle advisory remains. Local \u003ccode>linux/amd64\u003c/code> image \u003ccode>job-hunter:local\u003c/code> was rebuilt as \u003cstrong>f43a001a2325\u003c/strong>. Fresh-container startup, health, migration tables, seeded authorization preferences, and the cache-recovery script were verified with collection disabled. No Unraid or cloud deployment occurred.\u003c/li>\n\u003cli>See \u003ca href=\"#/features/matching\">matching rules and limits\u003c/a>. Server-side pagination/detail fetching and the complete CV browser workflow were completed in the 17 September follow-up above.\u003c/li>\n\u003c/ul>\n\u003cp>Initial checks: 15 September 2026. Source expansion checked on 16 September 2026 (Malaysia time).\u003c/p>\n\u003ch2 id=\"location-filter-16-september-2026\">Location filter — 16 September 2026\u003c/h2>\n\u003cul>\n\u003cli>Added a searchable Kumo multi-select Location filter to Jobs and Saved. Multiple locations combine with OR and other job filters with AND. Clear, reload/page-switch persistence, empty results, aliases, Worldwide and Unspecified are supported. Existing jobs work immediately without a rescan.\u003c/li>\n\u003cli>Explicit candidate-region fields are labeled Hiring locations. Original location text is preserved; long result-row values are limited to two lines with the full value in the detail pane. No city-to-country geocoding, region expansion, or work-authorization inference is performed.\u003c/li>\n\u003cli>Organic headers can contain role/salary text. Their filter values are restricted to recognized places from the structured-board inventory, with unrecognized cases placed under Unspecified. Incidental location names in descriptions are not used.\u003c/li>\n\u003cli>\u003cstrong>39 isolated tests pass\u003c/strong>. New coverage checks aliases, ambiguous abbreviations, multiple places, remote-only/unknown locations, qualified worldwide statements, OR matching, malformed persisted selections, source hiring-region labels, and organic-header noise suppression. TypeScript and the production build pass; the large-bundle advisory remains.\u003c/li>\n\u003cli>Browser verification passed: Singapore + Malaysia returned 50 current records at check time; adding a frontend text search returned 4. Worldwide returned 100. Keyboard selection, clearing, no-result searches, reload persistence, Saved navigation, dark mode, and a 390px viewport passed without JavaScript errors or horizontal page overflow. Counts are inventory snapshots, not guaranteed suitable vacancies.\u003c/li>\n\u003cli>Visually inspected screenshots: \u003ccode>.local-data/verification/location-filter-search.png\u003c/code>, \u003ccode>location-filter-worldwide.png\u003c/code>, \u003ccode>location-filter-mobile.png\u003c/code>, and \u003ccode>location-filter-dark.png\u003c/code>. Verified the two-line result-location display retains the complete text in the detail pane. All browser actions were local filtering/navigation; no jobs were saved or applications initiated.\u003c/li>\n\u003cli>Rebuilt \u003ccode>job-hunter:local\u003c/code> for linux/amd64, image \u003ccode>3e4c205774a7\u003c/code>. This is a local build, not an Unraid deployment.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"follow-up-additions-16-september-2026\">Follow-up additions — 16 September 2026\u003c/h2>\n\u003cul>\n\u003cli>Installed four more catalog entries: VueJobs RSS, Web3.career, Wellfound manual entry, and Welcome to the Jungle / Otta manual entry. The workspace now has \u003cstrong>31 configured sources\u003c/strong>, including the two manual entries. Re-running the install script added zero duplicates and preserved existing settings.\u003c/li>\n\u003cli>VueJobs live scan \u003ccode>4c869d45-ba69-4b37-bae7-96c0a6d742fa\u003c/code> completed at 05:16 UTC with \u003cstrong>one request and 923 added leads\u003c/strong>. All 923 had parsed employer and location values. This is the publisher’s RSS inventory, not 923 confirmed suitable/current vacancies. Descriptions are excerpts; saving them waits for the complete description before a CV is queued.\u003c/li>\n\u003cli>\u003cstrong>32 isolated tests pass\u003c/strong>, including Web3 response variants, exact attribution URL retention, private token persistence, bootstrap redaction, cache exclusion, redirect refusal, error redaction, Retry-After, missing/rejected-token request suppression, manual-source attribution/deduplication, and excerpt-to-full-description CV retry. Existing discovery, X and CV tests pass.\u003c/li>\n\u003cli>TypeScript and the production build pass. The existing large-bundle advisory remains.\u003c/li>\n\u003cli>Targeted browser checks passed for all four rows, Web3’s pending-token state and disabled Scan action, manual-source links and Add job dialog, hidden scan controls for manual entries, and the password input/API-token link in Settings. No JavaScript page errors. Screenshots \u003ccode>next-sources.png\u003c/code>, \u003ccode>manual-source-dialog.png\u003c/code>, and \u003ccode>web3-settings.png\u003c/code> under \u003ccode>.local-data/verification/\u003c/code> were visually inspected. The live manual-entry form was cancelled; data-entry and CV queuing were exercised only in isolated fixture tests.\u003c/li>\n\u003cli>Rebuilt the local amd64 image \u003ccode>job-hunter:local\u003c/code> (\u003ccode>13c4717c94c6\u003c/code>). A network-disabled container check verified 31 fresh catalog entries, both manual sources disabled for collection, VueJobs’ twelve-hour interval, Web3 making zero requests without a token, and both X/Web3 credentials absent from the image. Actual Unraid installation remains outstanding.\u003c/li>\n\u003cli>\u003cstrong>Web3 live authenticated collection is not yet verified.\u003c/strong> The local Settings form accepts its separate API token; this workspace currently has none. Wellfound and Welcome to the Jungle have no automated collector: they are usable through Open site and user-pasted job entry only.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"source-expansion\">Source expansion\u003c/h2>\n\u003cul>\n\u003cli>Added 21 enabled configurations, bringing the current workspace to 27 configured sources. Existing source preferences were preserved. Re-running \u003ccode>scripts/add-discovery-sources.ts\u003c/code> added zero duplicates.\u003c/li>\n\u003cli>All 21 additions completed a live scan: Himalayas, Remote OK, Remotive, 4 Day Week, three We Work Remotely category feeds, GolangProjects, LaraJobs, ClojureJobboard, HN's separate YC job feed, Arbeitnow Germany/UK visa-sponsorship feeds, Jobicy, LangChain, Cognition, Replit, Figma, Notion, Supabase, and Sourcegraph. Their first runs added 1,830 records in total. These are listings/leads, not 1,830 validated suitable or distinct real-world vacancies.\u003c/li>\n\u003cli>Twenty-five isolated tests pass. New coverage checks feed fields and missing descriptions, salary units, seconds/milliseconds dates, explicit expiry with saved history, malformed responses, bounded pagination with newest-page refresh, query checkpoint recovery, provider cooldowns, and HN YC feed attribution/deleted items. Existing X and private-CV behavior still pass.\u003c/li>\n\u003cli>TypeScript and production frontend build pass. Build reports the existing large-bundle advisory.\u003c/li>\n\u003cli>Targeted Playwright browser check passed: Sources navigation; new source visibility; Himalayas editor displays a 24-hour interval and minimum; Cancel closes the dialog; no page errors. Screenshot visually inspected at \u003ccode>.local-data/verification/source-expansion.png\u003c/code>.\u003c/li>\n\u003cli>Specialist RSS can contain excerpts or empty descriptions. These remain leads; this expansion does not fetch arbitrary linked HTML or fabricate a full job description.\u003c/li>\n\u003cli>Free APIs/feed collection required no new account, key, or purchase. Web3.career remains pending a separate token. Cross-board duplicate grouping and deeper eligibility analysis were subsequently implemented; see the matching and listing-quality section above.\u003c/li>\n\u003cli>Rebuilt the local \u003ccode>linux/amd64\u003c/code> image \u003ccode>job-hunter:local\u003c/code>. A network-disabled, isolated container check verified that a fresh database contains all 27 source configurations and all 21 additions, enforces the daily Himalayas minimum, and starts with X unconfigured/disabled. This remains a local image; it has not been installed on Unraid.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"passed\">Passed\u003c/h2>\n\u003cul>\n\u003cli>TypeScript check and production frontend build.\u003c/li>\n\u003cli>Eighteen isolated tests: source deduplication; save idempotency; saved notes and draft preservation; master revision conflicts; CV edits; missing-description retry; evidence validation; sanitized rendering; absent submission/engagement endpoints; public-address/redirect restrictions; scan caps and Retry-After; Ashby visibility; X pagination and volume reservations; X token persistence/redaction; the save-to-draft process boundary; closure/reopening with saved history preserved; bodyless dashboard POST actions; full-month X pacing and rollover; shared cap enforcement; and persisted scan scheduling with bounded multi-page X retrieval.\u003c/li>\n\u003cli>Real HN, Ashby and Greenhouse collection: 846 openings/hiring posts from the starter sources. HN reached its 30-request budget and retained progress for a subsequent scan. No claim that every HN comment has already been collected.\u003c/li>\n\u003cli>One successful real Codex inference using the requested \u003ccode>gpt-5.6-sol\u003c/code>, high reasoning, and existing ChatGPT subscription login. The draft passed career evidence validation. An earlier attempt failed the allowed-skills check; the prompt/schema now provide the exact allowed skill list. Verification did not save or apply to the posting.\u003c/li>\n\u003cli>Current master and a tailored draft exported as two-page PDFs and two-page Word documents. All pages were rendered and visually inspected. PDF follows the HTML/CSS template; Word has a separate editable layout. Employment/project blocks were kept together after detecting poor page breaks.\u003c/li>\n\u003cli>A subsequent real Cursor scan through the final HTTP transport completed in one request with no duplicate additions.\u003c/li>\n\u003cli>Authenticated X recent search succeeded using the bearer token saved through local Settings. Run \u003ccode>8fe7d1ab-c899-454d-91c0-91a069dbdb1a\u003c/code> at 13:29 UTC made one request and imported 10 posts. Collection stopped at the deliberate one-request/10-post test cap, retaining its pagination checkpoint. The test verified API access and ingestion, not the relevance of every result; the broad starter query also returned unrelated discussion and non-software roles.\u003c/li>\n\u003cli>The user selected 1,000 X posts per month, and scheduled X collection was enabled. Run \u003ccode>09169755-74f8-43e0-b3c4-b5e67eb510d2\u003c/code> at 13:36 UTC validated the revised software/product/AI/mobile query and pacing: one request read 10 posts, added 7 unique records, and persisted the remaining pagination and next scan time. Total recorded usage was 20/1,000, including the initial test. Tests simulated a complete high-volume month to verify pacing, minimum batch sizes, cap exhaustion, and the next month's allowance.\u003c/li>\n\u003cli>npm audit after dependency installation: zero reported vulnerabilities.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"container\">Container\u003c/h2>\n\u003cp>The \u003ccode>linux/amd64\u003c/code> image was built and tested locally under OrbStack, using a native Docker volume. Checks passed for API/worker health, static frontend delivery, the included Codex CLI version, PDF export, saved notes/jobs/queued tasks/profile revision after restart, online SQLite backup, and UID/GID 99:100 ownership. Scheduled collection was disabled for these fixture checks. A Mac bind mount was also exercised for export and restart; its ownership reporting is virtualized by OrbStack, so the definitive ownership assertion used the native Docker volume. This is not an actual Unraid server deployment.\u003c/p>\n\u003cp>After the X pacing changes, \u003ccode>job-hunter:local\u003c/code> was rebuilt successfully, including the TypeScript/production build. An isolated check inside the refreshed image verified the paced allowance, the revised starter query and one-request limit, and disabled X collection on a fresh installation. The local running app retained its configured token, approved 1,000-post cap, enabled schedule, 20 recorded reads, and next scan time across development restarts.\u003c/p>\n\u003ch2 id=\"requires-external-configuration-or-explicit-testing\">Requires external configuration or explicit testing\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>X coverage:\u003c/strong> collection and the revised query are live-verified. At the selected budget, high-volume searches may remain incomplete; small batches retain pagination but cannot guarantee exhaustive coverage within X's recent-search window. Settings accepts a token locally; the API returns configured/unconfigured status, never the token.\u003c/li>\n\u003cli>\u003cstrong>Unraid installation:\u003c/strong> no connection to the user's Unraid server has been supplied. The local image and XML are intended for manual transfer/installation.\u003c/li>\n\u003cli>\u003cstrong>Browser interaction QA:\u003c/strong> targeted Sources checks and the complete job/CV workflow checks recorded above passed. These cover the listed failure and responsive cases, not every browser or assistive-technology combination.\u003c/li>\n\u003cli>\u003cstrong>WebMCP:\u003c/strong> an optional imperative surface exposes listing jobs, saving selected jobs, and reading CVs through existing application APIs. No supported browser validation context was available. Registration and live tool invocation are not claimed as verified.\u003c/li>\n\u003c/ul>\n\u003cp>Verification documents and logs are private development intermediates under \u003ccode>.local-data/verification\u003c/code> and \u003ccode>.local-data/*.log\u003c/code>; they are not job applications or published files.\u003c/p>\n\u003ch2 id=\"optional-jev-assessment-22-september-2026\">Optional Jev assessment (22 September 2026)\u003c/h2>\n\u003cp>Added isolated fixture tests covering opt-in behavior, server-only keys, payload projection, strict typed-response validation, persistent cache and request reservations, stale/in-flight invalidation, filter integration, rate limits, authentication/schema failures, and conservative eligibility. The complete 137-test suite, TypeScript check and production build passed. The build retains the existing large-bundle advisory. See \u003ccode>docs/JEV.md\u003c/code> for behavior and \u003ccode>scripts/verify-jev-ui.ts\u003c/code> for isolated browser verification. The isolated desktop/mobile browser workflow passed, including settings, queuing, evidence display and key removal. No real TypeSafe request or user credential was used; provider authentication and real assessment quality remain unverified.\u003c/p>\n","backlinks":["index","decisions/dashboard-ui","decisions/index","discussions/open-questions","features/assistant","features/cover-letters","features/discovery","features/jev","features/job-inbox","features/master-cv","features/matching","features/profile","guides/documentation","guides/unraid","journal/2026-09-16-source-evaluation","journal/2026-10-07-jstack-migration","reference/architecture","reference/limitations","verification/index","verification/setup"]},{"id":"verification/index","title":"Verification","section":"Verification","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-10-07\u003c/span>","updated":"2026-10-07","summary":"","source":"---\ntitle: Verification\nsection: Verification\nupdated: 2026-10-07\n---\n# Verification\n\nUse [shared setup](setup.md) before running selected checks. [Feature records](../features/index.md) state expected outcomes and recipes; a pass applies only to its recorded build and scope.\n\n## Runs\n\n[Desktop portability follow-up — 7 October 2026](runs/2026-10-07T114528Z-desktop-portable.md) verifies the corrected app bundle and final installed startup.\n\n[Native desktop — 7 October 2026](runs/2026-10-07T113853Z-desktop.md) covers packaging, lifecycle, native controls, migration and installed startup.\n\n[X scanning status — 7 October 2026](runs/2026-10-07T073652Z-x-status.md) records recent successful retrieval and the stopped local runtime.\n\n[Wiki migration — 7 October 2026](runs/2026-10-07T042714Z-wiki-migration.md) covers the documentation migration and offline reader only.\n\n## Historical evidence\n\n[Verification history](history.md) preserves the earlier implementation notes and artifact paths. It includes browser, fixture, inference, compiler and local-container checks, with their stated limits. Historical logs remain private under `.local-data/`; missing build fingerprints have not been invented.\n\n[Limitations and pending verification](../reference/limitations.md) distinguishes implemented behavior from unverified integration/deployment paths.\n","toc":[{"id":"runs","title":"Runs","depth":2},{"id":"historical-evidence","title":"Historical evidence","depth":2}],"titleAnchor":"verification","links":["verification/setup","features/index","verification/runs/2026-10-07T114528Z-desktop-portable","verification/runs/2026-10-07T113853Z-desktop","verification/runs/2026-10-07T073652Z-x-status","verification/runs/2026-10-07T042714Z-wiki-migration","verification/history","reference/limitations"],"attachments":[],"html":"\u003cp>Use \u003ca href=\"#/verification/setup\">shared setup\u003c/a> before running selected checks. \u003ca href=\"#/features/index\">Feature records\u003c/a> state expected outcomes and recipes; a pass applies only to its recorded build and scope.\u003c/p>\n\u003ch2 id=\"runs\">Runs\u003c/h2>\n\u003cp>\u003ca href=\"#/verification/runs/2026-10-07T114528Z-desktop-portable\">Desktop portability follow-up — 7 October 2026\u003c/a> verifies the corrected app bundle and final installed startup.\u003c/p>\n\u003cp>\u003ca href=\"#/verification/runs/2026-10-07T113853Z-desktop\">Native desktop — 7 October 2026\u003c/a> covers packaging, lifecycle, native controls, migration and installed startup.\u003c/p>\n\u003cp>\u003ca href=\"#/verification/runs/2026-10-07T073652Z-x-status\">X scanning status — 7 October 2026\u003c/a> records recent successful retrieval and the stopped local runtime.\u003c/p>\n\u003cp>\u003ca href=\"#/verification/runs/2026-10-07T042714Z-wiki-migration\">Wiki migration — 7 October 2026\u003c/a> covers the documentation migration and offline reader only.\u003c/p>\n\u003ch2 id=\"historical-evidence\">Historical evidence\u003c/h2>\n\u003cp>\u003ca href=\"#/verification/history\">Verification history\u003c/a> preserves the earlier implementation notes and artifact paths. It includes browser, fixture, inference, compiler and local-container checks, with their stated limits. Historical logs remain private under \u003ccode>.local-data/\u003c/code>; missing build fingerprints have not been invented.\u003c/p>\n\u003cp>\u003ca href=\"#/reference/limitations\">Limitations and pending verification\u003c/a> distinguishes implemented behavior from unverified integration/deployment paths.\u003c/p>\n","backlinks":["index","features/assistant","features/cover-letters","features/discovery","features/jev","features/job-inbox","features/master-cv","features/matching","features/profile","journal/2026-10-07-desktop","journal/2026-10-07-jstack-migration","reference/limitations"]},{"id":"verification/setup","title":"Verification setup","section":"Verification","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-10-07\u003c/span>","updated":"2026-10-07","summary":"","source":"---\ntitle: Verification setup\nsection: Verification\nupdated: 2026-10-07\n---\n# Verification setup\n\nRun commands from the repository root. Product verification should exercise only the selected scenarios and record their exact build; documentation validation alone does not certify the app.\n\n## Environment and readiness\n\nUse Node 22.19+, installed project dependencies, and Playwright Chromium; see [local development](../guides/local-development.md). `npm run build` prepares the static UI required by isolated browser drivers. LaTeX scenarios need a prepared Tectonic/package cache; `npm run setup:latex` may download generic compiler packages.\n\nThe existing dev UI defaults to `http://127.0.0.1:5173`; this workspace uses API port 4317, while a fresh installation defaults to 3000. `GET /api/health` succeeds only with a recent worker heartbeat. Check the configured port without disclosing `.env` contents. Do not start another API/worker against the user's live database. `npm run dev` starts the configured scheduler and can perform real collection.\n\nFor build identity, record `git rev-parse HEAD`, whether the tree is dirty, and a SHA-256 content manifest or patch fingerprint including relevant untracked files. A revision alone does not identify a dirty tree. Exclude `.env`, appdata, credentials and candidate evidence from public manifests and logs.\n\n## Isolation, effects and cleanup\n\n`npm test` uses temporary databases, fictional profile fixtures and mocked provider/runtime responses. Most browser drivers start an isolated server on an ephemeral loopback port; inspect the selected script before execution. `verify-dashboard.ts` and `verify-matching-ui.ts` use the live app, intercept Seen writes, and depend on existing listings. They are not fixture-independent guarantees. Never use candidate data to create public evidence.\n\nReal generation drivers consume subscription allowance. Live scans consume provider/request budgets. Those checks are distinct from offline fixture tests and should be selected deliberately. Do not enable new sources or change the live profile for a documentation check.\n\nExisting drivers store artifacts under `.local-data/verification/`. Keep raw/private artifacts there. Copy only reviewed, sanitized or synthetic evidence into `docs/wiki/evidence/\u003crun-id>/`. Preserve run evidence; remove only temporary databases, browser contexts, processes and containers created by the check. Most isolated drivers use `finally` cleanup; inspect leftovers after failures.\n\n## Existing checks and tools\n\n\n```sh\nnpm run check\nnpm test\nnpm run build\n```\n\n`npx tsx scripts/verify-assistant-ui.ts` checks the overlay, onboarding, jobs, document edits, preview refresh, unsaved text and desktop/mobile behavior with isolated synthetic data and simulated inference; PDF compilation is real. The old `verify-profile-ui.ts` command delegates to this workflow. `npx tsx scripts/verify-assistant-runtime.ts` performs an opt-in real Codex profile/LaTeX edit and PDF compilation with synthetic facts; it consumes subscription allowance. `verify-profile-runtime.ts` retains the earlier profile-only runtime check.\n\nTests use an isolated temporary database and mock source responses/Codex process output. `scripts/verify-generation.ts` performs a real subscription inference against an already-collected Linear posting without saving it to your job list. It consumes subscription allowance. `scripts/verify-exports.ts` retains checks for master and legacy resume exports. `scripts/verify-container.ts` exercises the amd64 image, PDF export, volume ownership, backup, and restart persistence with an isolated Docker volume, fixture data, and scheduling disabled.\n\n`npx tsx scripts/verify-dashboard.ts` checks pagination, filtering, polling, retry behavior, unsaved notes and mobile layout against the local running app without saving jobs. `npx tsx scripts/verify-cv-workflow.ts` now runs the cover-letter save/edit/restore/download browser flow in an isolated temporary app with simulated generation. Add `--real-generation` to use the configured Codex subscription; this consumes allowance. Both modes passed, including one real generation, controlled failure/retry checks, and rendered PDF/Word inspection. See [verification](history.md) for scope and artifacts. The optional WebMCP surface has not been validated in a supported browser context.\n\n\n\n## Wiki checks\n\nNo extra package installation or server is needed:\n\n```sh\nnode docs/wiki/_build.mjs\nnode docs/wiki/_build.mjs --check\nnode ../jstack/skills/verify-change/scripts/check-reports.mjs docs/wiki\n```\n\nOpen `docs/wiki/index.html` locally. Verify navigation, search, source view and a narrow viewport with no network dependency when the reader changes. Use the existing Playwright installation or an available browser. The report metadata checker lives in the sibling jstack checkout; the reader builder is vendored and works without it. See [documentation maintenance](../guides/documentation.md).\n","toc":[{"id":"environment-and-readiness","title":"Environment and readiness","depth":2},{"id":"isolation-effects-and-cleanup","title":"Isolation, effects and cleanup","depth":2},{"id":"existing-checks-and-tools","title":"Existing checks and tools","depth":2},{"id":"wiki-checks","title":"Wiki checks","depth":2}],"titleAnchor":"verification-setup","links":["guides/local-development","verification/history","guides/documentation"],"attachments":[],"html":"\u003cp>Run commands from the repository root. Product verification should exercise only the selected scenarios and record their exact build; documentation validation alone does not certify the app.\u003c/p>\n\u003ch2 id=\"environment-and-readiness\">Environment and readiness\u003c/h2>\n\u003cp>Use Node 22.19+, installed project dependencies, and Playwright Chromium; see \u003ca href=\"#/guides/local-development\">local development\u003c/a>. \u003ccode>npm run build\u003c/code> prepares the static UI required by isolated browser drivers. LaTeX scenarios need a prepared Tectonic/package cache; \u003ccode>npm run setup:latex\u003c/code> may download generic compiler packages.\u003c/p>\n\u003cp>The existing dev UI defaults to \u003ccode>http://127.0.0.1:5173\u003c/code>; this workspace uses API port 4317, while a fresh installation defaults to 3000. \u003ccode>GET /api/health\u003c/code> succeeds only with a recent worker heartbeat. Check the configured port without disclosing \u003ccode>.env\u003c/code> contents. Do not start another API/worker against the user's live database. \u003ccode>npm run dev\u003c/code> starts the configured scheduler and can perform real collection.\u003c/p>\n\u003cp>For build identity, record \u003ccode>git rev-parse HEAD\u003c/code>, whether the tree is dirty, and a SHA-256 content manifest or patch fingerprint including relevant untracked files. A revision alone does not identify a dirty tree. Exclude \u003ccode>.env\u003c/code>, appdata, credentials and candidate evidence from public manifests and logs.\u003c/p>\n\u003ch2 id=\"isolation-effects-and-cleanup\">Isolation, effects and cleanup\u003c/h2>\n\u003cp>\u003ccode>npm test\u003c/code> uses temporary databases, fictional profile fixtures and mocked provider/runtime responses. Most browser drivers start an isolated server on an ephemeral loopback port; inspect the selected script before execution. \u003ccode>verify-dashboard.ts\u003c/code> and \u003ccode>verify-matching-ui.ts\u003c/code> use the live app, intercept Seen writes, and depend on existing listings. They are not fixture-independent guarantees. Never use candidate data to create public evidence.\u003c/p>\n\u003cp>Real generation drivers consume subscription allowance. Live scans consume provider/request budgets. Those checks are distinct from offline fixture tests and should be selected deliberately. Do not enable new sources or change the live profile for a documentation check.\u003c/p>\n\u003cp>Existing drivers store artifacts under \u003ccode>.local-data/verification/\u003c/code>. Keep raw/private artifacts there. Copy only reviewed, sanitized or synthetic evidence into \u003ccode>docs/wiki/evidence/&lt;run-id&gt;/\u003c/code>. Preserve run evidence; remove only temporary databases, browser contexts, processes and containers created by the check. Most isolated drivers use \u003ccode>finally\u003c/code> cleanup; inspect leftovers after failures.\u003c/p>\n\u003ch2 id=\"existing-checks-and-tools\">Existing checks and tools\u003c/h2>\n\u003cpre>\u003ccode class=\"language-sh\">npm run check\nnpm test\nnpm run build\n\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>npx tsx scripts/verify-assistant-ui.ts\u003c/code> checks the overlay, onboarding, jobs, document edits, preview refresh, unsaved text and desktop/mobile behavior with isolated synthetic data and simulated inference; PDF compilation is real. The old \u003ccode>verify-profile-ui.ts\u003c/code> command delegates to this workflow. \u003ccode>npx tsx scripts/verify-assistant-runtime.ts\u003c/code> performs an opt-in real Codex profile/LaTeX edit and PDF compilation with synthetic facts; it consumes subscription allowance. \u003ccode>verify-profile-runtime.ts\u003c/code> retains the earlier profile-only runtime check.\u003c/p>\n\u003cp>Tests use an isolated temporary database and mock source responses/Codex process output. \u003ccode>scripts/verify-generation.ts\u003c/code> performs a real subscription inference against an already-collected Linear posting without saving it to your job list. It consumes subscription allowance. \u003ccode>scripts/verify-exports.ts\u003c/code> retains checks for master and legacy resume exports. \u003ccode>scripts/verify-container.ts\u003c/code> exercises the amd64 image, PDF export, volume ownership, backup, and restart persistence with an isolated Docker volume, fixture data, and scheduling disabled.\u003c/p>\n\u003cp>\u003ccode>npx tsx scripts/verify-dashboard.ts\u003c/code> checks pagination, filtering, polling, retry behavior, unsaved notes and mobile layout against the local running app without saving jobs. \u003ccode>npx tsx scripts/verify-cv-workflow.ts\u003c/code> now runs the cover-letter save/edit/restore/download browser flow in an isolated temporary app with simulated generation. Add \u003ccode>--real-generation\u003c/code> to use the configured Codex subscription; this consumes allowance. Both modes passed, including one real generation, controlled failure/retry checks, and rendered PDF/Word inspection. See \u003ca href=\"#/verification/history\">verification\u003c/a> for scope and artifacts. The optional WebMCP surface has not been validated in a supported browser context.\u003c/p>\n\u003ch2 id=\"wiki-checks\">Wiki checks\u003c/h2>\n\u003cp>No extra package installation or server is needed:\u003c/p>\n\u003cpre>\u003ccode class=\"language-sh\">node docs/wiki/_build.mjs\nnode docs/wiki/_build.mjs --check\nnode ../jstack/skills/verify-change/scripts/check-reports.mjs docs/wiki\n\u003c/code>\u003c/pre>\n\u003cp>Open \u003ccode>docs/wiki/index.html\u003c/code> locally. Verify navigation, search, source view and a narrow viewport with no network dependency when the reader changes. Use the existing Playwright installation or an available browser. The report metadata checker lives in the sibling jstack checkout; the reader builder is vendored and works without it. See \u003ca href=\"#/guides/documentation\">documentation maintenance\u003c/a>.\u003c/p>\n","backlinks":["index","features/assistant","features/cover-letters","features/desktop","features/discovery","features/documentation","features/index","features/jev","features/job-inbox","features/master-cv","features/matching","features/profile","guides/local-development","journal/2026-10-07-jstack-migration","verification/index"]},{"id":"verification/runs/2026-10-07T042714Z-wiki-migration","title":"Wiki migration verification — 7 October 2026","section":"Verification runs","order":0,"metadata":{"result":"Passed"},"metadataHtml":"\u003cspan>Result: Passed\u003c/span> \u003cspan>Last updated: 2026-10-07\u003c/span>","updated":"2026-10-07","summary":"","source":"---\ntitle: Wiki migration verification — 7 October 2026\nsection: Verification runs\nupdated: 2026-10-07\nresult: Passed\n---\n# Wiki migration verification — 7 October 2026\n\n## Scope\n\n[FEAT-documentation](../../features/documentation.md): adoption of the local jstack skills, migration of existing public project guides, and the generated offline reader. Selected scenarios cover document/link integrity, historical content retention, runtime/private-file exclusions, desktop navigation/search/source/download, mobile layout and offline operation. Product behavior is outside this run.\n\n## Build and environment\n\n- Repository revision: `0f061483881ac7faa17ad9ca3d86d1b905d77e22`, dirty working tree including pre-existing automatic LaTeX setup work and this documentation migration.\n- Platform: macOS arm64; Node `v22.19.0`; existing project Playwright Chromium.\n- Reader asset: jstack revision `4a3109a2e4fd3be9836b7a14a2bf76ce14ce567d`, copied unchanged with bundled licenses.\n- Instance: local `docs/wiki/index.html` opened through `file:` in an isolated browser context. No app API, account, model, source scan or network service is needed.\n- [Build identity and SHA-256 source manifest](../../evidence/2026-10-07T042714Z-wiki-migration/build-identity.json) identify the tested documentation. The fingerprint excludes its own evidence and run report and the generated HTML to avoid circular hashes; it includes all other wiki Markdown, the builder and the repository documentation entry points.\n\n## Results\n\n| Scenario | Expected | Observed | Result |\n| --- | --- | --- | --- |\n| Wiki build and current snapshot check | Valid metadata, internal links and current HTML | Build and `--check` passed for all 30 pages | Passed |\n| Migration audit | All project documents mapped, historical content retained, special files excluded | 11 checks passed; see [document audit](../../evidence/2026-10-07T042714Z-wiki-migration/document-audit.json) | Passed |\n| Desktop reader | Navigation, search, source and Markdown download work | All 30 routes rendered; links/search/source worked and downloaded Markdown exactly matched its source; [reader results](../../evidence/2026-10-07T042714Z-wiki-migration/reader-check.json) | Passed |\n| Mobile reader | Usable navigation and no document overflow | At 390px, navigation toggled and closed after selection; no horizontal document overflow on any page; [reader results](../../evidence/2026-10-07T042714Z-wiki-migration/reader-check.json) | Passed |\n| Offline and errors | No external requests or JavaScript errors | Offline context, zero external requests and zero page errors; [reader results](../../evidence/2026-10-07T042714Z-wiki-migration/reader-check.json) | Passed |\n| Report format | Valid outcome metadata | jstack report checker found one report and zero errors | Passed |\n\n## Evidence\n\n[Desktop screenshot](../../evidence/2026-10-07T042714Z-wiki-migration/desktop.png) and [mobile screenshot](../../evidence/2026-10-07T042714Z-wiki-migration/mobile.png) were visually inspected. Both showed readable content and intact navigation without clipped controls. The screenshots contain only public project documentation. The check drivers remain private development intermediates under `.local-data/wiki-migration/`; product test drivers were unchanged.\n\n## Limits and follow-up\n\nThis verifies documentation integrity and selected reader interactions. It does not revalidate the product, external references, current provider access, real inference, or Unraid deployment. Feature recipes were mapped from source and historical notes; they were not rerun during migration. Earlier raw logs and candidate records remain private outside this wiki. The browser context is closed after checks; evidence is retained.\n","toc":[{"id":"scope","title":"Scope","depth":2},{"id":"build-and-environment","title":"Build and environment","depth":2},{"id":"results","title":"Results","depth":2},{"id":"evidence","title":"Evidence","depth":2},{"id":"limits-and-follow-up","title":"Limits and follow-up","depth":2}],"titleAnchor":"wiki-migration-verification-7-october-2026","links":["features/documentation"],"attachments":[{"path":"evidence/2026-10-07T042714Z-wiki-migration/build-identity.json","sha256":"059cc0d10787c02cd678b3cfa10d3f26c592aa7c05826b49b27198b47f920f59"},{"path":"evidence/2026-10-07T042714Z-wiki-migration/document-audit.json","sha2 ollection requires the app/worker to run. Persisted next run is 2026-10-08 17:08 UTC (9 October 01:08 Malaysia). Source policy retains progress after a budget-limited partial result. Coverage and relevance of all imported posts were not assessed. The check created only this report and sanitized evidence; it started no processes requiring cleanup.\u003c/p>\n","backlinks":["features/discovery","verification/index"]},{"id":"verification/runs/2026-10-07T113853Z-desktop","title":"Native desktop verification — 7 October 2026","section":"Verification runs","order":0,"metadata":{"result":"Failed"},"metadataHtml":"\u003cspan>Result: Failed\u003c/span> \u003cspan>Last updated: 2026-10-07\u003c/span>","updated":"2026-10-07","summary":"","source":"---\ntitle: Native desktop verification — 7 October 2026\nsection: Verification runs\nupdated: 2026-10-07\nresult: Failed\n---\n# Native desktop verification — 7 October 2026\n\n## Scope\n\n[FEAT-desktop](../../features/desktop.md): native Go/WKWebView packaging, owned services, keep-running window close, explicit Quit and preserved appdata. Selected scenarios cover build/tests, isolated migration/lifecycle, native document controls/downloads and installed startup. Individual providers and real model generation are outside the selected verification scope.\n\n## Build and environment\n\n- Revision `0f061483881ac7faa17ad9ca3d86d1b905d77e22`, dirty tree including earlier LaTeX/wiki work and this desktop change.\n- [Source and installed bundle fingerprints](../../evidence/2026-10-07T113853Z-desktop/build-identity.json). macOS 27, Apple silicon; Node v22.19.0; go version go1.26.4 darwin/arm64. Final installed executables equal the built package. Build manifest input hashes precede codesigning; separate final signed hashes identify the installed binaries.\n- Native UI interactions used a synthetic isolated database with scans/inference disabled. They exercised the first build's UI. The final build retains the wrapper code and moves the existing worker into its separate Node process; the packaged lifecycle checks were rerun after that service change.\n- The final installed app was opened through the native interface after the data audit. Its existing job inbox was observed loaded. No personal-data screenshots are attached; raw/private artifacts stay under `.local-data/verification/`.\n\n## Results\n\n| Scenario | Expected | Observed | Result |\n| --- | --- | --- | --- |\n| Build/tests | Build/type checking and regression tests pass | Production build passed; 174 app tests passed, no skips; Go supervisor tests passed with race detection | Passed |\n| Packaged lifecycle | Minimal PATH startup, single instance, Quit/force-quit cleanup and durable relaunch | [Final lifecycle driver](../../evidence/2026-10-07T113853Z-desktop/desktop-lifecycle.json) passed startup, duplicate launch, process-group cleanup, stable origin, crash recovery, retained counter and SQLite integrity | Passed |\n| Migration safeguards | Snapshot WAL safely and refuse active/overwriting imports | Three isolated tests passed WAL copy, source retention, destination preservation and active-instance checks | Passed |\n| Existing user data | Preserve records and credentials | [Import audit](../../evidence/2026-10-07T113853Z-desktop/desktop-data-audit.json): every row across 22 tables matched before startup; integrity OK, transient leases excluded; original database retained and local credential files identical | Passed |\n| Native CV workflow | Save, compile, preview, download and cancel dirty Quit | Valid synthetic source saved as version 2, selectable one-page PDF compiled, native Save dialog downloaded 4,568-byte PDF; Cancel retained unsaved edits. [Synthetic screenshot](../../evidence/2026-10-07T113853Z-desktop/native-cv.png), [checks](../../evidence/2026-10-07T113853Z-desktop/checks.json) | Passed |\n| Export runtimes | Bundled HTML PDF/Word exporters operate | Synthetic HTML CV exported via the packaged API: PDF 100,148 bytes, DOCX 9,222 bytes | Passed |\n| Window/quit behavior | Hidden window leaves services running; reopen restores it; Quit stops them | Command-W hid the window, health stayed 200 with a fresh heartbeat; reopen restored the document; Command-Q closed services and removed instance state | Passed |\n| Installed startup | User can open the app with preserved configuration | Job inbox loaded, API/worker healthy, Codex ready with gpt-5.6-sol/high, schedules enabled, X configured with 30/1,000 usage at inspection | Passed |\n| Package isolation/signature | Exclude private evidence/credentials and validate local signature | Forbidden private database/credential filenames absent; built/installed executable checksums match; ad-hoc deep strict codesign verification passed | Passed |\n\n## Limits and follow-up\n\nThe first generated synthetic source exposed an existing empty-education LaTeX list error. Only that fixture was replaced with a valid minimal document to verify packaged editing/compilation. No user CV source was modified. These checks do not certify every profile/document shape.\n\nThis is a locally ad-hoc-signed Apple silicon package, not a notarized public release. Other macOS versions, Intel/Windows/Linux, login startup, wake-from-sleep scheduling and live provider/model calls were not selected. Native external-link routing was inspected in source, not driven to a live employer site. The installed app resumes its existing configured scheduler; no provider configuration was changed.\n\nTemporary lifecycle processes/databases were removed; the installed user app is intentionally left running. Changes remain uncommitted alongside the earlier working tree.\n\n## Follow-up portability audit — 7 October 2026\n\nAfter the initially passing checks, a broader installed-bundle audit found 18 npm command symlinks pointing into the build directory. The exercised API/document paths worked, but this violated the intended independent bundle. This report is therefore revised to **Failed** transparently. The copy operations now preserve relative symlinks and the builder/installer validate all links. The subsequent run records the corrected package and rerun results; the earlier evidence above is retained.\n","toc":[{"id":"scope","title":"Scope","depth":2},{"id":"build-and-environment","title":"Build and environment","depth":2},{"id":"results","title":"Results","depth":2},{"id":"limits-and-follow-up","title":"Limits and follow-up","depth":2},{"id":"follow-up-portability-audit-7-october-2026","title":"Follow-up portability audit — 7 October 2026","depth":2}],"titleAnchor":"native-desktop-verification-7-october-2026","links":["features/desktop"],"attachments":[{"path":"evidence/2026-10-07T113853Z-desktop/build-identity.json","sha256":"dbc64921612a3daad0c9d435eb8d741dcea253dd28a3da47860e8ef12788e3c7"},{"path":"evidence/2026-10-07T113853Z-desktop/desktop-lifecycle.json","sha256":"93e1c70741ec18f45611b0fc5fa724514336adce4b5fbb57216239fb5b53dec2"},{"path":"evidence/2026-10-07T113853Z-desktop/desktop-data-audit.json","sha256":"57cc9ee5d41a2eda5d49bc8c7a39b8d5641510b5bbb150374cf9e0edd52147cc"},{"path":"evidence/2026-10-07T113853Z-desktop/native-cv.png","sha256":"9cb4220e5a3b7472fa4cd58f7d4a7fa717d3b04232950c66c78facc3b28efd23"},{"path":"evidence/2026-10-07T113853Z-desktop/checks.json","sha256":"e4f5b77e827da1764592c193d483f8296e3fcc62bb77e359d6b4c8faf0147882"}],"html":"\u003ch2 id=\"scope\">Scope\u003c/h2>\n\u003cp>\u003ca href=\"#/features/desktop\">FEAT-desktop\u003c/a>: native Go/WKWebView packaging, owned services, keep-running window close, explicit Quit and preserved appdata. Selected scenarios cover build/tests, isolated migration/lifecycle, native document controls/downloads and installed startup. Individual providers and real model generation are outside the selected verification scope.\u003c/p>\n\u003ch2 id=\"build-and-environment\">Build and environment\u003c/h2>\n\u003cul>\n\u003cli>Revision \u003ccode>0f061483881ac7faa17ad9ca3d86d1b905d77e22\u003c/c e-signing checksum is unchanged from the native UI check. Final installed executables match the built package.\n\n## Results\n\n| Scenario | Expected | Observed | Result |\n| --- | --- | --- | --- |\n| Portable copy | All links remain inside the app; invalid links fail | Relative symlinks preserved; regression test rejects an external link; all 18 installed links resolve internally, none broken. [Audit](../../evidence/2026-10-07T114528Z-desktop-portable/portability.json) | Passed |\n| Build/tests | TypeScript/production build and tests pass | Rebuild passed; 175 tests passed, no failures/skips; existing chunk-size advisory remains | Passed |\n| Packaged lifecycle | Minimal PATH startup, single instance, normal/forced Quit and durable restart | Final [lifecycle rerun](../../evidence/2026-10-07T114528Z-desktop-portable/desktop-lifecycle.json) passed every selected scenario | Passed |\n| Installation update | Existing desktop data remains canonical | Installer reused the Application Support database without replacing it; original 22-table import audit retained in the prior run | Passed |\n| Signature/identity | Installed artifact matches build | Deep strict ad-hoc signature verification and signed executable comparisons passed | Passed |\n| Final native startup | User can open the app with healthy services | Native Jobs screen loaded; [status](../../evidence/2026-10-07T114528Z-desktop-portable/desktop-installed-final.json) shows API 200, fresh worker heartbeat, Codex gpt-5.6-sol/high ready, schedules enabled and X at 30/1,000 usage | Passed |\n\n## Limits and follow-up\n\nNative edit/download/close/reopen interactions and original migration checks remain in the prior report, not presented as newly exercised here. The wrapper input is unchanged by checksum. Real model generation and explicit live-provider checks were not selected; existing configured schedules resume on launch.\n\nThe app is installed under the user's Applications directory and intentionally left running. Original private appdata remains intact. Local ad-hoc signing, other-platform/OS limits and the existing synthetic empty-education LaTeX issue remain as recorded previously. No Unraid/cloud deployment occurred.\n","toc":[{"id":"scope","title":"Scope","depth":2},{"id":"build-and-environment","title":"Build and environment","depth":2},{"id":"results","title":"Results","depth":2},{"id":"limits-and-follow-up","title":"Limits and follow-up","depth":2}],"titleAnchor":"desktop-portability-follow-up-7-october-2026","links":["features/desktop","verification/runs/2026-10-07T113853Z-desktop"],"attachments":[{"path":"evidence/2026-10-07T114528Z-desktop-portable/build-identity.json","sha256":"80e14991dc185a9c08ae3f6b55dde88142067d1b566a40782a01d7716338ee7b"},{"path":"evidence/2026-10-07T114528Z-desktop-portable/portability.json","sha256":"d6be6e97a53d4604b00301a0180740c11623cb950c535199892cfc6d162556fd"},{"path":"evidence/2026-10-07T114528Z-desktop-portable/desktop-lifecycle.json","sha256":"cf1d9193ede71c7fb157a0dd8138d7376095c2c8dec41e3fbbefba37af2930ab"},{"path":"evidence/2026-10-07T114528Z-desktop-portable/desktop-installed-final.json","sha256":"99136539e2cfff4849276d210de7852ab74f7ec621122ccf2d86ebee13c7b119"}],"html":"\u003ch2 id=\"scope\">Scope\u003c/h2>\n\u003cp>\u003ca href=\"#/features/desktop\">FEAT-desktop\u003c/a>: correct external npm symlinks found after the \u003ca href=\"#/verification/runs/2026-10-07T113853Z-desktop\">initial checks\u003c/a>, rebuild/reinstall and rerun the packaged lifecycle. The previous report retains that failure and earlier native UI/import evidence.\u003c/p>\n\u003ch2 id=\"build-and-environment\">Build and environment\u003c/h2>\n\u003cp>Revision \u003ccode>0f061483881ac7faa17ad9ca3d86d1b905d77e22\u003c/code>, dirty tree; macOS 27 arm64, Node v22.19.0, Go 1.26.4. \u003ca href=\"evidence/2026-10-07T114528Z-desktop-portable/build-identity.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 80e14991dc185a9c08ae3f6b55dde88142067d1b5 >\n\u003ctr>\n\u003ctd>Signature/identity\u003c/td>\n\u003ctd>Installed artifact matches build\u003c/td>\n\u003ctd>Deep strict ad-hoc signature verification and signed executable comparisons passed\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Final native startup\u003c/td>\n\u003ctd>User can open the app with healthy services\u003c/td>\n\u003ctd>Native Jobs screen loaded; \u003ca href=\"evidence/2026-10-07T114528Z-desktop-portable/desktop-installed-final.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 99136539e2cfff4849276d210de7852ab74f7ec621122ccf2d86ebee13c7b119\">status\u003c/a> shows API 200, fresh worker heartbeat, Codex gpt-5.6-sol/high ready, schedules enabled and X at 30/1,000 usage\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"limits-and-follow-up\">Limits and follow-up\u003c/h2>\n\u003cp>Native edit/download/close/reopen interactions and original migration checks remain in the prior report, not presented as newly exercised here. The wrapper input is unchanged by checksum. Real model generation and explicit live-provider checks were not selected; existing configured schedules resume on launch.\u003c/p>\n\u003cp>The app is installed under the user's Applications directory and intentionally left running. Original private appdata remains intact. Local ad-hoc signing, other-platform/OS limits and the existing synthetic empty-education LaTeX issue remain as recorded previously. No Unraid/cloud deployment occurred.\u003c/p>\n","backlinks":["features/desktop","verification/index"]}],"sections":["Overview","Decisions","Discussions","Features","Guides","Journal","Reference","Verification","Verification runs"]}</script>
<script>(() => {
  'use strict';
  const {title:wikiTitle,pages,sections} = JSON.parse(document.getElementById('wiki-data').textContent);
  const byId = new Map(pages.map(p=>[p.id,p]));
  const $ = id => document.getElementById(id);
  const colorScheme = matchMedia('(prefers-color-scheme: dark)');
  const colorInputs = document.querySelectorAll('input[name="color"]');
  function setColor(preference) {
    if (!['automatic', 'light', 'dark'].includes(preference)) preference = 'automatic';
    document.documentElement.dataset.colorPreference = preference;
    document.documentElement.dataset.theme = preference === 'automatic' ? (colorScheme.matches ? 'dark' : 'light') : preference;
    colorInputs.forEach(input => { input.checked = input.value === preference; });
  }
  setColor(document.documentElement.dataset.colorPreference);
  colorInputs.forEach(input => input.addEventListener('change', () => {
    setColor(input.value);
    try { localStorage.setItem('planning-wiki-color', input.value); } catch {}
  }));
  colorScheme.addEventListener('change', () => setColor(document.documentElement.dataset.colorPreference));
  window.addEventListener('storage', event => {
    if (event.key === 'planning-wiki-color' || event.key === null) setColor(event.newValue);
  });
  document.addEventListener('click', event => {
    if (!$('appearance').contains(event.target)) $('appearance').open = false;
  });
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && $('appearance').open) {
      $('appearance').open = false;
      $('appearance').querySelector('summary').focus();
    }
  });
  let current = null;
  const link = (label,href) => { const a=document.createElement('a'); a.textContent=label; a.href=href; return a; };
  const route = id => '#/'+id.split('/').map(s=>encodeURIComponent(s).replace(/~/g,'%7E')).join('/');
  for (const section of sections) {
    const group=document.createElement('div');group.className='nav-group';
    const label=document.createElement('div');label.className='nav-group-label';label.textContent=section;group.append(label);
    pages.filter(p=>p.section===section).forEach(p=>{const a=link(p.id==='index'?'Main page':p.title,route(p.id));a.dataset.page=p.id;group.append(a);});
    $('navigation').append(group);
  }
  if (matchMedia('(max-width: 700px)').matches) $('navigation-details').open=false;
  function mode(source) {
    $('article-view').hidden=source;
    $('source-view').hidden=!source;
    $('read-tab').classList.toggle('selected',!source);
    $('source-tab').classList.toggle('selected',source);
    $('read-tab').setAttribute('aria-pressed',String(!source));
    $('source-tab').setAttribute('aria-pressed',String(source));
    $('contents').hidden=source || !current?.toc.length;
  }
  function markText(text,query) {
    const fragment=document.createDocumentFragment();
    const lower=text.toLowerCase(), needle=query.toLowerCase();
    let start=0, at;
    while (needle && (at=lower.indexOf(needle,start))!==-1) {
      fragment.append(document.createTextNode(text.slice(start,at)));
      const mark=document.createElement('mark');mark.textContent=text.slice(at,at+query.length);fragment.append(mark);start=at+query.length;
    }
    fragment.append(document.createTextNode(text.slice(start)));return fragment;
  }
  function search(query) {
    current=null;
    $('search').value=query;
    $('page-title').textContent='Search results';
    $('page-meta').hidden=true;document.querySelector('.toolbar').hidden=true;
    $('article-view').hidden=true;$('source-view').hidden=true;$('search-results').hidden=false;$('toc').replaceChildren();
    $('contents').hidden=true;
    const terms=query.toLowerCase().split(/\s+/).filter(Boolean);
    const matches=terms.length?pages.filter(p=>terms.every(t=>(p.title+' '+p.source).toLowerCase().includes(t))).sort((a,b)=>Number(b.title.toLowerCase().includes(query.toLowerCase()))-Number(a.title.toLowerCase().includes(query.toLowerCase()))):[];
    $('result-count').textContent=terms.length?`${matches.length} ${matches.length===1?'article':'articles'} matching “${query}”${matches.length?'':'. Try fewer words or a broader term.'}`:'Enter a word or phrase to search all articles.';
    $('results').replaceChildren();
    for (const p of matches) {
      const card=document.createElement('div');card.className='result';
      const small=document.createElement('small');small.textContent=p.section;
      const h=document.createElement('h2'),a=link('',route(p.id));a.append(markText(p.title,query));h.append(a);
      const excerpt=document.createElement('p');
      const plain=p.source.replace(/^---\n[\s\S]*?\n---\n/,'').replace(/[#*`|]/g,'').replace(/\[([^\]]+)\]\([^)]+\)/g,'$1').replace(/\s+/g,' ');
      const position=plain.toLowerCase().indexOf(terms[0]);const start=Math.max(0,position-65);
      excerpt.append(markText((start?'…':'')+plain.slice(start,start+240)+(plain.length>start+240?'…':''),query));
      card.append(small,h,excerpt);$('results').append(card);
    }
    document.title='Search — '+wikiTitle;
  }
  function render() {
    const rawHash=location.hash.slice(1);
    document.querySelectorAll('[aria-current=page]').forEach(a=>a.removeAttribute('aria-current'));
    if(rawHash.startsWith('/search?')) {search(new URLSearchParams(rawHash.slice(8)).get('q')||'');window.scrollTo(0,0);return;}
    let id='index',anchor='';
    try {
      const parts=(rawHash.startsWith('/')?rawHash.slice(1):'index').split('~');
      id=decodeURIComponent(parts[0]);anchor=decodeURIComponent(parts[1]||'');
    } catch {id='__invalid_route__';}

    const p=byId.get(id||'index');
    $('search-results').hidden=true;document.querySelector('.toolbar').hidden=!p;$('page-meta').hidden=!p;
    current=p||null;mode(false);
    if(!p){
      $('page-title').textContent='Page not found';
      $('article').replaceChildren(link('Return to the main page',route('index')));$('toc').replaceChildren();$('backlinks').hidden=true;document.title='Page not found — '+wikiTitle;return;
    }
    $('search').value='';$('page-title').textContent=p.title;
    $('page-meta').innerHTML=p.metadataHtml;
    $('page-meta').hidden=!p.metadataHtml;
    $('article').innerHTML=p.html;
    $('source-text').textContent=p.source;$('source-path').textContent=p.id+'.md';
    $('toc').replaceChildren();
    p.toc.forEach(h=>{const a=link(h.title,route(p.id)+'~'+h.id);if(h.depth>2)a.className='nested';$('toc').append(a);});
    $('backlink-list').replaceChildren();$('backlinks').hidden=!p.backlinks.length;
    p.backlinks.forEach(id=>$('backlink-list').append(link(byId.get(id).title,route(id))));
    document.querySelectorAll('[data-page]').forEach(a=>{if(a.dataset.page===p.id)a.setAttribute('aria-current','page');});
    document.title=p.id==='index'?wikiTitle:p.title+' — '+wikiTitle;
    if(anchor)requestAnimationFrame(()=>{if(anchor===p.titleAnchor)$('page-title').scrollIntoView();else document.getElementById(anchor)?.scrollIntoView();});else window.scrollTo(0,0);
  }
  $('search-form').addEventListener('submit',e=>{e.preventDefault();const hash='/search?q='+encodeURIComponent($('search').value.trim());if(location.hash==='#'+hash)render();else location.hash=hash;});
  $('read-tab').addEventListener('click',()=>mode(false));$('source-tab').addEventListener('click',()=>mode(true));
  $('print').addEventListener('click',()=>{mode(false);window.print();});
  document.querySelector('.skip').addEventListener('click',e=>{e.preventDefault();const target=$('search-results').hidden?$('article'):$('main');target.focus();target.scrollIntoView();});
  $('download').addEventListener('click',()=>{
    if(!current)return;const url=URL.createObjectURL(new Blob([current.source],{type:'text/markdown;charset=utf-8'}));
    const a=link('',url);a.download=current.id.split('/').pop()+'.md';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
  });
  document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)&&!e.metaKey&&!e.ctrlKey&&!e.altKey){e.preventDefault();$('search').focus();}});
  document.addEventListener('click',e=>{const a=e.target.closest('a');if(a?.getAttribute('href')?.startsWith('#/')&&matchMedia('(max-width: 700px)').matches)$('navigation-details').open=false;});
  window.addEventListener('hashchange',render);
  render();
})();
</script>
