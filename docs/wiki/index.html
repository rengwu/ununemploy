>web3.career\u003c/a> is an independently verified current board with a documented API. Frontend/product roles offer relevant coverage.\u003c/td>\n\u003ctd>\u003cstrong>Integrate web3.career optionally after token setup.\u003c/strong> Preserve the original-link uncertainty.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>65\u003c/td>\n\u003ctd>We Love Go — \u003ca href=\"https://lnkd.in/dT7tYSBQ\" rel=\"noreferrer\">original link\u003c/a>\u003c/td>\n\u003ctd>Operator's \u003ca href=\"https://gist.github.com/jonathaningram/5b334274d6bc91554687e64608322419\" rel=\"noreferrer\">historical post\u003c/a> identifies \u003ccode>welovegolang.com\u003c/code>; current board access failed.\u003c/td>\n\u003ctd>\u003cstrong>Hold.\u003c/strong> Use working GolangProjects feed for this branch.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3 id=\"final-nine-domain-screenshot-new-names\">Final nine-domain screenshot: new names\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>#\u003c/th>\n\u003cth>Source\u003c/th>\n\u003cth>Fit and current evidence\u003c/th>\n\u003cth>Decision\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>66\u003c/td>\n\u003ctd>\u003ca href=\"https://whoishiring.io/\" rel=\"noreferrer\">whoishiring.io\u003c/a>\u003c/td>\n\u003ctd>Domain responds, but no readable job inventory or supported interface could be established. Do not assume it is HN's official hiring service.\u003c/td>\n\u003ctd>\u003cstrong>Hold/research.\u003c/strong> Needs a functioning current search and evidence of additional coverage.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>67\u003c/td>\n\u003ctd>\u003ca href=\"https://www.theladders.com/\" rel=\"noreferrer\">The Ladders\u003c/a>\u003c/td>\n\u003ctd>Active service positioning around $100K+ professional roles, with premium application/CV services. That salary positioning does not itself establish Malaysia eligibility or strong product-engineering coverage.\u003c/td>\n\u003ctd>\u003cstrong>Manual, lower priority.\u003c/strong> No verified public reading feed; its application automation is outside this product's scope.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"what-this-means-for-the-collector\">What this means for the collector\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>Use adapters for supported APIs and job RSS first.\u003c/strong> HTML parsing is a later source-specific decision after checking current terms and access rules. Low frequency does not itself grant permission. Do not bypass login walls, CAPTCHAs, blocks, or paywalls.\u003c/li>\n\u003cli>\u003cstrong>Discover employers, then follow their supported career feeds.\u003c/strong> A good board without a public API can still identify relevant companies. Follow an employer source under its own supported access route; do not reverse-engineer a board's private browser endpoints as a substitute for permission.\u003c/li>\n\u003cli>\u003cstrong>Deduplicate jobs as well as websites.\u003c/strong> Match canonical employer/application URLs and provider requisition IDs first, then normalized company/title/location. Preserve all discovery links. Avoid merging separate locations or requisitions solely because titles match.\u003c/li>\n\u003cli>\u003cstrong>Keep eligibility separate from fit.\u003c/strong> Store residence, allowed work countries, timezone overlap, relocation, sponsorship, existing work authorization, and citizenship restrictions separately. “Remote US” is not “US citizens only”; it is also not evidence of permission to work remotely from Malaysia. Keep unknowns visible.\u003c/li>\n\u003cli>\u003cstrong>Measure incremental value.\u003c/strong> Track relevant unique jobs, duplicate rate, explicit Malaysia/global eligibility, description completeness, stale/closed jobs, request cost, and connector failures. Promote sources that add useful opportunities, not merely the most records.\u003c/li>\n\u003cli>\u003cstrong>Treat salary as evidence with units.\u003c/strong> Preserve original currency, annual/monthly/hourly period, cash versus equity/tokens, and employer-stated versus estimated figures. Do not discard missing salaries given the user's flexibility.\u003c/li>\n\u003cli>\u003cstrong>Keep X distinct from board aggregation.\u003c/strong> X is already a required organic source with an approved 1,000-post monthly retrieval allowance. Extra boards should not consume or replace that budget. Keep the current account settings intact during this evaluation.\u003c/li>\n\u003cli>\u003cstrong>Preserve the existing action boundary.\u003c/strong> Reading listings and generating private CV drafts are permitted. No applications, account/profile publication, submissions, recruiter contact, messages, follows, reactions, or approval-to-send workflow.\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"open-checks-before-later-integrations\">Open checks before later integrations\u003c/h2>\n\u003cul>\n\u003cli>Confirm full-description fields, pagination, conditional requests, source-specific page budgets, and expiry behavior in each adapter. One successful response is not a complete connector test.\u003c/li>\n\u003cli>Resolve generic old shortened links only if their current destination becomes available; they do not block the verified integrations.\u003c/li>\n\u003cli>Review a small sample of current employer openings to compare relevant unique coverage. This review did not estimate match rates from marketing job counts.\u003c/li>\n\u003cli>Obtain a separate Web3.career token only if that optional source is selected. No account was created and no credential was requested or used during this assessment.\u003c/li>\n\u003cli>Revisit source terms when actually implementing, because interfaces and permissions can change.\u003c/li>\n\u003c/ul>\n\u003cp>The initial evaluation changed documentation only. The later authorized implementation is recorded at the top of this report. No employer-facing action was added.\u003c/p>\n","backlinks":["index","decisions/index","features/discovery","journal/2026-10-07-jstack-migration"]},{"id":"journal/2026-09-17-coverage-research","title":"Coverage research — 17 September 2026","section":"Journal","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-10-07\u003c/span>","updated":"2026-10-07","summary":"","source":"---\ntitle: Coverage research — 17 September 2026\nsection: Journal\nupdated: 2026-10-07\n---\n# Coverage research — 17 September 2026\n\nHistorical planning and probe results preserved from `docs/COVERAGE_EXPANSION.md`. The 31-source counts and proposed collector work below predate the installed 57-configuration expansion. See [the implemented coverage and observed scan results](../reference/source-coverage.md). External sources were not rechecked during migration.\n\n## Scope and current coverage\n\nThe user wants maximum useful coverage and explicitly includes low-frequency public-page scraping. A missing official API is not an exclusion. Evaluate technical access, site restrictions, relevance and maintenance separately. The earlier API/feed-first assessment remains useful historical context but is superseded on this point. No application or engagement automation is in scope.\n\nThe running installation has **31 source configurations**:\n\n- **11 distinct automatically collected multi-employer boards**, represented by 14 configurations: Himalayas, Remote OK, Remotive, 4 Day Week, We Work Remotely, GolangProjects, LaraJobs, ClojureJobboard, Arbeitnow, Jobicy and VueJobs. WWR categories and Arbeitnow markets are not separate boards.\n- 11 individual employer feeds, of which seven are enabled and four are paused.\n- Three organic configurations: X, HN monthly hiring threads, and HN's YC job stories.\n- Two manual-only boards: Wellfound and Welcome to the Jungle/Otta.\n- Web3.career awaiting its token, still pending at the user's request.\n\nThis leaves substantial gaps in Malaysia/Singapore/SEA, wider startup hiring, and East Asian relocation. The paused employer sources and existing X budget were not changed by this evaluation.\n\n## First implementation batch\n\nOrder is an engineering recommendation based on relevance and the observed access path, not a measured ranking of unique suitable vacancies. HTTP success is a point-in-time observation, not a guarantee of future access or permission.\n\n| Priority | Board | Coverage gained | Verified reading route and remaining work |\n| --- | --- | --- | --- |\n| 1 | [Hiredly](https://my.hiredly.com/Full-Stack-Software-Engineer-jobs) | Malaysian engineering/product/AI roles missing from remote-centric feeds. | Search HTML returned 200 and embedded 30 job records; ordinary browser rendered the same inventory. Public detail returned 200. Parse embedded listing records plus the actual description section. **Sample JobPosting description is only 500 characters**, despite a much longer visible job description. Keep its AI-generated summary separate from employer text. |\n| 2 | [LinkedIn public jobs](https://www.linkedin.com/jobs/search/?keywords=software%20engineer&location=Malaysia) | Broad Malaysia, Singapore, regional and global employer discovery. | Anonymous search and a Grab full-stack detail both returned 200 using the application's identifying user-agent, with job links and a 5,488-character structured description. Guest HTML is an unofficial integration; pagination, regional variants and inconsistent access need fixtures. LinkedIn explicitly restricts scraping in its [agreement](https://www.linkedin.com/legal/user-agreement) and wildcard robots rules. Mark this restriction separately from the successful technical probe. |\n| 3 | [Wellfound](https://wellfound.com/jobs) | Startup, founding, applied-AI and product roles. Currently only a manual entry in our app. | Search and an agent-engineering detail returned 200 without login; detail included a 4,002-character JobPosting body. Public categories, embedded listing state and employer links provide a plausible adapter. Public inventory is not the complete signed-in service. Its [terms](https://wellfound.com/terms) restrict copying/harvesting; retain that label. |\n| 4 | [Built In](https://builtin.com/jobs/remote) | Broader tech/product/AI companies, beyond the small employer list already configured. | Public listing and detail returned 200; sampled detail has 7,880 characters of JobPosting description. Use specific engineering/AI categories, original employer links and country restrictions. US-only remote jobs are common in the sample. Its [terms](https://builtin.com/community-terms-of-use) expressly restrict automated access/copying. |\n| 5 | [YC jobs](https://www.ycombinator.com/jobs) / [Work at a Startup](https://www.workatastartup.com/jobs) | YC's broader company/job directory, including founding and AI roles. The existing HN `jobstories` feed is not this full directory. | `ycombinator.com/jobs` returned readable HTML with 200. Work at a Startup returned 406 to the basic client but loaded listings in an ordinary browser. Prefer the public directory and employer pages where possible; validate paging/detail coverage. A successful initial public page does not establish access to all signed-in results. |\n| 6 | [Japan Dev](https://japan-dev.com/japan-jobs-relocation) | Japan relocation, explicit overseas sponsorship and language requirements. | Public relocation index and detail both returned 200. Index has vacancy links; sampled frontend/product detail includes an 8,020-character structured body. Source-specific country, visa and Japanese-language fields are particularly useful. |\n| 7 | [Cake](https://www.cake.me/jobs?query=software%20engineer) | Taiwan and additional Asian employers; separately inspect international-candidate categories. | Public search HTML returned 200 with rendered vacancy links and embedded state. Build filtered discovery and verify individual full-description extraction, pagination, locale, language requirements and closures. Detail adapter not proven by this review. |\n| 8 | [Arc](https://arc.dev/remote-jobs) | Remote engineering, full-time and contract work; country/timezone fields. | Search returned 200 with 30 Arc job records and separate external listings in page data; ordinary browser displayed jobs. Validate full descriptions and stable detail URLs, and distinguish Arc network roles from externally sourced vacancies. Talent onboarding/application actions stay manual. |\n\n### Concrete missing inventory\n\nThe inspected [Food Market Hub role on Hiredly](https://my.hiredly.com/jobs/jobs-malaysia-food-market-hub-job-senior-full-stack-engineer-ai-agentic-systems) covers agentic systems and advertises RM15K–RM30K. It asks for 10+ years, so it is a stretch example rather than a confirmed match. A local collection search returned no Food Market Hub records. The [Telexistence frontend/product role](https://japan-dev.com/jobs/telexistence/telexistence-lead-frontend-product-engineer-tjwvfc) is another absent employer in the local query. These two examples establish real gaps; they are not a statistically representative overlap study.\n\n## High-value targets with current access obstacles\n\n| Board | Why keep it in the backlog | Observed obstacle |\n| --- | --- | --- |\n| [JobStreet / SEEK](https://my.jobstreet.com/software-engineer-jobs/in-Malaysia) | Important Malaysian/SEA inventory; later investigate SEEK Australia/NZ as separate markets. | Malaysian search returned 403/security challenge in both HTTP and ordinary headless browser checks. [Terms](https://my.jobstreet.com/terms) and job-detail robots restrictions also need to remain explicit. Other SEEK markets were not live-tested. |\n| [NodeFlair](https://nodeflair.com/jobs/software-engineer-jobs) | Strong technical focus across Singapore, Malaysia and other Asian markets. | Both clients received a security challenge. Search-engine visibility is evidence of public inventory, not proof that our collector can read it. |\n| [Glints](https://glints.com/sg/opportunities/jobs/explore) | Additional SEA markets and local employers. | HTTP returned a firewall page; ordinary browser also encountered a challenge. Search results include closed jobs, so closure handling is necessary. |\n| [TokyoDev](https://www.tokyodev.com/) | English-speaking jobs, apply-from-abroad and relocation fields. | Searchable public listings exist, but both local clients were challenged. Japan Dev is the currently accessible first route into this segment. |\n| [Indeed](https://malaysia.indeed.com/jobs?q=software+engineer) | Broad employer coverage, with substantial aggregation/duplicate potential. | HTTP and ordinary browser checks were blocked. No working connector established. |\n| [Welcome to the Jungle / Otta](https://app.welcometothejungle.com/jobs) | Strong potential startup/product coverage. | The old candidate app redirected to login. The public main-domain search returned a shell, not confirmed vacancy inventory. Public company pages need separate evaluation. |\n\nThese are research priorities, not disabled adapters secretly presented as working coverage. No account sessions, challenge-solving or proxy services were used in the probes.\n\n## Next wave and inexpensive additions\n\n| Source | Findings and recommendation |\n| --- | --- |\n| [Get on Board](https://www.getonbrd.com/user-manual/get-on-board-s-api) | Official no-auth public API for published jobs, categories, companies and search, in addition to readable HTML. A live public search returned the requested two records with description fields. Good next adapter; LATAM residence/timezone restrictions reduce direct relevance for Malaysia, but keep global/relocation roles visible. The public and private recruiting APIs are distinct. |\n| [Remote.com Jobs](https://remote.com/jobs) | Index and detail returned 200, with country/work-authorization metadata and JobPosting data. The sampled full description was not in the initial visible HTML; verify ordinary rendered detail before claiming complete-text support. |\n| [No Fluff Jobs](https://nofluffjobs.com/) | Public index returned 200 with job links. Engineering/AI/salary coverage adds CEE markets. Verify descriptions, local language, employment country and sponsorship per listing. |\n| [TryRemote](https://tryremote.com/) | `reactjobsboard.com` redirected here during the probe. Public page exposes React, frontend, AI and region-specific listings. Treat the old name as an alias, not a second independent board. Validate detail extraction and overlap. |\n| [Remote Game Jobs](https://remotegamejobs.com/) | Public index returned 200 with vacancy links. Lower priority for general product engineering, useful for native/UI/tools and game-adjacent branches. |\n| [Jobspresso](https://jobspresso.co/remote-work/) | Public shell returned 200, but usable vacancy cards were not established by the basic fetch. Needs rendered-list/detail work and stale-entry checks. |\n| [Adzuna](https://developer.adzuna.com/overview) | Official keyword/location search API; needs app ID/key. Potential broad aggregator coverage. Confirm supported countries, description completeness and account terms; no authenticated test performed. |\n| [Jooble](https://jooble.org/api/about) | Official search API with a key request. Useful breadth, likely substantial duplication. No key requested or authenticated test performed. |\n| [Careerjet](https://www.careerjet.com/partners/api) | Official search API requires a publisher key. Documentation describes excerpts, so a feed response should not be labeled a full description. Confirm suitability for this local application and target locales. |\n| [Wantedly](https://www.wantedly.com/projects) | Public Japanese recruitment-project listings visible through web research. Lower priority than boards with explicit international-candidate filters; not locally probed. |\n| [Tech Jobs for Good](https://www.techjobsforgood.com/) | Public social-impact technical board visible through web research. Useful employer diversity; local extraction and hiring-country coverage not yet checked. |\n| [Relocate.me](https://relocate.me/international-jobs/software-engineering) | Public relocation listings remain, while The Global Move advertises a separate private/premium curated product. Evaluate the public inventory; do not count the premium archive as accessible coverage. |\n| [Tech in Asia](https://www.techinasia.com/jobs) | Relevant regional brand, but the web retrieval returned 403; current job-reading path unconfirmed. |\n| AIJobs.net / ai-jobs.net | `aijobs.net` redirected to [Foorilla Hiring](https://foorilla.com/hiring/). Reassess the current product and inventory before creating an adapter under an old brand. |\n\nSeparately, expand the employer directory behind Ashby/Greenhouse/Lever and add [SmartRecruiters' public Posting API](https://developers.smartrecruiters.com/docs/authentication). It is documented as unauthenticated and exposes published jobs per company. This is a coverage multiplier across employers, not one global feed or a new independent board. Workday and other ATS families can be later, source-specific adapter research.\n\n## Collector changes needed for useful coverage\n\n1. **Public HTML and page-data adapters.** Extract stable IDs, canonical links, listing metadata and source-specific description sections. A public embedded JSON response is a technical source, not evidence that every field is complete. Verify it against what an anonymous user can read.\n2. **Broad discovery with bounded detail work.** Start with two scheduled discovery passes per day, below the existing six-scan ceiling. Rotate role/region queries and persist pagination so the same first page does not consume every scan. Separate initial backfill from newest-first incremental collection.\n3. **Budget requests separately from scans.** As an illustrative starting budget, two discovery pages twice daily plus 20 new detail pages is 24 GETs per board/day, not two requests. Choose budgets per source after testing; no such configuration changed in this review. Shared host limits must cover related categories/markets and manual lookups.\n4. **Fetch once, reuse and revalidate.** Deduplicate known IDs/application URLs before fetching details. Cache text, preserve manual edits and provenance, and revalidate likely matches/saved jobs on a slower schedule. A fixed six-detail-requests/day limit for every future board would unnecessarily restrict broad discovery; VueJobs retains its current limit until explicitly changed in implementation.\n5. **Count failed and browser work.** Pause on 429 and surface blocked/challenged collectors. A browser scan can issue many assets/analytics requests; several probes attempted over 100 resources, including images/fonts blocked by the test. Prefer one-page HTML reads when they contain the same inventory. Do not call a successful HTML shell a successful job scan.\n6. **Report source contribution.** Distinct active boards, employers covered, discovered pages, new unique jobs, full-description rate, eligible/uncertain/conflicting roles, duplicate rate, stale entries, request totals and last successful data retrieval. Current source-row count alone overstates coverage.\n7. **Retain the broad job scope.** Frontend, full-stack, product, design engineering, native/mobile, applied AI, agent tooling, developer experience, founding engineer and adjacent technical leadership; SEA/East Asia plus worldwide remote and relocation. Country eligibility remains separate from geography and role fit.\n\n## Evidence and limits\n\nRead-only probes used local curl and a fresh ordinary Playwright browser. No credentials, paid API calls, source enablement, job imports, application actions or messages to employers were involved. Existing scheduled collectors continued under their existing settings.\n\nPrivate research files are under `.local-data/verification/coverage-research/`: `probe.json` and page/robots snapshots (20 boards), `browser.json` (eight browser checks), `details.json`, and the publisher's Get on Board OpenAPI document. The source-state snapshot is `coverage-bootstrap.json` in the parent directory. Raw counts of links/resources are diagnostics, not vacancy totals. Full pagination, ongoing reliability and incremental unique-match yield remain to be established during adapter implementation.\n","toc":[{"id":"scope-and-current-coverage","title":"Scope and current coverage","depth":2},{"id":"first-implementation-batch","title":"First implementation batch","depth":2},{"id":"concrete-missing-inventory","title":"Concrete missing inventory","depth":3},{"id":"high-value-targets-with-current-access-obstacles","title":"High-value targets with current access obstacles","depth":2},{"id":"next-wave-and-inexpensive-additions","title":"Next wave and inexpensive additions","depth":2},{"id":"collector-changes-needed-for-useful-coverage","title":"Collector changes needed for useful coverage","depth":2},{"id":"evidence-and-limits","title":"Evidence and limits","depth":2}],"titleAnchor":"coverage-research-17-september-2026","links":["reference/source-coverage"],"attachments":[],"html":"\u003cp>Historical planning and probe results preserved from \u003ccode>docs/COVERAGE_EXPANSION.md\u003c/code>. The 31-source counts and proposed collector work below predate the installed 57-configuration expansion. See \u003ca href=\"#/reference/source-coverage\">the implemented coverage and observed scan results\u003c/a>. External sources were not rechecked during migration.\u003c/p>\n\u003ch2 id=\"scope-and-current-coverage\">Scope and current coverage\u003c/h2>\n\u003cp>The user wants maximum useful coverage and explicitly includes low-frequency public-page scraping. A missing official API is not an exclusion. Evaluate technical access, site restrictions, relevance and maintenance separately. The earlier API/feed-first assessment remains useful historical context but is superseded on this point. No application or engagement automation is in scope.\u003c/p>\n\u003cp>The running installation has \u003cstrong>31 source configurations\u003c/strong>:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>11 distinct automatically collected multi-employer boards\u003c/strong>, represented by 14 configurations: Himalayas, Remote OK, Remotive, 4 Day Week, We Work Remotely, GolangProjects, LaraJobs, ClojureJobboard, Arbeitnow, Jobicy and VueJobs. WWR categories and Arbeitnow markets are not separate boards.\u003c/li>\n\u003cli>11 individual employer feeds, of which seven are enabled and four are paused.\u003c/li>\n\u003cli>Three organic configurations: X, HN monthly hiring threads, and HN's YC job stories.\u003c/li>\n\u003cli>Two manual-only boards: Wellfound and Welcome to the Jungle/Otta.\u003c/li>\n\u003cli>Web3.career awaiting its token, still pending at the user's request.\u003c/li>\n\u003c/ul>\n\u003cp>This leaves substantial gaps in Malaysia/Singapore/SEA, wider startup hiring, and East Asian relocation. The paused employer sources and existing X budget were not changed by this evaluation.\u003c/p>\n\u003ch2 id=\"first-implementation-batch\">First implementation batch\u003c/h2>\n\u003cp>Order is an engineering recommendation based on relevance and the observed access path, not a measured ranking of unique suitable vacancies. HTTP success is a point-in-time observation, not a guarantee of future access or permission.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Priority\u003c/th>\n\u003cth>Board\u003c/th>\n\u003cth>Coverage gained\u003c/th>\n\u003cth>Verified reading route and remaining work\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>\u003ca href=\"https://my.hiredly.com/Full-Stack-Software-Engineer-jobs\" rel=\"noreferrer\">Hiredly\u003c/a>\u003c/td>\n\u003ctd>Malaysian engineering/product/AI roles missing from remote-centric feeds.\u003c/td>\n\u003ctd>Search HTML returned 200 and embedded 30 job records; ordinary browser rendered the same inventory. Public detail returned 200. Parse embedded listing records plus the actual description section. \u003cstrong>Sample JobPosting description is only 500 characters\u003c/strong>, despite a much longer visible job description. Keep its AI-generated summary separate from employer text.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>\u003ca href=\"https://www.linkedin.com/jobs/search/?keywords=software%20engineer&amp;location=Malaysia\" rel=\"noreferrer\">LinkedIn public jobs\u003c/a>\u003c/td>\n\u003ctd>Broad Malaysia, Singapore, regional and global employer discovery.\u003c/td>\n\u003ctd>Anonymous search and a Grab full-stack detail both returned 200 using the application's identifying user-agent, with job links and a 5,488-character structured description. Guest HTML is an unofficial integration; pagination, regional variants and inconsistent access need fixtures. LinkedIn explicitly restricts scraping in its \u003ca href=\"https://www.linkedin.com/legal/user-agreement\" rel=\"noreferrer\">agreement\u003c/a> and wildcard robots rules. Mark this restriction separately from the successful technical probe.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>\u003ca href=\"https://wellfound.com/jobs\" rel=\"noreferrer\">Wellfound\u003c/a>\u003c/td>\n\u003ctd>Startup, founding, applied-AI and product roles. Currently only a manual entry in our app.\u003c/td>\n\u003ctd>Search and an agent-engineering detail returned 200 without login; detail included a 4,002-character JobPosting body. Public categories, embedded listing state and employer links provide a plausible adapter. Public inventory is not the complete signed-in service. Its \u003ca href=\"https://wellfound.com/terms\" rel=\"noreferrer\">terms\u003c/a> restrict copying/harvesting; retain that label.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>\u003ca href=\"https://builtin.com/jobs/remote\" rel=\"noreferrer\">Built In\u003c/a>\u003c/td>\n\u003ctd>Broader tech/product/AI companies, beyond the small employer list already configured.\u003c/td>\n\u003ctd>Public listing and detail returned 200; sampled detail has 7,880 characters of JobPosting description. Use specific engineering/AI categories, original employer links and country restrictions. US-only remote jobs are common in the sample. Its \u003ca href=\"https://builtin.com/community-terms-of-use\" rel=\"noreferrer\">terms\u003c/a> expressly restrict automated access/copying.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>\u003ca href=\"https://www.ycombinator.com/jobs\" rel=\"noreferrer\">YC jobs\u003c/a> / \u003ca href=\"https://www.workatastartup.com/jobs\" rel=\"noreferrer\">Work at a Startup\u003c/a>\u003c/td>\n\u003ctd>YC's broader company/job directory, including founding and AI roles. The existing HN \u003ccode>jobstories\u003c/code> feed is not this full directory.\u003c/td>\n\u003ctd>\u003ccode>ycombinator.com/jobs\u003c/code> returned readable HTML with 200. Work at a Startup returned 406 to the basic client but loaded listings in an ordinary browser. Prefer the public directory and employer pages where possible; validate paging/detail coverage. A successful initial public page does not establish access to all signed-in results.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>\u003ca href=\"https://japan-dev.com/japan-jobs-relocation\" rel=\"noreferrer\">Japan Dev\u003c/a>\u003c/td>\n\u003ctd>Japan relocation, explicit overseas sponsorship and language requirements.\u003c/td>\n\u003ctd>Public relocation index and detail both returned 200. Index has vacancy links; sampled frontend/product detail includes an 8,020-character structured body. Source-specific country, visa and Japanese-language fields are particularly useful.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7\u003c/td>\n\u003ctd>\u003ca href=\"https://www.cake.me/jobs?query=software%20engineer\" rel=\"noreferrer\">Cake\u003c/a>\u003c/td>\n\u003ctd>Taiwan and additional Asian employers; separately inspect international-candidate categories.\u003c/td>\n\u003ctd>Public search HTML returned 200 with rendered vacancy links and embedded state. Build filtered discovery and verify individual full-description extraction, pagination, locale, language requirements and closures. Detail adapter not proven by this review.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>8\u003c/td>\n\u003ctd>\u003ca href=\"https://arc.dev/remote-jobs\" rel=\"noreferrer\">Arc\u003c/a>\u003c/td>\n\u003ctd>Remote engineering, full-time and contract work; country/timezone fields.\u003c/td>\n\u003ctd>Search returned 200 with 30 Arc job records and separate external listings in page data; ordinary browser displayed jobs. Validate full descriptions and stable detail URLs, and distinguish Arc network roles from externally sourced vacancies. Talent onboarding/application actions stay manual.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3 id=\"concrete-missing-inventory\">Concrete missing inventory\u003c/h3>\n\u003cp>The inspected \u003ca href=\"https://my.hiredly.com/jobs/jobs-malaysia-food-market-hub-job-senior-full-stack-engineer-ai-agentic-systems\" rel=\"noreferrer\">Food Market Hub role on Hiredly\u003c/a> covers agentic systems and advertises RM15K–RM30K. It asks for 10+ years, so it is a stretch example rather than a confirmed match. A local collection search returned no Food Market Hub records. The \u003ca href=\"https://japan-dev.com/jobs/telexistence/telexistence-lead-frontend-product-engineer-tjwvfc\" rel=\"noreferrer\">Telexistence frontend/product role\u003c/a> is another absent employer in the local query. These two examples establish real gaps; they are not a statistically representative overlap study.\u003c/p>\n\u003ch2 id=\"high-value-targets-with-current-access-obstacles\">High-value targets with current access obstacles\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Board\u003c/th>\n\u003cth>Why keep it in the backlog\u003c/th>\n\u003cth>Observed obstacle\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ca href=\"https://my.jobstreet.com/software-engineer-jobs/in-Malaysia\" rel=\"noreferrer\">JobStreet / SEEK\u003c/a>\u003c/td>\n\u003ctd>Important Malaysian/SEA inventory; later investigate SEEK Australia/NZ as separate markets.\u003c/td>\n\u003ctd>Malaysian search returned 403/security challenge in both HTTP and ordinary headless browser checks. \u003ca href=\"https://my.jobstreet.com/terms\" rel=\"noreferrer\">Terms\u003c/a> and job-detail robots restrictions also need to remain explicit. Other SEEK markets were not live-tested.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"https://nodeflair.com/jobs/software-engineer-jobs\" rel=\"noreferrer\">NodeFlair\u003c/a>\u003c/td>\n\u003ctd>Strong technical focus across Singapore, Malaysia and other Asian markets.\u003c/td>\n\u003ctd>Both clients received a security challenge. Search-engine visibility is evidence of public inventory, not proof that our collector can read it.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"https://glints.com/sg/opportunities/jobs/explore\" rel=\"noreferrer\">Glints\u003c/a>\u003c/td>\n\u003ctd>Additional SEA markets and local employers.\u003c/td>\n\u003ctd>HTTP returned a firewall page; ordinary browser also encountered a challenge. Search results include closed jobs, so closure handling is necessary.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"https://www.tokyodev.com/\" rel=\"noreferrer\">TokyoDev\u003c/a>\u003c/td>\n\u003ctd>English-speaking jobs, apply-from-abroad and relocation fields.\u003c/td>\n\u003ctd>Searchable public listings exist, but both local clients were challenged. Japan Dev is the currently accessible first route into this segment.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"https://malaysia.indeed.com/jobs?q=software+engineer\" rel=\"noreferrer\">Indeed\u003c/a>\u003c/td>\n\u003ctd>Broad employer coverage, with substantial aggregation/duplicate potential.\u003c/td>\n\u003ctd>HTTP and ordinary browser checks were blocked. No working connector established.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"https://app.welcometothejungle.com/jobs\" rel=\"noreferrer\">Welcome to the Jungle / Otta\u003c/a>\u003c/td>\n\u003ctd>Strong potential startup/product coverage.\u003c/td>\n\u003ctd>The old candidate app redirected to login. The public main-domain search returned a shell, not confirmed vacancy inventory. Public company pages need separate evaluation.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>These are research priorities, not disabled adapters secretly presented as working coverage. No account sessions, challenge-solving or proxy services were used in the probes.\u003c/p>\n\u003ch2 id=\"next-wave-and-inexpensive-additions\">Next wave and inexpensive additions\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Source\u003c/th>\n\u003cth>Findings and recommendation\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ca href=\"https://www.getonbrd.com/user-manual/get-on-board-s-api\" rel=\"noreferrer\">Get on Board\u003c/a>\u003c/td>\n\u003ctd>Official no-auth public API for published jobs, categories, companies and search, in addition to readable HTML. A live public search returned the requested two records with description fields. Good next adapter; LATAM residence/timezone restrictions reduce direct relevance for Malaysia, but keep global/relocation roles visible. The public and private recruiting APIs are distinct.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"https://remote.com/jobs\" rel=\"noreferrer\">Remote.com Jobs\u003c/a>\u003c/td>\n\u003ctd>Index and detail returned 200, with country/work-authorization metadata and JobPosting data. The sampled full description was not in the initial visible HTML; verify ordinary rendered detail before claiming complete-text support.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"https://nofluffjobs.com/\" rel=\"noreferrer\">No Fluff Jobs\u003c/a>\u003c/td>\n\u003ctd>Public index returned 200 with job links. Engineering/AI/salary coverage adds CEE markets. Verify descriptions, local language, employment country and sponsorship per listing.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"https://tryremote.com/\" rel=\"noreferrer\">TryRemote\u003c/a>\u003c/td>\n\u003ctd>\u003ccode>reactjobsboard.com\u003c/code> redirected here during the probe. Public page exposes React, frontend, AI and region-specific listings. Treat the old name as an alias, not a second independent board. Validate detail extraction and overlap.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"https://remotegamejobs.com/\" rel=\"noreferrer\">Remote Game Jobs\u003c/a>\u003c/td>\n\u003ctd>Public index returned 200 with vacancy links. Lower priority for general product engineering, useful for native/UI/tools and game-adjacent branches.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"https://jobspresso.co/remote-work/\" rel=\"noreferrer\">Jobspresso\u003c/a>\u003c/td>\n\u003ctd>Public shell returned 200, but usable vacancy cards were not established by the basic fetch. Needs rendered-list/detail work and stale-entry checks.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"https://developer.adzuna.com/overview\" rel=\"noreferrer\">Adzuna\u003c/a>\u003c/td>\n\u003ctd>Official keyword/location search API; needs app ID/key. Potential broad aggregator coverage. Confirm supported countries, description completeness and account terms; no authenticated test performed.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"https://jooble.org/api/about\" rel=\"noreferrer\">Jooble\u003c/a>\u003c/td>\n\u003ctd>Official search API with a key request. Useful breadth, likely substantial duplication. No key requested or authenticated test performed.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"https://www.careerjet.com/partners/api\" rel=\"noreferrer\">Careerjet\u003c/a>\u003c/td>\n\u003ctd>Official search API requires a publisher key. Documentation describes excerpts, so a feed response should not be labeled a full description. Confirm suitability for this local application and target locales.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"https://www.wantedly.com/projects\" rel=\"noreferrer\">Wantedly\u003c/a>\u003c/td>\n\u003ctd>Public Japanese recruitment-project listings visible through web research. Lower priority than boards with explicit international-candidate filters; not locally probed.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"https://www.techjobsforgood.com/\" rel=\"noreferrer\">Tech Jobs for Good\u003c/a>\u003c/td>\n\u003ctd>Public social-impact technical board visible through web research. Useful employer diversity; local extraction and hiring-country coverage not yet checked.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"https://relocate.me/international-jobs/software-engineering\" rel=\"noreferrer\">Relocate.me\u003c/a>\u003c/td>\n\u003ctd>Public relocation listings remain, while The Global Move advertises a separate private/premium curated product. Evaluate the public inventory; do not count the premium archive as accessible coverage.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"https://www.techinasia.com/jobs\" rel=\"noreferrer\">Tech in Asia\u003c/a>\u003c/td>\n\u003ctd>Relevant regional brand, but the web retrieval returned 403; current job-reading path unconfirmed.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>AIJobs.net / ai-jobs.net\u003c/td>\n\u003ctd>\u003ccode>aijobs.net\u003c/code> redirected to \u003ca href=\"https://foorilla.com/hiring/\" rel=\"noreferrer\">Foorilla Hiring\u003c/a>. Reassess the current product and inventory before creating an adapter under an old brand.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Separately, expand the employer directory behind Ashby/Greenhouse/Lever and add \u003ca href=\"https://developers.smartrecruiters.com/docs/authentication\" rel=\"noreferrer\">SmartRecruiters' public Posting API\u003c/a>. It is documented as unauthenticated and exposes published jobs per company. This is a coverage multiplier across employers, not one global feed or a new independent board. Workday and other ATS families can be later, source-specific adapter research.\u003c/p>\n\u003ch2 id=\"collector-changes-needed-for-useful-coverage\">Collector changes needed for useful coverage\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>Public HTML and page-data adapters.\u003c/strong> Extract stable IDs, canonical links, listing metadata and source-specific description sections. A public embedded JSON response is a technical source, not evidence that every field is complete. Verify it against what an anonymous user can read.\u003c/li>\n\u003cli>\u003cstrong>Broad discovery with bounded detail work.\u003c/strong> Start with two scheduled discovery passes per day, below the existing six-scan ceiling. Rotate role/region queries and persist pagination so the same first page does not consume every scan. Separate initial backfill from newest-first incremental collection.\u003c/li>\n\u003cli>\u003cstrong>Budget requests separately from scans.\u003c/strong> As an illustrative starting budget, two discovery pages twice daily plus 20 new detail pages is 24 GETs per board/day, not two requests. Choose budgets per source after testing; no such configuration changed in this review. Shared host limits must cover related categories/markets and manual lookups.\u003c/li>\n\u003cli>\u003cstrong>Fetch once, reuse and revalidate.\u003c/strong> Deduplicate known IDs/application URLs before fetching details. Cache text, preserve manual edits and provenance, and revalidate likely matches/saved jobs on a slower schedule. A fixed six-detail-requests/day limit for every future board would unnecessarily restrict broad discovery; VueJobs retains its current limit until explicitly changed in implementation.\u003c/li>\n\u003cli>\u003cstrong>Count failed and browser work.\u003c/strong> Pause on 429 and surface blocked/challenged collectors. A browser scan can issue many assets/analytics requests; several probes attempted over 100 resources, including images/fonts blocked by the test. Prefer one-page HTML reads when they contain the same inventory. Do not call a successful HTML shell a successful job scan.\u003c/li>\n\u003cli>\u003cstrong>Report source contribution.\u003c/strong> Distinct active boards, employers covered, discovered pages, new unique jobs, full-description rate, eligible/uncertain/conflicting roles, duplicate rate, stale entries, request totals and last successful data retrieval. Current source-row count alone overstates coverage.\u003c/li>\n\u003cli>\u003cstrong>Retain the broad job scope.\u003c/strong> Frontend, full-stack, product, design engineering, native/mobile, applied AI, agent tooling, developer experience, founding engineer and adjacent technical leadership; SEA/East Asia plus worldwide remote and relocation. Country eligibility remains separate from geography and role fit.\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"evidence-and-limits\">Evidence and limits\u003c/h2>\n\u003cp>Read-only probes used local curl and a fresh ordinary Playwright browser. No credentials, paid API calls, source enablement, job imports, application actions or messages to employers were involved. Existing scheduled collectors continued under their existing settings.\u003c/p>\n\u003cp>Private research files are under \u003ccode>.local-data/verification/coverage-research/\u003c/code>: \u003ccode>probe.json\u003c/code> and page/robots snapshots (20 boards), \u003ccode>browser.json\u003c/code> (eight browser checks), \u003ccode>details.json\u003c/code>, and the publisher's Get on Board OpenAPI document. The source-state snapshot is \u003ccode>coverage-bootstrap.json\u003c/code> in the parent directory. Raw counts of links/resources are diagnostics, not vacancy totals. Full pagination, ongoing reliability and incremental unique-match yield remain to be established during adapter implementation.\u003c/p>\n","backlinks":["index","decisions/index","journal/2026-10-07-jstack-migration","reference/source-coverage"]},{"id":"journal/2026-10-07-desktop","title":"Native desktop packaging — 7 October 2026","section":"Journal","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-10-07\u003c/span>","updated":"2026-10-07","summary":"","source":"---\ntitle: Native desktop packaging — 7 October 2026\nsection: Journal\nupdated: 2026-10-07\n---\n# Native desktop packaging — 7 October 2026\n\nThe user requested a Go webview wrapper because starting the local instance manually made the app inconvenient to use. They selected **Keep running until Quit**, with the current Mac as the first target. This authorizes a native local launcher and bundled service lifecycle; no new external hosting or application-submission behavior is introduced.\n\nThe [desktop feature](../features/desktop.md) is the current specification. A Go supervisor and Cocoa/WKWebView adapter provide a native window, menus, downloads, single-instance handling and service shutdown. The existing React/Kumo UI is served by the bundled Fastify API; the existing worker stays in a separate Node process so collection does not share the API event loop. A parent-pipe watchdog and process-group cleanup cover normal Quit and abrupt wrapper exit.\n\nPackaging uses explicit code/runtime inputs, with no candidate evidence, credentials or application database inside the bundle. Installation uses SQLite's backup API and imports private assets into Application Support, retaining the original files and repointing development at the same canonical data. Official Codex authentication remains runtime-owned, with the same model and reasoning settings.\n\nNative interaction checks exercised document editing, a selectable PDF preview, native Save, unsaved-edit cancellation, hidden-window operation and Quit. Automated checks cover isolated migration and lifecycle failures/restarts; see the [dated verification index](../verification/index.md) for exact build evidence and limits. The first synthetic profile had no education entries and produced the existing empty-list LaTeX error; replacing its test source with a valid minimal document verified the packaged compiler. No user source was changed for that check.\n\nUnraid deployment remains separate and unverified. Other desktop operating systems, Intel packaging, notarization and login startup remain outside this implementation.\n\nA final portability audit caught npm command symlinks rewritten to build-folder paths during installation. Copy operations now preserve relative links, and the builder and installer reject broken/external links. The regression suite now contains 175 passing tests. The earlier verification report retains the discovered failure; the corrected package has a separate follow-up run.\n","toc":[],"titleAnchor":"native-desktop-packaging-7-october-2026","links":["features/desktop","verification/index"],"attachments":[],"html":"\u003cp>The user requested a Go webview wrapper because starting the local instance manually made the app inconvenient to use. They selected \u003cstrong>Keep running until Quit\u003c/strong>, with the current Mac as the first target. This authorizes a native local launcher and bundled service lifecycle; no new external hosting or application-submission behavior is introduced.\u003c/p>\n\u003cp>The \u003ca href=\"#/features/desktop\">desktop feature\u003c/a> is the current specification. A Go supervisor and Cocoa/WKWebView adapter provide a native window, menus, downloads, single-instance handling and service shutdown. The existing React/Kumo UI is served by the bundled Fastify API; the existing worker stays in a separate Node process so collection does not share the API event loop. A parent-pipe watchdog and process-group cleanup cover normal Quit and abrupt wrapper exit.\u003c/p>\n\u003cp>Packaging uses explicit code/runtime inputs, with no candidate evidence, credentials or application database inside the bundle. Installation uses SQLite's backup API and imports private assets into Application Support, retaining the original files and repointing development at the same canonical data. Official Codex authentication remains runtime-owned, with the same model and reasoning settings.\u003c/p>\n\u003cp>Native interaction checks exercised document editing, a selectable PDF preview, native Save, unsaved-edit cancellation, hidden-window operation and Quit. Automated checks cover isolated migration and lifecycle failures/restarts; see the \u003ca href=\"#/verification/index\">dated verification index\u003c/a> for exact build evidence and limits. The first synthetic profile had no education entries and produced the existing empty-list LaTeX error; replacing its test source with a valid minimal document verified the packaged compiler. No user source was changed for that check.\u003c/p>\n\u003cp>Unraid deployment remains separate and unverified. Other desktop operating systems, Intel packaging, notarization and login startup remain outside this implementation.\u003c/p>\n\u003cp>A final portability audit caught npm command symlinks rewritten to build-folder paths during installation. Copy operations now preserve relative links, and the builder and installer reject broken/external links. The regression suite now contains 175 passing tests. The earlier verification report retains the discovered failure; the corrected package has a separate follow-up run.\u003c/p>\n","backlinks":["index","decisions/index","features/desktop"]},{"id":"journal/2026-10-07-jstack-migration","title":"jstack adoption and documentation migration","section":"Journal","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-10-07\u003c/span>","updated":"2026-10-07","summary":"","source":"---\ntitle: jstack adoption and documentation migration\nsection: Journal\nupdated: 2026-10-07\n---\n# jstack adoption and documentation migration\n\nUser request: “can we adopt jstack (../jstack) for this project? migrate all docs to wiki format”. Adoption applies to project documentation and verification; the application's React/Kumo/Fastify/SQLite runtime remains unchanged.\n\n## Migration\n\nThe former README was split into [local development](../guides/local-development.md), [workflow](../guides/workflow.md), feature pages, [backups](../guides/backups.md), [verification setup](../verification/setup.md) and [limits](../reference/limitations.md). Root README now links here. Existing substantive project documents moved as follows:\n\n| Former path | Wiki destination |\n| --- | --- |\n| `docs/ASSISTANT.md` | [features/assistant.md](../features/assistant.md) |\n| `docs/BUILD_PLAN.md` | [reference/architecture.md](../reference/architecture.md) |\n| `docs/COVERAGE_EXPANSION.md` | [reference/source-coverage.md](../reference/source-coverage.md) |\n| `docs/MATCHING_AND_LISTING_QUALITY.md` | [features/matching.md](../features/matching.md) |\n| `docs/JEV.md` | [features/jev.md](../features/jev.md) |\n| `docs/SOURCE_EVALUATION.md` | [journal/2026-09-16-source-evaluation.md](2026-09-16-source-evaluation.md) |\n| `docs/UI_DESIGN.md` | [decisions/dashboard-ui.md](../decisions/dashboard-ui.md) |\n| `docs/VERIFICATION.md` | [verification/history.md](../verification/history.md) |\n| `deploy/unraid/README.md` | [guides/unraid.md](../guides/unraid.md) |\n| `data/geography/README.md` | [reference/geography.md](../reference/geography.md) |\n\nThe source-coverage document was split into installed coverage and [historical research](2026-09-17-coverage-research.md). Existing verification notes were preserved, including the uncommitted 3 October automatic LaTeX setup record. No historical run was promoted into a fresh pass. Original documentation snapshots are retained privately under `.local-data/wiki-migration/originals/` for migration comparison.\n\n## Corrections and boundaries\n\nCurrent guides now reflect 57 source configurations, public-board upgrades for Wellfound/Welcome to the Jungle, cover-letter generation on Save, and the local city/country lookup. The Unraid guide no longer claims fresh installations contain a candidate profile. Candidate-specific authorization assertions were replaced with general field semantics; the local canonical profile remains untouched. These changes reconcile existing code and newer project requirements, not new product decisions.\n\n`AGENTS.md` remains the authoritative agent entry point with updated links and a jstack maintenance section. `core/profile/skills/build-user-profile/SKILL.md` remains a runtime asset. Ignored `docs/MASTER_CV.md` and `data/candidate-profile.json` remain original local evidence. The dataset and Unraid folders retain short pointers, with GeoNames attribution kept beside its data.\n\nThe pre-existing LaTeX implementation changes remain in the working tree. This migration creates no commit, deployment, source scan or inference request. Private candidate evidence and old raw verification artifacts are not embedded in the reader.\n\n## Validation\n\nSee the [migration run](../verification/index.md). Recipes for product features were mapped from actual scripts and historical checks, not rerun merely to reorganize documentation. External references were preserved without a new web-research pass. [Open follow-up](../discussions/open-questions.md) records the remaining configuration and verification limits.\n","toc":[{"id":"migration","title":"Migration","depth":2},{"id":"corrections-and-boundaries","title":"Corrections and boundaries","depth":2},{"id":"validation","title":"Validation","depth":2}],"titleAnchor":"jstack-adoption-and-documentation-migration","links":["guides/local-development","guides/workflow","guides/backups","verification/setup","reference/limitations","features/assistant","reference/architecture","reference/source-coverage","features/matching","features/jev","journal/2026-09-16-source-evaluation","decisions/dashboard-ui","verification/history","guides/unraid","reference/geography","journal/2026-09-17-coverage-research","verification/index","discussions/open-questions"],"attachments":[],"html":"\u003cp>User request: “can we adopt jstack (../jstack) for this project? migrate all docs to wiki format”. Adoption applies to project documentation and verification; the application's React/Kumo/Fastify/SQLite runtime remains unchanged.\u003c/p>\n\u003ch2 id=\"migration\">Migration\u003c/h2>\n\u003cp>The former README was split into \u003ca href=\"#/guides/local-development\">local development\u003c/a>, \u003ca href=\"#/guides/workflow\">workflow\u003c/a>, feature pages, \u003ca href=\"#/guides/backups\">backups\u003c/a>, \u003ca href=\"#/verification/setup\">verification setup\u003c/a> and \u003ca href=\"#/reference/limitations\">limits\u003c/a>. Root README now links here. Existing substantive project documents moved as follows:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Former path\u003c/th>\n\u003cth>Wiki destination\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>docs/ASSISTANT.md\u003c/code>\u003c/td>\n\u003ctd>\u003ca href=\"#/features/assistant\">features/assistant.md\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>docs/BUILD_PLAN.md\u003c/code>\u003c/td>\n\u003ctd>\u003ca href=\"#/reference/architecture\">reference/architecture.md\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>docs/COVERAGE_EXPANSION.md\u003c/code>\u003c/td>\n\u003ctd>\u003ca href=\"#/reference/source-coverage\">reference/source-coverage.md\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>docs/MATCHING_AND_LISTING_QUALITY.md\u003c/code>\u003c/td>\n\u003ctd>\u003ca href=\"#/features/matching\">features/matching.md\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>docs/JEV.md\u003c/code>\u003c/td>\n\u003ctd>\u003ca href=\"#/features/jev\">features/jev.md\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>docs/SOURCE_EVALUATION.md\u003c/code>\u003c/td>\n\u003ctd>\u003ca href=\"#/journal/2026-09-16-source-evaluation\">journal/2026-09-16-source-evaluation.md\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>docs/UI_DESIGN.md\u003c/code>\u003c/td>\n\u003ctd>\u003ca href=\"#/decisions/dashboard-ui\">decisions/dashboard-ui.md\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>docs/VERIFICATION.md\u003c/code>\u003c/td>\n\u003ctd>\u003ca href=\"#/verification/history\">verification/history.md\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>deploy/unraid/README.md\u003c/code>\u003c/td>\n\u003ctd>\u003ca href=\"#/guides/unraid\">guides/unraid.md\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>data/geography/README.md\u003c/code>\u003c/td>\n\u003ctd>\u003ca href=\"#/reference/geography\">reference/geography.md\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>The source-coverage document was split into installed coverage and \u003ca href=\"#/journal/2026-09-17-coverage-research\">historical research\u003c/a>. Existing verification notes were preserved, including the uncommitted 3 October automatic LaTeX setup record. No historical run was promoted into a fresh pass. Original documentation snapshots are retained privately under \u003ccode>.local-data/wiki-migration/originals/\u003c/code> for migration comparison.\u003c/p>\n\u003ch2 id=\"corrections-and-boundaries\">Corrections and boundaries\u003c/h2>\n\u003cp>Current guides now reflect 57 source configurations, public-board upgrades for Wellfound/Welcome to the Jungle, cover-letter generation on Save, and the local city/country lookup. The Unraid guide no longer claims fresh installations contain a candidate profile. Candidate-specific authorization assertions were replaced with general field semantics; the local canonical profile remains untouched. These changes reconcile existing code and newer project requirements, not new product decisions.\u003c/p>\n\u003cp>\u003ccode>AGENTS.md\u003c/code> remains the authoritative agent entry point with updated links and a jstack maintenance section. \u003ccode>core/profile/skills/build-user-profile/SKILL.md\u003c/code> remains a runtime asset. Ignored \u003ccode>docs/MASTER_CV.md\u003c/code> and \u003ccode>data/candidate-profile.json\u003c/code> remain original local evidence. The dataset and Unraid folders retain short pointers, with GeoNames attribution kept beside its data.\u003c/p>\n\u003cp>The pre-existing LaTeX implementation changes remain in the working tree. This migration creates no commit, deployment, source scan or inference request. Private candidate evidence and old raw verification artifacts are not embedded in the reader.\u003c/p>\n\u003ch2 id=\"validation\">Validation\u003c/h2>\n\u003cp>See the \u003ca href=\"#/verification/index\">migration run\u003c/a>. Recipes for product features were mapped from actual scripts and historical checks, not rerun merely to reorganize documentation. External references were preserved without a new web-research pass. \u003ca href=\"#/discussions/open-questions\">Open follow-up\u003c/a> records the remaining configuration and verification limits.\u003c/p>\n","backlinks":["index","decisions/index","features/documentation"]},{"id":"reference/architecture","title":"Architecture","section":"Reference","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-10-07\u003c/span>","updated":"2026-10-07","summary":"","source":"---\ntitle: Architecture\nsection: Reference\nupdated: 2026-10-07\n---\n# Architecture\n\n## Runtime\n\n- React and TypeScript with Vite, official Cloudflare Kumo components, and CodeMirror.\n- Fastify HTTP API and static frontend serving in production.\n- SQLite through Node's built-in driver: WAL, versioned migrations, transactions, durable work queues and collection checkpoints.\n- A separate worker handles scheduling and serialized Codex generation. Supervisord runs API/worker together in the Unraid image, with automatic process restart.\n- Playwright/Chromium prints the editable HTML/CSS documents to PDF. The `docx` library produces an editable Word document with its own layout.\n- One locally built `linux/amd64` image, an Unraid XML template, and persistent `/config` appdata. No hosted domain or application login.\n- The [macOS desktop app](../features/desktop.md) bundles the same backend and frontend. A Go/Cocoa/WKWebView launcher owns the loopback API and separate worker process, single-instance lifecycle, native downloads and process cleanup. Appdata lives outside the bundle in Application Support.\n\n## Discovery\n\nHN monthly threads and YC jobs, Ashby, Greenhouse, Lever, RSS/Atom, X, Himalayas, Remote OK, Remotive, 4 Day Week, Arbeitnow, Jobicy, and Web3.career adapters normalize into a shared job record. Provider IDs and canonical URLs deduplicate incoming data. Matching uses an evidence-based deterministic rubric for role, technologies, domain, level and requirement gaps. Explicit eligibility conflicts are filterable separately from uncertain visa/relocation requirements. Cross-board duplicate groups retain every original record. Per-source description versions, source precedence, expiry and age-based staleness protect listing quality. See [the implemented matching and listing-quality design](../features/matching.md). Unknown compensation does not hide a job. The catalog supplies 57 configurations, including the 28-board public-page expansion, separate WWR categories, direct employer boards, VueJobs RSS and Web3.career pending configuration. Public-board adapters use a durable detail queue and bounded pagination; [coverage](source-coverage.md) distinguishes working, blocked and setup-pending entries. Manual entries never trigger source requests. RSS excerpts wait for complete descriptions before cover-letter generation. VueJobs supports bounded on-demand enrichment from a matching public job page (`core/vuejobs.ts`), triggered by Save or Load full description. Stored details survive subsequent feed excerpts; manual edits win. Lookups use one GET, a persistent six-per-day UTC cap, cooldowns, and the existing isolated HTTP transport. Other excerpt sources still require manual detail entry.\n\nDefault collection interval: four hours, with slower per-source intervals. Each source has at most six daily scans, per-scan request limits, conditional HTTP caching, rate-limit backoff, and resumable pagination. Manual scans honor provider cooldowns too (daily Himalayas, at most four Remotive scans/day). Large discovery boards refresh recent results while advancing a bounded backlog. Complete company-board snapshots mark missing listings closed; truncated discovery feeds do not. Already-expired incoming jobs are marked closed when an explicit expiry is supplied. Partial/failed scans retain jobs and progress. Saved records, notes, and CV history survive closure.\n\nX is a first-class adapter using official recent search. It supports editable saved searches, app-only bearer token entry, persistent fixed-window pagination, string post IDs, cross-search deduplication, and a shared monthly retrieval cap. Batch sizes and scheduled scan times divide the remaining allowance across the rest of the month and enabled searches; low budgets lengthen intervals because the API requires a minimum batch of ten. The historically selected local cap was 1,000 posts per UTC calendar month; current settings remain authoritative. Live access requires the user's developer account/token and any API credits required by X. No X user-context or engagement APIs are present.\n\n## Location filtering\n\nJobs and Saved share a grouped Kumo multi-select, with APAC/EMEA/Americas, SEA/East Asia first, and countries/areas within geographic groups. Cities and original labels appear in search. `core/location-index.ts` enriches original tokens with country and region facets using an offline GeoNames lookup; it leaves ambiguous names/codes and exclusions unresolved. Region selection expands to narrower known areas, while a regional-only posting never becomes a claim about a specific hiring country. Worldwide, Unspecified and Unresolved remain independent choices. Original source text, location scope and eligibility assessment are unchanged. The server alone loads the gazetteer; no runtime network geocoding or database migration is needed. [Data provenance and definitions](geography.md).\n\nSeen state is an optional first-open timestamp in each existing job document. `POST /api/jobs/:id/seen` atomically adds it once, preserving all other fields and avoiding CV/task changes. The regular job revision triggers invalidate query caches; `/api/jobs?seen=seen|unseen|all` applies the filter before duplicate grouping. GETs and default previews do not mark jobs seen. An explicit selection stays open across background updates even if its new Seen state removes it from Unseen results, until the user changes filters/pages or selects another job.\n\n## Dashboard data loading\n\n`GET /api/bootstrap` returns counts, task summaries without generation inputs, sources/settings and separate compact CV and cover-letter job choices. It does not load the job collection. Jobs/Saved request a filtered, sorted page from `/api/jobs`; only opening a detail pane requests `/api/jobs/:id`. Location options and master CV context have separate endpoints. Summary fields are explicitly allowlisted and exclude descriptions, notes, source histories and match evidence.\n\nFiltering uses a cached server-side collection index. Migration 003 adds transactional revision triggers for jobs, observations, tasks, CV versions and source identity changes, so worker writes invalidate the API cache across processes. A minute bucket also expires time-dependent freshness. Index rebuilding uses a single SQLite read snapshot. Memory and rebuild work remain proportional to collection size; this does not claim SQL-indexed search.\n\nETags allow unchanged reads to return bodyless 304 responses. The browser polls status every eight seconds sequentially while visible, then revalidates the current page/detail only when its revision changes. Search is debounced; superseded requests are aborted and cannot overwrite newer results. Network/JSON errors retain the last good response with Retry, and reads have a 15-second timeout.\n\n## Save to cover letter\n\n1. Saving a job records its review status and enqueues one idempotent first-save task.\n2. The task snapshots the description, profile revision, and template.\n3. The official Codex CLI uses the user's ChatGPT subscription, exact requested model `gpt-5.6-sol`, and high reasoning. Generation is serialized and has no shell, browser, plugins, connectors, or messaging tools.\n4. The output contains 3–5 first-person paragraphs with internal evidence references and separate review notes. The prompt targets 250–350 words and connects relevant experience to the opening. The application validates shape, evidence IDs, numeric claims, candidate evidence, and a 600-word ceiling; it adds a review note above 400 words. Name/contact/company/role/salutation/signature fields come from the application. These checks cannot establish semantic truth; the user reviews the result.\n5. A new cover-letter version is written transactionally to its own table. Manual edits and regeneration append versions, preserving prior work.\n6. The user reviews, edits, and downloads. No submission, employer upload, form filling, outreach, or engagement path exists.\n\nMissing descriptions wait for user input. Authentication, model, allowance, or generation failures preserve saved work and expose retry controls. The runtime manages its own official authentication state; there is no custom refresh logic or billing fallback.\n\n## Document management\n\nThe approved UI uses a source editor beside a rendered preview. The master is structured JSON with evidence references and explicit open questions. HTML/Handlebars and CSS are editable. Cover letters have separate version histories and independent edits. CV retains the master and legacy job-specific resumes; it no longer offers per-job generation. Migration 004 converts unfinished `cv` tasks to `cover_letter`, resets their document template, and pauses interrupted work. Completed resume records and task history remain unchanged. Saving/retrying uses cover-letter task keys and the worker only consumes that kind. `/api/cover-letters` exposes list/read/version/preview/export routes, separate from the retained `/api/cv` endpoints. Conflicting master edits are rejected by revision checking; successful master edits reassess job matches without changing existing drafts. Unsaved CV navigation prompts preserve deliberate review, while unfinished job notes are cached locally until saved. Loading failures can be retried, preview updates do not erase action errors, and editing/document switching is disabled during a save to prevent late responses from replacing newer input.\n\n## Verification and remaining configuration\n\n[Verification history](../verification/history.md) records the actual checks. [Local development](../guides/local-development.md) and [Unraid setup](../guides/unraid.md) cover operation. Historical checks verified authenticated X collection and the document browser workflow, including real Codex generation, editing/restoration, exports, controlled failures, keyboard use and mobile checks. Current configuration and allowance remain visible in Settings. The Unraid package was tested locally; actual server deployment and native amd64 LaTeX execution remain unverified. Optional WebMCP invocation also remains unverified.\n","toc":[{"id":"runtime","title":"Runtime","depth":2},{"id":"discovery","title":"Discovery","depth":2},{"id":"location-filtering","title":"Location filtering","depth":2},{"id":"dashboard-data-loading","title":"Dashboard data loading","depth":2},{"id":"save-to-cover-letter","title":"Save to
