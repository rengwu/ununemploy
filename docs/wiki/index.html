establish a candidate job-reading API. No automatic collector enabled.\n- **Welcome to the Jungle / Otta:** added manual job entry and the [candidate app](https://app.welcometothejungle.com/) link. The [candidate terms](https://us.welcometothejungle.com/terms-and-conditions/candidates) and [acceptable use policy](https://us.welcometothejungle.com/terms-and-conditions/acceptable-use-policy) were reviewed; no supported public automated reading route was established. No automatic collector enabled.\n\nAdditional sources established during implementation:\n\n- [Arbeitnow](https://www.arbeitnow.com/blog/job-board-api): public Germany and UK APIs, using the documented visa-sponsorship filter, twice daily. This is a discovery signal; confirm each employer's conditions. Both endpoints returned valid job arrays.\n- [Jobicy](https://github.com/Jobicy/remote-jobs-api): public API, 200 recent records per request, four scans daily. Preserve attribution and original listing URLs. Official guidance permits internal job-discovery products and requires polling no more often than hourly.\n- Direct career feeds confirmed from [LangChain](https://www.langchain.com/careers), [Cognition](https://cognition.com/careers), [Replit](https://replit.com/careers), [Figma](https://www.figma.com/careers/), [Notion](https://www.notion.com/careers), [Supabase](https://supabase.com/careers), and [Sourcegraph](https://sourcegraph.com/jobs). These use existing Ashby/Greenhouse adapters and run every six hours.\n\nThe tables below preserve the original evaluation decisions. Supported entries marked “Integrate” have now been added, with Web3.career implemented but awaiting its token. Some API marketing/documentation differs from returned data: 4 Day Week includes schedules such as generous PTO with 40-hour weeks; Remotive returned 15 records despite a requested one-record limit; LaraJobs descriptions were empty in the inspected RSS. The adapters retain those limitations instead of inventing missing fields.\n\n## Recommendation\n\nKeep X, Hacker News, and direct employer career feeds central. Add **Himalayas, We Work Remotely, Remote OK, Remotive, and 4 Day Week** next. These have documented public reading interfaces and relevant engineering coverage. Add **GolangProjects and LaraJobs** as smaller adjacent-role feeds. Web3.career is another practical option after obtaining its separate API token.\n\nWellfound, Arc, Welcome to the Jungle, Built In, and Remote.com deserve attention for their roles or employers, even though this review did not establish a ready-to-use public job-reading integration for them. Manual link capture and discovery of employers' own career feeds are useful routes.\n\nThis is an integration and relevance assessment, not a guarantee that every listing is current, genuine, or open to Malaysian applicants. Priority is our judgment based on the user's frontend, product, native/web, AI tooling, and leadership background. A reachable homepage alone does not establish job freshness or automation permission.\n\n## Duplicates and old names\n\nThere are **83 visible mentions and 67 distinct source labels** after obvious repeats and established aliases are consolidated. This is not a claim of 67 independent providers: some old shortened links remain unresolved, and JOBBOX has a historical relationship with Landing.jobs. The first image says “25” but only entries 1–22 are visible.\n\n- **AngelList Talent / angel.co/jobs / “Angle List” → Wellfound.** Confirmed by [Wellfound's history](https://wellfound.com/about-us).\n- **Remote OK / remoteok.io → remoteok.com.** The old domain redirects to the current site.\n- **Remotive / remotive.io → remotive.com.** Confirmed in its [API repository](https://github.com/remotive-com/remote-jobs-api).\n- **Otta / Welcome to the Jungle** are one entry in this inventory; the current candidate service is under Welcome to the Jungle.\n- Repeated Built In, DailyRemote, FlexJobs, JustRemote, NoDesk, Remote.co, SkipTheDrive, and We Work Remotely entries are each evaluated once.\n- **Remote.co and Remote.com are separate services.** Remote.com does have a [job board](https://remote.com/jobs), alongside its employment products.\n- **HN “Who is hiring?” threads, HN's `/jobs` page, hnhiring.me, and whoishiring.io are not interchangeable.** HN's `/jobs` is the YC company job feed. Its monthly hiring threads are a separate source. Do not assume the two third-party sites add independent inventory.\n- **JOBBOX.io and Landing.jobs use the same shortened link in the screenshot.** Landing's [own archive](https://wp.landing.jobs/blog/tag/landing-jobs/) contains its JOBBOX history. Keep the old label for traceability; do not build a connector against today's parked JOBBOX domain.\n\nThe `lnkd.in` destinations could not be resolved reliably by the research tool. Recognizable brands were checked at their official sites. Generic names such as “React.js Jobs,” “Full-stack developer Jobs,” and “remote-jobs” remain unresolved rather than being silently assigned to a similarly named website.\n\n## Public interfaces to prioritize\n\nThese are proposed schedules, not current application configuration. A scheduled scan can require several HTTP requests, so the implementation also needs a request/page budget per source. The user's five-to-six scans per day is a ceiling, not a requirement to poll every source that often.\n\n| Source | Interface and usefulness | Proposed cadence | Important constraints |\n| --- | --- | --- | --- |\n| [Himalayas](https://himalayas.app/docs/remote-jobs-api) | Free, no-auth JSON; country/timezone restrictions, seniority, salary period, full descriptions, expiry, stable IDs, cursor pagination. Especially useful for Malaysia eligibility. | Once daily | Documentation says data refreshes every 24 hours. Preserve source attribution and links; do not redistribute to other job boards. |\n| [We Work Remotely](https://weworkremotely.com/remote-job-rss-feed) | Official public RSS, including programming, frontend, full-stack, product, and design feeds. | 4/day initially | Feed use is expressly offered with links attributed back to WWR. Select a small feed set and deduplicate overlapping categories. |\n| [Remote OK](https://remoteok.com/api) | Public JSON linked from the site; title, tags, location, salary, descriptions and IDs. | 2–4/day | First array entry is legal metadata, not a job. Preserve attribution and required source link. Do not assume every “remote” listing is worldwide. Logo use has separate restrictions. |\n| [Remotive](https://github.com/remotive-com/remote-jobs-api) | Official free JSON API; location text and full descriptions. | 2/day initially; at most 4/day | Public API listings are delayed 24 hours. Credit and link Remotive; no onward redistribution to third-party boards. Actual response did not honor the requested one-item limit; enforce our own bounds. |\n| [4 Day Week](https://4dayweek.io/developers) | Free, no-auth v2 API with role, location, work arrangement, and work-schedule fields. Adds reduced-hours employers without making reduced hours a candidate requirement. | 2/day initially | Link back. Salary values, where provided, use cents. Documented rate limit is 60 requests/minute/IP, far above our intended use. Distinguish reduced hours from compressed schedules. |\n| [GolangProjects](https://www.golangprojects.com/) | Publisher-linked [RSS](https://www.golangprojects.com/rss.xml); adjacent backend, infrastructure, and developer-tool roles. | Once daily | Rank Go requirements against actual experience. Do not imply professional Go depth from general engineering experience. |\n| [LaraJobs](https://larajobs.com/) | Publisher-linked [RSS](https://larajobs.com/feed); Laravel plus React/Vue full-stack opportunities. | Once daily | Adjacent to older Laravel experience; check current backend requirements and hiring countries. |\n| [ClojureJobboard](https://clojurejobboard.com/) | Publisher-linked [RSS](https://clojurejobboard.com/rss.xml). | Once daily, optional | Lower priority because Clojure specialization is a larger career branch. |\n| [Web3.career](https://web3.career/web3-jobs-api) | Documented free JSON/RSS API; React, TypeScript, product, mobile, and infrastructure roles beyond smart contracts. | 1–2/day after token setup | Separate token required. [Official API docs](https://docs.bondex.app/api-reference/web3-career-jobs-api/api-overview) require source links and private token storage; no cursor/offset pagination. Endpoint verified in documentation, not authenticated in this review. |\n| [Hacker News](https://github.com/HackerNews/API) | Continue existing monthly-thread collection. Consider adding the official `jobstories` feed for the distinct YC job posts. | Existing bounded schedule | One thread can contain many comments. Preserve comment IDs, dates, and source links; follow employer links selectively when a description is incomplete. |\n\n### Live response checks\n\nRead-only checks against the advertised endpoints succeeded:\n\n| Source | Observed result |\n| --- | --- |\n| Himalayas | HTTP 200, valid JSON, one requested job; restriction, expiry, and description fields present. |\n| 4 Day Week | HTTP 200, valid JSON, one requested job, pagination metadata present. |\n| Remotive | HTTP 200, valid JSON, 15 jobs despite `limit=1`; response includes source-use conditions. This does not establish exhaustive board coverage. |\n| We Work Remotely | HTTP 200, parsed programming RSS with 25 items. |\n| GolangProjects | HTTP 200, parsed RSS with 10 items. |\n| LaraJobs | HTTP 200, parsed RSS with 10 items. |\n| ClojureJobboard | HTTP 200, parsed RSS with 3 items. |\n| Remote OK | Public JSON response inspected through the research tool; legal metadata and job records present. |\n\nCounts are response observations, not estimates of total active jobs or suitable matches. These checks did not import jobs into the application.\n\n## Complete inventory\n\n**Integrate:** a public reading interface was established. **Research:** useful potential source, but a current reading route or source conditions still need verification before automation. **Manual:** lower-priority board, subscription, or talent-network workflow. **Hold:** unavailable, changed, or insufficiently identified. “No verified feed” means this review did not establish one; it does not assert that none exists.\n\n### Original remote-board list\n\n| # | Source | Fit and current evidence | Decision |\n| --- | --- | --- | --- |\n| 1 | [Wellfound](https://wellfound.com/) | Strong startup/product/AI employer discovery. Candidate hiring-country filters still matter. [Terms](https://wellfound.com/terms) restrict copying/harvesting and automated load; this is not blanket permission to crawl. | **Research, high value.** Manual discovery and employer career feeds first; no verified public job-reading API. |\n| 2 | [Arc](https://arc.dev/remote-jobs) | Engineering jobs and a vetted talent network, with global/Malaysia browsing options. Permanent and freelance roles. | **Research.** Separate public-board discovery from manual network onboarding; no verified public reading feed. |\n| 3 | [Built In Remote](https://builtin.com/jobs/remote) | Relevant frontend, full-stack, product, and AI employers. Check country/state and authorization requirements per listing. | **Research.** Employer discovery is useful; public API/RSS and crawler permission not established. |\n| 4 | [DailyRemote](https://dailyremote.com/) | Broad remote inventory and location filters. [Terms](https://dailyremote.com/terms) require written permission for automated scraping/crawling/access. | **Manual or permission-based.** Do not schedule an HTML scraper. |\n| 5 | [FlexJobs](https://www.flexjobs.com/) | Broad curated flexible-work service; full access is subscription based. [Terms](https://www.flexjobs.com/termsofuse.aspx) restrict unauthorized copying/scraping. | **Manual, lower priority.** No purchase or automated access recommended for the first expansion. |\n| 6 | [Hacker News](https://news.ycombinator.com/submitted?id=whoishiring) | Strong organic founder/engineering discovery. Monthly hiring comments differ from the screenshot's [YC jobs page](https://news.ycombinator.com/jobs). | **Integrate/retain.** Already a core source; consider the separate official YC job feed. |\n| 7 | [Himalayas](https://himalayas.app/api) | Strong remote engineering coverage and unusually useful structured eligibility fields. | **Integrate first.** Daily public API, as detailed above. |\n| 8 | [Hubstaff Talent](https://hubstafftalent.net/) | Original `talent.hubstaff.com` redirects here. Global freelance/direct-hire directory, rather than a focused senior product-engineering board. | **Manual.** Useful contract fallback; no verified public reading feed. |\n| 9 | [JustRemote](https://justremote.co/) | Remote jobs plus paid PowerSearch. Relevant categories, but location restrictions require inspection. | **Research, secondary.** Start with public/manual discovery; no verified API/RSS. |\n| 10 | [NoDesk](https://nodesk.co/) | Remote technology, product, and design roles. [Terms](https://nodesk.co/legal/terms) describe personal/private use; no confirmed automation grant. | **Research, secondary.** No verified public job feed. |\n| 11 | [Welcome to the Jungle / Otta](https://www.welcometothejungle.com/en) | Strong product/startup fit. The former Otta service's [supported locations](https://support.welcometothejungle.com/en/articles/6882137-job-locations-we-support) focus on selected North American/European markets; distinguish relocation from Malaysia-remote eligibility. | **Research, high value.** No verified public reading integration. |\n| 12 | [Outsourcely](https://outsourcely.com/) | Current job inventory could not be retrieved or verified. | **Hold.** A failed retrieval is not evidence of permanent closure. |\n| 13 | [Pangian](https://pangian.com/) | Domain currently redirects to a [transition notice](https://pangianhq.github.io/pangian-com/), rather than an operational job feed. | **Hold.** Recheck if the service resumes; do not crawl the notice. |\n| 14 | [Remote.co](https://remote.co/) | Broad remote board, including international listings and geographically restricted roles. Separate from Remote.com. | **Research, secondary.** No verified public reading API/RSS. |\n| 15 | [RemoteHub](https://www.remotehub.com/) | Job/freelance marketplace. Root access was blocked; [official help](https://help.remotehub.com/hc/en-us/articles/360020973478-Is-RemoteHub-free) establishes the marketplace model, not current job-feed access. | **Manual/hold automation.** No verified public reading interface. |\n| 16 | [Remote OK](https://remoteok.com/) | Relevant remote engineering board; geography and broad tags need careful filtering. | **Integrate first.** Public JSON. Old `.io` domain is an alias. |\n| 17 | [Remotive](https://remotive.com/) | Relevant remote engineering source with descriptions and candidate-location text. | **Integrate first.** Public API with delayed data and at most four daily requests. |\n| 18 | [SkipTheDrive](https://www.skipthedrive.com/) | Free browsing with software/web categories. No official job-feed interface established. | **Research, secondary.** Do not assume a generic blog RSS feed contains jobs. |\n| 19 | [Turing](https://www.turing.com/) | Current offering includes AI coding evaluation/review work, which may fit harness experience, alongside other talent work. Inspect whether each opportunity is product ownership or evaluation contracting. | **Manual, worth considering.** Talent qualification/onboarding is separate from collection. |\n| 20 | [Toptal](https://www.toptal.com/) | Vetted freelance network; potentially useful for frontend/product contracts. | **Manual.** Network onboarding, not a verified public job-feed integration. |\n| 21 | [Virtual Vocations](https://www.virtualvocations.com/faq) | Curated remote jobs; free access is partial and full database access is paid. | **Manual, lower priority.** No verified public job-reading API. |\n| 22 | [We Work Remotely](https://weworkremotely.com/) | Relevant engineering, design, and product categories, with an explicitly offered public feed. | **Integrate first.** RSS with attribution. |\n\n### Additional names from the 2022 screenshots\n\n| # | Source | Fit and current evidence | Decision |\n| --- | --- | --- | --- |\n| 23 | [4 Day Week](https://4dayweek.io/) | Reduced-hours employers include relevant engineering roles. The user need not require a four-day schedule to benefit from this board. | **Integrate first.** Documented free v2 API. |\n| 24 | [Authentic Jobs](https://authenticjobs.com/) | Design/development positioning is relevant. Site responds, but current listing inventory and a supported API were not established. Historical API references are insufficient. | **Research.** Validate current jobs and interface before prioritizing a connector. |\n| 25 | [ClojureJobboard](https://clojurejobboard.com/) | Active specialist board with a working RSS feed. Larger language/stack branch than current frontend roles. | **Integrate optionally.** Low-cost, low-priority adjacent discovery. |\n| 26 | [Codestunts](https://codestunts.com/) | Current service and job inventory could not be verified. | **Hold.** Old screenshot alone is insufficient. |\n| 27 | Crypto Jobs — [original link](https://lnkd.in/dQp-wMYs) | Exact shortened destination unresolved. [CryptoJobs at crypto.jobs](https://crypto.jobs/) is a plausible brand match and has live listings, including frontend/AI roles, but that mapping is not confirmed. | **Research.** Preserve ambiguity; do not silently substitute CryptoJobsList or another crypto board. |\n| 28 | [Cryptocurrency Jobs](https://cryptocurrencyjobs.co/) | Active specialist board with frontend/product opportunities alongside blockchain-specific roles. | **Research, secondary.** No verified public feed in this review; distinguish cash compensation from tokens/equity. |\n| 29 | [Diversify Tech](https://www.diversifytech.com/) | Current site identifies career opportunities for marginalized people in tech, but readable inventory was unavailable. Old `.co` addresses failed. | **Research.** Verify current job service/access; assess listing eligibility without assuming the user's identity. |\n| 30 | [Dribbble Jobs](https://dribbble.com/jobs) | Active design job board; useful mainly for design engineering, UI/UX, and creative development branches. Screenshot spells it “Dribble.” | **Research, secondary.** No verified public job API/RSS. |\n| 31 | [FindBacon](https://findbacon.com/) | Current site/inventory could not be verified. | **Hold.** Historically relevant naming does not establish a functioning source. |\n| 32 | [freelancermap](https://www.freelancermap.com/) | Active IT contract marketplace with remote, hybrid, and onsite projects. Location and client-language requirements matter. | **Manual.** Useful contract branch; no verified public reading feed. |\n| 33 | Full-stack developer Jobs — [original link](https://lnkd.in/d4gpyzvy) | Generic label; exact destination unresolved. | **Hold identification.** Full-stack roles are a strong fit, but a specific provider is not established. |\n| 34 | [GolangProjects](https://www.golangprojects.com/) | Active Go board with working RSS; developer tooling/infrastructure are plausible adjacent areas. | **Integrate next.** Rank by actual Go requirements. |\n| 35 | GraphQL Jobs — [original link](https://lnkd.in/dPWKyzEU) | Exact destination unresolved; `graphql.jobs` could not be verified as a functioning current board. | **Hold.** GraphQL can remain a search keyword in working sources. |\n| 36 | [Guru](https://www.guru.com/) | Freelance marketplace candidate; current site content could not be retrieved in this review. | **Manual/hold automation.** No confirmed current reading API or feed. |\n| 37 | [HackerX](https://hackerx.org/) | Recruiting events and talent matching, with engineering skill coverage. | **Manual.** Potential discovery/network channel, not an established scheduled vacancy feed. |\n| 38 | [Hasjob](https://hasjob.co/) | Active board; inspected listings were largely India-oriented and mixed in seniority. | **Research, lower priority.** Retain explicitly global/relocation-compatible roles; public reading interface unverified. |\n| 39 | [HigherEdJobs](https://www.higheredjobs.com/) | Potential university software/research-computing branch. Site and putative RSS page did not expose usable inventory in this check. | **Hold automation.** Current access/feed unverified; do not confuse academic faculty qualifications with software-role requirements. |\n| 40 | [HN Hiring](https://hnhiring.me/) | Current site access could not be verified. Would need to show incremental value over collecting HN's original hiring threads. | **Hold.** Prefer official HN data already covered. |\n| 41 | [JOBBOX.io](https://jobbox.io/) | Current domain redirects to parking. Historical JOBBOX material exists in Landing.jobs' own archive; both labels share one screenshot short link. | **Hold as legacy alias.** No separate connector. |\n| 42 | [Jobhunt.ai](https://jobhunt.ai/) | Current service and inventory could not be verified. | **Hold.** Do not infer current capabilities from the name. |\n| 43 | [Jobspresso](https://jobspresso.co/) | Reachable board with development/product categories. Search also surfaced very old listing pages, so validate opening status at the employer. | **Research.** Useful potential source; no verified official jobs API/RSS. |\n| 44 | [Landing.jobs](https://landing.jobs/) | Tech-career service with European/remote positioning in its [own archive](https://wp.landing.jobs/blog/tag/landing-jobs/). Current main site returned 403. | **Research/manual.** Potential relocation value; current inventory and automation route not verified. |\n| 45 | [LaraJobs](https://larajobs.com/) | Active Laravel board with working RSS; React/Vue full-stack roles can fit previous experience. | **Integrate next.** Adjacent rather than a required stack preference. |\n| 46 | [No Fluff Jobs](https://nofluffjobs.com/pl/) | Active tech board with visible salary ranges; inspected market is Poland/CEE. Relevant frontend/full-stack/AI categories. | **Research.** Useful relocation branch; verify work country, language, and sponsorship per job. No public feed established. |\n| 47 | [PowerToFly](https://powertofly.com/jobs/) | Active job board emphasizing inclusive employers, with engineering opportunities. | **Research, secondary.** No verified public reading API; use job requirements rather than demographic assumptions. |\n| 48 | [Remote Game Jobs](https://remotegamejobs.com/) | Active specialist board; game UI, native tooling, and developer tools may fit. Engine-specific gameplay roles may require a larger transition. | **Research, secondary.** No official reading feed verified. |\n| 49 | [remote-es/remotes](https://github.com/remote-es/remotes) | Company directory focused on remote work with Spanish contracts. Not a stream of current openings. | **Employer discovery only.** Follow suitable company career sources; do not convert every directory entry into a vacancy. |\n| 50 | remote-jobs — [original link](https://lnkd.in/duVv2aw5) | Generic name with unresolved destination. | **Hold identification.** Cannot responsibly select a same-named repository or board. |\n| 51 | [Remotees](https://remotees.com/) | Current site/inventory could not be verified. | **Hold.** No connector until availability and unique coverage are established. |\n| 52 | RemotExtra — [original link](https://lnkd.in/dQFa_-ZN) | Shortened destination and a functioning current board could not be established. | **Hold.** Do not substitute a similarly named service. |\n| 53 | [RemoteJobs.lat](https://remotejobs.lat/) | Active Spanish-language LATAM-oriented board. | **Research, lower priority.** Include globally eligible roles or feasible relocation; LATAM residence requirements are not citizenship requirements. |\n| 54 | [Remote People](https://remotepeople.io/) | Supplied `.io` domain showed a directory/index rather than usable job listings. Do not conflate it with other similarly named recruiting sites. | **Hold.** No current vacancy feed established. |\n| 55 | Remote Works — [original link](https://lnkd.in/dZ59-iCY) | Generic name; exact destination unresolved. A similarly named podcast does not establish the screenshot's destination. | **Hold identification.** |\n| 56 | [Ruby on Remote](https://rubyonremote.com/) | Active Ruby/Rails job board. Full-stack frontend work may be adjacent; Ruby-specific seniority needs evidence. | **Research, lower priority.** No official feed verified. |\n| 57 | [Slasify](https://slasify.com/) | Current site presents payroll/global employment services, not an established public multi-employer job feed. | **Employer discovery only.** Its own careers may be relevant; do not assume access to client-company vacancies. |\n| 58 | Stack Overflow Jobs | The original service is historical; an [Indeed-powered version appeared in 2024](https://stackoverflow.blog/2024/07/01/community-products-roadmap-update-july-2024-an-update-on-recent-launches-and-the-upcoming-roadmap/), so “closed in 2022” alone is incomplete. Current [`/jobs`](https://stackoverflow.com/jobs) returned 404 and [stackoverflowjobs.com](https://stackoverflowjobs.com/) redirected to questions. | **Hold.** No functioning current jobs destination verified. |\n| 59 | [SwissDevJobs](https://swissdevjobs.ch/) | Primary-domain [job pages](https://swissdevjobs.ch/de/jobs/Backend/all) show technical roles and salary ranges despite root-access issues. Relevant to relocation. | **Research.** No public reading API/RSS established; check language and sponsorship explicitly. |\n| 60 | [Upwork](https://www.upwork.com/) | Active freelance marketplace. Official developer documentation exists, but this review did not establish the user's approved job-search API access. | **Manual.** Consider read-only integration only after access/terms verification; never add proposal or bidding automation. |\n| 61 | [VueJobs](https://vuejobs.com/) | Active and directly relevant to frontend/full-stack experience. | **Research, high value.** No current public API/RSS verified; investigate employer career feeds. |\n| 62 | React.js Jobs — [original link](https://lnkd.in/dyW5WNwu) | Very relevant category, but exact provider unresolved. | **Hold identification.** Keep React searches across working sources; do not assume ReactJobsBoard is the intended destination. |\n| 63 | [Remote.com Jobs](https://remote.com/jobs) | Working public job board, in addition to Remote's employment products. Includes technical and nontechnical roles. | **Research.** Relevant global-employer discovery; no public job-reading API/RSS established. |\n| 64 | Web3Jobs — [original link](https://lnkd.in/dZc-eKGG) | Short-link mapping is unconfirmed, but [web3.career](https://web3.career/) is an independently verified current board with a documented API. Frontend/product roles offer relevant coverage. | **Integrate web3.career optionally after token setup.** Preserve the original-link uncertainty. |\n| 65 | We Love Go — [original link](https://lnkd.in/dT7tYSBQ) | Operator's [historical post](https://gist.github.com/jonathaningram/5b334274d6bc91554687e64608322419) identifies `welovegolang.com`; current board access failed. | **Hold.** Use working GolangProjects feed for this branch. |\n\n### Final nine-domain screenshot: new names\n\n| # | Source | Fit and current evidence | Decision |\n| --- | --- | --- | --- |\n| 66 | [whoishiring.io](https://whoishiring.io/) | Domain responds, but no readable job inventory or supported interface could be established. Do not assume it is HN's official hiring service. | **Hold/research.** Needs a functioning current search and evidence of additional coverage. |\n| 67 | [The Ladders](https://www.theladders.com/) | Active service positioning around $100K+ professional roles, with premium application/CV services. That salary positioning does not itself establish Malaysia eligibility or strong product-engineering coverage. | **Manual, lower priority.** No verified public reading feed; its application automation is outside this product's scope. |\n\n## What this means for the collector\n\n1. **Use adapters for supported APIs and job RSS first.** HTML parsing is a later source-specific decision after checking current terms and access rules. Low frequency does not itself grant permission. Do not bypass login walls, CAPTCHAs, blocks, or paywalls.\n2. **Discover employers, then follow their supported career feeds.** A good board without a public API can still identify relevant companies. Follow an employer source under its own supported access route; do not reverse-engineer a board's private browser endpoints as a substitute for permission.\n3. **Deduplicate jobs as well as websites.** Match canonical employer/application URLs and provider requisition IDs first, then normalized company/title/location. Preserve all discovery links. Avoid merging separate locations or requisitions solely because titles match.\n4. **Keep eligibility separate from fit.** Store residence, allowed work countries, timezone overlap, relocation, sponsorship, existing work authorization, and citizenship restrictions separately. “Remote US” is not “US citizens only”; it is also not evidence of permission to work remotely from Malaysia. Keep unknowns visible.\n5. **Measure incremental value.** Track relevant unique jobs, duplicate rate, explicit Malaysia/global eligibility, description completeness, stale/closed jobs, request cost, and connector failures. Promote sources that add useful opportunities, not merely the most records.\n6. **Treat salary as evidence with units.** Preserve original currency, annual/monthly/hourly period, cash versus equity/tokens, and employer-stated versus estimated figures. Do not discard missing salaries given the user's flexibility.\n7. **Keep X distinct from board aggregation.** X is already a required organic source with an approved 1,000-post monthly retrieval allowance. Extra boards should not consume or replace that budget. Keep the current account settings intact during this evaluation.\n8. **Preserve the existing action boundary.** Reading listings and generating private CV drafts are permitted. No applications, account/profile publication, submissions, recruiter contact, messages, follows, reactions, or approval-to-send workflow.\n\n## Open checks before later integrations\n\n- Confirm full-description fields, pagination, conditional requests, source-specific page budgets, and expiry behavior in each adapter. One successful response is not a complete connector test.\n- Resolve generic old shortened links only if their current destination becomes available; they do not block the verified integrations.\n- Review a small sample of current employer openings to compare relevant unique coverage. This review did not estimate match rates from marketing job counts.\n- Obtain a separate Web3.career token only if that optional source is selected. No account was created and no credential was requested or used during this assessment.\n- Revisit source terms when actually implementing, because interfaces and permissions can change.\n\nThe initial evaluation changed documentation only. The later authorized implementation is recorded at the top of this report. No employer-facing action was added.\n","toc":[{"id":"coverage-expansion-17-september-2026","title":"Coverage expansion — 17 September 2026","depth":2},{"id":"implementation-update","title":"Implementation update","depth":2},{"id":"vuejobs-detail-follow-up-17-september-2026","title":"VueJobs detail follow-up — 17 September 2026","depth":3},{"id":"follow-up-additions-16-september-2026","title":"Follow-up additions — 16 September 2026","depth":3},{"id":"recommendation","title":"Recommendation","depth":2},{"id":"duplicates-and-old-names","title":"Duplicates and old names","depth":2},{"id":"public-interfaces-to-prioritize","title":"Public interfaces to prioritize","depth":2},{"id":"live-response-checks","title":"Live response checks","depth":3},{"id":"complete-inventory","title":"Complete inventory","depth":2},{"id":"original-remote-board-list","title":"Original remote-board list","depth":3},{"id":"additional-names-from-the-2022-screenshots","title":"Additional names from the 2022 screenshots","depth":3},{"id":"final-nine-domain-screenshot-new-names","title":"Final nine-domain screenshot: new names","depth":3},{"id":"what-this-means-for-the-collector","title":"What this means for the collector","depth":2},{"id":"open-checks-before-later-integrations","title":"Open checks before later integrations","depth":2}],"titleAnchor":"job-source-evaluation-september-2026","links":["reference/source-coverage","features/discovery","reference/source-coverage","verification/history"],"attachments":[],"html":"\u003cp>Historical research from 16–17 September 2026, migrated without rechecking external sites. Counts, access results, recommendations and older CV terminology describe that period. Later public-board collection supersedes the original API-first/manual-only conclusions. Use \u003ca href=\"#/reference/source-coverage\">source coverage\u003c/a> and \u003ca href=\"#/features/discovery\">discovery\u003c/a> for the implemented contract.\u003c/p>\n\u003cp>Reviewed: 16 September 2026. Scope: all visible sources in the user's screenshots, including the final nine-domain list.\u003c/p>\n\u003ch2 id=\"coverage-expansion-17-september-2026\">Coverage expansion — 17 September 2026\u003c/h2>\n\u003cp>The user has expanded the research scope to low-frequency public-page scraping, including sources without official APIs. See the \u003ca href=\"#/reference/source-coverage\">new coverage audit and prioritized adapter backlog\u003c/a>, with local HTTP/browser/detail probes. Hiredly, LinkedIn public jobs, Wellfound, Built In, YC's broader directory, Japan Dev, Cake and Arc are the recommended first batch. Site restrictions and technical access are recorded separately. The earlier API-first/manual-only decisions below are historical. All 28 evaluated boards are now in the scan list; see the linked document’s current status table for verified imports, blocked sources and pending API configuration.\u003c/p>\n\u003ch2 id=\"implementation-update\">Implementation update\u003c/h2>\n\u003cp>After this evaluation, the user authorized adding as many supported sources as possible. \u003cstrong>21 new configurations are installed and live-verified\u003c/strong>, bringing the workspace to 27 configured sources at that stage. The follow-up below adds four more, for 31 total. They cover the five recommended boards; WWR programming/design/product feeds; GolangProjects, LaraJobs, ClojureJobboard; HN's separate YC jobs feed; two Arbeitnow markets; Jobicy; and seven employer feeds. See \u003ca href=\"#/verification/history\">verification\u003c/a> and the catalog (\u003ccode>core/source-catalog.ts\u003c/code>).\u003c/p>\n\u003ch3 id=\"vuejobs-detail-follow-up-17-september-2026\">VueJobs detail follow-up — 17 September 2026\u003c/h3>\n\u003cp>The LINE MAN Wongnai listing's RSS description ends with an ellipsis, while its \u003ca href=\"https://vuejobs.com/jobs/line-man-wongnai-senior-software-engineer-fullstack-vue-js-python\" rel=\"noreferrer\">public job page\u003c/a> contains the full body and matching JobPosting structured data. The feed parser retained all supplied text; the missing step was fetching public details. Added on-demand retrieval on Save or Load full description, with a one-request lookup budget, six requests per UTC day, persistent cooldowns, identity/visible-text checks and description provenance. Full text survives feed refreshes and cannot overwrite manual edits. The first fetch recovered 2,231 plain-text characters for this listing. Gated or unavailable pages stay excerpts; this does not change the earlier restriction against bypassing PRO access.\u003c/p>\n\u003ch3 id=\"follow-up-additions-16-september-2026\">Follow-up additions — 16 September 2026\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>VueJobs:\u003c/strong> added the \u003ca href=\"https://app.vuejobs.com/feed/posts\" rel=\"noreferrer\">RSS feed\u003c/a> advertised by an RSS alternate link in \u003ca href=\"https://vuejobs.com/\" rel=\"noreferrer\">VueJobs’ homepage\u003c/a>. One live request imported 923 excerpts, all with employer and location fields. Runs twice daily. The app subdomain’s generic robots file disallows crawling; this integration consumes only the explicitly advertised syndication feed, with no crawling of app/detail pages. \u003ca href=\"https://vuejobs.com/terms-of-use\" rel=\"noreferrer\">Terms reviewed\u003c/a>. Public job pages advertise a seven-day PRO window for new listings; the integration does not bypass it. RSS entries remain leads and CV generation waits for the complete description.\u003c/li>\n\u003cli>\u003cstrong>Web3.career:\u003c/strong> implemented official JSON collection and local token configuration. The \u003ca href=\"https://docs.bondex.app/api-reference/web3-career-jobs-api/api-reference\" rel=\"noreferrer\">API reference\u003c/a> and \u003ca href=\"https://docs.bondex.app/api-reference/openapi-documentation/models\" rel=\"noreferrer\">response models\u003c/a> document the mixed metadata/jobs array, unmodified \u003ccode>apply_url\u003c/code>, and optional description/location fields. One request reads up to 100 listings, twice daily. No live authenticated scan yet; missing credentials cause zero requests.\u003c/li>\n\u003cli>\u003cstrong>Wellfound:\u003c/strong> added manual job entry and a direct board link. Its \u003ca href=\"https://wellfound.com/terms\" rel=\"noreferrer\">terms\u003c/a> restrict harvesting/copying except where permitted; public search pages and employer ATS integrations did not establish a candidate job-reading API. No automatic collector enabled.\u003c/li>\n\u003cli>\u003cstrong>Welcome to the Jungle / Otta:\u003c/strong> added manual job entry and the \u003ca href=\"https://app.welcometothejungle.com/\" rel=\"noreferrer\">candidate app\u003c/a> link. The \u003ca href=\"https://us.welcometothejungle.com/terms-and-conditions/candidates\" rel=\"noreferrer\">candidate terms\u003c/a> and \u003ca href=\"https://us.welcometothejungle.com/terms-and-conditions/acceptable-use-policy\" rel=\"noreferrer\">acceptable use policy\u003c/a> were reviewed; no supported public automated reading route was established. No automatic collector enabled.\u003c/li>\n\u003c/ul>\n\u003cp>Additional sources established during implementation:\u003c/p>\n\u003cul>\n\u003cli>\u003ca href=\"https://www.arbeitnow.com/blog/job-board-api\" rel=\"noreferrer\">Arbeitnow\u003c/a>: public Germany and UK APIs, using the documented visa-sponsorship filter, twice daily. This is a discovery signal; confirm each employer's conditions. Both endpoints returned valid job arrays.\u003c/li>\n\u003cli>\u003ca href=\"https://github.com/Jobicy/remote-jobs-api\" rel=\"noreferrer\">Jobicy\u003c/a>: public API, 200 recent records per request, four scans daily. Preserve attribution and original listing URLs. Official guidance permits internal job-discovery products and requires polling no more often than hourly.\u003c/li>\n\u003cli>Direct career feeds confirmed from \u003ca href=\"https://www.langchain.com/careers\" rel=\"noreferrer\">LangChain\u003c/a>, \u003ca href=\"https://cognition.com/careers\" rel=\"noreferrer\">Cognition\u003c/a>, \u003ca href=\"https://replit.com/careers\" rel=\"noreferrer\">Replit\u003c/a>, \u003ca href=\"https://www.figma.com/careers/\" rel=\"noreferrer\">Figma\u003c/a>, \u003ca href=\"https://www.notion.com/careers\" rel=\"noreferrer\">Notion\u003c/a>, \u003ca href=\"https://supabase.com/careers\" rel=\"noreferrer\">Supabase\u003c/a>, and \u003ca href=\"https://sourcegraph.com/jobs\" rel=\"noreferrer\">Sourcegraph\u003c/a>. These use existing Ashby/Greenhouse adapters and run every six hours.\u003c/li>\n\u003c/ul>\n\u003cp>The tables below preserve the original evaluation decisions. Supported entries marked “Integrate” have now been added, with Web3.career implemented but awaiting its token. Some API marketing/documentation differs from returned data: 4 Day Week includes schedules such as generous PTO with 40-hour weeks; Remotive returned 15 records despite a requested one-record limit; LaraJobs descriptions were empty in the inspected RSS. The adapters retain those limitations instead of inventing missing fields.\u003c/p>\n\u003ch2 id=\"recommendation\">Recommendation\u003c/h2>\n\u003cp>Keep X, Hacker News, and direct employer career feeds central. Add \u003cstrong>Himalayas, We Work Remotely, Remote OK, Remotive, and 4 Day Week\u003c/strong> next. These have documented public reading interfaces and relevant engineering coverage. Add \u003cstrong>GolangProjects and LaraJobs\u003c/strong> as smaller adjacent-role feeds. Web3.career is another practical option after obtaining its separate API token.\u003c/p>\n\u003cp>Wellfound, Arc, Welcome to the Jungle, Built In, and Remote.com deserve attention for their roles or employers, even though this review did not establish a ready-to-use public job-reading integration for them. Manual link capture and discovery of employers' own career feeds are useful routes.\u003c/p>\n\u003cp>This is an integration and relevance assessment, not a guarantee that every listing is current, genuine, or open to Malaysian applicants. Priority is our judgment based on the user's frontend, product, native/web, AI tooling, and leadership background. A reachable homepage alone does not establish job freshness or automation permission.\u003c/p>\n\u003ch2 id=\"duplicates-and-old-names\">Duplicates and old names\u003c/h2>\n\u003cp>There are \u003cstrong>83 visible mentions and 67 distinct source labels\u003c/strong> after obvious repeats and established aliases are consolidated. This is not a claim of 67 independent providers: some old shortened links remain unresolved, and JOBBOX has a historical relationship with Landing.jobs. The first image says “25” but only entries 1–22 are visible.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>AngelList Talent / angel.co/jobs / “Angle List” → Wellfound.\u003c/strong> Confirmed by \u003ca href=\"https://wellfound.com/about-us\" rel=\"noreferrer\">Wellfound's history\u003c/a>.\u003c/li>\n\u003cli>\u003cstrong>Remote OK / remoteok.io → remoteok.com.\u003c/strong> The old domain redirects to the current site.\u003c/li>\n\u003cli>\u003cstrong>Remotive / remotive.io → remotive.com.\u003c/strong> Confirmed in its \u003ca href=\"https://github.com/remotive-com/remote-jobs-api\" rel=\"noreferrer\">API repository\u003c/a>.\u003c/li>\n\u003cli>\u003cstrong>Otta / Welcome to the Jungle\u003c/strong> are one entry in this inventory; the current candidate service is under Welcome to the Jungle.\u003c/li>\n\u003cli>Repeated Built In, DailyRemote, FlexJobs, JustRemote, NoDesk, Remote.co, SkipTheDrive, and We Work Remotely entries are each evaluated once.\u003c/li>\n\u003cli>\u003cstrong>Remote.co and Remote.com are separate services.\u003c/strong> Remote.com does have a \u003ca href=\"https://remote.com/jobs\" rel=\"noreferrer\">job board\u003c/a>, alongside its employment products.\u003c/li>\n\u003cli>\u003cstrong>HN “Who is hiring?” threads, HN's \u003ccode>/jobs\u003c/code> page, hnhiring.me, and whoishiring.io are not interchangeable.\u003c/strong> HN's \u003ccode>/jobs\u003c/code> is the YC company job feed. Its monthly hiring threads are a separate source. Do not assume the two third-party sites add independent inventory.\u003c/li>\n\u003cli>\u003cstrong>JOBBOX.io and Landing.jobs use the same shortened link in the screenshot.\u003c/strong> Landing's \u003ca href=\"https://wp.landing.jobs/blog/tag/landing-jobs/\" rel=\"noreferrer\">own archive\u003c/a> contains its JOBBOX history. Keep the old label for traceability; do not build a connector against today's parked JOBBOX domain.\u003c/li>\n\u003c/ul>\n\u003cp>The \u003ccode>lnkd.in\u003c/code> destinations could not be resolved reliably by the research tool. Recognizable brands were checked at their official sites. Generic names such as “React.js Jobs,” “Full-stack developer Jobs,” and “remote-jobs” remain unresolved rather than being silently assigned to a similarly named website.\u003c/p>\n\u003ch2 id=\"public-interfaces-to-prioritize\">Public interfaces to prioritize\u003c/h2>\n\u003cp>These are proposed schedules, not current application configuration. A scheduled scan can require several HTTP requests, so the implementation also needs a request/page budget per source. The user's five-to-six scans per day is a ceiling, not a requirement to poll every source that often.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Source\u003c/th>\n\u003cth>Interface and usefulness\u003c/th>\n\u003cth>Proposed cadence\u003c/th>\n\u003cth>Important constraints\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ca href=\"https://himalayas.app/docs/remote-jobs-api\" rel=\"noreferrer\">Himalayas\u003c/a>\u003c/td>\n\u003ctd>Free, no-auth JSON; country/timezone restrictions, seniority, salary period, full descriptions, expiry, stable IDs, cursor pagination. Especially useful for Malaysia eligibility.\u003c/td>\n\u003ctd>Once daily\u003c/td>\n\u003ctd>Documentation says data refreshes every 24 hours. Preserve source attribution and links; do not redistribute to other job boards.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"https://weworkremotely.com/remote-job-rss-feed\" rel=\"noreferrer\">We Work Remotely\u003c/a>\u003c/td>\n\u003ctd>Official public RSS, including programming, frontend, full-stack, product, and design feeds.\u003c/td>\n\u003ctd>4/day initially\u003c/td>\n\u003ctd>Feed use is expressly offered with links attributed back to WWR. Select a small feed set and deduplicate overlapping categories.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"https://remoteok.com/api\" rel=\"noreferrer\">Remote OK\u003c/a>\u003c/td>\n\u003ctd>Public JSON linked from the site; title, tags, location, salary, descriptions and IDs.\u003c/td>\n\u003ctd>2–4/day\u003c/td>\n\u003ctd>First array entry is legal metadata, not a job. Preserve attribution and required source link. Do not assume every “remote” listing is worldwide. Logo use has separate restrictions.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"https://github.com/remotive-com/remote-jobs-api\" rel=\"noreferrer\">Remotive\u003c/a>\u003c/td>\n\u003ctd>Official free JSON API; location text and full descriptions.\u003c/td>\n\u003ctd>2/day initially; at most 4/day\u003c/td>\n\u003ctd>Public API listings are delayed 24 hours. Credit and link Remotive; no onward redistribution to third-party boards. Actual response did not honor the requested one-item limit; enforce our own bounds.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"https://4dayweek.io/developers\" rel=\"noreferrer\">4 Day Week\u003c/a>\u003c/td>\n\u003ctd>Free, no-auth v2 API with role, location, work arrangement, and work-schedule fields. Adds reduced-hours employers without making reduced hours a candidate requirement.\u003c/td>\n\u003ctd>2/day initially\u003c/td>\n\u003ctd>Link back. Salary values, where provided, use cents. Documented rate limit is 60 requests/minute/IP, far above our intended use. Distinguish reduced hours from compressed schedules.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"https://www.golangprojects.com/\" rel=\"noreferrer\">GolangProjects\u003c/a>\u003c/td>\n\u003ctd>Publisher-linked \u003ca href=\"https://www.golangprojects.com/rss.xml\" rel=\"noreferrer\">RSS\u003c/a>; adjacent backend, infrastructure, and developer-tool roles.\u003c/td>\n\u003ctd>Once daily\u003c/td>\n\u003ctd>Rank Go requirements against actual experience. Do not imply professional Go depth from general engineering experience.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"https://larajobs.com/\" rel=\"noreferrer\">LaraJobs\u003c/a>\u003c/td>\n\u003ctd>Publisher-linked \u003ca href=\"https://larajobs.com/feed\" rel=\"noreferrer\">RSS\u003c/a>; Laravel plus React/Vue full-stack opportunities.\u003c/td>\n\u003ctd>Once daily\u003c/td>\n\u003ctd>Adjacent to older Laravel experience; check current backend requirements and hiring countries.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"https://clojurejobboard.com/\" rel=\"noreferrer\">ClojureJobboard\u003c/a>\u003c/td>\n\u003ctd>Publisher-linked \u003ca href=\"https://clojurejobboard.com/rss.xml\" rel=\"noreferrer\">RSS\u003c/a>.\u003c/td>\n\u003ctd>Once daily, optional\u003c/td>\n\u003ctd>Lower priority because Clojure specialization is a larger career branch.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"https://web3.career/web3-jobs-api\" rel=\"noreferrer\">Web3.career\u003c/a>\u003c/td>\n\u003ctd>Documented free JSON/RSS API; React, TypeScript, product, mobile, and infrastructure roles beyond smart contracts.\u003c/td>\n\u003ctd>1–2/day after token setup\u003c/td>\n\u003ctd>Separate token required. \u003ca href=\"https://docs.bondex.app/api-reference/web3-career-jobs-api/api-overview\" rel=\"noreferrer\">Official API docs\u003c/a> require source links and private token storage; no cursor/offset pagination. Endpoint verified in documentation, not authenticated in this review.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"https://github.com/HackerNews/API\" rel=\"noreferrer\">Hacker News\u003c/a>\u003c/td>\n\u003ctd>Continue existing monthly-thread collection. Consider adding the official \u003ccode>jobstories\u003c/code> feed for the distinct YC job posts.\u003c/td>\n\u003ctd>Existing bounded schedule\u003c/td>\n\u003ctd>One thread can contain many comments. Preserve comment IDs, dates, and source links; follow employer links selectively when a description is incomplete.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3 id=\"live-response-checks\">Live response checks\u003c/h3>\n\u003cp>Read-only checks against the advertised endpoints succeeded:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Source\u003c/th>\n\u003cth>Observed result\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Himalayas\u003c/td>\n\u003ctd>HTTP 200, valid JSON, one requested job; restriction, expiry, and description fields present.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4 Day Week\u003c/td>\n\u003ctd>HTTP 200, valid JSON, one requested job, pagination metadata present.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Remotive\u003c/td>\n\u003ctd>HTTP 200, valid JSON, 15 jobs despite \u003ccode>limit=1\u003c/code>; response includes source-use conditions. This does not establish exhaustive board coverage.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>We Work Remotely\u003c/td>\n\u003ctd>HTTP 200, parsed programming RSS with 25 items.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>GolangProjects\u003c/td>\n\u003ctd>HTTP 200, parsed RSS with 10 items.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>LaraJobs\u003c/td>\n\u003ctd>HTTP 200, parsed RSS with 10 items.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ClojureJobboard\u003c/td>\n\u003ctd>HTTP 200, parsed RSS with 3 items.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Remote OK\u003c/td>\n\u003ctd>Public JSON response inspected through the research tool; legal metadata and job records present.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Counts are response observations, not estimates of total active jobs or suitable matches. These checks did not import jobs into the application.\u003c/p>\n\u003ch2 id=\"complete-inventory\">Complete inventory\u003c/h2>\n\u003cp>\u003cstrong>Integrate:\u003c/strong> a public reading interface was established. \u003cstrong>Research:\u003c/strong> useful potential source, but a current reading route or source conditions still need verification before automation. \u003cstrong>Manual:\u003c/strong> lower-priority board, subscription, or talent-network workflow. \u003cstrong>Hold:\u003c/strong> unavailable, changed, or insufficiently identified. “No verified feed” means this review did not establish one; it does not assert that none exists.\u003c/p>\n\u003ch3 id=\"original-remote-board-list\">Original remote-board list\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>#\u003c/th>\n\u003cth>Source\u003c/th>\n\u003cth>Fit and current evidence\u003c/th>\n\u003cth>Decision\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>\u003ca href=\"https://wellfound.com/\" rel=\"noreferrer\">Wellfound\u003c/a>\u003c/td>\n\u003ctd>Strong startup/product/AI employer discovery. Candidate hiring-country filters still matter. \u003ca href=\"https://wellfound.com/terms\" rel=\"noreferrer\">Terms\u003c/a> restrict copying/harvesting and automated load; this is not blanket permission to crawl.\u003c/td>\n\u003ctd>\u003cstrong>Research, high value.\u003c/strong> Manual discovery and employer career feeds first; no verified public job-reading API.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>\u003ca href=\"https://arc.dev/remote-jobs\" rel=\"noreferrer\">Arc\u003c/a>\u003c/td>\n\u003ctd>Engineering jobs and a vetted talent network, with global/Malaysia browsing options. Permanent and freelance roles.\u003c/td>\n\u003ctd>\u003cstrong>Research.\u003c/strong> Separate public-board discovery from manual network onboarding; no verified public reading feed.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>\u003ca href=\"https://builtin.com/jobs/remote\" rel=\"noreferrer\">Built In Remote\u003c/a>\u003c/td>\n\u003ctd>Relevant frontend, full-stack, product, and AI employers. Check country/state and authorization requirements per listing.\u003c/td>\n\u003ctd>\u003cstrong>Research.\u003c/strong> Employer discovery is useful; public API/RSS and crawler permission not established.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>\u003ca href=\"https://dailyremote.com/\" rel=\"noreferrer\">DailyRemote\u003c/a>\u003c/td>\n\u003ctd>Broad remote inventory and location filters. \u003ca href=\"https://dailyremote.com/terms\" rel=\"noreferrer\">Terms\u003c/a> require written permission for automated scraping/crawling/access.\u003c/td>\n\u003ctd>\u003cstrong>Manual or permission-based.\u003c/strong> Do not schedule an HTML scraper.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>\u003ca href=\"https://www.flexjobs.com/\" rel=\"noreferrer\">FlexJobs\u003c/a>\u003c/td>\n\u003ctd>Broad curated flexible-work service; full access is subscription based. \u003ca href=\"https://www.flexjobs.com/termsofuse.aspx\" rel=\"noreferrer\">Terms\u003c/a> restrict unauthorized copying/scraping.\u003c/td>\n\u003ctd>\u003cstrong>Manual, lower priority.\u003c/strong> No purchase or automated access recommended for the first expansion.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>\u003ca href=\"https://news.ycombinator.com/submitted?id=whoishiring\" rel=\"noreferrer\">Hacker News\u003c/a>\u003c/td>\n\u003ctd>Strong organic founder/engineering discovery. Monthly hiring comments differ from the screenshot's \u003ca href=\"https://news.ycombinator.com/jobs\" rel=\"noreferrer\">YC jobs page\u003c/a>.\u003c/td>\n\u003ctd>\u003cstrong>Integrate/retain.\u003c/strong> Already a core source; consider the separate official YC job feed.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7\u003c/td>\n\u003ctd>\u003ca href=\"https://himalayas.app/api\" rel=\"noreferrer\">Himalayas\u003c/a>\u003c/td>\n\u003ctd>Strong remote engineering coverage and unusually useful structured eligibility fields.\u003c/td>\n\u003ctd>\u003cstrong>Integrate first.\u003c/strong> Daily public API, as detailed above.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>8\u003c/td>\n\u003ctd>\u003ca href=\"https://hubstafftalent.net/\" rel=\"noreferrer\">Hubstaff Talent\u003c/a>\u003c/td>\n\u003ctd>Original \u003ccode>talent.hubstaff.com\u003c/code> redirects here. Global freelance/direct-hire directory, rather than a focused senior product-engineering board.\u003c/td>\n\u003ctd>\u003cstrong>Manual.\u003c/strong> Useful contract fallback; no verified public reading feed.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>9\u003c/td>\n\u003ctd>\u003ca href=\"https://justremote.co/\" rel=\"noreferrer\">JustRemote\u003c/a>\u003c/td>\n\u003ctd>Remote jobs plus paid PowerSearch. Relevant categories, but location restrictions require inspection.\u003c/td>\n\u003ctd>\u003cstrong>Research, secondary.\u003c/strong> Start with public/manual discovery; no verified API/RSS.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>10\u003c/td>\n\u003ctd>\u003ca href=\"https://nodesk.co/\" rel=\"noreferrer\">NoDesk\u003c/a>\u003c/td>\n\u003ctd>Remote technology, product, and design roles. \u003ca href=\"https://nodesk.co/legal/terms\" rel=\"noreferrer\">Terms\u003c/a> describe personal/private use; no confirmed automation grant.\u003c/td>\n\u003ctd>\u003cstrong>Research, secondary.\u003c/strong> No verified public job feed.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>11\u003c/td>\n\u003ctd>\u003ca href=\"https://www.welcometothejungle.com/en\" rel=\"noreferrer\">Welcome to the Jungle / Otta\u003c/a>\u003c/td>\n\u003ctd>Strong product/startup fit. The former Otta service's \u003ca href=\"https://support.welcometothejungle.com/en/articles/6882137-job-locations-we-support\" rel=\"noreferrer\">supported locations\u003c/a> focus on selected North American/European markets; distinguish relocation from Malaysia-remote eligibility.\u003c/td>\n\u003ctd>\u003cstrong>Research, high value.\u003c/strong> No verified public reading integration.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>12\u003c/td>\n\u003ctd>\u003ca href=\"https://outsourcely.com/\" rel=\"noreferrer\">Outsourcely\u003c/a>\u003c/td>\n\u003ctd>Current job inventory could not be retrieved or verified.\u003c/td>\n\u003ctd>\u003cstrong>Hold.\u003c/strong> A failed retrieval is not evidence of permanent closure.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>13\u003c/td>\n\u003ctd>\u003ca href=\"https://pangian.com/\" rel=\"noreferrer\">Pangian\u003c/a>\u003c/td>\n\u003ctd>Domain currently redirects to a \u003ca href=\"https://pangianhq.github.io/pangian-com/\" rel=\"noreferrer\">transition notice\u003c/a>, rather than an operational job feed.\u003c/td>\n\u003ctd>\u003cstrong>Hold.\u003c/strong> Recheck if the service resumes; do not crawl the notice.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>14\u003c/td>\n\u003ctd>\u003ca href=\"https://remote.co/\" rel=\"noreferrer\">Remote.co\u003c/a>\u003c/td>\n\u003ctd>Broad remote board, including international listings and geographically restricted roles. Separate from Remote.com.\u003c/td>\n\u003ctd>\u003cstrong>Research, secondary.\u003c/strong> No verified public reading API/RSS.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>15\u003c/td>\n\u003ctd>\u003ca href=\"https://www.remotehub.com/\" rel=\"noreferrer\">RemoteHub\u003c/a>\u003c/td>\n\u003ctd>Job/freelance marketplace. Root access was blocked; \u003ca href=\"https://help.remotehub.com/hc/en-us/articles/360020973478-Is-RemoteHub-free\" rel=\"noreferrer\">official help\u003c/a> establishes the marketplace model, not current job-feed access.\u003c/td>\n\u003ctd>\u003cstrong>Manual/hold automation.\u003c/strong> No verified public reading interface.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>16\u003c/td>\n\u003ctd>\u003ca href=\"https://remoteok.com/\" rel=\"noreferrer\">Remote OK\u003c/a>\u003c/td>\n\u003ctd>Relevant remote engineering board; geography and broad tags need careful filtering.\u003c/td>\n\u003ctd>\u003cstrong>Integrate first.\u003c/strong> Public JSON. Old \u003ccode>.io\u003c/code> domain is an alias.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>17\u003c/td>\n\u003ctd>\u003ca href=\"https://remotive.com/\" rel=\"noreferrer\">Remotive\u003c/a>\u003c/td>\n\u003ctd>Relevant remote engineering source with descriptions and candidate-location text.\u003c/td>\n\u003ctd>\u003cstrong>Integrate first.\u003c/strong> Public API with delayed data and at most four daily requests.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>18\u003c/td>\n\u003ctd>\u003ca href=\"https://www.skipthedrive.com/\" rel=\"noreferrer\">SkipTheDrive\u003c/a>\u003c/td>\n\u003ctd>Free browsing with software/web categories. No official job-feed interface established.\u003c/td>\n\u003ctd>\u003cstrong>Research, secondary.\u003c/strong> Do not assume a generic blog RSS feed contains jobs.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>19\u003c/td>\n\u003ctd>\u003ca href=\"https://www.turing.com/\" rel=\"noreferrer\">Turing\u003c/a>\u003c/td>\n\u003ctd>Current offering includes AI coding evaluation/review work, which may fit harness experience, alongside other talent work. Inspect whether each opportunity is product ownership or evaluation contracting.\u003c/td>\n\u003ctd>\u003cstrong>Manual, worth considering.\u003c/strong> Talent qualification/onboarding is separate from collection.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>20\u003c/td>\n\u003ctd>\u003ca href=\"https://www.toptal.com/\" rel=\"noreferrer\">Toptal\u003c/a>\u003c/td>\n\u003ctd>Vetted freelance network; potentially useful for frontend/product contracts.\u003c/td>\n\u003ctd>\u003cstrong>Manual.\u003c/strong> Network onboarding, not a verified public job-feed integration.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>21\u003c/td>\n\u003ctd>\u003ca href=\"https://www.virtualvocations.com/faq\" rel=\"noreferrer\">Virtual Vocations\u003c/a>\u003c/td>\n\u003ctd>Curated remote jobs; free access is partial and full database access is paid.\u003c/td>\n\u003ctd>\u003cstrong>Manual, lower priority.\u003c/strong> No verified public job-reading API.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>22\u003c/td>\n\u003ctd>\u003ca href=\"https://weworkremotely.com/\" rel=\"noreferrer\">We Work Remotely\u003c/a>\u003c/td>\n\u003ctd>Relevant engineering, design, and product categories, with an explicitly offered public feed.\u003c/td>\n\u003ctd>\u003cstrong>Integrate first.\u003c/strong> RSS with attribution.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3 id=\"additional-names-from-the-2022-screenshots\">Additional names from the 2022 screenshots\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>#\u003c/th>\n\u003cth>Source\u003c/th>\n\u003cth>Fit and current evidence\u003c/th>\n\u003cth>Decision\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>23\u003c/td>\n\u003ctd>\u003ca href=\"https://4dayweek.io/\" rel=\"noreferrer\">4 Day Week\u003c/a>\u003c/td>\n\u003ctd>Reduced-hours employers include relevant engineering roles. The user need not require a four-day schedule to benefit from this board.\u003c/td>\n\u003ctd>\u003cstrong>Integrate first.\u003c/strong> Documented free v2 API.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>24\u003c/td>\n\u003ctd>\u003ca href=\"https://authenticjobs.com/\" rel=\"noreferrer\">Authentic Jobs\u003c/a>\u003c/td>\n\u003ctd>Design/development positioning is relevant. Site responds, but current listing inventory and a supported API were not established. Historical API references are insufficient.\u003c/td>\n\u003ctd>\u003cstrong>Research.\u003c/strong> Validate current jobs and interface before prioritizing a connector.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>25\u003c/td>\n\u003ctd>\u003ca href=\"https://clojurejobboard.com/\" rel=\"noreferrer\">ClojureJobboard\u003c/a>\u003c/td>\n\u003ctd>Active specialist board with a working RSS feed. Larger language/stack branch than current frontend roles.\u003c/td>\n\u003ctd>\u003cstrong>Integrate optionally.\u003c/strong> Low-cost, low-priority adjacent discovery.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>26\u003c/td>\n\u003ctd>\u003ca href=\"https://codestunts.com/\" rel=\"noreferrer\">Codestunts\u003c/a>\u003c/td>\n\u003ctd>Current service and job inventory could not be verified.\u003c/td>\n\u003ctd>\u003cstrong>Hold.\u003c/strong> Old screenshot alone is insufficient.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>27\u003c/td>\n\u003ctd>Crypto Jobs — \u003ca href=\"https://lnkd.in/dQp-wMYs\" rel=\"noreferrer\">original link\u003c/a>\u003c/td>\n\u003ctd>Exact shortened destination unresolved. \u003ca href=\"https://crypto.jobs/\" rel=\"noreferrer\">CryptoJobs at crypto.jobs\u003c/a> is a plausible brand match and has live listings, including frontend/AI roles, but that mapping is not confirmed.\u003c/td>\n\u003ctd>\u003cstrong>Research.\u003c/strong> Preserve ambiguity; do not silently substitute CryptoJobsList or another crypto board.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>28\u003c/td>\n\u003ctd>\u003ca href=\"https://cryptocurrencyjobs.co/\" rel=\"noreferrer\">Cryptocurrency Jobs\u003c/a>\u003c/td>\n\u003ctd>Active specialist board with frontend/product opportunities alongside blockchain-specific roles.\u003c/td>\n\u003ctd>\u003cstrong>Research, secondary.\u003c/strong> No verified public feed in this review; distinguish cash compensation from tokens/equity.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>29\u003c/td>\n\u003ctd>\u003ca href=\"https://www.diversifytech.com/\" rel=\"noreferrer\">Diversify Tech\u003c/a>\u003c/td>\n\u003ctd>Current site identifies career opportunities for marginalized people in tech, but readable inventory was unavailable. Old \u003ccode>.co\u003c/code> addresses failed.\u003c/td>\n\u003ctd>\u003cstrong>Research.\u003c/strong> Verify current job service/access; assess listing eligibility without assuming the user's identity.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>30\u003c/td>\n\u003ctd>\u003ca href=\"https://dribbble.com/jobs\" rel=\"noreferrer\">Dribbble Jobs\u003c/a>\u003c/td>\n\u003ctd>Active design job board; useful mainly for design engineering, UI/UX, and creative development branches. Screenshot spells it “Dribble.”\u003c/td>\n\u003ctd>\u003cstrong>Research, secondary.\u003c/strong> No verified public job API/RSS.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>31\u003c/td>\n\u003ctd>\u003ca href=\"https://findbacon.com/\" rel=\"noreferrer\">FindBacon\u003c/a>\u003c/td>\n\u003ctd>Current site/inventory could not be verified.\u003c/td>\n\u003ctd>\u003cstrong>Hold.\u003c/strong> Historically relevant naming does not establish a functioning source.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>32\u003c/td>\n\u003ctd>\u003ca href=\"https://www.freelancermap.com/\" rel=\"noreferrer\">freelancermap\u003c/a>\u003c/td>\n\u003ctd>Active IT contract marketplace with remote, hybrid, and onsite projects. Location and client-language requirements matter.\u003c/td>\n\u003ctd>\u003cstrong>Manual.\u003c/strong> Useful contract branch; no verified public reading feed.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>33\u003c/td>\n\u003ctd>Full-stack developer Jobs — \u003ca href=\"https://lnkd.in/d4gpyzvy\" rel=\"noreferrer\">original link\u003c/a>\u003c/td>\n\u003ctd>Generic label; exact destination unresolved.\u003c/td>\n\u003ctd>\u003cstrong>Hold identification.\u003c/strong> Full-stack roles are a strong fit, but a specific provider is not established.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>34\u003c/td>\n\u003ctd>\u003ca href=\"https://www.golangprojects.com/\" rel=\"noreferrer\">GolangProjects\u003c/a>\u003c/td>\n\u003ctd>Active Go board with working RSS; developer tooling/infrastructure are plausible adjacent areas.\u003c/td>\n\u003ctd>\u003cstrong>Integrate next.\u003c/strong> Rank by actual Go requirements.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>35\u003c/td>\n\u003ctd>GraphQL Jobs — \u003ca href=\"https://lnkd.in/dPWKyzEU\" rel=\"noreferrer\">original link\u003c/a>\u003c/td>\n\u003ctd>Exact destination unresolved; \u003ccode>graphql.jobs\u003c/code> could not be verified as a functioning current board.\u003c/td>\n\u003ctd>\u003cstrong>Hold.\u003c/strong> GraphQL can remain a search keyword in working sources.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>36\u003c/td>\n\u003ctd>\u003ca href=\"https://www.guru.com/\" rel=\"noreferrer\">Guru\u003c/a>\u003c/td>\n\u003ctd>Freelance marketplace candidate; current site content could not be retrieved in this review.\u003c/td>\n\u003ctd>\u003cstrong>Manual/hold automation.\u003c/strong> No confirmed current reading API or feed.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>37\u003c/td>\n\u003ctd>\u003ca href=\"https://hackerx.org/\" rel=\"noreferrer\">HackerX\u003c/a>\u003c/td>\n\u003ctd>Recruiting events and talent matching, with engineering skill coverage.\u003c/td>\n\u003ctd>\u003cstrong>Manual.\u003c/strong> Potential discovery/network channel, not an established scheduled vacancy feed.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>38\u003c/td>\n\u003ctd>\u003ca href=\"https://hasjob.co/\" rel=\"noreferrer\">Hasjob\u003c/a>\u003c/td>\n\u003ctd>Active board; inspected listings were largely India-oriented and mixed in seniority.\u003c/td>\n\u003ctd>\u003cstrong>Research, lower priority.\u003c/strong> Retain explicitly global/relocation-compatible roles; public reading interface unverified.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>39\u003c/td>\n\u003ctd>\u003ca href=\"https://www.higheredjobs.com/\" rel=\"noreferrer\">HigherEdJobs\u003c/a>\u003c/td>\n\u003ctd>Potential university software/research-computing branch. Site and putative RSS page did not expose usable inventory in this check.\u003c/td>\n\u003ctd>\u003cstrong>Hold automation.\u003c/strong> Current access/feed unverified; do not confuse academic faculty qualifications with software-role requirements.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>40\u003c/td>\n\u003ctd>\u003ca href=\"https://hnhiring.me/\" rel=\"noreferrer\">HN Hiring\u003c/a>\u003c/td>\n\u003ctd>Current site access could not be verified. Would need to show incremental value over collecting HN's original hiring threads.\u003c/td>\n\u003ctd>\u003cstrong>Hold.\u003c/strong> Prefer official HN data already covered.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>41\u003c/td>\n\u003ctd>\u003ca href=\"https://jobbox.io/\" rel=\"noreferrer\">JOBBOX.io\u003c/a>\u003c/td>\n\u003ctd>Current domain redirects to parking. Historical JOBBOX material exists in Landing.jobs' own archive; both labels share one screenshot short link.\u003c/td>\n\u003ctd>\u003cstrong>Hold as legacy alias.\u003c/strong> No separate connector.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>42\u003c/td>\n\u003ctd>\u003ca href=\"https://jobhunt.ai/\" rel=\"noreferrer\">Jobhunt.ai\u003c/a>\u003c/td>\n\u003ctd>Current service and inventory could not be verified.\u003c/td>\n\u003ctd>\u003cstrong>Hold.\u003c/strong> Do not infer current capabilities from the name.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>43\u003c/td>\n\u003ctd>\u003ca href=\"https://jobspresso.co/\" rel=\"noreferrer\">Jobspresso\u003c/a>\u003c/td>\n\u003ctd>Reachable board with development/product categories. Search also surfaced very old listing pages, so validate opening status at the employer.\u003c/td>\n\u003ctd>\u003cstrong>Research.\u003c/strong> Useful potential source; no verified official jobs API/RSS.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>44\u003c/td>\n\u003ctd>\u003ca href=\"https://landing.jobs/\" rel=\"noreferrer\">Landing.jobs\u003c/a>\u003c/td>\n\u003ctd>Tech-career service with European/remote positioning in its \u003ca href=\"https://wp.landing.jobs/blog/tag/landing-jobs/\" rel=\"noreferrer\">own archive\u003c/a>. Current main site returned 403.\u003c/td>\n\u003ctd>\u003cstrong>Research/manual.\u003c/strong> Potential relocation value; current inventory and automation route not verified.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>45\u003c/td>\n\u003ctd>\u003ca href=\"https://larajobs.com/\" rel=\"noreferrer\">LaraJobs\u003c/a>\u003c/td>\n\u003ctd>Active Laravel board with working RSS; React/Vue full-stack roles can fit previous experience.\u003c/td>\n\u003ctd>\u003cstrong>Integrate next.\u003c/strong> Adjacent rather than a required stack preference.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>46\u003c/td>\n\u003ctd>\u003ca href=\"https://nofluffjobs.com/pl/\" rel=\"noreferrer\">No Fluff Jobs\u003c/a>\u003c/td>\n\u003ctd>Active tech board with visible salary ranges; inspected market is Poland/CEE. Relevant frontend/full-stack/AI categories.\u003c/td>\n\u003ctd>\u003cstrong>Research.\u003c/strong> Useful relocation branch; verify work country, language, and sponsorship per job. No public feed established.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>47\u003c/td>\n\u003ctd>\u003ca href=\"https://powertofly.com/jobs/\" rel=\"noreferrer\">PowerToFly\u003c/a>\u003c/td>\n\u003ctd>Active job board emphasizing inclusive employers, with engineering opportunities.\u003c/td>\n\u003ctd>\u003cstrong>Research, secondary.\u003c/strong> No verified public reading API; use job requirements rather than demographic assumptions.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>48\u003c/td>\n\u003ctd>\u003ca href=\"https://remotegamejobs.com/\" rel=\"noreferrer\">Remote Game Jobs\u003c/a>\u003c/td>\n\u003ctd>Active specialist board; game UI, native tooling, and developer tools may fit. Engine-specific gameplay roles may require a larger transition.\u003c/td>\n\u003ctd>\u003cstrong>Research, secondary.\u003c/strong> No official reading feed verified.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>49\u003c/td>\n\u003ctd>\u003ca href=\"https://github.com/remote-es/remotes\" rel=\"noreferrer\">remote-es/remotes\u003c/a>\u003c/td>\n\u003ctd>Company directory focused on remote work with Spanish contracts. Not a stream of current openings.\u003c/td>\n\u003ctd>\u003cstrong>Employer discovery only.\u003c/strong> Follow suitable company career sources; do not convert every directory entry into a vacancy.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>50\u003c/td>\n\u003ctd>remote-jobs — \u003ca href=\"https://lnkd.in/duVv2aw5\" rel=\"noreferrer\">original link\u003c/a>\u003c/td>\n\u003ctd>Generic name with unresolved destination.\u003c/td>\n\u003ctd>\u003cstrong>Hold identification.\u003c/strong> Cannot responsibly select a same-named repository or board.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>51\u003c/td>\n\u003ctd>\u003ca href=\"https://remotees.com/\" rel=\"noreferrer\">Remotees\u003c/a>\u003c/td>\n\u003ctd>Current site/inventory could not be verified.\u003c/td>\n\u003ctd>\u003cstrong>Hold.\u003c/strong> No connector until availability and unique coverage are established.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>52\u003c/td>\n\u003ctd>RemotExtra — \u003ca href=\"https://lnkd.in/dQFa_-ZN\" rel=\"noreferrer\">original link\u003c/a>\u003c/td>\n\u003ctd>Shortened destination and a functioning current board could not be established.\u003c/td>\n\u003ctd>\u003cstrong>Hold.\u003c/strong> Do not substitute a similarly named service.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>53\u003c/td>\n\u003ctd>\u003ca href=\"https://remotejobs.lat/\" rel=\"noreferrer\">RemoteJobs.lat\u003c/a>\u003c/td>\n\u003ctd>Active Spanish-language LATAM-oriented board.\u003c/td>\n\u003ctd>\u003cstrong>Research, lower priority.\u003c/strong> Include globally eligible roles or feasible relocation; LATAM residence requirements are not citizenship requirements.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>54\u003c/td>\n\u003ctd>\u003ca href=\"https://remotepeople.io/\" rel=\"noreferrer\">Remote People\u003c/a>\u003c/td>\n\u003ctd>Supplied \u003ccode>.io\u003c/code> domain showed a directory/index rather than usable job listings. Do not conflate it with other similarly named recruiting sites.\u003c/td>\n\u003ctd>\u003cstrong>Hold.\u003c/strong> No current vacancy feed established.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>55\u003c/td>\n\u003ctd>Remote Works — \u003ca href=\"https://lnkd.in/dZ59-iCY\" rel=\"noreferrer\">original link\u003c/a>\u003c/td>\n\u003ctd>Generic name; exact destination unresolved. A similarly named podcast does not establish the screenshot's destination.\u003c/td>\n\u003ctd>\u003cstrong>Hold identification.\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>56\u003c/td>\n\u003ctd>\u003ca href=\"https://rubyonremote.com/\" rel=\"noreferrer\">Ruby on Remote\u003c/a>\u003c/td>\n\u003ctd>Active Ruby/Rails job board. Full-stack frontend work may be adjacent; Ruby-specific seniority needs evidence.\u003c/td>\n\u003ctd>\u003cstrong>Research, lower priority.\u003c/strong> No official feed verified.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>57\u003c/td>\n\u003ctd>\u003ca href=\"https://slasify.com/\" rel=\"noreferrer\">Slasify\u003c/a>\u003c/td>\n\u003ctd>Current site presents payroll/global employment services, not an established public multi-employer job feed.\u003c/td>\n\u003ctd>\u003cstrong>Employer discovery only.\u003c/strong> Its own careers may be relevant; do not assume access to client-company vacancies.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>58\u003c/td>\n\u003ctd>Stack Overflow Jobs\u003c/td>\n\u003ctd>The original service is historical; an \u003ca href=\"https://stackoverflow.blog/2024/07/01/community-products-roadmap-update-july-2024-an-update-on-recent-launches-and-the-upcoming-roadmap/\" rel=\"noreferrer\">Indeed-powered version appeared in 2024\u003c/a>, so “closed in 2022” alone is incomplete. Current \u003ca href=\"https://stackoverflow.com/jobs\" rel=\"noreferrer\">\u003ccode>/jobs\u003c/code>\u003c/a> returned 404 and \u003ca href=\"https://stackoverflowjobs.com/\" rel=\"noreferrer\">stackoverflowjobs.com\u003c/a> redirected to questions.\u003c/td>\n\u003ctd>\u003cstrong>Hold.\u003c/strong> No functioning current jobs destination verified.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>59\u003c/td>\n\u003ctd>\u003ca href=\"https://swissdevjobs.ch/\" rel=\"noreferrer\">SwissDevJobs\u003c/a>\u003c/td>\n\u003ctd>Primary-domain \u003ca href=\"https://swissdevjobs.ch/de/jobs/Backend/all\" rel=\"noreferrer\">job pages\u003c/a> show technical roles and salary ranges despite root-access issues. Relevant to relocation.\u003c/td>\n\u003ctd>\u003cstrong>Research.\u003c/strong> No public reading API/RSS established; check language and sponsorship explicitly.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>60\u003c/td>\n\u003ctd>\u003ca href=\"https://www.upwork.com/\" rel=\"noreferrer\">Upwork\u003c/a>\u003c/td>\n\u003ctd>Active freelance marketplace. Official developer documentation exists, but this review did not establish the user's approved job-search API access.\u003c/td>\n\u003ctd>\u003cstrong>Manual.\u003c/strong> Consider read-only integration only after access/terms verification; never add proposal or bidding automation.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>61\u003c/td>\n\u003ctd>\u003ca href=\"https://vuejobs.com/\" rel=\"noreferrer\">VueJobs\u003c/a>\u003c/td>\n\u003ctd>Active and directly relevant to frontend/full-stack experience.\u003c/td>\n\u003ctd>\u003cstrong>Research, high value.\u003c/strong> No current public API/RSS verified; investigate employer career feeds.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>62\u003c/td>\n\u003ctd>React.js Jobs — \u003ca href=\"https://lnkd.in/dyW5WNwu\" rel=\"noreferrer\">original link\u003c/a>\u003c/td>\n\u003ctd>Very relevant category, but exact provider unresolved.\u003c/td>\n\u003ctd>\u003cstrong>Hold identification.\u003c/strong> Keep React searches across working sources; do not assume ReactJobsBoard is the intended destination.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>63\u003c/td>\n\u003ctd>\u003ca href=\"https://remote.com/jobs\" rel=\"noreferrer\">Remote.com Jobs\u003c/a>\u003c/td>\n\u003ctd>Working public job board, in addition to Remote's employment products. Includes technical and nontechnical roles.\u003c/td>\n\u003ctd>\u003cstrong>Research.\u003c/strong> Relevant global-employer discovery; no public job-reading API/RSS established.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>64\u003c/td>\n\u003ctd>Web3Jobs — \u003ca href=\"https://lnkd.in/dZc-eKGG\" rel=\"noreferrer\">original link\u003c/a>\u003c/td>\n\u003ctd>Short-link mapping is unconfirmed, but \u003ca href=\"https://web3.career/\" rel=\"noreferrer\"
