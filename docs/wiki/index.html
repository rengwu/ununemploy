003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/reference/limitations\">Limitations\u003c/a> and \u003ca href=\"#/discussions/open-questions\">open follow-up\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"verification-and-history\">Verification and history\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"#/verification/setup\">Verification setup\u003c/a>, \u003ca href=\"#/verification/index\">runs\u003c/a>, and \u003ca href=\"#/verification/history\">historical checks\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/journal/2026-09-16-source-evaluation\">Source evaluation — September 2026\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/journal/2026-09-17-coverage-research\">Coverage research — 17 September 2026\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/journal/2026-10-07-jstack-migration\">jstack adoption — 7 October 2026\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/journal/2026-10-07-desktop\">Native desktop packaging — 7 October 2026\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"maintain-this-wiki\">Maintain this wiki\u003c/h2>\n\u003cp>Follow \u003ca href=\"#/guides/documentation\">documentation maintenance\u003c/a>. Markdown is authoritative; build \u003ccode>docs/wiki/index.html\u003c/code> with \u003ccode>node docs/wiki/_build.mjs\u003c/code> and validate it with \u003ccode>node docs/wiki/_build.mjs --check\u003c/code>. The generated reader opens locally without a server. Private candidate evidence, credentials, application records and generated CVs stay outside this wiki.\u003c/p>\n","backlinks":[]},{"id":"decisions/dashboard-ui","title":"Dashboard UI","section":"Decisions","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-10-07\u003c/span>","updated":"2026-10-07","summary":"","source":"---\ntitle: Dashboard UI\nsection: Decisions\nupdated: 2026-10-07\n---\n# Dashboard UI\n\nStatus: implemented locally with Kumo. See [verification history](../verification/history.md) for the scope of browser checks.\n\n## User decisions\n\n- Follow Cloudflare's dashboard and use official Kumo components.\n- No ornamental labels, captions, subcaptions, subtitles, or flourishes. Every string must serve a task.\n- Name actions plainly: Save, Edit, Dismiss, Retry, Download PDF, Download DOCX. These are examples for existing product actions, not a finalized toolbar.\n- Keep the app fully local.\n- The user approved the job inbox with filters and a detail pane, and the CV source editor with rendered preview. Career facts remain structured and CV presentation remains editable.\n\n## Component system\n\nUse React, TypeScript, and Vite for the frontend. Kumo requires React and React DOM; use `@cloudflare/kumo` and its Phosphor icon peer dependency. This replaces the proposed SvelteKit frontend. The Node.js backend, worker, SQLite database, and Unraid deployment remain local. [Kumo installation](https://kumo-ui.com/installation/), [Vite guide](https://vite.dev/guide/).\n\nUse Kumo semantic colors and supported component variants. Let its tokens carry theme differences. Prefer styled components; use primitives only when the library lacks the needed control. Consult component APIs before implementation. [Kumo colors](https://kumo-ui.com/colors/), [component documentation](https://kumo-ui.com/components/button/).\n\nKumo blocks are adaptable examples. Optional descriptions and documentation panels in a demo are not requirements for this product. Omit them when they conflict with the user's direction. [Resource list block](https://kumo-ui.com/blocks/resource-list/).\n\n## Cloudflare design guidance\n\nApply the official [kumo-design skill](https://github.com/cloudflare/kumo/blob/main/skills/kumo-design/SKILL.md), also published in the [design guide](https://kumo-ui.com/skill/). Research notes:\n\n- Content and controls use 14px; larger sizes belong to headings.\n- Sentence-case headings; preserve product names.\n- Preserve font tracking. Use semibold headings and medium inline emphasis.\n- Group related text; account for line height in padding.\n- Hover colors change immediately.\n- Use rings with shadows and borders for sticky separators.\n- Closely nested corners use concentric radii.\n- Align icons with the first text line; reduce inline monospace size slightly.\n- Preserve content dimensions during collapse.\n- Avoid nested LayerCards.\n- Control dialog visibility through its open state.\n\nThese are Cloudflare's conventions, not locally invented universal rules. User requirements govern product copy and scope; examples containing subtitles do not authorize adding subtitles here.\n\n## Usability and accessibility\n\nReview against Jakob Nielsen's published heuristics: consistent terms and controls, visible operation status, recoverable mistakes, discoverable actions, efficient repeated work, and only relevant information. For this application, that means distinguishing an empty result from a failed scan, showing whether a cover letter is saved or generating, retaining edits after failures, and keeping filter state understandable. The implementation applies these heuristics to the approved page layouts. [Nielsen Norman Group](https://www.nngroup.com/articles/ten-usability-heuristics/).\n\nRetain Kumo's keyboard and focus behavior; provide visible focus, meaningful input labels, and accessible names for icon controls. Follow documented interaction patterns when composing custom controls. Review loading, empty, error, disabled, and unsaved states as part of each implemented workflow. [Kumo accessibility](https://kumo-ui.com/accessibility/), [WAI-ARIA patterns](https://www.w3.org/WAI/ARIA/apg/patterns/).\n\n## Approved workflow\n\n- Opening screen: job inbox with filters, paginated results, and an adjacent detail pane for complete profiles; User profile onboarding for new users.\n- Navigation: Jobs, Saved, User profile, CV, Sources, Settings.\n- CV: master JSON facts and legacy saved resumes. Saved job → Cover letter: the complete job-specific letter editor, generation/retry, preview, versions and downloads live in the job detail. There is no separate Cover letters page or document picker. Old letter links redirect to the saved job tab. Both use editable Handlebars HTML/CSS, rendered previews, immutable saved versions, and PDF/Word downloads.\n- User authorized implementation after accepting these two recommended workflows.\n\nCloudflare Kumo supplies controls and semantic color tokens. Custom CSS arranges the application panes; it does not replace the component system. Text uses Kumo's text-color tokens, with light and dark modes.\n\n## App-wide assistant\n\nKumo 2.13.2 has inputs, buttons, tabs and selects but no dedicated conversation/message/composer component. Use [assistant-ui's external-store runtime](https://www.assistant-ui.com/docs/runtimes/custom/external-store) with its unstyled [Thread](https://www.assistant-ui.com/docs/primitives/thread), [Message](https://www.assistant-ui.com/docs/primitives/message) and [Composer](https://www.assistant-ui.com/docs/primitives/composer) primitives. This fits the existing SQLite-backed Codex queue without introducing a second inference provider. Controls remain Kumo, and presentation uses Kumo tokens. AI Elements and other shadcn-oriented kits were considered but would introduce another styled component system without improving the existing runtime integration.\n\nThe assistant is a 520px viewport-fixed overlay that slides in from the right without resizing or shifting the underlying page. A neutral chat-icon button in the top-right page header opens it, with an Open assistant tooltip below on hover/focus. The button participates in the header’s normal flex layout; Hide or Escape slides it offscreen and returns focus. It remains mounted so conversation, scroll and unsent text survive hiding and navigation. Unsent text also survives reload in the current browser tab. Reduced-motion settings disable the slide. The desktop overlay is nonmodal, allowing navigation while chatting; at 600px and below it fills the screen, traps keyboard focus and makes the underlying app inert while open.\n\nThe header identifies the current page/document context. The composer supports Enter to send, Shift+Enter for a newline, cancellation and recovery after failure. Activity text reports actual read/edit/compile stages. Saved-document links navigate to the actual job, letter or CV editor and hide the overlay. Clean editors refresh after changes; unsaved text and historical views are retained with a notice about the newer version. Markdown has no raw HTML or remote images.\n\nUser Profile is now a read-only facts viewer with Build profile/Edit with assistant. Facts include missing information, preferences, evidence references and additional fact status; historical sources are distinguished from current facts. Previous versions restore into a new revision. New users see the onboarding conversation in the same global assistant.\n\n## Layout alignment\n\nThe page heading, filters, result controls, and outer table cells share a 24px horizontal gutter (16px on mobile). The page and sidebar headers share Kumo's 58px sidebar-header height. CV editor tabs and preview actions share a 56px row, so their borders and content start together.\n\nPane tabs use Kumo's `listClassName` extension to fit this row, with one separator and enough room for the library's keyboard focus ring. The native-control focus fallback lives in the base CSS layer so it does not override Kumo's focus styles. Notes fill the detail pane and resize vertically. Preview actions can scroll horizontally in very narrow panes.\n\n## Location filtering\n\nJobs and Saved use Kumo’s documented grouped, searchable multi-select Combobox pattern: Group, GroupLabel and Collection retain library keyboard/focus behavior. APAC/EMEA/Americas provide broad filters, followed by SEA/East Asia country groups and other geographic groups. Malaysia appears first within SEA. Cities are searchable, and selected cities remain visible when the query clears. Worldwide, Unspecified and Unresolved remain independent options. Selections combine with OR and other filters with AND. [Kumo Combobox](https://kumo-ui.com/components/combobox/).\n\nLocation is distinct from work arrangement. The detail header identifies source-provided hiring restrictions without repeating the same location in the facts grid. Desktop, keyboard, light/dark themes, reload persistence, and the 390px mobile layout were checked for this control.\n\n## Seen and selected rows\n\nSeen is independent of review status and row selection. The Seen status filter uses the existing Kumo Select; seen rows show a literal Seen label. A deliberate open records the flag; automatically previewing the first result does not. Selection has a Kumo brand-tinted background, a 3px inset edge marker, an emphasized link-colored title and `aria-current` on the title button. Both color and the edge marker distinguish it from alternating table backgrounds. The same layout works in light and dark modes without shifting cell padding.\n\n## Match, eligibility and listing quality\n\nThe existing Kumo Select controls now expose eligibility, stale/closed availability, and reversible duplicate grouping. Eligibility also appears in the job facts, independently of the match label. The Match tab shows score components and exact restriction evidence, with conflicts before general review notes. The description pane identifies its source, incomplete/stale states, and related posting links. Toolbar actions stay together when wrapping. Saved retains individual saved records. Desktop and 390px mobile checks cover these additions.\n","toc":[{"id":"user-decisions","title":"User decisions","depth":2},{"id":"component-system","title":"Component system","depth":2},{"id":"cloudflare-design-guidance","title":"Cloudflare design guidance","depth":2},{"id":"usability-and-accessibility","title":"Usability and accessibility","depth":2},{"id":"approved-workflow","title":"Approved workflow","depth":2},{"id":"app-wide-assistant","title":"App-wide assistant","depth":2},{"id":"layout-alignment","title":"Layout alignment","depth":2},{"id":"location-filtering","title":"Location filtering","depth":2},{"id":"seen-and-selected-rows","title":"Seen and selected rows","depth":2},{"id":"match-eligibility-and-listing-quality","title":"Match, eligibility and listing quality","depth":2}],"titleAnchor":"dashboard-ui","links":["verification/history"],"attachments":[],"html":"\u003cp>Status: implemented locally with Kumo. See \u003ca href=\"#/verification/history\">verification history\u003c/a> for the scope of browser checks.\u003c/p>\n\u003ch2 id=\"user-decisions\">User decisions\u003c/h2>\n\u003cul>\n\u003cli>Follow Cloudflare's dashboard and use official Kumo components.\u003c/li>\n\u003cli>No ornamental labels, captions, subcaptions, subtitles, or flourishes. Every string must serve a task.\u003c/li>\n\u003cli>Name actions plainly: Save, Edit, Dismiss, Retry, Download PDF, Download DOCX. These are examples for existing product actions, not a finalized toolbar.\u003c/li>\n\u003cli>Keep the app fully local.\u003c/li>\n\u003cli>The user approved the job inbox with filters and a detail pane, and the CV source editor with rendered preview. Career facts remain structured and CV presentation remains editable.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"component-system\">Component system\u003c/h2>\n\u003cp>Use React, TypeScript, and Vite for the frontend. Kumo requires React and React DOM; use \u003ccode>@cloudflare/kumo\u003c/code> and its Phosphor icon peer dependency. This replaces the proposed SvelteKit frontend. The Node.js backend, worker, SQLite database, and Unraid deployment remain local. \u003ca href=\"https://kumo-ui.com/installation/\" rel=\"noreferrer\">Kumo installation\u003c/a>, \u003ca href=\"https://vite.dev/guide/\" rel=\"noreferrer\">Vite guide\u003c/a>.\u003c/p>\n\u003cp>Use Kumo semantic colors and supported component variants. Let its tokens carry theme differences. Prefer styled components; use primitives only when the library lacks the needed control. Consult component APIs before implementation. \u003ca href=\"https://kumo-ui.com/colors/\" rel=\"noreferrer\">Kumo colors\u003c/a>, \u003ca href=\"https://kumo-ui.com/components/button/\" rel=\"noreferrer\">component documentation\u003c/a>.\u003c/p>\n\u003cp>Kumo blocks are adaptable examples. Optional descriptions and documentation panels in a demo are not requirements for this product. Omit them when they conflict with the user's direction. \u003ca href=\"https://kumo-ui.com/blocks/resource-list/\" rel=\"noreferrer\">Resource list block\u003c/a>.\u003c/p>\n\u003ch2 id=\"cloudflare-design-guidance\">Cloudflare design guidance\u003c/h2>\n\u003cp>Apply the official \u003ca href=\"https://github.com/cloudflare/kumo/blob/main/skills/kumo-design/SKILL.md\" rel=\"noreferrer\">kumo-design skill\u003c/a>, also published in the \u003ca href=\"https://kumo-ui.com/skill/\" rel=\"noreferrer\">design guide\u003c/a>. Research notes:\u003c/p>\n\u003cul>\n\u003cli>Content and controls use 14px; larger sizes belong to headings.\u003c/li>\n\u003cli>Sentence-case headings; preserve product names.\u003c/li>\n\u003cli>Preserve font tracking. Use semibold headings and medium inline emphasis.\u003c/li>\n\u003cli>Group related text; account for line height in padding.\u003c/li>\n\u003cli>Hover colors change immediately.\u003c/li>\n\u003cli>Use rings with shadows and borders for sticky separators.\u003c/li>\n\u003cli>Closely nested corners use concentric radii.\u003c/li>\n\u003cli>Align icons with the first text line; reduce inline monospace size slightly.\u003c/li>\n\u003cli>Preserve content dimensions during collapse.\u003c/li>\n\u003cli>Avoid nested LayerCards.\u003c/li>\n\u003cli>Control dialog visibility through its open state.\u003c/li>\n\u003c/ul>\n\u003cp>These are Cloudflare's conventions, not locally invented universal rules. User requirements govern product copy and scope; examples containing subtitles do not authorize adding subtitles here.\u003c/p>\n\u003ch2 id=\"usability-and-accessibility\">Usability and accessibility\u003c/h2>\n\u003cp>Review against Jakob Nielsen's published heuristics: consistent terms and controls, visible operation status, recoverable mistakes, discoverable actions, efficient repeated work, and only relevant information. For this application, that means distinguishing an empty result from a failed scan, showing whether a cover letter is saved or generating, retaining edits after failures, and keeping filter state understandable. The implementation applies these heuristics to the approved page layouts. \u003ca href=\"https://www.nngroup.com/articles/ten-usability-heuristics/\" rel=\"noreferrer\">Nielsen Norman Group\u003c/a>.\u003c/p>\n\u003cp>Retain Kumo's keyboard and focus behavior; provide visible focus, meaningful input labels, and accessible names for icon controls. Follow documented interaction patterns when composing custom controls. Review loading, empty, error, disabled, and unsaved states as part of each implemented workflow. \u003ca href=\"https://kumo-ui.com/accessibility/\" rel=\"noreferrer\">Kumo accessibility\u003c/a>, \u003ca href=\"https://www.w3.org/WAI/ARIA/apg/patterns/\" rel=\"noreferrer\">WAI-ARIA patterns\u003c/a>.\u003c/p>\n\u003ch2 id=\"approved-workflow\">Approved workflow\u003c/h2>\n\u003cul>\n\u003cli>Opening screen: job inbox with filters, paginated results, and an adjacent detail pane for complete profiles; User profile onboarding for new users.\u003c/li>\n\u003cli>Navigation: Jobs, Saved, User profile, CV, Sources, Settings.\u003c/li>\n\u003cli>CV: master JSON facts and legacy saved resumes. Saved job → Cover letter: the complete job-specific letter editor, generation/retry, preview, versions and downloads live in the job detail. There is no separate Cover letters page or document picker. Old letter links redirect to the saved job tab. Both use editable Handlebars HTML/CSS, rendered previews, immutable saved versions, and PDF/Word downloads.\u003c/li>\n\u003cli>User authorized implementation after accepting these two recommended workflows.\u003c/li>\n\u003c/ul>\n\u003cp>Cloudflare Kumo supplies controls and semantic color tokens. Custom CSS arranges the application panes; it does not replace the component system. Text uses Kumo's text-color tokens, with light and dark modes.\u003c/p>\n\u003ch2 id=\"app-wide-assistant\">App-wide assistant\u003c/h2>\n\u003cp>Kumo 2.13.2 has inputs, buttons, tabs and selects but no dedicated conversation/message/composer component. Use \u003ca href=\"https://www.assistant-ui.com/docs/runtimes/custom/external-store\" rel=\"noreferrer\">assistant-ui's external-store runtime\u003c/a> with its unstyled \u003ca href=\"https://www.assistant-ui.com/docs/primitives/thread\" rel=\"noreferrer\">Thread\u003c/a>, \u003ca href=\"https://www.assistant-ui.com/docs/primitives/message\" rel=\"noreferrer\">Message\u003c/a> and \u003ca href=\"https://www.assistant-ui.com/docs/primitives/composer\" rel=\"noreferrer\">Composer\u003c/a> primitives. This fits the existing SQLite-backed Codex queue without introducing a second inference provider. Controls remain Kumo, and presentation uses Kumo tokens. AI Elements and other shadcn-oriented kits were considered but would introduce another styled component system without improving the existing runtime integration.\u003c/p>\n\u003cp>The assistant is a 520px viewport-fixed overlay that slides in from the right without resizing or shifting the underlying page. A neutral chat-icon button in the top-right page header opens it, with an Open assistant tooltip below on hover/focus. The button participates in the header’s normal flex layout; Hide or Escape slides it offscreen and returns focus. It remains mounted so conversation, scroll and unsent text survive hiding and navigation. Unsent text also survives reload in the current browser tab. Reduced-motion settings disable the slide. The desktop overlay is nonmodal, allowing navigation while chatting; at 600px and below it fills the screen, traps keyboard focus and makes the underlying app inert while open.\u003c/p>\n\u003cp>The header identifies the current page/document context. The composer supports Enter to send, Shift+Enter for a newline, cancellation and recovery after failure. Activity text reports actual read/edit/compile stages. Saved-document links navigate to the actual job, letter or CV editor and hide the overlay. Clean editors refresh after changes; unsaved text and historical views are retained with a notice about the newer version. Markdown has no raw HTML or remote images.\u003c/p>\n\u003cp>User Profile is now a read-only facts viewer with Build profile/Edit with assistant. Facts include missing information, preferences, evidence references and additional fact status; historical sources are distinguished from current facts. Previous versions restore into a new revision. New users see the onboarding conversation in the same global assistant.\u003c/p>\n\u003ch2 id=\"layout-alignment\">Layout alignment\u003c/h2>\n\u003cp>The page heading, filters, result controls, and outer table cells share a 24px horizontal gutter (16px on mobile). The page and sidebar headers share Kumo's 58px sidebar-header height. CV editor tabs and preview actions share a 56px row, so their borders and content start together.\u003c/p>\n\u003cp>Pane tabs use Kumo's \u003ccode>listClassName\u003c/code> extension to fit this row, with one separator and enough room for the library's keyboard focus ring. The native-control focus fallback lives in the base CSS layer so it does not override Kumo's focus styles. Notes fill the detail pane and resize vertically. Preview actions can scroll horizontally in very narrow panes.\u003c/p>\n\u003ch2 id=\"location-filtering\">Location filtering\u003c/h2>\n\u003cp>Jobs and Saved use Kumo’s documented grouped, searchable multi-select Combobox pattern: Group, GroupLabel and Collection retain library keyboard/focus behavior. APAC/EMEA/Americas provide broad filters, followed by SEA/East Asia country groups and other geographic groups. Malaysia appears first within SEA. Cities are searchable, and selected cities remain visible when the query clears. Worldwide, Unspecified and Unresolved remain independent options. Selections combine with OR and other filters with AND. \u003ca href=\"https://kumo-ui.com/components/combobox/\" rel=\"noreferrer\">Kumo Combobox\u003c/a>.\u003c/p>\n\u003cp>Location is distinct from work arrangement. The detail header identifies source-provided hiring restrictions without repeating the same location in the facts grid. Desktop, keyboard, light/dark themes, reload persistence, and the 390px mobile layout were checked for this control.\u003c/p>\n\u003ch2 id=\"seen-and-selected-rows\">Seen and selected rows\u003c/h2>\n\u003cp>Seen is independent of review status and row selection. The Seen status filter uses the existing Kumo Select; seen rows show a literal Seen label. A deliberate open records the flag; automatically previewing the first result does not. Selection has a Kumo brand-tinted background, a 3px inset edge marker, an emphasized link-colored title and \u003ccode>aria-current\u003c/code> on the title button. Both color and the edge marker distinguish it from alternating table backgrounds. The same layout works in light and dark modes without shifting cell padding.\u003c/p>\n\u003ch2 id=\"match-eligibility-and-listing-quality\">Match, eligibility and listing quality\u003c/h2>\n\u003cp>The existing Kumo Select controls now expose eligibility, stale/closed availability, and reversible duplicate grouping. Eligibility also appears in the job facts, independently of the match label. The Match tab shows score components and exact restriction evidence, with conflicts before general review notes. The description pane identifies its source, incomplete/stale states, and related posting links. Toolbar actions stay together when wrapping. Saved retains individual saved records. Desktop and 390px mobile checks cover these additions.\u003c/p>\n","backlinks":["index","decisions/index","journal/2026-10-07-jstack-migration"]},{"id":"decisions/index","title":"Decision register","section":"Decisions","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-10-07\u003c/span>","updated":"2026-10-07","summary":"","source":"---\ntitle: Decision register\nsection: Decisions\nupdated: 2026-10-07\n---\n# Decision register\n\nThese are established requirements summarized from repository `AGENTS.md` and the migrated design documentation. Original acceptance dates were not recorded consistently; pre-existing requirements are marked **established before 7 October 2026**, not assigned invented decision dates. `AGENTS.md` remains the agent instruction entry point.\n\n| ID | Accepted decision | Basis and related behavior |\n| --- | --- | --- |\n| DEC-local | Local development and home-network hosting; no login or cloud domain. Target Docker/Unraid with persistent appdata. | Established before migration; [Unraid](../guides/unraid.md), [architecture](../reference/architecture.md). Actual server deployment is unverified. |\n| DEC-boundaries | Discover, assess, draft and manage CVs. No submission, employer uploads, form filling, outreach, engagement or external notifications. | User-established boundary; [discovery](../features/discovery.md), [cover letters](../features/cover-letters.md). Ordinary application links are manual. |\n| DEC-evidence | SQLite profile versions are canonical; retain attribution, quoted changes and history. Never invent candidate facts or equate total engineering experience with AI tenure. | Established before migration; [profile](../features/profile.md). Private evidence remains local. |\n| DEC-letters | Save generates a cover letter; keep the master CV independent and preserve legacy resumes. Full letter editor belongs inside Saved job detail. | Existing correction supersedes older per-job CV workflow; [cover letters](../features/cover-letters.md), [history](../verification/history.md). |\n| DEC-ui | Lowercase ununemploy; React/TypeScript/Vite with official Kumo components and literal task-focused copy. | Existing user approval, replacing the earlier SvelteKit proposal; [dashboard decisions](dashboard-ui.md). |\n| DEC-assistant | Persistent right-side overlay without page shift; shared profile facts and bounded document actions with atomic versions. | Established before migration; [assistant](../features/assistant.md). No unrestricted shell/filesystem/external writes. |\n| DEC-runtime | Official Codex, ChatGPT subscription, gpt-5.6-sol, high reasoning; serialized jobs, runtime-owned authentication, no silent fallback. | Established before migration; [architecture](../reference/architecture.md), [cover letters](../features/cover-letters.md). |\n| DEC-jev | Optional TypeSafe assessment only after user configuration; retain no-key baseline and Codex letter generation. | Established before migration; [Jev](../features/jev.md). Live authenticated inference is unverified. |\n| DEC-wiki | Adopt the local jstack collection and migrate project documentation into a Markdown wiki with an offline reader. | User request on **7 October 2026**: “can we adopt jstack (../jstack) for this project? migrate all docs to wiki format”; [migration journal](../journal/2026-10-07-jstack-migration.md). |\n| DEC-desktop | Add a local native Go webview app for macOS; opening it owns service startup, closing the window keeps scanning, and Quit stops services. Preserve existing local state outside the bundle. | User request and explicit “Keep running until Quit” selection on **7 October 2026**; [journal](../journal/2026-10-07-desktop.md), [desktop specification](../features/desktop.md). Supplements the Unraid target. |\n\nHistorical source strategies and probe outcomes remain in the [source evaluation](../journal/2026-09-16-source-evaluation.md) and [coverage research](../journal/2026-09-17-coverage-research.md) journals; proposals there are not newly accepted requirements.\n","toc":[],"titleAnchor":"decision-register","links":["guides/unraid","reference/architecture","features/discovery","features/cover-letters","features/profile","features/cover-letters","verification/history","decisions/dashboard-ui","features/assistant","reference/architecture","features/cover-letters","features/jev","journal/2026-10-07-jstack-migration","journal/2026-10-07-desktop","features/desktop","journal/2026-09-16-source-evaluation","journal/2026-09-17-coverage-research"],"attachments":[],"html":"\u003cp>These are established requirements summarized from repository \u003ccode>AGENTS.md\u003c/code> and the migrated design documentation. Original acceptance dates were not recorded consistently; pre-existing requirements are marked \u003cstrong>established before 7 October 2026\u003c/strong>, not assigned invented decision dates. \u003ccode>AGENTS.md\u003c/code> remains the agent instruction entry point.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>ID\u003c/th>\n\u003cth>Accepted decision\u003c/th>\n\u003cth>Basis and related behavior\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>DEC-local\u003c/td>\n\u003ctd>Local development and home-network hosting; no login or cloud domain. Target Docker/Unraid with persistent appdata.\u003c/td>\n\u003ctd>Established before migration; \u003ca href=\"#/guides/unraid\">Unraid\u003c/a>, \u003ca href=\"#/reference/architecture\">architecture\u003c/a>. Actual server deployment is unverified.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-boundaries\u003c/td>\n\u003ctd>Discover, assess, draft and manage CVs. No submission, employer uploads, form filling, outreach, engagement or external notifications.\u003c/td>\n\u003ctd>User-established boundary; \u003ca href=\"#/features/discovery\">discovery\u003c/a>, \u003ca href=\"#/features/cover-letters\">cover letters\u003c/a>. Ordinary application links are manual.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-evidence\u003c/td>\n\u003ctd>SQLite profile versions are canonical; retain attribution, quoted changes and history. Never invent candidate facts or equate total engineering experience with AI tenure.\u003c/td>\n\u003ctd>Established before migration; \u003ca href=\"#/features/profile\">profile\u003c/a>. Private evidence remains local.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-letters\u003c/td>\n\u003ctd>Save generates a cover letter; keep the master CV independent and preserve legacy resumes. Full letter editor belongs inside Saved job detail.\u003c/td>\n\u003ctd>Existing correction supersedes older per-job CV workflow; \u003ca href=\"#/features/cover-letters\">cover letters\u003c/a>, \u003ca href=\"#/verification/history\">history\u003c/a>.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-ui\u003c/td>\n\u003ctd>Lowercase ununemploy; React/TypeScript/Vite with official Kumo components and literal task-focused copy.\u003c/td>\n\u003ctd>Existing user approval, replacing the earlier SvelteKit proposal; \u003ca href=\"#/decisions/dashboard-ui\">dashboard decisions\u003c/a>.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-assistant\u003c/td>\n\u003ctd>Persistent right-side overlay without page shift; shared profile facts and bounded document actions with atomic versions.\u003c/td>\n\u003ctd>Established before migration; \u003ca href=\"#/features/assistant\">assistant\u003c/a>. No unrestricted shell/filesystem/external writes.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-runtime\u003c/td>\n\u003ctd>Official Codex, ChatGPT subscription, gpt-5.6-sol, high reasoning; serialized jobs, runtime-owned authentication, no silent fallback.\u003c/td>\n\u003ctd>Established before migration; \u003ca href=\"#/reference/architecture\">architecture\u003c/a>, \u003ca href=\"#/features/cover-letters\">cover letters\u003c/a>.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-jev\u003c/td>\n\u003ctd>Optional TypeSafe assessment only after user configuration; retain no-key baseline and Codex letter generation.\u003c/td>\n\u003ctd>Established before migration; \u003ca href=\"#/features/jev\">Jev\u003c/a>. Live authenticated inference is unverified.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-wiki\u003c/td>\n\u003ctd>Adopt the local jstack collection and migrate project documentation into a Markdown wiki with an offline reader.\u003c/td>\n\u003ctd>User request on \u003cstrong>7 October 2026\u003c/strong>: “can we adopt jstack (../jstack) for this project? migrate all docs to wiki format”; \u003ca href=\"#/journal/2026-10-07-jstack-migration\">migration journal\u003c/a>.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-desktop\u003c/td>\n\u003ctd>Add a local native Go webview app for macOS; opening it owns service startup, closing the window keeps scanning, and Quit stops services. Preserve existing local state outside the bundle.\u003c/td>\n\u003ctd>User request and explicit “Keep running until Quit” selection on \u003cstrong>7 October 2026\u003c/strong>; \u003ca href=\"#/journal/2026-10-07-desktop\">journal\u003c/a>, \u003ca href=\"#/features/desktop\">desktop specification\u003c/a>. Supplements the Unraid target.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Historical source strategies and probe outcomes remain in the \u003ca href=\"#/journal/2026-09-16-source-evaluation\">source evaluation\u003c/a> and \u003ca href=\"#/journal/2026-09-17-coverage-research\">coverage research\u003c/a> journals; proposals there are not newly accepted requirements.\u003c/p>\n","backlinks":["index","features/assistant","features/cover-letters","features/desktop","features/discovery","features/documentation","features/jev","features/job-inbox","features/master-cv","features/matching","features/profile"]},{"id":"discussions/open-questions","title":"Open questions and follow-up","section":"Discussions","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-10-07\u003c/span>","updated":"2026-10-07","summary":"","source":"---\ntitle: Open questions and follow-up\nsection: Discussions\nupdated: 2026-10-07\n---\n# Open questions and follow-up\n\nThis page distinguishes unfinished verification and implementation from decisions. No new product direction is proposed by the documentation migration.\n\n| Item | Current state | Next evidence needed |\n| --- | --- | --- |\n| Actual Unraid installation | Unverified; local container checks exist | Run on the intended server, verify persistence and native Landlock compilation; [guide](../guides/unraid.md). |\n| Web3.career authentication | Implemented, authenticated collection unverified | Configure a local token and record a bounded live scan. |\n| Jev provider access and quality | Simulated tests and UI checks exist | A configured account and selected real inference cases; [Jev](../features/jev.md). |\n| Adzuna / Jooble / Careerjet | Catalog entries only, pending credentials and adapter work | Provider configuration plus actual adapters and bounded verification; [coverage](../reference/source-coverage.md). |\n| Optional WebMCP | No supported browser verification recorded | Registration and real tool invocation in a supported context. |\n| Collection scaling and bundle size | Existing performance limits | Measured evidence at larger inventories before choosing further changes. |\n| Legacy live browser recipes | Some depend on named real postings | Verify inventory prerequisites or create isolated fixtures before claiming a new pass. |\n\nSee [limitations](../reference/limitations.md) and [verification history](../verification/history.md). Updates should preserve dated findings and link resolved items to their new decision or run.\n","toc":[],"titleAnchor":"open-questions-and-follow-up","links":["guides/unraid","features/jev","reference/source-coverage","reference/limitations","verification/history"],"attachments":[],"html":"\u003cp>This page distinguishes unfinished verification and implementation from decisions. No new product direction is proposed by the documentation migration.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Item\u003c/th>\n\u003cth>Current state\u003c/th>\n\u003cth>Next evidence needed\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Actual Unraid installation\u003c/td>\n\u003ctd>Unverified; local container checks exist\u003c/td>\n\u003ctd>Run on the intended server, verify persistence and native Landlock compilation; \u003ca href=\"#/guides/unraid\">guide\u003c/a>.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Web3.career authentication\u003c/td>\n\u003ctd>Implemented, authenticated collection unverified\u003c/td>\n\u003ctd>Configure a local token and record a bounded live scan.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Jev provider access and quality\u003c/td>\n\u003ctd>Simulated tests and UI checks exist\u003c/td>\n\u003ctd>A configured account and selected real inference cases; \u003ca href=\"#/features/jev\">Jev\u003c/a>.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Adzuna / Jooble / Careerjet\u003c/td>\n\u003ctd>Catalog entries only, pending credentials and adapter work\u003c/td>\n\u003ctd>Provider configuration plus actual adapters and bounded verification; \u003ca href=\"#/reference/source-coverage\">coverage\u003c/a>.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Optional WebMCP\u003c/td>\n\u003ctd>No supported browser verification recorded\u003c/td>\n\u003ctd>Registration and real tool invocation in a supported context.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Collection scaling and bundle size\u003c/td>\n\u003ctd>Existing performance limits\u003c/td>\n\u003ctd>Measured evidence at larger inventories before choosing further changes.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Legacy live browser recipes\u003c/td>\n\u003ctd>Some depend on named real postings\u003c/td>\n\u003ctd>Verify inventory prerequisites or create isolated fixtures before claiming a new pass.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>See \u003ca href=\"#/reference/limitations\">limitations\u003c/a> and \u003ca href=\"#/verification/history\">verification history\u003c/a>. Updates should preserve dated findings and link resolved items to their new decision or run.\u003c/p>\n","backlinks":["index","journal/2026-10-07-jstack-migration"]},{"id":"features/assistant","title":"App-wide assistant","section":"Features","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-10-07\u003c/span>","updated":"2026-10-07","summary":"","source":"---\ntitle: App-wide assistant\nsection: Features\nupdated: 2026-10-07\n---\n# App-wide assistant\n\nFeature ID: `FEAT-assistant`\n\n## Intent and basis\n\nSupport one persistent, restricted assistant that can coordinate attributable facts and real document edits. Based on the [accepted project boundaries](../decisions/index.md) and existing implementation documentation; this migration adds no product requirement.\n\n## Entry points and prerequisites\n\nOpen assistant in the top-right page header; supplied job/document context and an available serialized Codex runtime are prerequisites for a real turn.\n\n## Expected outcomes\n\nThe overlay preserves page bounds, context and unsent drafts; Escape restores focus. Atomic saves retain versions and report actual preview results. New chat clears conversation state while preserving saved facts and documents.\n\n## Verification recipe\n\nUse [shared verification setup](../verification/setup.md) for isolation, build identity, evidence and cleanup. `npm test` covers action/evidence/version boundaries. After `npm run build`, `npx tsx scripts/verify-assistant-ui.ts` drives the actual UI with synthetic data, simulated inference and real compilation. The detailed runtime command is below.\n\nRecipes are migrated from existing scripts and historical checks; they were not re-executed during the wiki migration.\n\n## Coverage and limitations\n\nThe synthetic UI check does not establish current authentication or every interpretation. No unrestricted shell, filesystem, external writes, messaging or application actions are available.\n\n## Verification history\n\n[Historical implementation checks](../verification/history.md) record previous selected scenarios and limitations. Those entries are historical evidence; new reports belong in [verification runs](../verification/index.md).\n\n\n**New chat** in the assistant header clears the conversation, turn/action history, remembered document focus, and the current tab's unsent draft. Saved profile facts, source evidence, change quotes, document versions and jobs remain intact. There is no conversation archive. Wait for an active reply or use **Stop** before starting a new chat; the server also waits for the worker to release the chat before allowing a reset.\n\nThe Assistant button in the top-right page header opens one persistent conversation over any page. It uses the official Codex CLI, the existing ChatGPT subscription login, `gpt-5.6-sol` and high reasoning. It does not introduce another provider, API key or model fallback.\n\n## Capabilities\n\n| Request | Application behavior |\n| --- | --- |\n| Find React/TypeScript jobs in Malaysia | Query collected jobs with AND keywords, resolved location filters, match ranking, availability and eligibility. Return real clickable records. This does not start an internet-wide job search or a scan. |\n| Refresh a project from its website/repository | Read exact supplied or recorded public URLs, using a GitHub repository's README where applicable. Save attributable project facts without inferring personal authorship or professional production experience. |\n| Add/correct profile information | Read canonical facts, apply field edits supported by quotes from user messages or fetched references, and version the result. The onboarding skill remains active for missing essentials. |\n| Edit the CV | Read and edit the actual master LaTeX source or the data/HTML representation. Preserve unrelated sections and presentation. Compile LaTeX and report diagnostics; render HTML through the existing sanitizing renderer. |\n| Rewrite a saved cover letter | Read the existing letter and relevant facts/posting, save a new edited version, and link to Saved → job → Cover letter. No letter is sent or submitted. |\n\nThe current page/document is a context hint; explicit user intent persists across follow-ups. The last read document target also persists. Asking to edit a CV and then discussing a project should continue targeting that CV. When the user requests both factual and document updates, the assistant can coordinate them. A profile-only correction does not overwrite independent LaTeX wording, and a wording-only edit does not rewrite the profile.\n\n## Execution and state\n\n- `core/assistant/service.ts` runs a bounded application-action loop. Codex returns schema-validated action requests; the server executes only its allowlisted capabilities and returns results to the next inference step. The underlying runtime retains disabled shell, browser, connector and plugin tools.\n- `core/assistant/actions.ts` implements job queries, document reads, exact LaTeX replacements, structured profile/document edits, public references and PDF previews. The model must read a document before editing it and use the returned version identifier. The current HTML master uses the canonical profile data plus its existing HTML/CSS template.\n- Changes stay in memory until completion. Profile, document versions, evidence audit, saved-version receipts and final reply commit together in one SQLite transaction. Nested savepoints allow existing store operations to participate. Conflicting versions, invalid fields, unresolved edit failures, cancellation and restarts do not commit staged edits.\n- PDF compilation happens before commit. The agent can fix diagnostics and recompile. If it finishes with an unavailable/failed compiler, the source is still versioned and the final receipt explicitly says the preview failed; the previous PDF remains available. Successful compilation is not a guarantee that every layout or factual choice is ideal.\n- Migration 009 adds engine/context/activity/receipt fields and an action audit to the existing persistent chat tables. Previous profile conversations and queued legacy turns are retained. The global UI uses `/api/assistant`; existing profile APIs remain compatible. The same active-turn constraint and worker/runtime leases serialize work. The worker checks for queued chat every second and scans yield between sources.\n- A turn has at most ten inference rounds, five actions per round, eight public-reference HTTP requests and bounded document/context sizes. Reference pages are capped at 3 MB and 24,000 extracted characters. The UI shows progress and supports Stop; final replies appear after validation and saving, without token streaming.\n\n## Boundaries and recovery\n\nPublic references are read-only GETs to exact user-supplied/profile URLs. GitHub repository-to-README mapping is deterministic. DNS and connection addresses must be public; redirects stay on the expected host, credentials are not attached, and arbitrary model-constructed URLs are rejected. Read failures are returned to the assistant so it can request pasted text. Web content and job descriptions remain untrusted data. Reference access is not an unrestricted browser or search engine.\n\nThe assistant cannot access app credentials, run shell commands, read arbitrary local files, submit applications, contact employers, send messages, change applied status, or deliver documents externally. Existing LaTeX compilation remains offline and sandboxed. HTML/Markdown previews cannot execute scripts or load remote images.\n\nAll edits create versions. Restore profile/CV/letter versions with their existing editor controls. Saved-version receipts link to the correct view. Clean editors refresh after completion; dirty or historical editors retain their text and show a notice. Manual saves carry expected version identifiers so they cannot silently overwrite an assistant edit. Save a local copy before reloading if concurrent edits need to be reconciled. Retry rereads current records rather than blindly replaying old writes.\n\n## Verification commands\n\n`npm test` covers the action loop, capabilities, evidence, job filters, version conflicts, cancellation and rollback. `npx tsx scripts/verify-assistant-ui.ts` runs a synthetic browser workflow with simulated inference and actual PDF compilation. `npx tsx scripts/verify-assistant-runtime.ts` performs real subscription inference with synthetic profile/CV data in an isolated temporary database; it consumes allowance and does not edit the user's documents. See [verification results](../verification/history.md).\n","toc":[{"id":"intent-and-basis","title":"Intent and basis","depth":2},{"id":"entry-points-and-prerequisites","title":"Entry points and prerequisites","depth":2},{"id":"expected-outcomes","title":"Expected outcomes","depth":2},{"id":"verification-recipe","title":"Verification recipe","depth":2},{"id":"coverage-and-limitations","title":"Coverage and limitations","depth":2},{"id":"verification-history","title":"Verification history","depth":2},{"id":"capabilities","title":"Capabilities","depth":2},{"id":"execution-and-state","title":"Execution and state","depth":2},{"id":"boundaries-and-recovery","title":"Boundaries and recovery","depth":2},{"id":"verification-commands","title":"Verification commands","depth":2}],"titleAnchor":"app-wide-assistant","links":["decisions/index","verification/setup","verification/history","verification/index","verification/history"],"attachments":[],"html":"\u003cp>Feature ID: \u003ccode>FEAT-assistant\u003c/code>\u003c/p>\n\u003ch2 id=\"intent-and-basis\">Intent and basis\u003c/h2>\n\u003cp>Support one persistent, restricted assistant that can coordinate attributable facts and real document edits. Based on the \u003ca href=\"#/decisions/index\">accepted project boundaries\u003c/a> a ellation and restarts do not commit staged edits.\u003c/li>\n\u003cli>PDF compilation happens before commit. The agent can fix diagnostics and recompile. If it finishes with an unavailable/failed compiler, the source is still versioned and the final receipt explicitly says the preview failed; the previous PDF remains available. Successful compilation is not a guarantee that every layout or factual choice is ideal.\u003c/li>\n\u003cli>Migration 009 adds engine/context/activity/receipt fields and an action audit to the existing persistent chat tables. Previous profile conversations and queued legacy turns are retained. The global UI uses \u003ccode>/api/assistant\u003c/code>; existing profile APIs remain compatible. The same active-turn constraint and worker/runtime leases serialize work. The worker checks for queued chat every second and scans yield between sources.\u003c/li>\n\u003cli>A turn has at most ten inference rounds, five actions per round, eight public-reference HTTP requests and bounded document/context sizes. Reference pages are capped at 3 MB and 24,000 extracted characters. The UI shows progress and supports Stop; final replies appear after validation and saving, without token streaming.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"boundaries-and-recovery\">Boundaries and recovery\u003c/h2>\n\u003cp>Public references are read-only GETs to exact user-supplied/profile URLs. GitHub repository-to-README mapping is deterministic. DNS and connection addresses must be public; redirects stay on the expected host, credentials are not attached, and arbitrary model-constructed URLs are rejected. Read failures are returned to the assistant so it can request pasted text. Web content and job descriptions remain untrusted data. Reference access is not an unrestricted browser or search engine.\u003c/p>\n\u003cp>The assistant cannot access app credentials, run shell commands, read arbitrary local files, submit applications, contact employers, send messages, change applied status, or deliver documents externally. Existing LaTeX compilation remains offline and sandboxed. HTML/Markdown previews cannot execute scripts or load remote images.\u003c/p>\n\u003cp>All edits create versions. Restore profile/CV/letter versions with their existing editor controls. Saved-version receipts link to the correct view. Clean editors refresh after completion; dirty or historical editors retain their text and show a notice. Manual saves carry expected version identifiers so they cannot silently overwrite an assistant edit. Save a local copy before reloading if concurrent edits need to be reconciled. Retry rereads current records rather than blindly replaying old writes.\u003c/p>\n\u003ch2 id=\"verification-commands\">Verification commands\u003c/h2>\n\u003cp>\u003ccode>npm test\u003c/code> covers the action loop, capabilities, evidence, job filters, version conflicts, cancellation and rollback. \u003ccode>npx tsx scripts/verify-assistant-ui.ts\u003c/code> runs a synthetic browser workflow with simulated inference and actual PDF compilation. \u003ccode>npx tsx scripts/verify-assistant-runtime.ts\u003c/code> performs real subscription inference with synthetic profile/CV data in an isolated temporary database; it consumes allowance and does not edit the user's documents. See \u003ca href=\"#/verification/history\">verification results\u003c/a>.\u003c/p>\n","backlinks":["decisions/index","features/index","features/profile","journal/2026-10-07-jstack-migration","verification/history"]},{"id":"features/cover-letters","title":"Saved-job cover letters","section":"Features","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-10-07\u003c/span>","updated":"2026-10-07","summary":"","source":"---\ntitle: Saved-job cover letters\nsection: Features\nupdated: 2026-10-07\n---\n# Saved-job cover letters\n\nFeature ID: `FEAT-cover-letters`\n\n## Intent and basis\n\nSaving a job prepares a private tailored cover letter while keeping the master CV separate. Based on the [accepted project boundaries](../decisions/index.md) and existing implementation documentation; this migration adds no product requirement.\n\n## Entry points and prerequisites\n\nJobs → Save; Saved → job → Cover letter. Requires complete posting text, supported profile evidence and available Codex authentication/allowance.\n\n## Expected outcomes\n\nFirst-save generation is idempotent and serialized. Failures retain saved work with retry. Manual edits and restores append versions. Legacy resumes remain accessible; no per-job resume is generated.\n\n## Verification recipe\n\nUse [shared verification setup](../verification/setup.md) for isolation, build identity, evidence and cleanup. `npx tsx --test tests/cover-letters.test.ts tests/system.test.ts` covers isolated task/storage boundaries. After `npm run build`, `npx tsx scripts/verify-cv-workflow.ts` exercises save/edit/restore/download with simulated generation and real exports.\n\nRecipes are migrated from existing scripts and historical checks; they were not re-executed during the wiki migration.\n\n## Coverage and limitations\n\n`--real-generation` consumes subscription allowance. Layout checks apply to tested fixtures; letters require user review and are never sent.\n\n## Verification history\n\n[Historical implementation checks](../verification/history.md) record previous selected scenarios and limitations. Those entries are historical evidence; new reports belong in [verification runs](../verification/index.md).\n\n\nOpen **Saved → job → Cover letter** for generation/retry, the JSON/HTML/CSS editor, previews, versions and PDF/DOCX downloads. Save appends a version; Restore appends a restored version. Old `#letters` links redirect to the saved job tab. There is no standalone Cover letters page.\n\nSaving snapshots the job description, master profile revision, and cover-letter template. Generation is serialized and produces first-person paragraphs, targeting 250–350 words, with relevant examples from the confirmed profile. The application supplies the name, contact details, company, role, salutation, and signature; the generated prose cites internal evidence IDs and is checked for unknown references and unsupported numeric claims. These checks do not prove semantic truth: review the draft before using it. Unconfirmed details appear in review notes, outside the letter.\n\nCover letters have their own storage and version history. Migration 004 converts unfinished resume tasks to cover-letter tasks, pausing interrupted runs for retry. Completed resumes and manual edits stay intact under CV. Existing saved jobs with only a resume show **Generate cover letter**; the update does not bulk-generate new documents. New saved jobs generate letters automatically. The master CV remains independently editable and exportable.\n\nCodex has no shell, browser, connector, plugin, or messaging capabilities in generation runs. Job text is treated as untrusted source material. Authentication, model-access, allowance, or validation failures keep the saved job and expose a retryable task. There is no model or paid API fallback. Retry paused tasks after restoring access or allowance.\n","toc":[{"id":"intent-and-basis","title":"Intent and basis","depth":2},{"id":"entry-points-and-prerequisites","title":"Entry points and prerequisites","depth":2},{"id":"expected-outcomes","title":"Expected outcomes","depth":2},{"id":"verification-recipe","title":"Verification recipe","depth":2},{"id":"coverage-and-limitations","title":"Coverage and limitations","depth":2},{"id":"verification-history","title":"Verification history","depth":2}],"titleAnchor":"saved-job-cover-letters","links":["decisions/index","verification/setup","verification/history","verification/index"],"attachments":[],"html":"\u003cp>Feature ID: \u003ccode>FEAT-cover-letters\u003c/code>\u003c/p>\n\u003ch2 id=\"intent-and-basis\">Intent and basis\u003c/h2>\n\u003cp>Saving a job prepares a private tailored cover letter while keeping the master CV separate. Based on the \u003ca href=\"#/decisions/index\">accepted project boundaries\u003c/a> and existing implementation documentation; this migration adds no product requirement.\u003c/p>\n\u003ch2 id=\"entry-points-and-prerequisites\">Entry points and prerequisites\u003c/h2>\n\u003cp>Jobs → Save; Saved → job → Cover letter. Requires complete posting text, supported profile evidence and available Codex authentication/allowance.\u003c/p>\n\u003ch2 id=\"expected-outcomes\">Expected outcomes\u003c/h2>\n\u003cp>First-save generation is idempotent and serialized. Failures retain saved work with retry. Manual edits and restores append versions. Legacy resumes remain accessible; no per-job resume is generated.\u003c/p>\n\u003ch2 id=\"verification-recipe\">Verification recipe\u003c/h2>\n\u003cp>Use \u003ca href=\"#/verification/setup\">shared verification setup\u003c/a> for isolation, build identity, evidence and cleanup. \u003ccode>npx tsx --test tests/cover-letters.test.ts tests/system.test.ts\u003c/code> covers isolated task/storage boundaries. After \u003ccode>npm run build\u003c/code>, \u003ccode>npx tsx scripts/verify-cv-workflow.ts\u003c/code> exercises save/edit/restore/download with simulated generation and real exports.\u003c/p>\n\u003cp>Recipes are migrated from existing scripts and historical checks; they were not re-executed during the wiki migration.\u003c/p>\n\u003ch2 id=\"coverage-and-limitations\">Coverage and limitations\u003c/h2>\n\u003cp>\u003ccode>--real-generation\u003c/code> consumes subscription allowance. Layout checks apply to tested fixtures; letters require user review and are never sent.\u003c/p>\n\u003ch2 id=\"verification-history\">Verification history\u003c/h2>\n\u003cp>\u003ca href=\"#/verification/history\">Historical implementation checks\u003c/a> record previous selected scenarios and limitations. Those entries are historical evidence; new reports belong in \u003ca href=\"#/verification/index\">verification runs\u003c/a>.\u003c/p>\n\u003cp>Open \u003cstrong>Saved → job → Cover letter\u003c/strong> for generation/retry, the JSON/HTML/CSS editor, previews, versions and PDF/DOCX downloads. Save appends a version; Restore appends a restored version. Old \u003ccode>#letters\u003c/code> links redirect to the saved job tab. There is no standalone Cover letters page.\u003c/p>\n\u003cp>Saving snapshots the job description, master profile revision, and cover-letter template. Generation is serialized and produces first-person paragraphs, targeting 250–350 words, with relevant examples from the confirmed profile. The application supplies the name, contact details, company, role, salutation, and signature; the generated prose cites internal evidence IDs and is checked for unknown references and unsupported numeric claims. These checks do not prove semantic truth: review the draft before using it. Unconfirmed details appear in review notes, outside the letter.\u003c/p>\n\u003cp>Cover letters have their own storage and version history. Migration 004 converts unfinished resume tasks to cover-letter tasks, pausing interrupted runs for retry. Completed resumes and manual edits stay intact under CV. Existing saved jobs with only a resume show \u003cstrong>Generate cover letter\u003c/strong>; the update does not bulk-generate new documents. New saved jobs generate letters automatically. The master CV remains independently editable and exportable.\u003c/p>\n\u003cp>Codex has no shell, browser, connector, plugin, or messaging capabilities in generation runs. Job text is treated as untrusted source material. Authentication, model-access, allowance, or validation failures keep the saved job and expose a retryable task. There is no model or paid API fallback. Retry paused tasks after restoring access or allowance.\u003c/p>\n","backlinks":["decisions/index","features/index","features/job-inbox"]},{"id":"features/desktop","title":"Native desktop app","section":"Features","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-10-07\u003c/span>","updated":"2026-10-07","summary":"","source":"---\ntitle: Native desktop app\nsection: Features\nupdated: 2026-10-07\n---\n# Native desktop app\n\nFeature ID: `FEAT-desktop`\n\n## Intent and basis\n\nOpen ununemploy as a native macOS app without starting a development server in Terminal. The user requested a Go webview wrapper on 7 October 2026 and selected **keep running until Quit**. [Accepted decision](../decisions/index.md) and [implementation journal](../journal/2026-10-07-desktop.md).\n\n## Entry points and prerequisites\n\nOpen `~/Applications/ununemploy.app` from Finder or Spotlight. Closing the window keeps the app and worker running; opening the app again brings back its window. **ununemploy → Quit ununemploy** or Command-Q stops the API, worker and descendant processes. Unsaved document edits show a Cancel / Quit Without Saving dialog.\n\nThe currently built package targets this Mac's Apple silicon architecture. It includes Node, production server dependencies, the React frontend, the official Codex executable, portable Tectonic with generic packages, and Playwright's headless Chromium for HTML PDF exports. Go uses Cocoa/WKWebView through a small cgo adapter. It does not rewrite the backend in Go. macOS 13 is the declared wrapper deployment target; other OS releases and Intel packaging need separate testing. No app login or cloud service is added.\n\nCodex uses its own existing ChatGPT authentication; an unavailable sign-in, model or subscription allowance remains visible through the existing runtime state. Provider credentials and configured budgets remain prerequisites for their collectors.\n\n## Expected outcomes\n\n- The launcher reserves a loopback socket, starts the API and its separate worker, and loads the native window after health succeeds. A persisted port is preferred, with an available port selected on conflict.\n- One desktop instance owns each data directory. A second launch activates the first instance. Quit terminates the owned process group; unexpected parent termination closes a pipe that shuts down the services. Startup/runtime failure shows a native error with the local diagnostic log path.\n- Default appdata is `~/Library/Application Support/ununemploy`. The installer imports the former SQLite database with the backup API, verifies integrity, retains private assets/credentials locally, and preserves the original source data. Later installs do not overwrite an existing desktop database. Build and installation checks reject broken links or links that escape the application bundle. The local development `.env` is repointed to the same canonical data directory after installation.\n- The app bundle contains code and generic runtime assets, never the user's database, credentials or CVs. Copying the app alone to another Mac does not copy personal data or authentication.\n- Native Save dialogs handle downloads. Explicit external HTTP(S) links open in the user's browser. Remote top-level pages do not replace the local app; no unrestricted native JavaScript bridge is exposed.\n- Existing scanning, model serialization, saved-job behavior and manual application boundaries remain in effect. Scanning requires the app to be running and the Mac awake. It does not start at login or wake a sleeping computer.\n\n## Verification recipe\n\nBuild prerequisites: current project Node/dependencies, Go, Xcode Command Line Tools and an installed official `@openai/codex` npm package for the current Mac. Initial packaging downloads checksum-pinned Tectonic and generic packages, plus the version-matched Playwright headless browser.\n\n```sh\nnpm run desktop:build\nnpm run desktop:test\nnpx tsx --test tests/desktop.test.ts\nnpx tsx scripts/verify-desktop.ts\n```\n\nFor a source-only iteration with unchanged Node/architecture, `npm run desktop:build -- --reuse-runtimes` reuses the previously built generic runtime payload. A normal build refreshes that payload. The native lifecycle driver creates a synthetic isolated database with scans/inference disabled, runs with a minimal PATH, tests duplicate launch, Quit, relaunch, forced termination and counter persistence, and removes its temporary instance. Results are written privately under `.local-data/verification/`.\n\nInstall the built bundle and import existing local appdata with `npm run desktop:install`. Quit any running desktop/development instance first. The installer refuses active leases and does not overwrite an existing desktop database. Installation updates the local `.env`; it is not a disposable fixture command.\n\nNative UI checks: open the app, edit/save a synthetic LaTeX CV, compile and inspect its selectable PDF preview, download using the native Save panel, verify unsaved-edit cancellation on Quit, close the window, confirm a fresh worker heartbeat, reopen, then Quit and confirm the entire service process group exits. Use [shared setup](../verification/setup.md) and keep personal data out of screenshots.\n\n## Coverage and limitations\n\nThe bundle is approximately 1.1 GB because it includes the model/runtime and document-export dependencies. Its native UI uses the system webview. The build is locally ad-hoc signed, not Developer ID signed or notarized for distribution. No Windows/Linux desktop package, automatic update system, login item, or tray icon is provided. Unraid remains an independent supported hosting target; no server deployment is implied.\n\nWindow routing/filter state is tied to the saved local origin. If another application occupies its port, a new port is used and origin-specific browser preferences may start afresh; SQLite records remain intact. Service failure requires quitting/reopening the app after the displayed error. Existing startup recovery preserves queued work and pauses interrupted model jobs.\n\n## Verification history\n\n[Desktop portability follow-up — 7 October 2026](../verification/runs/2026-10-07T114528Z-desktop-portable.md) passed the corrected bundle audit, 175-test suite, packaged lifecycle and final startup.\n\n[Native desktop verification — 7 October 2026](../verification/runs/2026-10-07T113853Z-desktop.md) records the packaging, lifecycle, native workflow and installation checks. These expectations are not a claim that every provider, model invocation or document layout was reverified during packaging.\n","toc":[{"id":"intent-and-basis","title":"Intent and basis","depth":2},{"id":"entry-points-and-prerequisites","title":"Entry points and prerequisites","depth":2},{"id":"expected-outcomes","title":"Expected outcomes","depth":2},{"id":"verification-recipe","title":"Verification recipe","depth":2},{"id":"coverage-and-limitations","title":"Coverage and limitations","depth":2},{"id":"verification-history","title":"Verification history","depth":2}],"titleAnchor":"native-desktop-app","links":["decisions/index","journal/2026-10-07-desktop","verification/setup","verification/runs/2026-10-07T114528Z-desktop-portable","verification/runs/2026-10-07T113853Z-desktop"],"attachments":[],"html":"\u003cp>Feature ID: \u003ccode>FEAT-desktop\u003c/code>\u003c/p>\n\u003ch2 id=\"intent-and-basis\">Intent and basis\u003c/h2>\n\u003cp>Open ununemploy as a native macOS app without starting a development server in Terminal. The user requested a Go webview wrapper on 7 October 2026 and selected \u003cstrong>keep running until Quit\u003c/strong>. \u003ca href=\"#/decisions/index\">Accepted decision\u003c/a> and \u003ca href=\"#/journal/2026-10-07-desktop\">implementation journal\u003c/a>.\u003c/p>\n\u003ch2 id=\"entry-points-and-prerequisites\">Entry points and prerequisites\u003c/h2>\n\u003cp>Open \u003ccode>~/Applications/ununemploy.app\u003c/code> from Finder or Spotlight. Closing the window keeps the app and worker running; opening the app again brings back its window. \u003cstrong>ununemploy → Quit ununemploy\u003c/strong> or Command-Q stops the API, worker and descendant processes. Unsaved document edits show a Cancel /
